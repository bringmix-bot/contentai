function ScheduleScreen({socials,posts,showToast}) {
  const now = new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [schedules,setSchedules]=useState(store.get("schedules")||{});
  const [selectedDate,setSelectedDate]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [modalData,setModalData]=useState({postNum:1,hour:"09:00",net:"instagram"});
  const [dragPost,setDragPost]=useState(null);
  const connected=socials.filter(s=>s.connected);

  const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DAYS_HEADER=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  const saveSchedules=(s)=>{setSchedules(s);store.set("schedules",s);};
  const getDaysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const getFirstDayOfMonth=(y,m)=>new Date(y,m,1).getDay();
  const prevMonth=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey=dateKey(now.getFullYear(),now.getMonth(),now.getDate());

  const openModal=(day)=>{
    const key=dateKey(year,month,day);
    setSelectedDate({day,key,label:day+" de "+MONTHS[month]+" "+year});
    const existing=schedules[key];
    setModalData(existing||{postNum:dragPost||1,hour:"09:00",net:connected[0]?.id||"instagram"});
    setShowModal(true);
  };

  const assignPost=()=>{
    saveSchedules({...schedules,[selectedDate.key]:modalData});
    setShowModal(false); setDragPost(null);
    showToast("Post #"+modalData.postNum+" — "+selectedDate.label+" "+modalData.hour,"ok");
  };

  const removeSchedule=(key,e)=>{if(e)e.stopPropagation();const s={...schedules};delete s[key];saveSchedules(s);};

  const daysInMonth=getDaysInMonth(year,month);
  const firstDay=getFirstDayOfMonth(year,month);
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  const scheduledCount=Object.keys(schedules).length;
  const selectedPosts=posts.slice(0,7);

  return (
    <div style={{padding:"24px 28px",display:"flex",gap:20,height:"100%",minHeight:0}} className="fade-in">
      <div style={{width:200,flexShrink:0,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,marginBottom:4}}>Mis publicaciones</div>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,lineHeight:1.5}}>Hacé click en un post y luego en un día del calendario.</div>
        {selectedPosts.length===0?(
          <div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:"20px 0"}}>Primero generá las publicaciones.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
            {selectedPosts.map((post,i)=>(
              <div key={i} onClick={()=>setDragPost(i+1)}
                style={{cursor:"pointer",outline:dragPost===i+1?"3px solid var(--accent2)":"none",borderRadius:12,transition:"all .15s",transform:dragPost===i+1?"scale(1.03)":"scale(1)"}}>
                <PostMiniCard post={post} postNum={i+1} />
              </div>
            ))}
          </div>
        )}
        {dragPost&&(
          <div style={{marginTop:8,background:"rgba(109,40,217,.15)",border:"1px solid var(--accent2)",borderRadius:10,padding:"10px",textAlign:"center"}}>
            <div style={{fontSize:12,color:"var(--accent2)",fontWeight:600}}>Post #{dragPost} seleccionado</div>
            <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>Hacé click en el día</div>
            <button onClick={()=>setDragPost(null)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:11,marginTop:4}}>Cancelar</button>
          </div>
        )}
      </div>

      <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={prevMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>‹</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}}>{MONTHS[month]} {year}</div>
          <button onClick={nextMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>›</button>
        </div>

        {posts.length===0?(
          <div className="card" style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
            <div style={{fontSize:32,marginBottom:12}}>📋</div>
            <div style={{fontWeight:600,marginBottom:6}}>No hay publicaciones generadas</div>
            <div style={{fontSize:13}}>Volvé a "Crear publicación" y generá las 7 publicaciones.</div>
          </div>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {DAYS_HEADER.map(d=>(
                <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--muted)",letterSpacing:1,padding:"4px 0"}}>{d}</div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {Array.from({length:totalCells},(_,i)=>{
                const day=i-firstDay+1;
                const isValid=day>=1&&day<=daysInMonth;
                const key=isValid?dateKey(year,month,day):null;
                const sched=key&&schedules[key];
                const isToday=key===todayKey;
                const isPast=key&&key<todayKey;
                const soc=sched&&socials.find(s=>s.id===sched.net);
                const isClickable=isValid&&!isPast;
                return (
                  <div key={i}
                    onClick={()=>{
                      if(!isClickable)return;
                      if(dragPost){
                        const k=dateKey(year,month,day);
                        setSelectedDate({day,key:k,label:day+" de "+MONTHS[month]+" "+year});
                        setModalData({postNum:dragPost,hour:"09:00",net:connected[0]?.id||"instagram"});
                        setShowModal(true);
                      } else openModal(day);
                    }}
                    style={{minHeight:72,borderRadius:10,padding:"7px 6px",
                      background:!isValid?"transparent":sched?"rgba(109,40,217,.18)":isPast?"rgba(255,255,255,.015)":dragPost?"rgba(109,40,217,.05)":"var(--surface2)",
                      border:!isValid?"none":"2px solid "+(isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)"),
                      cursor:isClickable?"pointer":"default",opacity:isPast?0.35:1,transition:"all .15s",
                      display:"flex",flexDirection:"column",gap:3,
                      boxShadow:dragPost&&isClickable?"0 0 0 2px rgba(168,85,247,.3) inset":"none"}}
                    onMouseEnter={e=>{if(isClickable)e.currentTarget.style.borderColor="var(--accent2)";}}
                    onMouseLeave={e=>{if(isValid)e.currentTarget.style.borderColor=isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)";}}
                  >
                    {isValid&&(
                      <>
                        <div style={{fontSize:12,fontWeight:isToday?800:400,color:isToday?"var(--accent2)":"var(--text)"}}>{day}</div>
                        {sched&&(
                          <>
                            <div style={{background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:5,padding:"2px 5px",fontSize:10,fontWeight:800,color:"#fff",textAlign:"center"}}>#{sched.postNum}</div>
                            <div style={{fontSize:9,color:"var(--accent2)",textAlign:"center"}}>{sched.hour}</div>
                            <div style={{fontSize:11,textAlign:"center"}}>{soc?.icon}</div>
                            <button onClick={(e)=>removeSchedule(key,e)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:9,padding:0,lineHeight:1}}>✕ quitar</button>
                          </>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontWeight:600,fontSize:14}}>Posts programados</div>
                <div style={{fontSize:12,color:"var(--muted)"}}>{scheduledCount} en total</div>
              </div>
              {scheduledCount===0
                ?<div style={{color:"var(--muted)",fontSize:13,textAlign:"center",padding:"8px 0"}}>Seleccioná un post del panel izquierdo y hacé click en un día.</div>
                :<div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:150,overflowY:"auto"}}>
                  {Object.entries(schedules).sort(([a],[b])=>a.localeCompare(b)).map(([key,sched])=>{
                    const soc=socials.find(s=>s.id===sched.net);
                    const [y,m,d]=key.split("-");
                    const date=new Date(+y,+m-1,+d);
                    const label=date.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
                    return(
                      <div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid var(--border)",fontSize:12}}>
                        <span>{soc?.icon}</span>
                        <span style={{flex:1,textTransform:"capitalize"}}>{label}</span>
                        <span style={{color:"var(--muted)"}}>{sched.hour}</span>
                        <span style={{background:"rgba(109,40,217,.2)",border:"1px solid rgba(168,85,247,.3)",borderRadius:20,padding:"2px 8px",color:"var(--accent2)"}}>Post #{sched.postNum}</span>
                        <button onClick={()=>removeSchedule(key)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:12}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              }
              {scheduledCount>0&&(
                <button className="btn btn-primary" style={{width:"100%",marginTop:12}} onClick={()=>showToast("Calendario confirmado! MCM publicará automáticamente.","ok")}>
                  ✓ Confirmar calendario
                </button>
              )}
            </div>
          </>
        )}
      </div>

      {showModal&&selectedDate&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(16px)"}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:18,padding:28,width:"100%",maxWidth:440}} className="fade-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:700}}>📅 {selectedDate.label}</h3>
              <button onClick={()=>setShowModal(false)} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:28,height:28,borderRadius:7,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <span className="lbl">Publicación (1-7)</span>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {Array.from({length:7},(_,i)=>i+1).map(n=>(
                    <button key={n} onClick={()=>setModalData(p=>({...p,postNum:n}))} className="btn"
                      style={{width:44,height:44,padding:0,fontSize:15,fontWeight:800,
                        background:modalData.postNum===n?"rgba(109,40,217,.3)":"var(--surface2)",
                        border:"2px solid "+(modalData.postNum===n?"var(--accent2)":"var(--border)"),
                        color:modalData.postNum===n?"var(--accent2)":"var(--muted)",borderRadius:10}}>
                      {n}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Horario</span>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"].map(h=>(
                    <button key={h} onClick={()=>setModalData(p=>({...p,hour:h}))} className="btn"
                      style={{padding:"6px 9px",fontSize:12,
                        background:modalData.hour===h?"rgba(109,40,217,.2)":"var(--surface2)",
                        border:"1px solid "+(modalData.hour===h?"var(--accent2)":"var(--border)"),
                        color:modalData.hour===h?"var(--accent2)":"var(--muted)",borderRadius:8}}>
                      {h}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Red social</span>
                {connected.length===0
                  ?<div style={{color:"var(--muted)",fontSize:13}}>No tenés redes conectadas.</div>
                  :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {connected.map(s=>(
                      <button key={s.id} onClick={()=>setModalData(p=>({...p,net:s.id}))} className="btn"
                        style={{padding:"7px 14px",fontSize:13,
                          background:modalData.net===s.id?"rgba(109,40,217,.2)":"var(--surface2)",
                          border:"1px solid "+(modalData.net===s.id?"var(--accent2)":"var(--border)"),
                          color:modalData.net===s.id?"var(--accent2)":"var(--muted)"}}>
                        {s.icon} {s.name}
                      </button>
                    ))}
                  </div>}
              </div>
              <button className="btn btn-primary" style={{width:"100%"}} onClick={assignPost}>
                Programar Post #{modalData.postNum} — {selectedDate.label} {modalData.hour}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
