<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCM — My Community Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;
  --accent:#6d28d9;--accent2:#a855f7;--pink:#ec4899;
  --text:#f0f0ff;--muted:#6b6b8a;--success:#22d3ee;--error:#f43f5e;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:'Inter',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:none}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.fade-in{animation:fadeIn .35s ease both}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px}
.main{flex:1;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:24px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:'Syne',sans-serif;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(109,40,217,.15);color:var(--accent2);border-color:rgba(168,85,247,.2)}
.nav-section{font-size:10px;color:var(--muted);letter-spacing:2px;padding:8px 12px 4px;margin-top:8px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s}
.step-dot.done{background:var(--success)}.step-dot.active{background:var(--accent2)}
.social-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:border-color .2s}
.social-card.connected{border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.03)}
.social-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.file-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color .2s}
.file-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;color:var(--muted);font-size:12px;transition:all .2s}
.file-add:hover{border-color:var(--accent2);color:var(--accent2)}
.post-option{background:var(--surface2);border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.post-option:hover{border-color:var(--accent2);transform:translateY(-2px)}
.post-option.selected{border-color:var(--accent)}
.post-canvas-wrap{aspect-ratio:1;background:var(--bg);overflow:hidden}
.post-caption{padding:12px;font-size:12px;color:var(--muted);line-height:1.6;max-height:80px;overflow:hidden}
.editor-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(20px)}
.editor-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:980px;max-height:92vh;overflow-y:auto;display:flex;gap:24px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;max-width:340px;animation:fadeIn .3s ease}
.toast.ok{background:#0d2b1f;border:1px solid var(--success);color:var(--success)}
.toast.err{background:#1f0d0d;border:1px solid var(--error);color:var(--error)}
.toast.info{background:#1a0d2e;border:1px solid var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("mcm_"+k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem("mcm_"+k, JSON.stringify(v)),
};

function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null),3500); };
  return [t, show];
}

const SOCIALS_DEFAULT = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
];

async function generateText(prompt) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d = await r.json();
  return d.text||"";
}

async function drawPost(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080,H=1080;
  canvas.width=W; canvas.height=H;
  const color = opt.brandColor||"#6d28d9";

  if (opt.imgSrc) {
    await new Promise(resolve=>{
      const img=new Image(); img.crossOrigin="anonymous";
      img.onload=()=>{ctx.drawImage(img,0,0,W,H);resolve();};
      img.onerror=resolve; img.src=opt.imgSrc;
    });
    const alpha = opt.style===1?0.38:opt.style===2?0.52:0.28;
    ctx.fillStyle="rgba(0,0,0,"+alpha+")"; ctx.fillRect(0,0,W,H);
  } else {
    const bg=ctx.createLinearGradient(0,0,W,H);
    if(opt.style===1){bg.addColorStop(0,"#0d0520");bg.addColorStop(1,"#05050a");}
    else if(opt.style===2){bg.addColorStop(0,"#060609");bg.addColorStop(1,"#0d0520");}
    else{bg.addColorStop(0,"#0a0a14");bg.addColorStop(1,"#05050a");}
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const g=ctx.createRadialGradient(W,0,0,W,0,700);
    g.addColorStop(0,color+"55"); g.addColorStop(1,"transparent");
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  if(opt.style===2){
    ctx.strokeStyle="rgba(255,255,255,0.05)"; ctx.lineWidth=1;
    for(let x=0;x<=W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<=H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const bar=ctx.createLinearGradient(0,0,W,0); bar.addColorStop(0,color); bar.addColorStop(1,"#a855f7");
    ctx.fillStyle=bar; ctx.fillRect(0,0,W,10); ctx.fillRect(0,H-10,W,10);
  }
  if(opt.style===3){
    ctx.fillStyle="rgba(255,255,255,0.02)"; ctx.fillRect(580,0,500,H);
    ctx.fillStyle=color; ctx.fillRect(0,0,8,H);
    const grad=ctx.createLinearGradient(0,H*0.6,0,H);
    grad.addColorStop(0,"transparent"); grad.addColorStop(1,"rgba(0,0,0,0.7)");
    ctx.fillStyle=grad; ctx.fillRect(0,0,W,H);
  }

  const text=(opt.overlayText||"").trim();
  if(text){
    const size=Math.max(24,Math.min(120,opt.fontSize||56));
    ctx.font="bold "+size+"px Arial,sans-serif";
    const maxW=900,pad=80;
    const words=text.split(" "); const lines=[]; let line="";
    words.forEach(w=>{const t=line+(line?" ":"")+w; if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}else line=t;});
    if(line)lines.push(line);
    const lineH=size*1.28,totalH=lines.length*lineH;
    let startY=opt.textPos==="top"?pad+size:opt.textPos==="center"?(H-totalH)/2+size:H-pad-totalH+size;
    if(opt.textBg!==false){
      ctx.fillStyle="rgba(0,0,0,0.6)";
      ctx.beginPath(); ctx.roundRect(pad-20,startY-size-14,maxW+40,totalH+32,14); ctx.fill();
    }
    ctx.fillStyle=opt.fontColor||"#ffffff"; ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln,pad,startY+i*lineH));
  }
  ctx.font="400 16px Arial"; ctx.fillStyle="rgba(255,255,255,0.18)"; ctx.textAlign="right";
  ctx.fillText("MCM My Community Manager",W-24,H-22);
}

function App() {
  const [screen, setScreen] = useState("connect");
  const [brand, setBrand] = useState(store.get("brand")||{});
  const [files, setFiles] = useState(store.get("files")||[]);
  const [posts, setPosts] = useState(store.get("posts")||[]);
  const [socials, setSocials] = useState(store.get("socials")||SOCIALS_DEFAULT);
  const [toast, showToast] = useToast();

  const saveBrand=(b)=>{setBrand(b);store.set("brand",b);};
  const saveFiles=(f)=>{setFiles(f);store.set("files",f);};
  const savePosts=(p)=>{setPosts(p);store.set("posts",p);};
  const saveSocials=(s)=>{setSocials(s);store.set("socials",s);};

  const steps=[
    {id:"connect",icon:"🔗",label:"Conectar redes",done:socials.some(s=>s.connected)},
    {id:"brand",icon:"🎨",label:"Mi marca",done:!!(brand.name&&brand.description)},
    {id:"library",icon:"📁",label:"Mis archivos",done:files.length>0},
    {id:"generate",icon:"✦",label:"Crear publicación",done:posts.length>0},
    {id:"schedule",icon:"📅",label:"Automatizar",done:false},
  ];

  return (
    <div className="app">
      <div className="sidebar">
        <div className="logo">
          <div className="logo-mark">M</div>
          <div><div className="logo-text">MCM</div><div className="logo-sub">COMMUNITY MANAGER</div></div>
        </div>
        <div className="nav-section">FLUJO</div>
        {steps.map(s=>(
          <button key={s.id} className={"nav-item"+(screen===s.id?" active":"")} onClick={()=>setScreen(s.id)}>
            <div className={"step-dot"+(s.done?" done":screen===s.id?" active":"")} />
            <span>{s.icon}</span>{s.label}
          </button>
        ))}
        <div style={{marginTop:"auto",padding:"12px 10px"}}>
          <div style={{fontSize:11,color:"var(--muted)",marginBottom:6}}>Conectadas</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {socials.filter(s=>s.connected).map(s=><span key={s.id} title={s.name} style={{fontSize:16}}>{s.icon}</span>)}
            {!socials.some(s=>s.connected)&&<span style={{fontSize:11,color:"var(--muted)"}}>Ninguna</span>}
          </div>
        </div>
      </div>
      <div className="main">
        {screen==="connect"  && <ConnectScreen  socials={socials} saveSocials={saveSocials} showToast={showToast} onNext={()=>setScreen("brand")} />}
        {screen==="brand"    && <BrandScreen    brand={brand} saveBrand={saveBrand} showToast={showToast} onNext={()=>setScreen("library")} />}
        {screen==="library"  && <LibraryScreen  files={files} saveFiles={saveFiles} showToast={showToast} onNext={()=>setScreen("generate")} />}
        {screen==="generate" && <GenerateScreen brand={brand} files={files} posts={posts} savePosts={savePosts} showToast={showToast} onNext={()=>setScreen("schedule")} />}
        {screen==="schedule" && <ScheduleScreen socials={socials} showToast={showToast} />}
      </div>
      {toast&&<div className={"toast "+toast.type}>{toast.msg}</div>}
    </div>
  );
}

function ConnectScreen({socials,saveSocials,showToast,onNext}) {
  const connect=(id)=>{
    if(id==="instagram"){saveSocials(socials.map(s=>s.id===id?{...s,connected:true,user:"@gonvinardell"}:s));showToast("Instagram conectado!","ok");}
    else showToast("Próximamente — "+socials.find(s=>s.id===id).name,"info");
  };
  const disconnect=(id)=>saveSocials(socials.map(s=>s.id===id?{...s,connected:false,user:""}:s));
  return (
    <div style={{padding:"32px 36px",maxWidth:600}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Conectá tus redes sociales</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>MCM publicará en las redes que conectes.</p>
      </div>
      {socials.map(s=>(
        <div key={s.id} className={"social-card"+(s.connected?" connected":"")}>
          <div className="social-icon" style={{background:s.color+"22"}}>{s.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
            <div style={{fontSize:12,color:s.connected?"var(--success)":"var(--muted)",marginTop:2}}>
              {s.connected?"● Conectado — "+s.user:"No conectado"}
            </div>
          </div>
          {s.connected
            ?<button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>disconnect(s.id)}>Desconectar</button>
            :<button className="btn btn-primary" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>connect(s.id)}>Conectar</button>}
        </div>
      ))}
      <div style={{marginTop:28}}>
        <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Mi Marca →</button>
      </div>
    </div>
  );
}

function BrandScreen({brand,saveBrand,showToast,onNext}) {
  const [form,setForm]=useState(brand);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));
  const save=()=>{saveBrand(form);showToast("Perfil guardado!","ok");};
  const TONES=["Profesional","Cercano","Divertido","Inspirador","Urgente","Educativo"];
  const INDUSTRIES=["Gastronomía","Moda","Salud","Tecnología","Inmobiliaria","Educación","Turismo","Retail","Servicios","Construcción","Paisajismo","Fitness","Belleza","Fotografía","Otro"];
  return (
    <div style={{padding:"32px 36px",maxWidth:600}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Perfil de tu marca</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>La IA usa este perfil para personalizar todos los posts.</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:16}}>
        <div><span className="lbl">Nombre de la empresa</span><input value={form.name||""} onChange={e=>upd("name",e.target.value)} placeholder="Ej: La Josefa Granja Orgánica" /></div>
        <div>
          <span className="lbl">Rubro</span>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {INDUSTRIES.map(i=><button key={i} onClick={()=>upd("industry",i)} className="btn" style={{padding:"6px 12px",fontSize:12,background:form.industry===i?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.industry===i?"var(--accent2)":"var(--border)"),color:form.industry===i?"var(--accent2)":"var(--muted)"}}>{i}</button>)}
          </div>
        </div>
        <div><span className="lbl">Descripción del negocio</span><textarea value={form.description||""} onChange={e=>upd("description",e.target.value)} rows={3} placeholder="Qué ofrecés, qué te diferencia de la competencia..." /></div>
        <div><span className="lbl">Cliente ideal</span><input value={form.target||""} onChange={e=>upd("target",e.target.value)} placeholder="Ej: Familias que valoran la alimentación saludable" /></div>
        <div>
          <span className="lbl">Tono de comunicación</span>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {TONES.map(t=><button key={t} onClick={()=>upd("tone",t)} className="btn" style={{padding:"6px 12px",fontSize:12,background:form.tone===t?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.tone===t?"var(--accent2)":"var(--border)"),color:form.tone===t?"var(--accent2)":"var(--muted)"}}>{t}</button>)}
          </div>
        </div>
        <div>
          <span className="lbl">Color de marca</span>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <input type="color" value={form.color||"#6d28d9"} onChange={e=>upd("color",e.target.value)} style={{width:48,height:40,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:4}} />
            <span style={{fontSize:13,color:"var(--muted)"}}>Se usa en los fondos de las imágenes</span>
          </div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:28}}>
        <button className="btn btn-ghost" style={{flex:1}} onClick={save}>Guardar</button>
        <button className="btn btn-primary" style={{flex:1}} onClick={()=>{save();onNext();}}>Siguiente — Mis Archivos →</button>
      </div>
    </div>
  );
}

function LibraryScreen({files,saveFiles,showToast,onNext}) {
  const inputRef=useRef();
  const handleFiles=(e)=>{
    const newFiles=Array.from(e.target.files).map(f=>({
      id:Date.now()+Math.random(),name:f.name,
      type:f.type.startsWith("video")?"video":"image",
      preview:URL.createObjectURL(f),size:f.size,
    }));
    const updated=[...files,...newFiles];
    saveFiles(updated);
    showToast(newFiles.length+" archivo(s) agregado(s)","ok");
  };
  const remove=(id)=>saveFiles(files.filter(f=>f.id!==id));
  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Mis archivos</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>La IA elegirá de estos archivos para crear las publicaciones.</p>
        </div>
        <button className="btn btn-primary" onClick={()=>inputRef.current.click()}>+ Agregar</button>
      </div>
      <input ref={inputRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={handleFiles} />
      <div className="file-grid">
        <div className="file-add" onClick={()=>inputRef.current.click()}>
          <div style={{fontSize:28}}>📷</div><div>Fotos y videos</div>
        </div>
        {files.map(f=>(
          <div key={f.id} className="file-thumb">
            {f.type==="video"?<video src={f.preview} style={{width:"100%",height:"100%",objectFit:"cover"}} />:<img src={f.preview} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}} />}
            <button onClick={()=>remove(f.id)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            {f.type==="video"&&<div style={{position:"absolute",bottom:4,left:4,background:"rgba(0,0,0,.6)",borderRadius:4,padding:"2px 6px",fontSize:10}}>🎬</div>}
          </div>
        ))}
      </div>
      {files.length>0&&<div style={{marginTop:28}}><button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Crear Publicaciones →</button></div>}
    </div>
  );
}

function GenerateScreen({brand,files,posts,savePosts,showToast,onNext}) {
  const [generating,setGenerating]=useState(false);
  const [options,setOptions]=useState([]);
  const [selected,setSelected]=useState(null);
  const [editing,setEditing]=useState(false);
  const [brief,setBrief]=useState("");
  const canvasRefs=[useRef(),useRef(),useRef()];
  const STYLES=[{id:1,name:"Minimalista"},{id:2,name:"Bold"},{id:3,name:"Editorial"}];

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    const imgs=files.filter(f=>f.type==="image");
    if(imgs.length===0){showToast("Agregá al menos una imagen a tus archivos","err");return;}
    setGenerating(true); setOptions([]); setSelected(null);
    try{
      const imgSrc=imgs[Math.floor(Math.random()*imgs.length)].preview;
      const briefCtx=brief?" Tema especifico: "+brief:"";
      const base="Negocio: "+brand.name+". Rubro: "+(brand.industry||"")+". Descripcion: "+(brand.description||"")+". Cliente ideal: "+(brand.target||"")+"."+briefCtx;
      const captions=await Promise.all([
        generateText("Genera un caption "+((brand.tone||"profesional")).toLowerCase()+" para Instagram. "+base+" Tono: "+(brand.tone||"profesional")+". Incluye 5-6 hashtags. Solo el caption."),
        generateText("Genera un caption emotivo y cercano para Instagram. "+base+" Conecta con el cliente de forma personal. Incluye 5-6 hashtags. Solo el caption."),
        generateText("Genera un caption orientado a ventas y accion para Instagram. "+base+" Incluye llamado a la accion. Incluye 5-6 hashtags. Solo el caption."),
      ]);
      const overlayRaw=await generateText("Texto MUY CORTO para imagen de Instagram (maximo 5 palabras, sin hashtags, sin emojis). Empresa: "+brand.name+". Solo las palabras.");
      const overlayText=overlayRaw.trim().replace(/['"]/g,"").slice(0,45);
      const newOptions=STYLES.map((st,i)=>({
        id:i,style:st.id,styleName:st.name,
        caption:captions[i]||captions[0],
        overlayText,imgSrc,
        fontSize:56,fontColor:"#ffffff",
        textPos:i===0?"bottom":i===1?"center":"top",
        textBg:true,brandColor:brand.color||"#6d28d9",
      }));
      setOptions(newOptions);
      showToast("3 opciones generadas!","ok");
    }catch(e){showToast("Error: "+e.message,"err");}
    finally{setGenerating(false);}
  };

  const handleSelect=(idx)=>{
    setSelected(idx);
    const post=options[idx];
    savePosts([...posts,{...post,id:Date.now(),createdAt:new Date().toISOString()}]);
  };

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Crear publicación</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>La IA genera 3 opciones distintas — elegís la que más te guste.</p>
        </div>
        <button className="btn btn-primary" onClick={generate} disabled={generating}>
          {generating?<><div className="spin"/>Generando...</>:"✦ Generar 3 opciones"}
        </button>
      </div>
      <div style={{marginBottom:20}}>
        <span className="lbl">Brief del post (opcional)</span>
        <input value={brief} onChange={e=>setBrief(e.target.value)} placeholder="Ej: Lanzamiento nueva colección, promo fin de semana, apertura de local..." />
      </div>
      {generating&&(
        <div style={{textAlign:"center",padding:"60px 0",color:"var(--muted)"}}>
          <div className="spin" style={{margin:"0 auto 16px",width:32,height:32,borderWidth:3}} />
          <div>Generando 3 opciones únicas...</div>
          <div style={{fontSize:12,marginTop:8,opacity:.6}}>Esto puede tomar unos segundos</div>
        </div>
      )}
      {options.length>0&&(
        <div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,marginBottom:20}}>
            {options.map((opt,i)=>(
              <PostOptionCard key={opt.id} opt={opt} canvasRef={canvasRefs[i]}
                selected={selected===i} onSelect={()=>handleSelect(i)} />
            ))}
          </div>
          {selected!==null&&(
            <div className="fade-in" style={{display:"flex",gap:10}}>
              <button className="btn btn-ghost" style={{flex:1}} onClick={()=>setEditing(true)}>✏️ Editar diseño</button>
              <button className="btn btn-primary" style={{flex:1}} onClick={onNext}>📅 Programar publicación →</button>
            </div>
          )}
        </div>
      )}
      {editing&&selected!==null&&(
        <EditorModal opt={options[selected]} brand={brand}
          onClose={()=>setEditing(false)}
          onSave={(updated)=>{
            const newOpts=options.map((o,i)=>i===selected?updated:o);
            setOptions(newOpts); setEditing(false); showToast("Cambios guardados","ok");
          }}
          showToast={showToast} />
      )}
    </div>
  );
}

function PostOptionCard({opt,canvasRef,selected,onSelect}) {
  useEffect(()=>{if(canvasRef.current)drawPost(canvasRef.current,opt);},[opt]);
  return (
    <div className={"post-option"+(selected?" selected":"")} onClick={onSelect}>
      <div className="post-canvas-wrap">
        <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}} />
        <div style={{position:"absolute",top:8,left:8,background:"rgba(0,0,0,.65)",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600}}>{opt.styleName}</div>
        {selected&&<div style={{position:"absolute",top:8,right:8,background:"var(--accent)",borderRadius:"50%",width:22,height:22,display:"grid",placeItems:"center",fontSize:12}}>✓</div>}
      </div>
      <div className="post-caption">{opt.caption}</div>
    </div>
  );
}

function EditorModal({opt,brand,onClose,onSave,showToast}) {
  const canvasRef=useRef();
  const [form,setForm]=useState({...opt});
  const [publishing,setPublishing]=useState(false);
  const [pubMsg,setPubMsg]=useState(null);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{if(canvasRef.current)drawPost(canvasRef.current,form);},[form]);

  const download=()=>{
    const c=canvasRef.current; if(!c)return;
    const a=document.createElement("a"); a.href=c.toDataURL("image/png"); a.download="MCM_post.png"; a.click();
  };

  const publishIG=async()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    setPublishing(true); setPubMsg(null);
    try{
      const upRes=await fetch("/api/instagram?action=upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageBase64:canvas.toDataURL("image/png")})});
      const upData=await upRes.json();
      if(!upData.success)throw new Error(upData.error);
      const pubRes=await fetch("/api/instagram?action=publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caption:form.caption,imageUrl:upData.url})});
      const pubData=await pubRes.json();
      if(!pubData.success)throw new Error(pubData.error);
      setPubMsg({ok:true,text:"Publicado en @gonvinardell!"});
      showToast("Publicado exitosamente!","ok");
    }catch(e){setPubMsg({ok:false,text:"Error: "+e.message});}
    finally{setPublishing(false);}
  };

  return (
    <div className="editor-wrap">
      <div className="editor-box">
        <div style={{flex:"0 0 340px"}}>
          <div className="lbl">Preview en vivo</div>
          <div style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)"}}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}} />
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginTop:6}}>1080x1080px — se actualiza en tiempo real</div>
        </div>
        <div style={{flex:1,minWidth:260,display:"flex",flexDirection:"column",gap:14}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontSize:16,fontWeight:700}}>Editor de diseño</h3>
            <button onClick={onClose} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:14}}>✕</button>
          </div>
          <div>
            <span className="lbl">Texto sobre la imagen (max 6 palabras)</span>
            <input value={form.overlayText} onChange={e=>upd("overlayText",e.target.value)} placeholder="Texto corto para la imagen..." />
          </div>
          <div>
            <span className="lbl">Caption del post</span>
            <textarea value={form.caption} onChange={e=>upd("caption",e.target.value)} rows={5} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit"}} />
          </div>
          <div style={{display:"flex",gap:12,alignItems:"flex-end"}}>
            <div style={{flex:1}}>
              <span className="lbl">Tamaño fuente ({form.fontSize}px)</span>
              <input type="range" min={20} max={100} value={form.fontSize} onChange={e=>upd("fontSize",+e.target.value)} style={{width:"100%",accentColor:"var(--accent)"}} />
            </div>
            <div>
              <span className="lbl">Color</span>
              <input type="color" value={form.fontColor} onChange={e=>upd("fontColor",e.target.value)} style={{width:44,height:36,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:3}} />
            </div>
          </div>
          <div>
            <span className="lbl">Posición del texto</span>
            <div style={{display:"flex",gap:6}}>
              {[["top","Arriba"],["center","Centro"],["bottom","Abajo"]].map(([v,l])=>(
                <button key={v} onClick={()=>upd("textPos",v)} className="btn"
                  style={{flex:1,padding:"8px",fontSize:12,background:form.textPos===v?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.textPos===v?"var(--accent2)":"var(--border)"),color:form.textPos===v?"var(--accent2)":"var(--muted)"}}>{l}</button>
              ))}
            </div>
          </div>
          <div>
            <button onClick={()=>upd("textBg",!form.textBg)} className="btn"
              style={{background:form.textBg?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.textBg?"var(--accent2)":"var(--border)"),color:form.textBg?"var(--accent2)":"var(--muted)",fontSize:12,padding:"8px 14px"}}>
              {form.textBg?"✓ Fondo oscuro: ON":"○ Fondo oscuro: OFF"}
            </button>
          </div>
          {pubMsg&&<div style={{background:pubMsg.ok?"#0d2b1f":"#1f0d0d",border:"1px solid "+(pubMsg.ok?"var(--success)":"var(--error)"),color:pubMsg.ok?"var(--success)":"var(--error)",padding:"10px 14px",borderRadius:8,fontSize:12,fontWeight:600}}>{pubMsg.text}</div>}
          <div style={{display:"flex",gap:8,marginTop:"auto"}}>
            <button onClick={download} className="btn btn-ghost" style={{flex:1}}>⬇ Descargar</button>
            <button onClick={()=>onSave(form)} className="btn btn-ghost" style={{flex:1}}>✓ Guardar</button>
            <button onClick={publishIG} disabled={publishing} className="btn btn-primary" style={{flex:1,background:publishing?"var(--surface2)":"linear-gradient(135deg,#E1306C,#833AB4)"}}>
              {publishing?<><div className="spin"/>Publicando</>:"🚀 Publicar IG"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ScheduleScreen({socials,showToast}) {
  const [schedules,setSchedules]=useState(store.get("schedules")||[]);
  const [day,setDay]=useState("Lunes");
  const [hour,setHour]=useState("09:00");
  const [net,setNet]=useState("instagram");
  const [mode,setMode]=useState("manual");
  const connected=socials.filter(s=>s.connected);
  const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const save=(arr)=>{setSchedules(arr);store.set("schedules",arr);};
  const add=()=>{
    const s={id:Date.now(),day,hour,net,active:true,mode};
    save([...schedules,s]); showToast("Automatización guardada!","ok");
  };
  const remove=(id)=>save(schedules.filter(s=>s.id!==id));
  const toggle=(id)=>save(schedules.map(s=>s.id===id?{...s,active:!s.active}:s));
  return (
    <div style={{padding:"32px 36px",maxWidth:680}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Automatizar publicaciones</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>Configurá cuándo y en qué red publicar automáticamente.</p>
      </div>
      <div style={{display:"flex",gap:8,marginBottom:24}}>
        {[["manual","📋 Manual"],["auto","🤖 Automático"]].map(([v,l])=>(
          <button key={v} onClick={()=>setMode(v)} className="btn"
            style={{flex:1,padding:"12px",fontSize:13,background:mode===v?"rgba(109,40,217,.2)":"var(--surface)",border:"1px solid "+(mode===v?"var(--accent2)":"var(--border)"),color:mode===v?"var(--accent2)":"var(--muted)"}}>{l}</button>
        ))}
      </div>
      <div className="card" style={{marginBottom:16}}>
        <div style={{fontWeight:600,marginBottom:16}}>Nueva automatización</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
          <div><span className="lbl">Día</span><select value={day} onChange={e=>setDay(e.target.value)}>{DAYS.map(d=><option key={d}>{d}</option>)}</select></div>
          <div><span className="lbl">Horario</span><input type="time" value={hour} onChange={e=>setHour(e.target.value)} /></div>
        </div>
        <div style={{marginBottom:16}}>
          <span className="lbl">Red social</span>
          {connected.length===0
            ?<div style={{color:"var(--muted)",fontSize:13}}>No tenés redes conectadas.</div>
            :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {connected.map(s=><button key={s.id} onClick={()=>setNet(s.id)} className="btn" style={{padding:"7px 14px",fontSize:13,background:net===s.id?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(net===s.id?"var(--accent2)":"var(--border)"),color:net===s.id?"var(--accent2)":"var(--muted)"}}>{s.icon} {s.name}</button>)}
            </div>}
        </div>
        <button className="btn btn-primary" style={{width:"100%"}} onClick={add}>+ Agregar automatización</button>
      </div>
      {schedules.length>0&&(
        <div>
          <div className="lbl" style={{marginBottom:10}}>Automatizaciones</div>
          {schedules.map(s=>{
            const soc=socials.find(x=>x.id===s.net);
            return(
              <div key={s.id} className="card" style={{display:"flex",alignItems:"center",gap:12,marginBottom:8,borderColor:s.active?"rgba(34,211,238,.2)":"var(--border)"}}>
                <span style={{fontSize:20}}>{soc?.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:14}}>{soc?.name} · {s.day} a las {s.hour}</div>
                  <div style={{fontSize:12,color:s.active?"var(--success)":"var(--muted)",marginTop:2}}>{s.active?"● Activo":"○ Pausado"} · {s.mode==="auto"?"Automático":"Manual"}</div>
                </div>
                <button onClick={()=>toggle(s.id)} className="btn btn-ghost" style={{fontSize:12,padding:"6px 12px"}}>{s.active?"Pausar":"Activar"}</button>
                <button onClick={()=>remove(s.id)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:18,padding:"4px 6px"}}>✕</button>
              </div>
            );
          })}
        </div>
      )}
      <div className="card" style={{marginTop:16,borderColor:"rgba(109,40,217,.2)"}}>
        <div style={{fontSize:12,color:"var(--accent2)",fontWeight:600,marginBottom:6}}>ℹ️ Cómo funciona</div>
        <div style={{fontSize:13,color:"var(--muted)",lineHeight:1.7}}>
          <strong style={{color:"var(--text)"}}>Manual:</strong> MCM te avisa cuando es hora de publicar y vos confirmás.<br/>
          <strong style={{color:"var(--text)"}}>Automático:</strong> La IA elige una imagen de tu biblioteca, genera el contenido y publica sola.
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
