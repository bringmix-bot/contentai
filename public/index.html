// ── POST IMAGE GENERATOR ──
const generatePostImage = (postText, networkName, networkColor, businessName, imagePreview) => {
  return new Promise(resolve => {
    const canvas = document.createElement("canvas");
    canvas.width = 1080; canvas.height = 1080;
    const ctx = canvas.getContext("2d");
 
    const drawContent = () => {
      // Background
      if (imagePreview) {
        const img = new Image();
        img.onload = () => {
          // Draw image as background
          const scale = Math.max(1080/img.width, 1080/img.height);
          const w = img.width * scale, h = img.height * scale;
          const x = (1080-w)/2, y = (1080-h)/2;
          ctx.drawImage(img, x, y, w, h);
          // Dark overlay
          ctx.fillStyle = "rgba(7,7,16,0.72)";
          ctx.fillRect(0, 0, 1080, 1080);
          addText();
        };
        img.src = imagePreview;
      } else {
        // Gradient background
        const grad = ctx.createLinearGradient(0, 0, 1080, 1080);
        grad.addColorStop(0, "#070710");
        grad.addColorStop(0.5, "#0e0e2a");
        grad.addColorStop(1, "#07101a");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, 1080, 1080);
        // Decorative circle
        ctx.beginPath();
        ctx.arc(900, 180, 300, 0, Math.PI*2);
        ctx.fillStyle = networkColor + "15";
        ctx.fill();
        ctx.beginPath();
        ctx.arc(180, 900, 200, 0, Math.PI*2);
        ctx.fillStyle = "#7c6fff10";
        ctx.fill();
        addText();
      }
    };
 
    const addText = () => {
      const pad = 80;
      const maxW = 1080 - pad*2;
 
      // Top bar
      ctx.fillStyle = networkColor;
      ctx.fillRect(pad, pad, 6, 60);
 
      // Network label
      ctx.font = "500 26px 'DM Sans', sans-serif";
      ctx.fillStyle = networkColor;
      ctx.fillText(networkName.toUpperCase(), pad+22, pad+40);
 
      // Business name
      if (businessName) {
        ctx.font = "400 22px 'DM Sans', sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillText(businessName, pad+22, pad+70);
      }
 
      // Main post text
      ctx.font = "500 38px 'DM Sans', sans-serif";
      ctx.fillStyle = "#ffffff";
      const lines = [];
      const words = postText.replace(/[#@]/g, '').split(' ');
      let line = '';
      words.forEach(word => {
        const test = line + (line?' ':'') + word;
        if (ctx.measureText(test).width > maxW) { if(line) lines.push(line); line = word; }
        else line = test;
      });
      if (line) lines.push(line);
 
      // Limit to first ~8 lines for visual
      const displayLines = lines.slice(0, 8);
      if (lines.length > 8) displayLines[7] = displayLines[7] + '...';
 
      const lineH = 52;
      const totalH = displayLines.length * lineH;
      const startY = (1080 - totalH) / 2;
 
      displayLines.forEach((l, i) => {
        ctx.fillText(l, pad, startY + i * lineH);
      });
 
      // Bottom branding
      ctx.fillStyle = "rgba(124,111,255,0.8)";
      ctx.fillRect(0, 1020, 1080, 60);
      ctx.font = "600 24px 'DM Sans', sans-serif";
      ctx.fillStyle = "#fff";
      ctx.fillText("MCM · My Community Manager", pad, 1056);
 
      resolve(canvas.toDataURL("image/png"));
    };
 
    drawContent();
  });
};

${brandCtx || "Cliente sin perfil configurado aún"}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"11px 20px",borderBottom:`1px solid ${C.border}`,background:"#08080f",flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:9,cursor:"pointer"}} onClick={()=>setView("landing")}>
          <div style={{width:28,height:28,background:C.primary,borderRadius:8,display:"grid",placeItems:"center",color:"#fff",fontWeight:800,fontSize:13}}>M</div>
          <span style={{fontFamily:"'Playfair Display',serif",fontSize:15,fontWeight:800}}>MCM</span>
          <span style={{fontSize:10,color:"#444",marginLeft:2}}>My Community Manager</span>
        </div>
        <div style={{display:"flex",gap:3}}>
          {navTabs.map(([id,icon,label])=>(
            <button key={id} onClick={()=>setTab(id)} style={{background:tab===id?C.card:"transparent",border:`1px solid ${tab===id?C.border2:"transparent"}`,borderRadius:8,padding:"7px 16px",color:tab===id?"#fff":"#555",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:6,transition:"all 0.2s"}}>
              <span>{icon}</span>{label}
            </button>
          ))}
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {postsCount>0&&<span style={{fontSize:11,color:"#333"}}>{postsCount} posts generados</span>}
          <button onClick={()=>setView("pricing")} style={{background:C.primary,color:"#fff",border:"none",borderRadius:8,padding:"7px 18px",cursor:"pointer",fontWeight:700,fontSize:12}}>Suscribirme →</button>
        </div>
      </div>
 
      {/* GENERATOR */}
      {tab==="generator"&&(
        <div style={{flex:1,display:"flex",overflow:"hidden"}}>
          <div style={{width:290,borderRight:`1px solid ${C.border}`,padding:"16px",display:"flex",flexDirection:"column",gap:14,overflowY:"auto",flexShrink:0}}>
            <div>
              <div style={{fontSize:15,fontWeight:700,marginBottom:3}}>Generador</div>
              <div style={{fontSize:11,color:"#555"}}>Seleccioná tu contenido y generá posts para 5 redes.</div>
            </div>
 
            <div>
              <span style={LBL}>CONTENIDO SELECCIONADO ({selItems.length})</span>
              {selItems.length>0?(
                <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
                  {selItems.map(item=>(
                    <div key={item.id} style={{position:"relative",width:56,height:56}}>
                      {item.isVideo
                        ? <div style={{width:56,height:56,borderRadius:7,background:"#1a1a2e",border:`2px solid ${C.primary}`,display:"grid",placeItems:"center",fontSize:18}}>🎬</div>
                        : <img src={item.preview} style={{width:56,height:56,borderRadius:7,objectFit:"cover",border:`2px solid ${C.primary}`}} alt=""/>
                      }
                      <button onClick={()=>toggleSel(item.id)} style={{position:"absolute",top:-5,right:-5,background:"#f43f5e",border:"none",color:"#fff",width:16,height:16,borderRadius:"50%",cursor:"pointer",fontSize:8,lineHeight:"16px",padding:0}}>✕</button>
                    </div>
                  ))}
                  <div onClick={()=>setTab("gallery")} style={{width:56,height:56,borderRadius:7,border:`2px dashed ${C.border2}`,display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",color:"#444",fontSize:20}}>+</div>
                  <button onClick={()=>setSelected([])} style={{fontSize:10,color:"#f43f5e",background:"none",border:"none",cursor:"pointer",alignSelf:"center"}}>Limpiar</button>
                </div>
              ):(
                <div onClick={()=>setTab("gallery")} style={{border:`2px dashed ${C.border}`,borderRadius:10,padding:"14px",textAlign:"center",cursor:"pointer",marginBottom:8,transition:"border-color 0.2s"}}
                  onMouseEnter={e=>e.currentTarget.style.borderColor=C.border2} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
                  <div style={{fontSize:24,marginBottom:4}}>📁</div>
                  <div style={{fontSize:12,color:"#666",marginBottom:2}}>Seleccioná de tu contenido</div>
                  <div style={{fontSize:10,color:"#444"}}>o arrastrá archivos acá</div>
                </div>
              )}
              <div onClick={()=>fileRef.current.click()} style={{border:`1px dashed ${C.border}`,borderRadius:8,padding:"7px",textAlign:"center",cursor:"pointer",fontSize:11,color:"#444"}}>
                <input ref={fileRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={e=>addFiles(e.target.files)}/>
                + Subir imágenes o videos
              </div>
            </div>
 
            <div>
              <span style={LBL}>BRIEF DEL POST</span>
              <textarea value={topic} onChange={e=>setTopic(e.target.value)} rows={3}
                placeholder="Ej: Lanzamiento nueva colección, promo del fin de semana, evento especial..."
                style={{...INP}}/>
            </div>
 
            {brand.name&&(
              <div style={{background:C.card,border:`1px solid ${C.border2}`,borderRadius:9,padding:"10px 12px"}}>
                <div style={{fontSize:10,color:"#444",marginBottom:4,letterSpacing:1}}>PERFIL ACTIVO</div>
                <div style={{color:C.accent,fontWeight:700,fontSize:13}}>{brand.name}</div>
                {brand.industry&&<div style={{color:"#666",marginTop:2,fontSize:12}}>{brand.industry}</div>}
                {brand.target&&<div style={{color:"#444",marginTop:2,fontSize:11}}>→ {brand.target}</div>}
                <span onClick={()=>setTab("brand")} style={{color:"#444",fontSize:10,cursor:"pointer",marginTop:5,display:"block"}}>Editar →</span>
              </div>
            )}
 
            <button onClick={generateAll} disabled={!canGenerate} style={{background:canGenerate?C.primary:"#111",color:canGenerate?"#fff":"#333",border:"none",borderRadius:10,padding:"13px",fontSize:14,fontWeight:800,cursor:canGenerate?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",gap:8,transition:"all 0.2s"}}>
              {generating
                ? <><div style={{width:13,height:13,border:"2px solid #ffffff40",borderTopColor:"#fff",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>Generando...</>
                : `✦ Generar${selItems.length>0?` con ${selItems.length} archivo${selItems.length>1?"s":""}`:""}`}
            </button>
 
            {(generating||generatingImg)&&(
              <div style={{background:C.card,border:`1px solid ${C.border2}`,borderRadius:9,padding:"10px 13px"}}>
                <div style={{fontSize:11,color:C.accent,marginBottom:6,animation:"pulse 1.2s ease infinite"}}>🤖 MCM está trabajando...</div>
                {[
                  generating&&"Analizando tu contenido",
                  generating&&"Investigando el mercado",
                  generating&&"Escribiendo para 5 redes",
                  generatingImg&&"Generando imágenes de posts",
                ].filter(Boolean).map((s,i)=>(
                  <div key={i} style={{fontSize:10,color:"#333",padding:"2px 0"}}>· {s}</div>
                ))}
              </div>
            )}
          </div>
 
          {/* RIGHT */}
          <div style={{flex:1,display:"flex",flexDirection:"column",padding:"14px 18px",gap:10,overflow:"hidden"}}>
            <div style={{display:"flex",gap:6,flexWrap:"wrap",flexShrink:0}}>
              {NETWORKS.map(n=>(
                <button key={n.id} className="net-btn" onClick={()=>setActiveNet(n.id)} style={{background:activeNet===n.id?`${C.primary}18`:C.card,border:`1px solid ${activeNet===n.id?C.primary:C.border}`,borderRadius:8,padding:"8px 14px",color:activeNet===n.id?C.accent:"#555",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:6,transition:"all 0.15s"}}>
                  <span>{n.icon}</span>{n.label}
                  {results[n.id]&&<span style={{width:5,height:5,borderRadius:"50%",background:C.green,flexShrink:0}}/>}
                </button>
              ))}
            </div>
 
            <div style={{flex:1,display:"flex",gap:14,overflow:"hidden"}}>
              {/* Text result */}
              <div style={{flex:1,background:"#08080f",border:`1px solid ${results[activeNet]?C.primary+"30":C.border}`,borderRadius:13,padding:"16px 18px",display:"flex",flexDirection:"column",overflow:"hidden",transition:"border-color 0.3s"}}>
                {results._error&&<div style={{color:"#f43f5e",fontSize:14}}>❌ {results._error}</div>}
                {!generating&&!results[activeNet]&&!results._error&&(
                  <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",textAlign:"center"}}>
                    <div style={{fontSize:40,marginBottom:12,opacity:0.15}}>✦</div>
                    <div style={{fontSize:14,color:"#222",marginBottom:6}}>Seleccioná contenido y generá</div>
                    <div style={{fontSize:11,color:"#1a1a1a"}}>MCM analiza tus archivos y crea posts<br/>para las 5 redes simultáneamente</div>
                  </div>
                )}
                {generating&&!results[activeNet]&&(
                  <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
                    <div style={{width:32,height:32,border:`3px solid ${C.border2}`,borderTopColor:C.primary,borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>
                    <div style={{color:"#333",fontSize:12}}>Generando para {NETWORKS.find(n=>n.id===activeNet)?.label}...</div>
                  </div>
                )}
                {results[activeNet]&&(
                  <div style={{animation:"fadeIn 0.4s ease",flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:`1px solid ${C.border}`,flexShrink:0}}>
                      <span style={{fontSize:16}}>{NETWORKS.find(n=>n.id===activeNet)?.icon}</span>
                      <span style={{fontWeight:700,fontSize:13}}>{NETWORKS.find(n=>n.id===activeNet)?.label}</span>
                      <span style={{marginLeft:"auto",fontSize:10,color:C.green,background:`${C.green}10`,padding:"3px 10px",borderRadius:20,border:`1px solid ${C.green}25`}}>✓ Listo</span>
                    </div>
                    <div style={{whiteSpace:"pre-wrap",fontSize:13.5,lineHeight:1.9,color:"#ddd",flex:1,overflowY:"auto"}}>{results[activeNet]}</div>
                    <div style={{display:"flex",gap:7,marginTop:12,paddingTop:10,borderTop:`1px solid ${C.border}`,flexShrink:0,flexWrap:"wrap"}}>
                      <button onClick={()=>{navigator.clipboard.writeText(results[activeNet]);setCopied(activeNet);setTimeout(()=>setCopied(false),2000);}}
                        style={{flex:1,background:copied===activeNet?`${C.green}20`:C.primary,color:copied===activeNet?C.green:"#fff",border:copied===activeNet?`1px solid ${C.green}`:"none",borderRadius:8,padding:"9px",fontWeight:700,cursor:"pointer",fontSize:12,transition:"all 0.2s",minWidth:100}}>
                        {copied===activeNet?"✓ Copiado":"📋 Copiar texto"}
                      </button>
                      <button onClick={()=>downloadText(activeNet)} style={{background:C.card,color:"#888",border:`1px solid ${C.border2}`,borderRadius:8,padding:"9px 12px",cursor:"pointer",fontSize:12}}>
                        ⬇ .txt
                      </button>
                      <button onClick={generateAll} style={{background:C.card,color:"#555",border:`1px solid ${C.border}`,borderRadius:8,padding:"9px 12px",cursor:"pointer",fontSize:13}}>🔁</button>
                    </div>
                  </div>
                )}
              </div>
 
              {/* Image result */}
              {(results[activeNet]||generatingImg)&&(
                <div style={{width:220,background:"#08080f",border:`1px solid ${C.border}`,borderRadius:13,padding:"14px",display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
                  <div style={{fontSize:10,color:C.muted,letterSpacing:1}}>IMAGEN DEL POST</div>
                  {generatingImg&&!postImages[activeNet]?(
                    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8}}>
                      <div style={{width:24,height:24,border:`2px solid ${C.border2}`,borderTopColor:C.primary,borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>
                      <div style={{fontSize:10,color:"#333",textAlign:"center"}}>Generando imagen...</div>
                    </div>
                  ):postImages[activeNet]?(
                    <>
                      <img src={postImages[activeNet]} style={{width:"100%",borderRadius:8,aspectRatio:"1",objectFit:"cover"}} alt="post"/>
                      <button onClick={()=>downloadImage(activeNet)} style={{background:C.primary,color:"#fff",border:"none",borderRadius:8,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:12,display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                        ⬇ Descargar imagen
                      </button>
                      <div style={{fontSize:10,color:"#333",textAlign:"center"}}>1080×1080px · Lista para publicar</div>
                    </>
                  ):null}
                </div>
              )}
            </div>
 
            {Object.keys(results).filter(k=>k!=="_error").length>0&&(
              <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:8,padding:"8px 14px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
                <span style={{fontSize:10,color:"#333",letterSpacing:1}}>REDES:</span>
                {NETWORKS.map(n=>(
                  <span key={n.id} onClick={()=>setActiveNet(n.id)} style={{fontSize:11,color:results[n.id]?C.green:"#222",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
                    {results[n.id]&&postImages[n.id]?"🖼️ ":results[n.id]?"✓ ":""}{n.label}
                  </span>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
 
      {/* GALLERY */}
      {tab==="gallery"&&(
        <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <div>
              <div style={{fontSize:17,fontWeight:800,fontFamily:"'Playfair Display',serif",marginBottom:3}}>Mi contenido</div>
              <div style={{fontSize:12,color:"#555"}}>{gallery.length} archivo{gallery.length!==1?"s":""} · {selected.length} seleccionado{selected.length!==1?"s":""}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {selected.length>0&&(
                <button onClick={()=>setTab("generator")} style={{background:C.primary,color:"#fff",border:"none",borderRadius:9,padding:"9px 18px",fontWeight:700,cursor:"pointer",fontSize:13}}>
                  Generar con {selected.length} archivo{selected.length>1?"s":""} →
                </button>
              )}
              <button onClick={()=>galleryFileRef.current.click()} style={{background:"transparent",color:C.accent,border:`1px solid ${C.primary}40`,borderRadius:9,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>
                + Subir archivos
              </button>
              <input ref={galleryFileRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={e=>addFiles(e.target.files)}/>
            </div>
          </div>
 
          <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();addFiles(e.dataTransfer.files);}} onClick={()=>galleryFileRef.current.click()}
            style={{border:`2px dashed ${C.border}`,borderRadius:12,padding:"24px",textAlign:"center",marginBottom:18,cursor:"pointer",transition:"all 0.2s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=C.border2} onMouseLeave={e=>e.currentTarget.style.borderColor=C.border}>
            <div style={{fontSize:32,marginBottom:8}}>📁</div>
            <div style={{fontSize:13,marginBottom:3,color:"#888"}}>Arrastrá imágenes y videos de tu empresa acá</div>
            <div style={{fontSize:11,color:"#333"}}>JPG, PNG, WEBP, MP4, MOV · Múltiples archivos a la vez</div>
          </div>
 
          {selected.length>0&&(
            <div style={{background:`${C.primary}10`,border:`1px solid ${C.primary}25`,borderRadius:9,padding:"9px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:C.accent,fontSize:12,fontWeight:700}}>✓ {selected.length} archivo{selected.length>1?"s":""} seleccionado{selected.length>1?"s":""}</span>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setSelected(gallery.map(g=>g.id))} style={{background:"transparent",color:C.accent,border:`1px solid ${C.primary}30`,borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11}}>Todos</button>
                <button onClick={()=>setSelected([])} style={{background:"transparent",color:"#555",border:`1px solid ${C.border2}`,borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11}}>Ninguno</button>
              </div>
            </div>
          )}
 
          {gallery.length===0?(
            <div style={{textAlign:"center",padding:"50px 20px"}}>
              <div style={{fontSize:44,marginBottom:10,opacity:0.2}}>📁</div>
              <div style={{fontSize:15,color:"#333",marginBottom:6}}>Tu carpeta de contenido está vacía</div>
              <div style={{fontSize:12,color:"#222"}}>Subí las fotos y videos de tu empresa para usarlos en los posts.</div>
            </div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
              {gallery.map(item=>{
                const isSel=selected.includes(item.id);
                return (
                  <div key={item.id} className="media-wrap" style={{position:"relative",borderRadius:10,overflow:"hidden",border:`2px solid ${isSel?C.primary:"transparent"}`,cursor:"pointer",aspectRatio:"1",transition:"border-color 0.2s",background:C.card}}
                    onClick={()=>toggleSel(item.id)}>
                    {item.isVideo
                      ? <div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6}}>
                          <div style={{fontSize:32}}>🎬</div>
                          <div style={{fontSize:10,color:"#555",textAlign:"center",padding:"0 8px"}}>{item.name.slice(0,20)}</div>
                        </div>
                      : <img src={item.preview} style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}} alt=""/>
                    }
                    {isSel&&<div style={{position:"absolute",inset:0,background:`${C.primary}20`,display:"flex",alignItems:"flex-start",justifyContent:"flex-end",padding:7}}>
                      <div style={{width:22,height:22,borderRadius:"50%",background:C.primary,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#fff",fontWeight:800}}>✓</div>
                    </div>}
                    <button className="del-btn" onClick={e=>{e.stopPropagation();removeItem(item.id);}}
                      style={{position:"absolute",top:7,left:7,background:"rgba(0,0,0,0.75)",border:"none",color:"#fff",width:20,height:20,borderRadius:"50%",cursor:"pointer",fontSize:10,lineHeight:"20px",padding:0,opacity:0}}>✕</button>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.7))",padding:"6px",fontSize:9,color:"#888"}}>{item.date}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
 
      {/* BRAND */}
      {tab==="brand"&&(
        <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>
          <div style={{maxWidth:540}}>
            <div style={{marginBottom:22}}>
              <div style={{fontSize:17,fontWeight:800,fontFamily:"'Playfair Display',serif",marginBottom:3}}>Perfil de mi marca</div>
              <div style={{fontSize:12,color:"#555"}}>MCM usa este perfil para personalizar todos los posts automáticamente.</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {[
                ["NOMBRE DE LA EMPRESA","name","input","Ej: La Josefa Granja Orgánica"],
                ["RUBRO","industry","select",""],
                ["QUÉ HACÉS / QUÉ TE DIFERENCIA","description","textarea","Ej: Granja orgánica familiar con 20 años de historia. Vendemos directo al consumidor."],
                ["CLIENTE IDEAL","target","input","Ej: Familias de 30-50 años que valoran la alimentación natural"],
                ["ESTÉTICA / ESTILO DE MARCA","colors","input","Ej: Natural, verde tierra, artesanal, cálido"],
      ].map(([label,field,type,ph])=>(
                <div key={field}>
                  <span style={LBL}>{label}</span>
                  {type==="select"?(
                    <select value={brand[field]||""} onChange={e=>updateBrand(field,e.target.value)} style={{...INP,color:brand[field]?"#fff":"#3a3a4a",cursor:"pointer"}}>
                      <option value="">Seleccioná tu rubro...</option>
                      {INDUSTRIES.map(i=><option key={i}>{i}</option>)}
                    </select>
                  ):type==="textarea"?(
                    <textarea value={brand[field]||""} onChange={e=>updateBrand(field,e.target.value)} rows={3} placeholder={ph} style={{...INP}}/>
                  ):(
                    <input value={brand[field]||""} onChange={e=>updateBrand(field,e.target.value)} placeholder={ph} style={{...INP}}/>
                  )}
                </div>
              ))}
 
              <div>
                <span style={LBL}>TONO DE COMUNICACIÓN</span>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {TONES.map(t=>(
                    <button key={t} onClick={()=>updateBrand("tone",t)} style={{background:(brand.tone||"profesional")===t?`${C.primary}20`:C.card,border:`1px solid ${(brand.tone||"profesional")===t?C.primary:C.border2}`,borderRadius:8,padding:"8px 14px",color:(brand.tone||"profesional")===t?C.accent:"#555",cursor:"pointer",fontSize:12,textTransform:"capitalize",transition:"all 0.2s"}}>{t}</button>
                  ))}
                </div>
              </div>
 
              <div style={{background:C.card,border:`1px solid ${C.primary}20`,borderRadius:10,padding:"13px 15px"}}>
                <div style={{fontSize:11,color:C.accent,fontWeight:700,marginBottom:4}}>✦ Guardado automáticamente</div>
                <div style={{fontSize:12,color:"#555",lineHeight:1.7}}>MCM usa este perfil en cada generación para que el contenido siempre suene como tu empresa.</div>
              </div>
 
              {brand.name&&(
                <button onClick={()=>setTab("generator")} style={{background:C.primary,color:"#fff",border:"none",borderRadius:10,padding:"13px",fontWeight:800,cursor:"pointer",fontSize:14}}>
                  Ir al generador →
                </button>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
