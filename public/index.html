<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCM — My Community Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;
  --accent:#6d28d9;--accent2:#a855f7;--pink:#ec4899;
  --text:#f0f0ff;--muted:#6b6b8a;--success:#22d3ee;--error:#f43f5e;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:'Inter',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:none}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.fade-in{animation:fadeIn .35s ease both}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px}
.main{flex:1;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:24px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:'Syne',sans-serif;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(109,40,217,.15);color:var(--accent2);border-color:rgba(168,85,247,.2)}
.nav-section{font-size:10px;color:var(--muted);letter-spacing:2px;padding:8px 12px 4px;margin-top:8px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s}
.step-dot.done{background:var(--success)}.step-dot.active{background:var(--accent2)}
.social-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:border-color .2s}
.social-card.connected{border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.03)}
.social-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.file-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color .2s}
.file-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;color:var(--muted);font-size:12px;transition:all .2s}
.file-add:hover{border-color:var(--accent2);color:var(--accent2)}
.post-option{background:var(--surface2);border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.post-option:hover{border-color:var(--accent2);transform:translateY(-2px)}
.post-option.selected{border-color:var(--accent)}
.post-canvas-wrap{aspect-ratio:1;background:var(--bg);overflow:hidden}
.post-caption{padding:12px;font-size:12px;color:var(--muted);line-height:1.6;max-height:80px;overflow:hidden}
.editor-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(20px)}
.editor-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:980px;max-height:92vh;overflow-y:auto;display:flex;gap:24px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;max-width:340px;animation:fadeIn .3s ease}
.toast.ok{background:#0d2b1f;border:1px solid var(--success);color:var(--success)}
.toast.err{background:#1f0d0d;border:1px solid var(--error);color:var(--error)}
.toast.info{background:#1a0d2e;border:1px solid var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("mcm_"+k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem("mcm_"+k, JSON.stringify(v)),
};

function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null),3500); };
  return [t, show];
}

const SOCIALS_DEFAULT = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
];

async function generateText(prompt) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d = await r.json();
  return d.text||"";
}


async function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function hexToRgb(hex) {
  try {
    const h = hex.replace("#","");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  } catch { return {r:109,g:40,b:217}; }
}

// Draw image covering area, centered & cropped
function coverImg(ctx, img, x, y, w, h) {
  if (!img) return;
  const s = Math.max(w/img.width, h/img.height);
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

// Rounded rectangle helper
function rRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// Smart text wrapping with max lines
function smartWrap(ctx, text, maxW, maxLines) {
  const words = text.split(" ");
  const lines = []; let line = "";
  for(const w of words) {
    const t = line + (line?" ":"") + w;
    if (ctx.measureText(t).width > maxW) {
      if (line) lines.push(line);
      line = w;
      if (lines.length >= maxLines-1) { 
        // last line — add remaining
        const rest = words.slice(words.indexOf(w)).join(" ");
        lines.push(rest);
        return lines;
      }
    } else line = t;
  }
  if (line) lines.push(line);
  return lines;
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 1 — FOTO DEL CLIENTE + DISEÑO EDITORIAL
// Layout: foto ocupa 65% inferior, header blanco con titular negro
// Estilo: revista de moda/gastronomía premium
// ════════════════════════════════════════════════════════════════
async function drawTemplate1(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const bgImg = opt.imgSrc ? await loadImg(opt.imgSrc) : null;
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();

  const HEADER = 370;
  const PHOTO_Y = HEADER;
  const FOOT = 80;

  // ── HEADER: white ──
  ctx.fillStyle = "#fafafa";
  ctx.fillRect(0,0,W,HEADER);

  // Top accent bar — full width, thick
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  ctx.fillRect(0,0,W,14);

  // ── PHOTO: bottom 65% ──
  ctx.save();
  ctx.beginPath(); ctx.rect(0,PHOTO_Y,W,H-PHOTO_Y); ctx.clip();
  if(bgImg) coverImg(ctx,bgImg,0,PHOTO_Y,W,H-PHOTO_Y);
  else { 
    const bg=ctx.createLinearGradient(0,PHOTO_Y,W,H);
    bg.addColorStop(0,`rgb(${r},${g},${b})`); bg.addColorStop(1,"#000");
    ctx.fillStyle=bg; ctx.fillRect(0,PHOTO_Y,W,H-PHOTO_Y);
  }
  ctx.restore();

  // Gradient: photo fades into header at top
  const fade = ctx.createLinearGradient(0,PHOTO_Y,0,PHOTO_Y+100);
  fade.addColorStop(0,"#fafafa"); fade.addColorStop(1,"rgba(250,250,250,0)");
  ctx.fillStyle=fade; ctx.fillRect(0,PHOTO_Y,W,100);

  // Dark gradient bottom of photo (for readability)
  const darkFade = ctx.createLinearGradient(0,H-200,0,H);
  darkFade.addColorStop(0,"rgba(0,0,0,0)"); darkFade.addColorStop(1,"rgba(0,0,0,0.6)");
  ctx.fillStyle=darkFade; ctx.fillRect(0,H-200,W,200);

  // ── HEADER TEXT ──
  if(text) {
    // Category tag
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.font = "700 18px Arial,sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("■  PUBLICACIÓN", 58, 68);

    // Main headline — dynamic sizing
    const words = text.split(" ");
    const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    
    const availH = HEADER - 90 - 40;
    let size = Math.min(160, Math.floor(availH / lines.length / 0.95));
    size = Math.max(60, Math.min(size, 160));
    
    ctx.font = `900 ${size}px Impact,'Arial Black',sans-serif`;
    // Shrink until fits width
    while(size > 40) {
      ctx.font = `900 ${size}px Impact,'Arial Black',sans-serif`;
      const maxW = Math.max(...lines.map(l=>ctx.measureText(l).width));
      if(maxW <= W-116) break;
      size -= 4;
    }
    
    ctx.fillStyle = "#0a0a0a";
    ctx.textAlign = "left";
    const lineH = size * 0.95;
    const totalH = lines.length * lineH;
    const startY = 88 + (availH - totalH)/2 + size*0.85;
    lines.forEach((ln,i) => ctx.fillText(ln, 58, startY+i*lineH));

    // Divider line below headline
    ctx.fillStyle = `rgba(${r},${g},${b},0.3)`;
    ctx.fillRect(58, HEADER-38, W-116, 1.5);
  }

  // ── FOOTER on photo ──
  ctx.font = "600 18px Arial"; ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.textAlign="right";
  ctx.fillText("MCM", W-42, H-28);
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 2 — DISEÑO GRÁFICO PURO (SIN FOTO)
// Layout: composición geométrica, tipografía grande, sin imagen
// Estilo: agencia de diseño, marca premium, texto más extenso
// ════════════════════════════════════════════════════════════════
async function drawTemplate2(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  // ── BACKGROUND: dark with geometric shapes ──
  ctx.fillStyle = "#0a0a0f";
  ctx.fillRect(0,0,W,H);

  // Large circle — color accent, top right
  ctx.beginPath();
  ctx.arc(W+100, -100, 520, 0, Math.PI*2);
  const circGrad = ctx.createRadialGradient(W+100,-100,0,W+100,-100,520);
  circGrad.addColorStop(0, `rgba(${r},${g},${b},0.7)`);
  circGrad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = circGrad; ctx.fill();

  // Second circle — bottom left
  ctx.beginPath(); ctx.arc(-60, H+60, 340, 0, Math.PI*2);
  const circGrad2 = ctx.createRadialGradient(-60,H+60,0,-60,H+60,340);
  circGrad2.addColorStop(0, `rgba(${r},${g},${b},0.4)`);
  circGrad2.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle=circGrad2; ctx.fill();

  // Horizontal lines — decorative
  ctx.strokeStyle = `rgba(${r},${g},${b},0.15)`; ctx.lineWidth=1;
  for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // ── LARGE COLOR BLOCK — left ──
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  rRect(ctx, 50, 200, 18, H-400, 9);
  ctx.fill();

  // ── MAIN HEADLINE — large, left-aligned ──
  if(text) {
    const words = text.toUpperCase().split(" ");
    const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    
    let size = 150;
    ctx.font = `900 ${size}px Impact,'Arial Black',sans-serif`;
    while(size>50){
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      if(Math.max(...lines.map(l=>ctx.measureText(l).width)) <= W-160) break;
      size-=4;
    }
    ctx.fillStyle="#ffffff"; ctx.textAlign="left";
    const lineH=size*0.95;
    const startY=200+size*0.9;
    lines.forEach((ln,i)=>ctx.fillText(ln, 96, startY+i*lineH));
  }

  // ── EXTENDED TEXT — body copy ──
  if(caption) {
    const bodySize = 32;
    ctx.font = `300 ${bodySize}px Arial,sans-serif`;
    ctx.fillStyle="rgba(255,255,255,0.75)";
    ctx.textAlign="left";
    const maxW = W-150;
    const words = caption.split(" ");
    const lines=[]; let line="";
    for(const w of words){
      const t=line+(line?" ":"")+w;
      if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}
      else line=t;
      if(lines.length>=4) break;
    }
    if(line&&lines.length<4) lines.push(line);
    const bodyY = H-280;
    lines.forEach((ln,i)=>ctx.fillText(ln, 96, bodyY+i*(bodySize*1.5)));
  }

  // ── BOTTOM BAR ──
  ctx.fillStyle=`rgba(${r},${g},${b},0.9)`;
  ctx.fillRect(0,H-72,W,72);
  ctx.font="700 22px Arial"; ctx.fillStyle="#ffffff"; ctx.textAlign="left";
  ctx.fillText("MCM · MY COMMUNITY MANAGER", 48, H-27);

  // Decorative corner elements
  ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=2;
  // top-left corner brackets
  ctx.beginPath(); ctx.moveTo(38,38); ctx.lineTo(38,90); ctx.moveTo(38,38); ctx.lineTo(90,38); ctx.stroke();
  // bottom-right
  ctx.beginPath(); ctx.moveTo(W-38,H-82); ctx.lineTo(W-38,H-90-36); ctx.moveTo(W-38,H-82); ctx.lineTo(W-90,H-82); ctx.stroke();
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 3 — FONDO GENERADO POR IA (según rubro)
// Layout: fondo artístico generado con Canvas según industria
// Estilo: cada rubro tiene su paleta y composición única
// ════════════════════════════════════════════════════════════════
async function drawTemplate3(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  const industry = (opt.industry||"").toLowerCase();

  // ── INDUSTRY-BASED BACKGROUND ──
  const isFood = /gastro|restaurante|pizza|cafe|comida|food|panaderia|heladeria/i.test(industry);
  const isHealth = /salud|fitness|deporte|medic|bienestar|gym/i.test(industry);
  const isRealEstate = /inmobil|construcci|arquitect|paisaj/i.test(industry);
  const isTech = /tecnolog|software|digital|web|app/i.test(industry);
  const isFashion = /moda|ropa|indument|fashion|belleza|estetica/i.test(industry);

  if(isFood) {
    // Warm gradient — orange/red tones
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,"#1a0800"); bg.addColorStop(0.5,"#3d1200"); bg.addColorStop(1,"#0d0000");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // Warm light burst
    const burst=ctx.createRadialGradient(W*0.7,H*0.3,0,W*0.7,H*0.3,W*0.6);
    burst.addColorStop(0,"rgba(255,120,0,0.45)"); burst.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
    // Circle decorations
    ctx.strokeStyle="rgba(255,100,0,0.12)"; ctx.lineWidth=1;
    [200,380,560].forEach(r2=>{ctx.beginPath();ctx.arc(W*0.75,H*0.28,r2,0,Math.PI*2);ctx.stroke();});
  } else if(isHealth) {
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,"#001a10"); bg.addColorStop(1,"#000d08");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const burst=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,W*0.7);
    burst.addColorStop(0,"rgba(0,200,100,0.3)"); burst.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
    // DNA-like lines
    ctx.strokeStyle="rgba(0,200,100,0.08)"; ctx.lineWidth=1;
    for(let x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  } else if(isRealEstate) {
    const bg=ctx.createLinearGradient(0,0,0,H);
    bg.addColorStop(0,"#0a0a14"); bg.addColorStop(1,"#05050a");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // Blueprint grid
    ctx.strokeStyle="rgba(100,150,255,0.07)"; ctx.lineWidth=1;
    for(let x=0;x<W;x+=54){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    // House silhouette shape — abstract
    const burst=ctx.createRadialGradient(W*0.5,H*0.45,0,W*0.5,H*0.45,W*0.55);
    burst.addColorStop(0,`rgba(${r},${g},${b},0.35)`); burst.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
  } else if(isTech) {
    ctx.fillStyle="#030308"; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(0,200,255,0.06)"; ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    const burst=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.6);
    burst.addColorStop(0,"rgba(0,180,255,0.2)"); burst.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
  } else if(isFashion) {
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,"#1a0a0a"); bg.addColorStop(1,"#0a0a1a");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,200,200,0.06)"; ctx.lineWidth=1;
    for(let i=-H;i<W;i+=60){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
    const burst=ctx.createRadialGradient(W*0.6,H*0.4,0,W*0.6,H*0.4,W*0.5);
    burst.addColorStop(0,"rgba(255,100,150,0.25)"); burst.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
  } else {
    // Generic premium dark
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,"#0a080f"); bg.addColorStop(1,"#050508");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    const burst=ctx.createRadialGradient(W*0.6,H*0.35,0,W*0.6,H*0.35,W*0.65);
    burst.addColorStop(0,`rgba(${r},${g},${b},0.35)`); burst.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=`rgba(${r},${g},${b},0.07)`; ctx.lineWidth=1;
    for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }

  // ── LARGE CIRCLE FRAME — decorative ──
  ctx.beginPath(); ctx.arc(W*0.72, H*0.38, 280, 0, Math.PI*2);
  ctx.strokeStyle=`rgba(${r},${g},${b},0.25)`; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(W*0.72, H*0.38, 240, 0, Math.PI*2);
  ctx.strokeStyle=`rgba(${r},${g},${b},0.12)`; ctx.lineWidth=1; ctx.stroke();

  // ── BRAND NAME top left ──
  ctx.font="300 20px Arial"; ctx.fillStyle=`rgba(${r},${g},${b},0.9)`; ctx.textAlign="left";
  ctx.fillText("● MCM", 60, 64);

  // ── MAIN TEXT — bottom left, massive ──
  if(text) {
    const words = text.split(" ");
    const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    
    let size=130;
    ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
    while(size>50){
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-140) break;
      size-=4;
    }

    const lineH=size*0.95;
    const totalH=lines.length*lineH;
    const startY=H-120-totalH+size*0.85;

    // Text shadow for depth
    ctx.shadowColor=`rgba(${r},${g},${b},0.6)`;
    ctx.shadowBlur=30;
    ctx.fillStyle="#ffffff"; ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln, 58, startY+i*lineH));
    ctx.shadowBlur=0;

    // Underline accent
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(58, H-110, Math.min(300, lines[lines.length-1] ? ctx.measureText(lines[lines.length-1]).width*0.6 : 200), 5);
  }

  // ── BOTTOM gradient ──
  const bot=ctx.createLinearGradient(0,H-150,0,H);
  bot.addColorStop(0,"rgba(0,0,0,0)"); bot.addColorStop(1,"rgba(0,0,0,0.8)");
  ctx.fillStyle=bot; ctx.fillRect(0,H-150,W,150);

  ctx.font="500 18px Arial"; ctx.fillStyle="rgba(255,255,255,0.4)"; ctx.textAlign="right";
  ctx.fillText("Diseño generado por IA", W-48, H-28);
}

// ── ROUTER ──
async function drawPost(canvas, opt) {
  if(opt.style===1) return drawTemplate1(canvas, opt);
  if(opt.style===2) return drawTemplate2(canvas, opt);
  return drawTemplate3(canvas, opt);
}

  const [selections,setSelections]=useState({}); // {postIdx: optionIdx}
  const [editing,setEditing]=useState(null); // {postIdx, optIdx}
  const [brief,setBrief]=useState("");
  const [progress,setProgress]=useState(0);
  const STYLES=[{id:1,name:"Revista"},{id:2,name:"Impacto"},{id:3,name:"Cine"}];

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    const imgs=files.filter(f=>f.type==="image");
    if(imgs.length===0){showToast("Agregá al menos una imagen a tus archivos","err");return;}
    setGenerating(true); setWeekPosts([]); setSelections({}); setProgress(0);

    const PROMPTS=[
      "Genera un caption "+((brand.tone||"profesional"))+" sobre el trabajo/servicio que ofrece la empresa.",
      "Genera un caption testimonial o de caso de exito relacionado con esta empresa.",
      "Genera un caption educativo con un tip o consejo relacionado al rubro.",
      "Genera un caption promocional con llamado a la accion.",
      "Genera un caption que muestre el equipo humano o valores de la empresa.",
      "Genera un caption con una pregunta para generar engagement.",
      "Genera un caption emotivo o inspirador relacionado al rubro.",
    ];
    const base="Empresa: "+brand.name+". Rubro: "+(brand.industry||"")+". Descripcion: "+(brand.description||"")+". Cliente ideal: "+(brand.target||"")+". "+(brief?"Contexto: "+brief+". ":"")+"Tono: "+(brand.tone||"profesional")+". Incluye 5-6 hashtags. Solo el caption, sin explicaciones.";

    try{
      const allPosts=[];
      for(let i=0;i<7;i++){
        setProgress(i+1);
        const imgSrc=imgs[i%imgs.length].preview;
        const [cap1,cap2,cap3,overlayRaw]=await Promise.all([
          generateText(PROMPTS[i]+base),

          generateText(PROMPTS[i]+" Version orientada a ventas y conversion. "+base),

        ]);
        const overlayText=overlayRaw.trim().replace(/['"\*\_\#]/g,"").replace(/\s+/g," ").slice(0,45);
        // Each template gets different image, text and caption
        const imgs2=files.filter(f=>f.type==="image");
        const img2=imgs2[(i+1)%imgs2.length]?.preview||imgSrc; // different photo for template 2 if available
        const options=[
          // Template 1: foto del cliente + texto corto
          {id:0,style:1,styleName:"Revista",caption:cap1,overlayText,imgSrc,
           fontSize:56,fontColor:"#ffffff",fontFamily:"Impact",fontWeight:"900",
           textBg:false,brandColor:brand.color||"#6d28d9",industry:brand.industry||""},

           fontSize:56,fontColor:"#ffffff",fontFamily:"Impact",fontWeight:"900",
           textBg:false,brandColor:brand.color||"#6d28d9",industry:brand.industry||""},
          // Template 3: fondo generado por IA según rubro

           fontSize:56,fontColor:"#ffffff",fontFamily:"Impact",fontWeight:"900",
           textBg:false,brandColor:brand.color||"#6d28d9",industry:brand.industry||""},
        ];
        allPosts.push({postIdx:i,label:"Post "+(i+1),theme:PROMPTS[i].slice(8,40)+"...",options});

              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>Elegí una opción por cada post para continuar</div>
            </div>
          </div>
          {allSelected&&(
            <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>
              📅 Programar en el calendario →
            </button>
          )}
        </div>
      )}

      {editing&&(
        <EditorModal
          opt={weekPosts[editing.postIdx]?.options[editing.optIdx]}
          brand={brand}
          onClose={()=>setEditing(null)}
          onSave={(updated)=>{
            const newWeek=[...weekPosts];
            newWeek[editing.postIdx].options[editing.optIdx]=updated;
            setWeekPosts(newWeek);
            setEditing(null);
            showToast("Cambios guardados","ok");
          }}
          showToast={showToast}
        />
      )}
    </div>
  );
}

function EditorModal({opt,brand,onClose,onSave,showToast}) {
  const canvasRef=useRef();
  const previewRef=useRef(); // preview div for drag
  const [form,setForm]=useState({
    ...opt,
    textBg: false,           // no background by default
    textX: opt.textX!==undefined?opt.textX:0.08,
    textY: opt.textY!==undefined?opt.textY:0.75,
    fontFamily: opt.fontFamily||"Impact",
    fontWeight: opt.fontWeight||"900",
  });
  const [publishing,setPublishing]=useState(false);
  const [pubMsg,setPubMsg]=useState(null);
  const [dragging,setDragging]=useState(false);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  const FONTS=[
    {id:"Arial",label:"Sans-Serif",sample:"Aa"},
    {id:"Georgia",label:"Serif",sample:"Aa"},
    {id:"'Courier New'",label:"Mono",sample:"Aa"},
    {id:"Impact",label:"Impact",sample:"Aa"},
    {id:"'Times New Roman'",label:"Times",sample:"Aa"},
    {id:"Verdana",label:"Verdana",sample:"Aa"},
  ];

  useEffect(()=>{if(canvasRef.current)drawPost(canvasRef.current,form);},[form]);

  // Drag to position text
  const handlePreviewMouseDown=(e)=>{
    e.preventDefault();
    setDragging(true);
  };

  const handlePreviewMouseMove=(e)=>{
    if(!dragging)return;
    const rect=previewRef.current.getBoundingClientRect();
    const x=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    const y=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));
    upd("textX",x);
    upd("textY",y);
  };

  const handlePreviewMouseUp=()=>setDragging(false);

  const handlePreviewTouch=(e)=>{
    const t=e.touches[0];
    const rect=previewRef.current.getBoundingClientRect();
    const x=Math.max(0,Math.min(1,(t.clientX-rect.left)/rect.width));
    const y=Math.max(0,Math.min(1,(t.clientY-rect.top)/rect.height));
    upd("textX",x); upd("textY",y);
  };

  const download=()=>{
    const cv=canvasRef.current; if(!cv)return;
    const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="MCM_post.png"; a.click();
  };

  const publishIG=async()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    setPublishing(true); setPubMsg(null);
    try{
      const upRes=await fetch("/api/instagram?action=upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageBase64:canvas.toDataURL("image/png")})});
      const upData=await upRes.json();
      if(!upData.success)throw new Error(upData.error);
      const pubRes=await fetch("/api/instagram?action=publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caption:form.caption,imageUrl:upData.url})});
      const pubData=await pubRes.json();
      if(!pubData.success)throw new Error(pubData.error);
      setPubMsg({ok:true,text:"Publicado en @gonvinardell!"});
      showToast("Publicado exitosamente!","ok");
    }catch(e){setPubMsg({ok:false,text:"Error: "+e.message});}
    finally{setPublishing(false);}
  };

  return (
    <div className="editor-wrap">
      <div className="editor-box">
        {/* LEFT: Draggable canvas preview */}
        <div style={{flex:"0 0 340px"}}>
          <div className="lbl">Preview — arrastrá el texto</div>
          <div
            ref={previewRef}
            style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",cursor:dragging?"grabbing":"crosshair",position:"relative",userSelect:"none"}}
            onMouseDown={handlePreviewMouseDown}
            onMouseMove={handlePreviewMouseMove}
            onMouseUp={handlePreviewMouseUp}
            onMouseLeave={handlePreviewMouseUp}
            onTouchMove={handlePreviewTouch}
          >
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",pointerEvents:"none"}} />
            {/* Drag hint */}
            <div style={{position:"absolute",bottom:8,left:0,right:0,textAlign:"center",fontSize:10,color:"rgba(255,255,255,.4)",pointerEvents:"none"}}>
              Click para mover el texto
            </div>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginTop:6}}>1080×1080px</div>
        </div>

        {/* RIGHT: Controls */}
        <div style={{flex:1,minWidth:260,display:"flex",flexDirection:"column",gap:13,overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontSize:16,fontWeight:700}}>Editor de diseño</h3>
            <button onClick={onClose} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:14}}>✕</button>
          </div>

          {/* Texto */}
          <div>
            <span className="lbl">Texto sobre la imagen</span>
            <input value={form.overlayText} onChange={e=>upd("overlayText",e.target.value)} placeholder="Máximo 6-8 palabras..." style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit"}} />
          </div>

          {/* Caption */}
          <div>
            <span className="lbl">Caption del post</span>
            <textarea value={form.caption} onChange={e=>upd("caption",e.target.value)} rows={4}
              style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:12,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit",resize:"none"}} />
          </div>

          {/* Fuente */}
          <div>
            <span className="lbl">Tipografía</span>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
              {[
                {id:"Arial",label:"Sans-Serif"},
                {id:"Georgia",label:"Serif"},
                {id:"'Courier New'",label:"Mono"},
                {id:"Impact",label:"Impact"},
                {id:"'Times New Roman'",label:"Times"},
                {id:"Verdana",label:"Verdana"},
              ].map(f=>(
                <button key={f.id} onClick={()=>upd("fontFamily",f.id)} className="btn"
                  style={{padding:"8px 6px",fontSize:11,flexDirection:"column",gap:2,
                    background:form.fontFamily===f.id?"rgba(109,40,217,.2)":"var(--surface2)",
                    border:"1px solid "+(form.fontFamily===f.id?"var(--accent2)":"var(--border)"),
                    color:form.fontFamily===f.id?"var(--accent2)":"var(--muted)"}}>
                  <span style={{fontSize:16,fontFamily:f.id,fontWeight:"bold"}}>Aa</span>
                  <span>{f.label}</span>
                </button>
              ))}
            </div>
          </div>

          {/* Peso de fuente */}
          <div>
            <span className="lbl">Peso</span>
            <div style={{display:"flex",gap:6}}>
              {[["normal","Normal"],["bold","Negrita"],["900","Extra Bold"]].map(([v,l])=>(
                <button key={v} onClick={()=>upd("fontWeight",v)} className="btn"
                  style={{flex:1,padding:"7px",fontSize:12,
                    background:form.fontWeight===v?"rgba(109,40,217,.2)":"var(--surface2)",
                    border:"1px solid "+(form.fontWeight===v?"var(--accent2)":"var(--border)"),
                    color:form.fontWeight===v?"var(--accent2)":"var(--muted)",
                    fontFamily:form.fontFamily,fontWeight:v}}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          {/* Tamaño y color */}
          <div style={{display:"flex",gap:12,alignItems:"flex-end"}}>
            <div style={{flex:1}}>
              <span className="lbl">Tamaño ({form.fontSize}px)</span>
              <input type="range" min={20} max={110} value={form.fontSize} onChange={e=>upd("fontSize",+e.target.value)} style={{width:"100%",accentColor:"var(--accent)"}} />
            </div>
            <div>
              <span className="lbl">Color</span>
              <input type="color" value={form.fontColor||"#ffffff"} onChange={e=>upd("fontColor",e.target.value)} style={{width:44,height:36,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:3}} />
            </div>
          </div>

          {/* Fondo del texto */}
          <div>
            <button onClick={()=>upd("textBg",!form.textBg)} className="btn"
              style={{background:form.textBg?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.textBg?"var(--accent2)":"var(--border)"),color:form.textBg?"var(--accent2)":"var(--muted)",fontSize:12,padding:"8px 14px"}}>
              {form.textBg?"✓ Fondo oscuro: ON":"○ Fondo oscuro: OFF"}
            </button>
          </div>

          {pubMsg&&<div style={{background:pubMsg.ok?"#0d2b1f":"#1f0d0d",border:"1px solid "+(pubMsg.ok?"var(--success)":"var(--error)"),color:pubMsg.ok?"var(--success)":"var(--error)",padding:"10px 14px",borderRadius:8,fontSize:12,fontWeight:600}}>{pubMsg.text}</div>}

          <div style={{display:"flex",gap:8,marginTop:"auto"}}>
            <button onClick={download} className="btn btn-ghost" style={{flex:1}}>⬇ Descargar</button>
            <button onClick={()=>onSave(form)} className="btn btn-ghost" style={{flex:1}}>✓ Guardar</button>
            <button onClick={publishIG} disabled={publishing} className="btn btn-primary"
              style={{flex:1,background:publishing?"var(--surface2)":"linear-gradient(135deg,#E1306C,#833AB4)"}}>
              {publishing?<><div className="spin"/>Publicando</>:"🚀 Publicar IG"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function ScheduleScreen({socials,showToast}) {
  const now = new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [schedules,setSchedules]=useState(store.get("schedules")||{});
  const [posts,setPosts]=useState(store.get("posts")||[]);
  const [selectedDate,setSelectedDate]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [modalData,setModalData]=useState({postNum:1,hour:"09:00",net:"instagram"});
  const [dragPost,setDragPost]=useState(null);
  const connected=socials.filter(s=>s.connected);

  const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DAYS_HEADER=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const HOURS=["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"];

  const saveSchedules=(s)=>{setSchedules(s);store.set("schedules",s);};
  const getDaysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const getFirstDayOfMonth=(y,m)=>new Date(y,m,1).getDay();
  const prevMonth=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey=dateKey(now.getFullYear(),now.getMonth(),now.getDate());

  const openModal=(day)=>{
    const key=dateKey(year,month,day);
    setSelectedDate({day,key,label:day+" de "+MONTHS[month]+" "+year});
    const existing=schedules[key];
    setModalData(existing||{postNum:dragPost||1,hour:"09:00",net:connected[0]?.id||"instagram"});
    setShowModal(true);
  };

  const assignPost=()=>{
    saveSchedules({...schedules,[selectedDate.key]:modalData});
    setShowModal(false);
    setDragPost(null);
    showToast("Post #"+modalData.postNum+" — "+selectedDate.label+" "+modalData.hour,"ok");
  };

  const removeSchedule=(key,e)=>{
    if(e)e.stopPropagation();
    const s={...schedules}; delete s[key]; saveSchedules(s);
  };

  const daysInMonth=getDaysInMonth(year,month);
  const firstDay=getFirstDayOfMonth(year,month);
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  const scheduledCount=Object.keys(schedules).length;

  // Get the 7 selected posts to show in panel
  const selectedPosts=posts.slice(0,7);

  return (
    <div style={{padding:"24px 28px",display:"flex",gap:20,height:"100%",minHeight:0}} className="fade-in">

      {/* LEFT PANEL: Post thumbnails */}
      <div style={{width:200,flexShrink:0,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,marginBottom:4}}>Mis publicaciones</div>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,lineHeight:1.5}}>Hacé click en un día del calendario para asignar el post deseado.</div>

        {selectedPosts.length===0?(
          <div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:"20px 0"}}>
            Primero generá las publicaciones.
          </div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
            {selectedPosts.map((post,i)=>(
              <div key={i}
                onClick={()=>setDragPost(i+1)}
                style={{
                  cursor:"pointer",
                  outline:dragPost===i+1?"3px solid var(--accent2)":"none",
                  borderRadius:12,
                  transition:"all .15s",
                  transform:dragPost===i+1?"scale(1.03)":"scale(1)",
                }}>
                <PostMiniCard post={post} postNum={i+1} />
              </div>
            ))}
          </div>
        )}

        {dragPost&&(
          <div style={{marginTop:8,background:"rgba(109,40,217,.15)",border:"1px solid var(--accent2)",borderRadius:10,padding:"10px",textAlign:"center"}}>
            <div style={{fontSize:12,color:"var(--accent2)",fontWeight:600}}>Post #{dragPost} seleccionado</div>
            <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>Ahora hacé click en el día</div>
            <button onClick={()=>setDragPost(null)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:11,marginTop:4}}>Cancelar</button>
          </div>
        )}
      </div>

      {/* RIGHT: Calendar */}
      <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={prevMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>‹</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}}>{MONTHS[month]} {year}</div>
          <button onClick={nextMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>›</button>
        </div>

        {posts.length===0?(
          <div className="card" style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
            <div style={{fontSize:32,marginBottom:12}}>📋</div>
            <div style={{fontWeight:600,marginBottom:6}}>No hay publicaciones generadas</div>
            <div style={{fontSize:13}}>Volvé a "Crear publicación" y generá las 7 publicaciones.</div>
          </div>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {DAYS_HEADER.map(d=>(
                <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--muted)",letterSpacing:1,padding:"4px 0"}}>{d}</div>
              ))}
            </div>

            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {Array.from({length:totalCells},(_,i)=>{
                const day=i-firstDay+1;
                const isValid=day>=1&&day<=daysInMonth;
                const key=isValid?dateKey(year,month,day):null;
                const sched=key&&schedules[key];
                const isToday=key===todayKey;
                const isPast=key&&key<todayKey;
                const soc=sched&&socials.find(s=>s.id===sched.net);
                const isClickable=isValid&&!isPast;

                return (
                  <div key={i}
                    onClick={()=>{
                      if(!isClickable)return;
                      if(dragPost){
                        const k=dateKey(year,month,day);
                        setSelectedDate({day,key:k,label:day+" de "+MONTHS[month]+" "+year});
                        setModalData({postNum:dragPost,hour:"09:00",net:connected[0]?.id||"instagram"});
                        setShowModal(true);
                      } else {
                        openModal(day);
                      }
                    }}
                    style={{
                      minHeight:72,borderRadius:10,padding:"7px 6px",
                      background:!isValid?"transparent":sched?"rgba(109,40,217,.18)":isPast?"rgba(255,255,255,.015)":dragPost?"rgba(109,40,217,.05)":"var(--surface2)",
                      border:!isValid?"none":"2px solid "+(isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)"),
                      cursor:isClickable?"pointer":"default",
                      opacity:isPast?0.35:1,
                      transition:"all .15s",
                      display:"flex",flexDirection:"column",gap:3,
                      boxShadow:dragPost&&isClickable?"0 0 0 2px rgba(168,85,247,.3) inset":"none",
                    }}
                    onMouseEnter={e=>{if(isClickable)e.currentTarget.style.borderColor="var(--accent2)";}}
                    onMouseLeave={e=>{if(isValid)e.currentTarget.style.borderColor=isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)";}}
                  >
                    {isValid&&(
                      <>
                        <div style={{fontSize:12,fontWeight:isToday?800:400,color:isToday?"var(--accent2)":"var(--text)"}}>{day}</div>
                        {sched&&(
                          <>
                            <div style={{background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:5,padding:"2px 5px",fontSize:10,fontWeight:800,color:"#fff",textAlign:"center"}}>#{sched.postNum}</div>
                            <div style={{fontSize:9,color:"var(--accent2)",textAlign:"center"}}>{sched.hour}</div>
                            <div style={{fontSize:11,textAlign:"center"}}>{soc?.icon}</div>
                            <button onClick={(e)=>removeSchedule(key,e)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:9,padding:0,lineHeight:1}}>✕ quitar</button>
                          </>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>

            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontWeight:600,fontSize:14}}>Posts programados</div>
                <div style={{fontSize:12,color:"var(--muted)"}}>{scheduledCount} en total</div>
              </div>
              {scheduledCount===0
                ?<div style={{color:"var(--muted)",fontSize:13,textAlign:"center",padding:"8px 0"}}>Seleccioná un post del panel izquierdo y hacé click en un día.</div>
                :<div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:150,overflowY:"auto"}}>
                  {Object.entries(schedules).sort(([a],[b])=>a.localeCompare(b)).map(([key,sched])=>{
                    const soc=socials.find(s=>s.id===sched.net);
                    const [y,m,d]=key.split("-");
                    const date=new Date(+y,+m-1,+d);
                    const label=date.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
                    return(
                      <div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid var(--border)",fontSize:12}}>
                        <span>{soc?.icon}</span>
                        <span style={{flex:1,textTransform:"capitalize"}}>{label}</span>
                        <span style={{color:"var(--muted)"}}>{sched.hour}</span>
                        <span style={{background:"rgba(109,40,217,.2)",border:"1px solid rgba(168,85,247,.3)",borderRadius:20,padding:"2px 8px",color:"var(--accent2)"}}>Post #{sched.postNum}</span>
                        <button onClick={()=>removeSchedule(key)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:12}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              }
              {scheduledCount>0&&(
                <button className="btn btn-primary" style={{width:"100%",marginTop:12}} onClick={()=>showToast("Calendario confirmado! MCM publicará automáticamente.","ok")}>
                  ✓ Confirmar calendario
                </button>
              )}
            </div>
          </>
        )}
      </div>

      {/* Assign modal */}
      {showModal&&selectedDate&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(16px)"}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:18,padding:28,width:"100%",maxWidth:440}} className="fade-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:700}}>📅 {selectedDate.label}</h3>
              <button onClick={()=>setShowModal(false)} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:28,height:28,borderRadius:7,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <span className="lbl">Publicación (1-7)</span>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {Array.from({length:7},(_,i)=>i+1).map(n=>(
                    <button key={n} onClick={()=>setModalData(p=>({...p,postNum:n}))} className="btn"
                      style={{width:44,height:44,padding:0,fontSize:15,fontWeight:800,
                        background:modalData.postNum===n?"rgba(109,40,217,.3)":"var(--surface2)",
                        border:"2px solid "+(modalData.postNum===n?"var(--accent2)":"var(--border)"),
                        color:modalData.postNum===n?"var(--accent2)":"var(--muted)",borderRadius:10}}>
                      {n}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Horario</span>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"].map(h=>(
                    <button key={h} onClick={()=>setModalData(p=>({...p,hour:h}))} className="btn"
                      style={{padding:"6px 9px",fontSize:12,
                        background:modalData.hour===h?"rgba(109,40,217,.2)":"var(--surface2)",
                        border:"1px solid "+(modalData.hour===h?"var(--accent2)":"var(--border)"),
                        color:modalData.hour===h?"var(--accent2)":"var(--muted)",borderRadius:8}}>
                      {h}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Red social</span>
                {connected.length===0
                  ?<div style={{color:"var(--muted)",fontSize:13}}>No tenés redes conectadas.</div>
                  :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {connected.map(s=>(
                      <button key={s.id} onClick={()=>setModalData(p=>({...p,net:s.id}))} className="btn"
                        style={{padding:"7px 14px",fontSize:13,
                          background:modalData.net===s.id?"rgba(109,40,217,.2)":"var(--surface2)",
                          border:"1px solid "+(modalData.net===s.id?"var(--accent2)":"var(--border)"),
                          color:modalData.net===s.id?"var(--accent2)":"var(--muted)"}}>
                        {s.icon} {s.name}
                      </button>
                    ))}
                  </div>}
              </div>
              <button className="btn btn-primary" style={{width:"100%"}} onClick={assignPost}>
                Programar Post #{modalData.postNum} — {selectedDate.label} {modalData.hour}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
