<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ContentAI — Generador de contenido con IA</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e1e1e;border-radius:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
input,textarea,select{font-family:'DM Sans',sans-serif}
input::placeholder,textarea::placeholder{color:#2e2e2e}
textarea{resize:none}
select{-webkit-appearance:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState } = React;

const PLANS = [
  { id:"starter", name:"Starter", price:19, posts:30, color:"#a3e635", features:["30 posts/mes","5 redes sociales","Tono personalizado","Soporte por email"] },
  { id:"pro", name:"Pro", price:49, posts:100, color:"#f59e0b", popular:true, features:["100 posts/mes","Todas las redes","IA avanzada","Calendario editorial","Soporte prioritario"] },
  { id:"agency", name:"Agency", price:129, posts:999, color:"#818cf8", features:["Posts ilimitados","10 clientes","API access","White label","Soporte 24/7"] },
];

const NETWORKS = [
  { id:"instagram", label:"Instagram", icon:"📸", tone:"visual, emocional y con hashtags relevantes" },
  { id:"linkedin",  label:"LinkedIn",  icon:"💼", tone:"profesional, con datos y orientado a negocios" },
  { id:"twitter",   label:"X/Twitter", icon:"🐦", tone:"conciso, directo y con gancho fuerte" },
  { id:"facebook",  label:"Facebook",  icon:"👥", tone:"conversacional y que invite a la interacción" },
  { id:"tiktok",    label:"TikTok",    icon:"🎵", tone:"entretenido, informal y con llamada a la acción" },
];

const INDUSTRIES = ["Restaurante / Gastronomía","Moda / Indumentaria","Salud y bienestar","Tecnología","Inmobiliaria","Educación","Turismo","Retail / Tienda","Servicios profesionales","Otro"];

function PricingCard({ plan, onCheckout, isActive }) {
  const [hover, setHover] = useState(false);
  return (
    <div onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)} style={{
      background: isActive ? `${plan.color}10` : "#0f0f0f",
      border: `1.5px solid ${isActive||hover ? plan.color : "#1e1e1e"}`,
      borderRadius:20, padding:"32px 26px", position:"relative",
      transform: isActive?"translateY(-6px)":hover?"translateY(-3px)":"none",
      boxShadow: isActive?`0 20px 60px ${plan.color}20`:"none",
      transition:"all 0.3s ease", cursor:"pointer",
    }}>
      {plan.popular && <div style={{position:"absolute",top:-13,left:"50%",transform:"translateX(-50%)",background:plan.color,color:"#000",fontSize:11,fontWeight:800,padding:"4px 16px",borderRadius:20,letterSpacing:1,whiteSpace:"nowrap"}}>⭐ MÁS POPULAR</div>}
      <div style={{color:plan.color,fontSize:11,fontWeight:700,letterSpacing:2,marginBottom:8}}>{plan.name.toUpperCase()}</div>
      <div style={{display:"flex",alignItems:"flex-end",gap:4,marginBottom:4}}>
        <span style={{fontSize:44,fontWeight:800,color:"#fff",lineHeight:1,fontFamily:"'Playfair Display',serif"}}>${plan.price}</span>
        <span style={{color:"#555",fontSize:14,marginBottom:7}}>/mes USD</span>
      </div>
      <div style={{color:"#333",fontSize:12,marginBottom:20}}>≈ ${(plan.price*1000).toLocaleString()} ARS/mes</div>
      <div style={{borderTop:"1px solid #1a1a1a",paddingTop:18,display:"flex",flexDirection:"column",gap:10,marginBottom:24}}>
        {plan.features.map((f,i)=><div key={i} style={{display:"flex",gap:10,color:"#bbb",fontSize:14}}><span style={{color:plan.color}}>✦</span>{f}</div>)}
      </div>
      <button onClick={()=>onCheckout(plan)} style={{width:"100%",background:isActive?plan.color:"transparent",border:`1.5px solid ${plan.color}`,color:isActive?"#000":plan.color,borderRadius:12,padding:"13px",fontWeight:800,cursor:"pointer",fontSize:14,transition:"all 0.2s",fontFamily:"'DM Sans',sans-serif"}}>
        {isActive ? "✓ Tu plan actual" : "Suscribirme ahora →"}
      </button>
    </div>
  );
}

function CheckoutModal({ plan, onClose, onSuccess }) {
  const [step, setStep] = useState("method");
  const [email, setEmail] = useState("");
  const [card, setCard] = useState({number:"",expiry:"",cvc:"",name:""});

  const simulatePay = () => {
    setStep("processing");
    setTimeout(()=>setStep("done"), 2400);
  };

  const inp = {width:"100%",background:"#0a0a0a",border:"1px solid #1e1e1e",borderRadius:10,padding:"11px 14px",color:"#fff",fontSize:14,outline:"none",fontFamily:"'DM Sans',sans-serif"};

  return (
    <div style={{position:"fixed",inset:0,background:"#000000d0",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{background:"#0f0f0f",border:"1px solid #1e1e1e",borderRadius:24,padding:36,width:"100%",maxWidth:430,position:"relative",animation:"fadeUp 0.3s ease forwards"}}>
        <button onClick={onClose} style={{position:"absolute",top:16,right:16,background:"#1a1a1a",border:"none",color:"#555",width:30,height:30,borderRadius:7,cursor:"pointer",fontSize:14}}>✕</button>

        {step==="method" && <>
          <div style={{marginBottom:24}}>
            <div style={{fontSize:11,color:"#444",letterSpacing:2,marginBottom:6}}>SUSCRIPCIÓN</div>
            <div style={{fontSize:24,fontWeight:800}}>{plan.name}</div>
            <div style={{color:plan.color,fontSize:18,fontWeight:700}}>${plan.price}/mes USD</div>
          </div>
          <div style={{fontSize:12,color:"#555",marginBottom:16}}>Elegí tu método de pago:</div>
          <div style={{display:"flex",flexDirection:"column",gap:10}}>
            {[{icon:"💳",title:"Stripe (Internacional)",sub:"Visa, Mastercard, Amex",action:simulatePay},{icon:"🌎",title:"Tarjeta local (Argentina)",sub:"Hasta 12 cuotas",action:()=>setStep("card")},{icon:"🏦",title:"Transferencia / USDT",sub:"CVU o cripto",action:simulatePay}].map(opt=>(
              <button key={opt.title} onClick={opt.action} style={{background:"#0a0a0a",border:"1px solid #1a1a1a",borderRadius:13,padding:"15px 18px",color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",gap:13,textAlign:"left",fontFamily:"'DM Sans',sans-serif",width:"100%"}}>
                <span style={{fontSize:22}}>{opt.icon}</span>
                <div><div style={{fontWeight:700,fontSize:14}}>{opt.title}</div><div style={{fontSize:12,color:"#555",marginTop:2}}>{opt.sub}</div></div>
              </button>
            ))}
          </div>
          <div style={{marginTop:18,textAlign:"center",color:"#2a2a2a",fontSize:12}}>🔒 Pago seguro · Sin cargos ocultos</div>
        </>}

        {step==="card" && <>
          <button onClick={()=>setStep("method")} style={{background:"none",border:"none",color:"#555",cursor:"pointer",fontSize:13,padding:"0 0 16px",display:"block",fontFamily:"inherit"}}>← Volver</button>
          <div style={{marginBottom:20}}><div style={{fontSize:20,fontWeight:800}}>Datos de pago</div><div style={{color:plan.color,fontSize:15}}>Plan {plan.name} · ${plan.price}/mes</div></div>
          <div style={{display:"flex",flexDirection:"column",gap:11}}>
            <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" style={inp}/>
            <input value={card.name} onChange={e=>setCard({...card,name:e.target.value})} placeholder="Nombre en la tarjeta" style={inp}/>
            <input value={card.number} onChange={e=>setCard({...card,number:e.target.value.replace(/\D/g,"").slice(0,16)})} placeholder="1234 5678 9012 3456" style={inp}/>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:11}}>
              <input value={card.expiry} onChange={e=>setCard({...card,expiry:e.target.value})} placeholder="MM/AA" style={inp}/>
              <input value={card.cvc} onChange={e=>setCard({...card,cvc:e.target.value.slice(0,4)})} placeholder="CVC" style={inp}/>
            </div>
            <button onClick={simulatePay} style={{background:plan.color,color:"#000",border:"none",borderRadius:12,padding:"14px",fontWeight:800,cursor:"pointer",fontSize:15,fontFamily:"inherit"}}>Pagar ${plan.price}/mes →</button>
          </div>
        </>}

        {step==="processing" && <div style={{textAlign:"center",padding:"40px 0"}}>
          <div style={{width:48,height:48,border:"3px solid #141414",borderTopColor:plan.color,borderRadius:"50%",animation:"spin 0.8s linear infinite",margin:"0 auto 20px"}}/>
          <div style={{fontSize:18,fontWeight:700,marginBottom:8}}>Procesando pago...</div>
          <div style={{color:"#444",fontSize:13}}>No cerrés esta ventana</div>
        </div>}

        {step==="done" && <div style={{textAlign:"center",padding:"16px 0"}}>
          <div style={{fontSize:58,marginBottom:14}}>🎉</div>
          <div style={{fontSize:22,fontWeight:800,marginBottom:8}}>¡Suscripción activada!</div>
          <div style={{color:"#555",fontSize:14,lineHeight:1.7,marginBottom:24}}>Bienvenido al plan <span style={{color:plan.color,fontWeight:700}}>{plan.name}</span>.<br/>Te llega un mail de confirmación.</div>
          <button onClick={()=>{onSuccess(plan);onClose();}} style={{background:plan.color,color:"#000",border:"none",borderRadius:12,padding:"14px 32px",fontWeight:800,cursor:"pointer",fontSize:15,fontFamily:"inherit"}}>Empezar a generar posts →</button>
        </div>}
      </div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("landing");
  const [activePlan, setActivePlan] = useState(null);
  const [checkoutPlan, setCheckoutPlan] = useState(null);
  const [tab, setTab] = useState("generator");
  const [network, setNetwork] = useState(NETWORKS[0]);
  const [businessName, setBusinessName] = useState("");
  const [industry, setIndustry] = useState("");
  const [topic, setTopic] = useState("");
  const [tone, setTone] = useState("profesional");
  const [generating, setGenerating] = useState(false);
  const [result, setResult] = useState("");
  const [postsUsed, setPostsUsed] = useState(0);
  const [copied, setCopied] = useState(false);

  const plan = activePlan || PLANS[1];
  const postsLeft = plan.posts===999?"∞":Math.max(0,plan.posts-postsUsed);

  const generateContent = async () => {
    if(!topic.trim()) return;
    setGenerating(true); setResult("");
    const prompt = `Sos un experto en marketing digital y redes sociales latinoamericanas.
Generá UN post de alto impacto para ${network.label} para "${businessName||"mi negocio"}" del rubro "${industry||"servicios"}".
Tema: "${topic}" · Tono: ${tone} y ${network.tone}

Formato:
📝 POST:
[contenido listo para copiar, emojis si aplica]

🏷️ HASHTAGS:
[5-8 hashtags relevantes]

💡 TIP DE ALCANCE:
[consejo rápido y concreto]

Respondé directo.`;
    try {
      const res = await fetch("/api/generate",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({prompt})
      });
      const data = await res.json();
      setResult(data.text||"Error al generar.");
      setPostsUsed(p=>p+1);
    } catch { setResult("❌ Error de conexión."); }
    setGenerating(false);
  };

  // LANDING
  if(view==="landing") return (
    <div style={{minHeight:"100vh",background:"#080808",color:"#fff",fontFamily:"'DM Sans',sans-serif"}}>
      <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 40px",borderBottom:"1px solid #111",position:"sticky",top:0,background:"#080808ee",backdropFilter:"blur(16px)",zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:30,height:30,background:"#a3e635",borderRadius:8,display:"grid",placeItems:"center",fontSize:13}}>✦</div>
          <span style={{fontFamily:"'Playfair Display',serif",fontSize:19,fontWeight:800}}>ContentAI</span>
        </div>
        <div style={{display:"flex",gap:28}}>
          <span onClick={()=>setView("pricing")} style={{color:"#555",fontSize:14,cursor:"pointer"}}>Precios</span>
          <span onClick={()=>setView("app")} style={{color:"#555",fontSize:14,cursor:"pointer"}}>Demo</span>
        </div>
        <button onClick={()=>setView("pricing")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:11,padding:"10px 22px",fontWeight:700,cursor:"pointer",fontSize:14}}>Empezar gratis →</button>
      </nav>

      <div style={{textAlign:"center",padding:"110px 20px 90px",animation:"fadeUp 0.7s ease"}}>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"#a3e63510",border:"1px solid #a3e63330",color:"#a3e635",fontSize:11,fontWeight:700,padding:"6px 18px",borderRadius:20,marginBottom:36,letterSpacing:1.5}}>✦ POWERED BY CLAUDE AI</div>
        <h1 style={{fontSize:"clamp(44px,9vw,88px)",fontFamily:"'Playfair Display',serif",fontWeight:800,lineHeight:1.05,margin:"0 0 26px",background:"linear-gradient(135deg,#ffffff 0%,#a3e635 45%,#f59e0b 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>
          Nunca más te<br/>quedés sin qué publicar.
        </h1>
        <p style={{color:"#555",fontSize:20,maxWidth:510,margin:"0 auto 52px",lineHeight:1.65}}>ContentAI genera posts perfectos para cada red social en segundos. Sin experiencia. En español rioplatense.</p>
        <div style={{display:"flex",gap:14,justifyContent:"center",flexWrap:"wrap"}}>
          <button onClick={()=>setView("app")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:13,padding:"17px 40px",fontWeight:800,cursor:"pointer",fontSize:17}}>Probar gratis 7 días</button>
          <button onClick={()=>setView("pricing")} style={{background:"transparent",color:"#fff",border:"1px solid #222",borderRadius:13,padding:"17px 40px",fontWeight:600,cursor:"pointer",fontSize:17}}>Ver planes y precios</button>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"center",gap:"clamp(28px,7vw,90px)",padding:"40px 20px",borderTop:"1px solid #111",borderBottom:"1px solid #111",flexWrap:"wrap"}}>
        {[["2.400+","negocios"],["98%","ahorro de tiempo"],["5 seg","por post"],["$19","precio de entrada"]].map(([n,l])=>(
          <div key={l} style={{textAlign:"center"}}>
            <div style={{fontFamily:"'Playfair Display',serif",fontSize:38,fontWeight:800,color:"#a3e635"}}>{n}</div>
            <div style={{color:"#444",fontSize:13,marginTop:4}}>{l}</div>
          </div>
        ))}
      </div>

      <div style={{padding:"80px 40px",maxWidth:1080,margin:"0 auto"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:40,textAlign:"center",marginBottom:56}}>Todo lo que necesitás</h2>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(255px,1fr))",gap:18}}>
          {[["⚡","Posts en 5 segundos","Describí el tema y la IA genera el post optimizado para cada red."],["🎯","Tono de tu marca","Configurá la voz una vez. Todos los posts suenan auténticos."],["🇦🇷","Español rioplatense","Entendemos el vos, los modismos y el contexto de Latam."],["📊","5 redes en uno","Instagram, LinkedIn, TikTok, Facebook y X desde un solo lugar."],["🔁","Variaciones infinitas","No te gusta? Regenerá hasta que sea perfecto."],["📅","Calendario editorial","Planificá el mes entero en minutos con sugerencias de IA."]].map(([icon,title,desc])=>(
            <div key={title} style={{background:"#0c0c0c",border:"1px solid #141414",borderRadius:16,padding:"24px 22px"}}>
              <div style={{fontSize:28,marginBottom:10}}>{icon}</div>
              <div style={{fontWeight:700,fontSize:15,marginBottom:7}}>{title}</div>
              <div style={{color:"#555",fontSize:13,lineHeight:1.65}}>{desc}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{textAlign:"center",padding:"80px 20px",borderTop:"1px solid #111"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:48,marginBottom:12}}>Empezá hoy.</h2>
        <p style={{color:"#555",fontSize:17,marginBottom:36}}>7 días gratis · Sin tarjeta · Cancelá cuando quieras</p>
        <button onClick={()=>setView("pricing")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:13,padding:"17px 52px",fontWeight:800,cursor:"pointer",fontSize:17}}>Elegir mi plan →</button>
      </div>
    </div>
  );

  // PRICING
  if(view==="pricing") return (
    <div style={{minHeight:"100vh",background:"#080808",color:"#fff",fontFamily:"'DM Sans',sans-serif"}}>
      {checkoutPlan && <CheckoutModal plan={checkoutPlan} onClose={()=>setCheckoutPlan(null)} onSuccess={p=>{setActivePlan(p);setView("app");}}/>}
      <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 40px",borderBottom:"1px solid #111"}}>
        <span onClick={()=>setView("landing")} style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:800,cursor:"pointer"}}>✦ ContentAI</span>
        <button onClick={()=>setView("app")} style={{background:"transparent",color:"#a3e635",border:"1px solid #a3e63540",borderRadius:10,padding:"9px 20px",cursor:"pointer",fontWeight:700,fontSize:13}}>Ver demo →</button>
      </nav>
      <div style={{textAlign:"center",padding:"70px 20px 50px"}}>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:54,margin:"0 0 12px"}}>Planes simples.</h1>
        <p style={{color:"#555",fontSize:18}}>Sin contratos. Cancelá cuando quieras.</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(280px,1fr))",gap:24,maxWidth:980,margin:"0 auto",padding:"0 24px 60px"}}>
        {PLANS.map(p=><PricingCard key={p.id} plan={p} isActive={activePlan?.id===p.id} onCheckout={pl=>setCheckoutPlan(pl)}/>)}
      </div>
    </div>
  );

  // APP
  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#080808",color:"#fff",fontFamily:"'DM Sans',sans-serif",overflow:"hidden"}}>
      {checkoutPlan && <CheckoutModal plan={checkoutPlan} onClose={()=>setCheckoutPlan(null)} onSuccess={p=>setActivePlan(p)}/>}

      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"13px 24px",borderBottom:"1px solid #111",background:"#0a0a0a",flexShrink:0}}>
        <span onClick={()=>setView("landing")} style={{fontFamily:"'Playfair Display',serif",fontSize:17,fontWeight:800,cursor:"pointer"}}>✦ ContentAI</span>
        <div style={{display:"flex",alignItems:"center",gap:14}}>
          {activePlan
            ? <><div style={{textAlign:"right"}}><div style={{fontSize:10,color:"#333",letterSpacing:1}}>PLAN {plan.name.toUpperCase()}</div><div style={{fontSize:12,color:plan.color,fontWeight:700}}>{postsLeft} posts restantes</div></div><button onClick={()=>setView("pricing")} style={{background:`${plan.color}12`,color:plan.color,border:`1px solid ${plan.color}40`,borderRadius:9,padding:"6px 14px",cursor:"pointer",fontSize:12,fontWeight:700}}>Mejorar ↑</button></>
            : <button onClick={()=>setView("pricing")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:9,padding:"8px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>Suscribirme →</button>
          }
        </div>
      </div>

      <div style={{display:"flex",flex:1,overflow:"hidden"}}>
        <div style={{width:180,borderRight:"1px solid #111",padding:"16px 10px",display:"flex",flexDirection:"column",gap:3,flexShrink:0}}>
          {[["generator","✦","Generador"],["pricing_tab","💳","Suscripción"]].map(([id,icon,label])=>(
            <button key={id} onClick={()=>id==="pricing_tab"?setView("pricing"):setTab(id)} style={{display:"flex",alignItems:"center",gap:10,padding:"10px 12px",background:tab===id?"#141414":"transparent",border:"none",borderRadius:9,color:tab===id?"#fff":"#3a3a3a",cursor:"pointer",fontSize:13,textAlign:"left",fontFamily:"inherit"}}>
              <span>{icon}</span>{label}
            </button>
          ))}
          <div style={{marginTop:"auto",background:"#0c0c0c",border:"1px solid #141414",borderRadius:12,padding:"14px 12px"}}>
            <div style={{fontSize:10,color:"#2a2a2a",letterSpacing:1,marginBottom:5}}>META $10K/MES</div>
            <div style={{fontSize:24,fontWeight:800,color:"#a3e635",fontFamily:"'Playfair Display',serif"}}>${activePlan?plan.price:0}</div>
            <div style={{color:"#2a2a2a",fontSize:11,marginBottom:8}}>ingreso actual/mes</div>
            <div style={{height:3,background:"#141414",borderRadius:3}}>
              <div style={{height:"100%",width:`${Math.min((plan.price/10000)*100,100)}%`,background:"#a3e635",borderRadius:3}}/>
            </div>
          </div>
        </div>

        <div style={{flex:1,overflowY:"auto",padding:"24px 26px"}}>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:22,maxWidth:980}}>
            <div style={{display:"flex",flexDirection:"column",gap:16}}>
              <div>
                <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:24,margin:"0 0 4px"}}>Generador IA</h2>
                <p style={{color:"#333",fontSize:13}}>Completá y la IA hace el resto.</p>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                <div>
                  <div style={{fontSize:10,color:"#333",marginBottom:5,letterSpacing:1}}>NEGOCIO</div>
                  <input value={businessName} onChange={e=>setBusinessName(e.target.value)} placeholder="Ej: Café del Centro" style={{width:"100%",background:"#0c0c0c",border:"1px solid #161616",borderRadius:9,padding:"10px 12px",color:"#fff",fontSize:13,outline:"none"}}/>
                </div>
                <div>
                  <div style={{fontSize:10,color:"#333",marginBottom:5,letterSpacing:1}}>RUBRO</div>
                  <select value={industry} onChange={e=>setIndustry(e.target.value)} style={{width:"100%",background:"#0c0c0c",border:"1px solid #161616",borderRadius:9,padding:"10px 12px",color:industry?"#fff":"#2a2a2a",fontSize:13,cursor:"pointer"}}>
                    <option value="">Seleccioná...</option>
                    {INDUSTRIES.map(i=><option key={i}>{i}</option>)}
                  </select>
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#333",marginBottom:7,letterSpacing:1}}>RED SOCIAL</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {NETWORKS.map(n=><button key={n.id} onClick={()=>setNetwork(n)} style={{background:network.id===n.id?"#a3e63510":"#0c0c0c",border:`1px solid ${network.id===n.id?"#a3e635":"#161616"}`,borderRadius:8,padding:"7px 12px",color:network.id===n.id?"#a3e635":"#444",cursor:"pointer",fontSize:12,fontFamily:"inherit"}}>{n.icon} {n.label}</button>)}
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#333",marginBottom:7,letterSpacing:1}}>TONO</div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {["profesional","divertido","inspirador","urgente"].map(t=><button key={t} onClick={()=>setTone(t)} style={{background:tone===t?"#f59e0b10":"#0c0c0c",border:`1px solid ${tone===t?"#f59e0b":"#161616"}`,borderRadius:8,padding:"7px 11px",color:tone===t?"#f59e0b":"#444",cursor:"pointer",fontSize:12,fontFamily:"inherit",textTransform:"capitalize"}}>{t}</button>)}
                </div>
              </div>
              <div>
                <div style={{fontSize:10,color:"#333",marginBottom:5,letterSpacing:1}}>SOBRE QUÉ PUBLICAR *</div>
                <textarea value={topic} onChange={e=>setTopic(e.target.value)} rows={4} placeholder="Ej: Promoción 2x1 en hamburguesas este sábado..." style={{width:"100%",background:"#0c0c0c",border:"1px solid #161616",borderRadius:9,padding:"10px 12px",color:"#fff",fontSize:13,outline:"none"}}/>
              </div>
              <button onClick={generateContent} disabled={generating||!topic.trim()} style={{background:generating||!topic.trim()?"#141414":"#a3e635",color:generating||!topic.trim()?"#2a2a2a":"#000",border:"none",borderRadius:11,padding:"13px",fontSize:15,fontWeight:800,cursor:generating||!topic.trim()?"not-allowed":"pointer",display:"flex",alignItems:"center",justifyContent:"center",gap:10,fontFamily:"inherit"}}>
                {generating?<><div style={{width:15,height:15,border:"2px solid #2a2a2a",borderTopColor:"#a3e635",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>Generando...</>:"✦ Generar post ahora"}
              </button>
            </div>

            <div style={{display:"flex",flexDirection:"column",gap:12}}>
              <div style={{fontSize:10,color:"#333",letterSpacing:1}}>RESULTADO</div>
              <div style={{background:"#0a0a0a",border:"1px solid #141414",borderRadius:13,padding:20,flex:1,minHeight:340,display:"flex",flexDirection:"column"}}>
                {!result&&!generating&&<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#1e1e1e",textAlign:"center"}}><div style={{fontSize:42,marginBottom:10}}>{network.icon}</div><div style={{fontSize:13}}>Tu post para {network.label} aparecerá acá</div></div>}
                {generating&&<div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}><div style={{width:34,height:34,border:"3px solid #141414",borderTopColor:"#a3e635",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/><div style={{color:"#333",fontSize:13}}>La IA está escribiendo...</div></div>}
                {result&&!generating&&<div style={{animation:"fadeIn 0.4s ease",flex:1,display:"flex",flexDirection:"column"}}>
                  <div style={{whiteSpace:"pre-wrap",fontSize:13.5,lineHeight:1.85,color:"#ccc",flex:1}}>{result}</div>
                  <div style={{display:"flex",gap:9,marginTop:18,paddingTop:14,borderTop:"1px solid #141414"}}>
                    <button onClick={()=>{navigator.clipboard.writeText(result);setCopied(true);setTimeout(()=>setCopied(false),2000);}} style={{flex:1,background:copied?"#1a2a10":"#a3e635",color:copied?"#a3e635":"#000",border:copied?"1px solid #a3e635":"none",borderRadius:8,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>
                      {copied?"✓ Copiado!":"📋 Copiar"}
                    </button>
                    <button onClick={generateContent} style={{background:"#141414",color:"#666",border:"none",borderRadius:8,padding:"10px 14px",cursor:"pointer",fontSize:13,fontFamily:"inherit"}}>🔁</button>
                  </div>
                </div>}
              </div>
              <div style={{background:"#0c0c0c",border:"1px solid #141414",borderRadius:11,padding:"12px 16px"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6,fontSize:11}}>
                  <span style={{color:"#2a2a2a",letterSpacing:1}}>USO DEL MES</span>
                  <span style={{color:plan.color,fontWeight:700}}>{postsUsed} / {plan.posts===999?"∞":plan.posts}</span>
                </div>
                {plan.posts!==999&&<div style={{height:3,background:"#141414",borderRadius:3}}><div style={{height:"100%",width:`${Math.min((postsUsed/plan.posts)*100,100)}%`,background:plan.color,borderRadius:3}}/></div>}
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
