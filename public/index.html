// EDITOR MODAL — con portal, cambio de foto, 2 textos, stickers
// ════════════════════════════════════════════════════════════════
function EditorModal({opt,brand,onClose,onSave,showToast}) {
  const canvasRef=useRef();
  const previewRef=useRef();
  const bgInputRef=useRef();

  const makeText=(src,idx)=>({
    text: idx===0?(src?.overlayText||""):(src?.overlayText2||""),
    x: idx===0?(src?.textX!==undefined?src.textX:0.05):(src?.text2X!==undefined?src.text2X:0.05),
    y: idx===0?(src?.textY!==undefined?src.textY:0.75):(src?.text2Y!==undefined?src.text2Y:0.88),
    fontFamily: idx===0?(src?.fontFamily||"Impact"):(src?.fontFamily2||"Impact"),
    fontWeight: idx===0?(src?.fontWeight||"900"):(src?.fontWeight2||"900"),
    fontSize: idx===0?(src?.fontSize||56):(src?.fontSize2||40),
    fontColor: idx===0?(src?.fontColor||"#ffffff"):(src?.fontColor2||"#ffffff"),
    textBg: idx===0?(src?.textBg||false):(src?.textBg2||false),
    visible: idx===0?true:(src?.text2Visible!==undefined?src.text2Visible:false),
  });

  const [texts,setTexts]=useState([makeText(opt,0),makeText(opt,1)]);
  const [activeText,setActiveText]=useState(0);
  const [form,setForm]=useState({
    ...opt,
    showLogo: opt.showLogo!==undefined?opt.showLogo:true,
    logoBase64: opt.logoBase64||brand?.logoBase64||null,
    logoX: opt.logoX!==undefined?opt.logoX:undefined,
    logoY: opt.logoY!==undefined?opt.logoY:undefined,
    logoSize: opt.logoSize!==undefined?opt.logoSize:0.15,
    stickers: opt.stickers||[],
  });

  const [publishing,setPublishing]=useState(false);
  const [pubMsg,setPubMsg]=useState(null);
  const [dragMode,setDragMode]=useState(null);
  const [showFormatPicker,setShowFormatPicker]=useState(false);
  const [showStickerPanel,setShowStickerPanel]=useState(false);
  const [activeStickerSet,setActiveStickerSet]=useState(0);
  const [activeSticker,setActiveSticker]=useState(null);
  const [showLinkPanel,setShowLinkPanel]=useState(false);
  const [showPollPanel,setShowPollPanel]=useState(false);
  const [link,setLink]=useState(opt.link||"");
  const [linkLabel,setLinkLabel]=useState(opt.linkLabel||"");
  const [poll,setPoll]=useState(opt.poll||{question:"",options:["",""],active:false});

  const updForm=(k,v)=>setForm(p=>({...p,[k]:v}));
  const updText=(idx,k,v)=>setTexts(ts=>ts.map((t,i)=>i===idx?{...t,[k]:v}:t));
  const t=texts[activeText];

  useEffect(()=>{
    if(!canvasRef.current) return;
    drawPost(canvasRef.current,{
      ...form,
      overlayText:texts[0].text, textX:texts[0].x, textY:texts[0].y,
      fontFamily:texts[0].fontFamily, fontWeight:texts[0].fontWeight, fontSize:texts[0].fontSize, fontColor:texts[0].fontColor, textBg:texts[0].textBg,
      overlayText2:texts[1].visible?texts[1].text:"",
      text2X:texts[1].x, text2Y:texts[1].y,
      fontFamily2:texts[1].fontFamily, fontWeight2:texts[1].fontWeight, fontSize2:texts[1].fontSize, fontColor2:texts[1].fontColor, textBg2:texts[1].textBg,
    });
  },[form,texts]);

  // Cambio de imagen de fondo
  const handleBgChange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader();
    reader.onload=ev=>{
      updForm("imgSrc",ev.target.result);
      // Aprender que el cliente prefiere cambiar imágenes
      const prefs=store.get("stylePrefs")||{};
      store.set("stylePrefs",{...prefs,preferCustomBg:true,lastBgChange:Date.now()});
      showToast("Imagen de fondo cambiada ✓","ok");
    };
    reader.readAsDataURL(file);
  };

  const getClickTarget=(clientX,clientY)=>{
    const rect=previewRef.current.getBoundingClientRect();
    const fx=(clientX-rect.left)/rect.width, fy=(clientY-rect.top)/rect.height;
    for(let i=form.stickers.length-1;i>=0;i--){
      const s=form.stickers[i]; const sz=s.size||0.1;
      if(Math.abs(fx-s.x)<sz*0.7&&Math.abs(fy-s.y)<sz*0.7) return "sticker:"+i;
    }
    if(form.showLogo&&form.logoBase64){
      const lx=form.logoX||0.88, ly=form.logoY||0.88, ls=form.logoSize||0.15;
      if(Math.abs(fx-lx)<ls*0.7&&Math.abs(fy-ly)<ls*0.7) return "logo";
    }
    if(texts[1].visible&&Math.abs(fx-texts[1].x)<0.15&&Math.abs(fy-texts[1].y)<0.08){setActiveText(1);return "text1";}
    setActiveText(0); return "text0";
  };

  const applyDrag=(fx,fy)=>{
    if(dragMode==="text0") setTexts(ts=>[{...ts[0],x:fx,y:fy},ts[1]]);
    else if(dragMode==="text1") setTexts(ts=>[ts[0],{...ts[1],x:fx,y:fy}]);
    else if(dragMode==="logo") setForm(p=>({...p,logoX:fx,logoY:fy}));
    else if(dragMode&&dragMode.startsWith("sticker:")){
      const idx=+dragMode.split(":")[1];
      setForm(p=>({...p,stickers:p.stickers.map((s,i)=>i===idx?{...s,x:fx,y:fy}:s)}));
    }
  };

  const handleMouseDown=(e)=>{ e.preventDefault(); const tgt=getClickTarget(e.clientX,e.clientY); setDragMode(tgt); if(tgt.startsWith("sticker:"))setActiveSticker(+tgt.split(":")[1]); };
  const handleMouseMove=(e)=>{ if(!dragMode) return; const rect=previewRef.current.getBoundingClientRect(); applyDrag(Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)),Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height))); };
  const handleMouseUp=()=>setDragMode(null);
  const handleTouchStart=(e)=>{ e.preventDefault(); const t2=e.touches[0]; const tgt=getClickTarget(t2.clientX,t2.clientY); setDragMode(tgt); if(tgt.startsWith("sticker:"))setActiveSticker(+tgt.split(":")[1]); };
  const handleTouchMove=(e)=>{ if(!dragMode) return; const rect=previewRef.current.getBoundingClientRect(); const t2=e.touches[0]; applyDrag(Math.max(0,Math.min(1,(t2.clientX-rect.left)/rect.width)),Math.max(0,Math.min(1,(t2.clientY-rect.top)/rect.height))); };

  const addSticker=(emoji)=>{ setForm(p=>({...p,stickers:[...p.stickers,{emoji,x:0.5,y:0.5,size:0.1}]})); setActiveSticker(form.stickers.length); setShowStickerPanel(false); };
  const removeSticker=(idx)=>{ setForm(p=>({...p,stickers:p.stickers.filter((_,i)=>i!==idx)})); setActiveSticker(null); };

  const download=()=>{ const cv=canvasRef.current; if(!cv)return; const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="MCM_post.png"; a.click(); };

  const publishIG=async(format)=>{
    const canvas=canvasRef.current; if(!canvas)return;
    setPublishing(true); setPubMsg(null); setShowFormatPicker(false);
    try{
      const upRes=await fetch("/api/instagram?action=upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageBase64:canvas.toDataURL("image/png")})});
      const upData=await upRes.json(); if(!upData.success)throw new Error(upData.error);
      const pubPayload={
        caption: form.caption,
        imageUrl: upData.url,
        format: format||"post",
        link: link||null,
        linkLabel: linkLabel||null,
        poll: poll.active&&poll.question ? poll : null,
      };
      const pubRes=await fetch("/api/instagram?action=publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(pubPayload)});
      const pubData=await pubRes.json(); if(!pubData.success)throw new Error(pubData.error);
      // Guardar en historial
      const hist=store.get("postHistory")||[];
      hist.unshift({id:Date.now(),imgBase64:canvas.toDataURL("image/jpeg",0.5),caption:form.caption,date:new Date().toISOString(),network:"instagram",format:format||"post",status:"published",postId:pubData.id||""});
      store.set("postHistory",hist.slice(0,50));
      const lbl={"post":"Publicación","story":"Historia","reel":"Reel"}[format]||"Post";
      setPubMsg({ok:true,text:lbl+" publicada en @gonvinardell!"}); showToast(lbl+" publicada!","ok");
    }catch(e){setPubMsg({ok:false,text:"Error: "+e.message});}
    finally{setPublishing(false);}
  };

  const handleSave=()=>{
    onSave({...form,
      overlayText:texts[0].text, textX:texts[0].x, textY:texts[0].y,
      fontFamily:texts[0].fontFamily, fontWeight:texts[0].fontWeight, fontSize:texts[0].fontSize, fontColor:texts[0].fontColor, textBg:texts[0].textBg,
      overlayText2:texts[1].text, text2X:texts[1].x, text2Y:texts[1].y,
      fontFamily2:texts[1].fontFamily, fontWeight2:texts[1].fontWeight, fontSize2:texts[1].fontSize, fontColor2:texts[1].fontColor, textBg2:texts[1].textBg,
      text2Visible:texts[1].visible,
      link, linkLabel,
      poll: poll.active ? poll : null,
    });
  };

  return (
    <div className="editor-wrap" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
      <div className="editor-box" onClick={e=>e.stopPropagation()}>

        {/* LEFT: Canvas */}
        <div style={{flex:"0 0 310px",display:"flex",flexDirection:"column",gap:8}}>
          <div className="lbl" style={{marginBottom:0}}>Preview — arrastrá cualquier elemento</div>
          <div ref={previewRef} style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",cursor:dragMode?"grabbing":"crosshair",position:"relative",userSelect:"none"}}
            onMouseDown={handleMouseDown} onMouseMove={handleMouseMove} onMouseUp={handleMouseUp} onMouseLeave={handleMouseUp}
            onTouchStart={handleTouchStart} onTouchMove={handleTouchMove} onTouchEnd={handleMouseUp}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",pointerEvents:"none"}} />
            <div style={{position:"absolute",left:`${texts[0].x*100}%`,top:`${texts[0].y*100}%`,transform:"translate(-50%,-50%)",pointerEvents:"none",width:10,height:10,borderRadius:"50%",background:activeText===0?"var(--accent2)":"rgba(168,85,247,0.5)",boxShadow:"0 0 0 2px rgba(168,85,247,0.3)"}} />
            {texts[1].visible&&<div style={{position:"absolute",left:`${texts[1].x*100}%`,top:`${texts[1].y*100}%`,transform:"translate(-50%,-50%)",pointerEvents:"none",width:10,height:10,borderRadius:"50%",background:activeText===1?"var(--success)":"rgba(34,211,238,0.5)",boxShadow:"0 0 0 2px rgba(34,211,238,0.3)"}} />}
            {form.showLogo&&form.logoBase64&&<div style={{position:"absolute",left:`${(form.logoX||0.88)*100}%`,top:`${(form.logoY||0.88)*100}%`,transform:"translate(-50%,-50%)",pointerEvents:"none",width:8,height:8,borderRadius:"50%",background:"var(--pink)",boxShadow:"0 0 0 2px rgba(236,72,153,0.4)"}} />}
            {form.stickers.map((s,i)=>(
              <div key={i} style={{position:"absolute",left:`${s.x*100}%`,top:`${s.y*100}%`,transform:"translate(-50%,-50%)",pointerEvents:"none",outline:activeSticker===i?"2px solid var(--accent2)":"none",borderRadius:4,fontSize:`${(s.size||0.1)*120}px`,lineHeight:1}}>{s.emoji}</div>
            ))}
            <div style={{position:"absolute",bottom:6,left:0,right:0,textAlign:"center",fontSize:9,color:"rgba(255,255,255,.35)",pointerEvents:"none"}}>● violeta=T1 · ● verde=T2 · ● rosa=logo</div>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"center"}}>1080×1080px</div>

          {/* Cambiar imagen de fondo */}
          <input ref={bgInputRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleBgChange} />
          <button className="btn btn-ghost" style={{fontSize:12,padding:"8px"}} onClick={()=>bgInputRef.current.click()}>
            🖼 Cambiar imagen de fondo
          </button>
        </div>

        {/* RIGHT: Controls */}
        <div style={{flex:1,minWidth:260,display:"flex",flexDirection:"column",gap:10,overflowY:"auto",maxHeight:"calc(94vh - 48px)"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontSize:15,fontWeight:700}}>Editor de diseño</h3>
            <button onClick={onClose} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:28,height:28,borderRadius:8,cursor:"pointer",fontSize:13}}>✕</button>
          </div>

          {/* Caption */}
          <div>
            <span className="lbl">Caption del post</span>
            <textarea value={form.caption} onChange={e=>updForm("caption",e.target.value)} rows={3}
              style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:12,padding:"9px 11px",width:"100%",outline:"none",fontFamily:"inherit",resize:"none"}} />
          </div>

          {/* Selector texto activo */}
          <div style={{display:"flex",gap:4,background:"var(--surface2)",borderRadius:10,padding:3}}>
            {[0,1].map(i=>(
              <button key={i} onClick={()=>setActiveText(i)}
                style={{flex:1,padding:"7px",fontSize:12,fontWeight:600,borderRadius:8,border:"none",cursor:"pointer",
                  background:activeText===i?(i===0?"rgba(109,40,217,.35)":"rgba(34,211,238,.2)"):"transparent",
                  color:activeText===i?(i===0?"var(--accent2)":"var(--success)"):"var(--muted)"}}>
                {i===0?"● Texto 1":"● Texto 2"}{i===1&&!texts[1].visible&&" (inactivo)"}
              </button>
            ))}
          </div>

          {/* Texto activo */}
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:5}}>
              <span className="lbl" style={{margin:0}}>Texto {activeText+1}</span>
              {activeText===1&&(
                <button onClick={()=>updText(1,"visible",!texts[1].visible)} className="btn"
                  style={{fontSize:11,padding:"3px 9px",background:texts[1].visible?"rgba(34,211,238,.15)":"var(--surface2)",border:"1px solid "+(texts[1].visible?"var(--success)":"var(--border)"),color:texts[1].visible?"var(--success)":"var(--muted)"}}>
                  {texts[1].visible?"✓ Activo":"+ Activar"}
                </button>
              )}
            </div>
            <input value={t.text} onChange={e=>updText(activeText,"text",e.target.value)}
              placeholder={activeText===0?"Máximo 5-6 palabras...":"Subtítulo, fecha, precio, etc."}
              style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"9px 11px",width:"100%",outline:"none",fontFamily:"inherit"}} />
          </div>

          {/* Tipografía */}
          <select value={t.fontFamily} onChange={e=>updText(activeText,"fontFamily",e.target.value)}
            style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"9px 11px",outline:"none",cursor:"pointer"}}>
            <option value="Impact">Impact — DISPLAY</option>
            <option value="Arial">Arial — Sans-Serif</option>
            <option value="Georgia">Georgia — Serif</option>
            <option value="'Courier New'">Courier New — Mono</option>
            <option value="'Times New Roman'">Times New Roman — Clásica</option>
            <option value="Verdana">Verdana — Legible</option>
          </select>

          {/* Peso */}
          <div style={{display:"flex",gap:5}}>
            {[["normal","Normal"],["bold","Negrita"],["900","Extra Bold"]].map(([v,l])=>(
              <button key={v} onClick={()=>updText(activeText,"fontWeight",v)} className="btn"
                style={{flex:1,padding:"6px",fontSize:11,background:t.fontWeight===v?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(t.fontWeight===v?"var(--accent2)":"var(--border)"),color:t.fontWeight===v?"var(--accent2)":"var(--muted)",fontFamily:t.fontFamily,fontWeight:v}}>
                {l}
              </button>
            ))}
          </div>

          {/* Tamaño + Color */}
          <div style={{display:"flex",gap:10,alignItems:"flex-end"}}>
            <div style={{flex:1}}>
              <span className="lbl">Tamaño ({t.fontSize}px)</span>
              <input type="range" min={12} max={120} value={t.fontSize}
                onChange={e=>updText(activeText,"fontSize",+e.target.value)}
                style={{width:"100%",accentColor:"var(--accent)"}} />
            </div>
            <div>
              <span className="lbl">Color</span>
              <input type="color" value={t.fontColor||"#ffffff"} onChange={e=>updText(activeText,"fontColor",e.target.value)}
                style={{width:40,height:34,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:2}} />
            </div>
          </div>

          <button onClick={()=>updText(activeText,"textBg",!t.textBg)} className="btn"
            style={{background:t.textBg?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(t.textBg?"var(--accent2)":"var(--border)"),color:t.textBg?"var(--accent2)":"var(--muted)",fontSize:11,padding:"6px 12px",alignSelf:"flex-start"}}>
            {t.textBg?"✓ Fondo texto: ON":"○ Fondo texto: OFF"}
          </button>

          {/* Logo */}
          {form.logoBase64?(
            <div style={{background:"var(--surface2)",borderRadius:10,padding:"9px 11px",display:"flex",flexDirection:"column",gap:7}}>
              <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <img src={form.logoBase64} alt="logo" style={{width:20,height:20,objectFit:"contain",borderRadius:3}} />
                  <span style={{fontSize:12,fontWeight:600}}>Logo</span>
                </div>
                <button onClick={()=>updForm("showLogo",!form.showLogo)} className="btn"
                  style={{fontSize:11,padding:"3px 9px",background:form.showLogo?"rgba(109,40,217,.15)":"var(--surface2)",border:"1px solid "+(form.showLogo?"var(--accent2)":"var(--border)"),color:form.showLogo?"var(--accent2)":"var(--muted)"}}>
                  {form.showLogo?"Visible":"Oculto"}
                </button>
              </div>
              {form.showLogo&&(
                <div>
                  <span className="lbl">Tamaño ({Math.round((form.logoSize||0.15)*100)}%)</span>
                  <input type="range" min={5} max={45} value={Math.round((form.logoSize||0.15)*100)}
                    onChange={e=>updForm("logoSize",+e.target.value/100)}
                    style={{width:"100%",accentColor:"var(--pink)"}} />
                  <div style={{fontSize:10,color:"var(--muted)",marginTop:2}}>Arrastrá el punto rosa para mover</div>
                </div>
              )}
            </div>
          ):(
            <div style={{fontSize:11,color:"var(--muted)"}}>Sin logo — cargalo en <strong style={{color:"var(--accent2)"}}>Mi Marca</strong></div>
          )}

          {/* Stickers */}
          <div style={{background:"var(--surface2)",borderRadius:10,padding:"9px 11px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:7}}>
              <span style={{fontSize:12,fontWeight:600}}>Stickers</span>
              <button onClick={()=>setShowStickerPanel(v=>!v)} className="btn btn-ghost" style={{fontSize:11,padding:"3px 9px"}}>
                {showStickerPanel?"Cerrar":"+ Agregar"}
              </button>
            </div>
            {form.stickers.length>0&&(
              <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:7}}>
                {form.stickers.map((s,i)=>(
                  <div key={i} onClick={()=>setActiveSticker(activeSticker===i?null:i)}
                    style={{display:"flex",alignItems:"center",gap:4,padding:"2px 7px",borderRadius:20,cursor:"pointer",background:activeSticker===i?"rgba(109,40,217,.2)":"rgba(255,255,255,.04)",border:"1px solid "+(activeSticker===i?"var(--accent2)":"var(--border)"),fontSize:12}}>
                    <span style={{fontSize:15}}>{s.emoji}</span>
                    {activeSticker===i&&<button onClick={e=>{e.stopPropagation();removeSticker(i);}} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:10,padding:0,lineHeight:1}}>✕</button>}
                  </div>
                ))}
              </div>
            )}
            {activeSticker!==null&&form.stickers[activeSticker]&&(
              <div style={{marginBottom:6}}>
                <span className="lbl">Tamaño sticker ({Math.round((form.stickers[activeSticker].size||0.1)*100)}%)</span>
                <input type="range" min={4} max={40} value={Math.round((form.stickers[activeSticker].size||0.1)*100)}
                  onChange={e=>setForm(p=>({...p,stickers:p.stickers.map((s,i)=>i===activeSticker?{...s,size:+e.target.value/100}:s)}))}
                  style={{width:"100%",accentColor:"var(--accent2)"}} />
              </div>
            )}
            {showStickerPanel&&(
              <div className="fade-in">
                <div style={{display:"flex",gap:4,marginBottom:6,flexWrap:"wrap"}}>
                  {STICKER_SETS.map((set,i)=>(
                    <button key={i} onClick={()=>setActiveStickerSet(i)}
                      style={{fontSize:11,padding:"3px 7px",borderRadius:20,border:"1px solid "+(activeStickerSet===i?"var(--accent2)":"var(--border)"),background:activeStickerSet===i?"rgba(109,40,217,.2)":"transparent",color:activeStickerSet===i?"var(--accent2)":"var(--muted)",cursor:"pointer"}}>
                      {set.label}
                    </button>
                  ))}
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:3}}>
                  {STICKER_SETS[activeStickerSet].items.map((emoji,i)=>(
                    <button key={i} onClick={()=>addSticker(emoji)}
                      style={{fontSize:20,padding:"5px",borderRadius:7,border:"1px solid var(--border)",background:"rgba(255,255,255,.03)",cursor:"pointer",lineHeight:1,transition:"background .1s"}}
                      onMouseEnter={e=>e.currentTarget.style.background="rgba(109,40,217,.2)"}
                      onMouseLeave={e=>e.currentTarget.style.background="rgba(255,255,255,.03)"}>
                      {emoji}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* ── LINK ── */}
          <div style={{background:"var(--surface2)",borderRadius:10,padding:"9px 11px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:showLinkPanel?10:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:16}}>🔗</span>
                <span style={{fontSize:12,fontWeight:600}}>Link</span>
                {link&&<span style={{fontSize:10,color:"var(--success)",background:"rgba(34,211,238,.1)",border:"1px solid rgba(34,211,238,.2)",borderRadius:20,padding:"2px 7px"}}>Activo</span>}
              </div>
              <button onClick={()=>setShowLinkPanel(v=>!v)} className="btn btn-ghost" style={{fontSize:11,padding:"3px 9px"}}>
                {showLinkPanel?"Cerrar":link?"Editar":"+ Agregar"}
              </button>
            </div>
            {showLinkPanel&&(
              <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:8}}>
                <div>
                  <span className="lbl">URL de destino</span>
                  <input value={link} onChange={e=>setLink(e.target.value)}
                    placeholder="https://tusitio.com o @tuperfil"
                    style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:12,padding:"8px 10px",width:"100%",outline:"none"}} />
                </div>
                <div>
                  <span className="lbl">Texto del botón (opcional)</span>
                  <input value={linkLabel} onChange={e=>setLinkLabel(e.target.value)}
                    placeholder="Ej: Ver más, Comprar ahora, Visitanos..."
                    style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:12,padding:"8px 10px",width:"100%",outline:"none"}} />
                </div>
                {link&&(
                  <div style={{background:"rgba(34,211,238,.06)",border:"1px solid rgba(34,211,238,.15)",borderRadius:8,padding:"8px 10px",fontSize:11,color:"var(--muted)"}}>
                    ℹ️ El link se agregará en la bio o como sticker de Historia según el formato de publicación.
                  </div>
                )}
                {link&&<button onClick={()=>{setLink("");setLinkLabel("");}} style={{background:"none",border:"none",color:"var(--error)",fontSize:11,cursor:"pointer",alignSelf:"flex-start"}}>✕ Quitar link</button>}
              </div>
            )}
          </div>

          {/* ── ENCUESTA ── */}
          <div style={{background:"var(--surface2)",borderRadius:10,padding:"9px 11px"}}>
            <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:showPollPanel?10:0}}>
              <div style={{display:"flex",alignItems:"center",gap:8}}>
                <span style={{fontSize:16}}>📊</span>
                <span style={{fontSize:12,fontWeight:600}}>Encuesta</span>
                {poll.active&&<span style={{fontSize:10,color:"var(--warn)",background:"rgba(245,158,11,.1)",border:"1px solid rgba(245,158,11,.2)",borderRadius:20,padding:"2px 7px"}}>Activa</span>}
              </div>
              <button onClick={()=>setShowPollPanel(v=>!v)} className="btn btn-ghost" style={{fontSize:11,padding:"3px 9px"}}>
                {showPollPanel?"Cerrar":poll.active?"Editar":"+ Crear"}
              </button>
            </div>
            {showPollPanel&&(
              <div className="fade-in" style={{display:"flex",flexDirection:"column",gap:8}}>
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <button onClick={()=>setPoll(p=>({...p,active:!p.active}))} className="btn"
                    style={{fontSize:11,padding:"5px 12px",background:poll.active?"rgba(245,158,11,.15)":"var(--surface2)",border:"1px solid "+(poll.active?"rgba(245,158,11,.5)":"var(--border)"),color:poll.active?"var(--warn)":"var(--muted)"}}>
                    {poll.active?"✓ Encuesta ON":"○ Encuesta OFF"}
                  </button>
                  <span style={{fontSize:11,color:"var(--muted)"}}>Se publica como encuesta en Historia</span>
                </div>
                {poll.active&&(<>
                  <div>
                    <span className="lbl">Pregunta</span>
                    <input value={poll.question} onChange={e=>setPoll(p=>({...p,question:e.target.value}))}
                      placeholder="¿Cuál preferís?"
                      style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:12,padding:"8px 10px",width:"100%",outline:"none"}} />
                  </div>
                  <div>
                    <span className="lbl">Opciones ({poll.options.length}/5)</span>
                    <div style={{display:"flex",flexDirection:"column",gap:5}}>
                      {poll.options.map((opt2,i)=>(
                        <div key={i} style={{display:"flex",gap:5,alignItems:"center"}}>
                          <span style={{fontSize:11,color:"var(--muted)",width:18,flexShrink:0,textAlign:"center"}}>{i+1}</span>
                          <input value={opt2} onChange={e=>{const o=[...poll.options];o[i]=e.target.value;setPoll(p=>({...p,options:o}));}}
                            placeholder={`Opción ${i+1}...`}
                            style={{flex:1,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,color:"var(--text)",fontSize:12,padding:"7px 10px",outline:"none"}} />
                          {poll.options.length>2&&(
                            <button onClick={()=>setPoll(p=>({...p,options:p.options.filter((_,j)=>j!==i)}))}
                              style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:13,flexShrink:0}}>✕</button>
                          )}
                        </div>
                      ))}
                    </div>
                    {poll.options.length<5&&(
                      <button onClick={()=>setPoll(p=>({...p,options:[...p.options,""]}))}
                        style={{marginTop:6,background:"none",border:"1px dashed var(--border)",color:"var(--muted)",borderRadius:8,padding:"5px 12px",fontSize:11,cursor:"pointer",width:"100%"}}>
                        + Agregar opción
                      </button>
                    )}
                  </div>
                  {/* Preview de encuesta */}
                  {poll.question&&(
                    <div style={{background:"rgba(255,255,255,.06)",borderRadius:12,padding:"12px",marginTop:4}}>
                      <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,textAlign:"center"}}>Vista previa</div>
                      <div style={{fontSize:13,fontWeight:700,textAlign:"center",marginBottom:10,color:"var(--text)"}}>{poll.question}</div>
                      <div style={{display:"flex",flexDirection:"column",gap:5}}>
                        {poll.options.filter(o=>o).map((o,i)=>(
                          <div key={i} style={{background:"rgba(255,255,255,.08)",border:"1px solid rgba(255,255,255,.15)",borderRadius:20,padding:"8px 14px",fontSize:12,color:"var(--text)",textAlign:"center"}}>
                            {o}
                          </div>
                        ))}
                      </div>
                    </div>
                  )}
                </>)}
              </div>
            )}
          </div>

          {showFormatPicker&&(
            <div style={{background:"var(--surface2)",border:"1px solid var(--accent2)",borderRadius:12,padding:"11px",display:"flex",flexDirection:"column",gap:6}} className="fade-in">
              <div style={{fontSize:12,fontWeight:700,color:"var(--accent2)"}}>¿Cómo publicar en Instagram?</div>
              {[{id:"post",icon:"🖼",label:"Publicación",desc:"Post estático en el feed"},{id:"story",icon:"📱",label:"Historia",desc:"Desaparece en 24 hs"},{id:"reel",icon:"🎬",label:"Reel",desc:"Video corto"}].map(f=>(
                <button key={f.id} onClick={()=>publishIG(f.id)}
                  style={{display:"flex",alignItems:"center",gap:10,padding:"8px 10px",borderRadius:9,background:"rgba(255,255,255,.04)",border:"1px solid var(--border)",cursor:"pointer",color:"var(--text)",textAlign:"left",width:"100%"}}>
                  <span style={{fontSize:18}}>{f.icon}</span>
                  <div><div style={{fontWeight:700,fontSize:12}}>{f.label}</div><div style={{fontSize:10,color:"var(--muted)"}}>{f.desc}</div></div>
                  {publishing&&<div className="spin" style={{marginLeft:"auto"}} />}
                </button>
              ))}
              <button onClick={()=>setShowFormatPicker(false)} style={{background:"none",border:"none",color:"var(--muted)",fontSize:11,cursor:"pointer"}}>Cancelar</button>
            </div>
          )}

          <div style={{display:"flex",gap:6,paddingTop:2}}>
            <button onClick={download} className="btn btn-ghost" style={{flex:1,fontSize:12,padding:"8px"}}>⬇ Descargar</button>
            <button onClick={handleSave} className="btn btn-ghost" style={{flex:1,fontSize:12,padding:"8px"}}>✓ Guardar</button>
            <button onClick={()=>setShowFormatPicker(v=>!v)} disabled={publishing} className="btn btn-primary"
              style={{flex:1,fontSize:12,padding:"8px",background:publishing?"var(--surface2)":"linear-gradient(135deg,#E1306C,#833AB4)"}}>
              {publishing?<><div className="spin"/>Publicando</>:"🚀 Publicar IG"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// POST MINI CARD
// ════════════════════════════════════════════════════════════════
function PostMiniCard({post, postNum}) {
  const canvasRef=useRef();
  useEffect(()=>{ if(canvasRef.current&&post) drawPost(canvasRef.current,post); },[post]);
  return (
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:4}}>
      <div style={{position:"relative",width:"100%",aspectRatio:"1",borderRadius:10,overflow:"hidden",background:"var(--bg)",border:"2px solid var(--border)"}}>
        <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}} />
        <div style={{position:"absolute",top:4,left:4,background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:6,padding:"2px 7px",fontSize:11,fontWeight:800,color:"#fff"}}>#{postNum}</div>
      </div>
      <div style={{fontSize:10,color:"var(--muted)"}}>Post #{postNum}</div>
    </div>
  );
}

// SCHEDULE SCREEN — con tipo de posteo en modal
// ════════════════════════════════════════════════════════════════
function ScheduleScreen({socials,showToast}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [schedules,setSchedules]=useState(store.get("schedules")||{});
  const [posts,setPosts]=useState(store.get("posts")||[]);
  const [selectedDate,setSelectedDate]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [modalData,setModalData]=useState({postNum:1,hour:"09:00",net:"instagram",format:"post"});
  const [dragPost,setDragPost]=useState(null);
  const connected=socials.filter(s=>s.connected);

  const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DAYS_HEADER=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const FORMAT_ICONS={"post":"🖼","story":"📱","reel":"🎬"};

  const saveSchedules=(s)=>{setSchedules(s);store.set("schedules",s);};
  const getDaysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const getFirstDayOfMonth=(y,m)=>new Date(y,m,1).getDay();
  const prevMonth=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey=dateKey(now.getFullYear(),now.getMonth(),now.getDate());

  const openModal=(day)=>{
    const key=dateKey(year,month,day);
    setSelectedDate({day,key,label:day+" de "+MONTHS[month]+" "+year});
    const existing=schedules[key];
    setModalData(existing||{postNum:dragPost||1,hour:"09:00",net:connected[0]?.id||"instagram",format:"post"});
    setShowModal(true);
  };

  const assignPost=()=>{
    saveSchedules({...schedules,[selectedDate.key]:modalData});
    // Guardar en historial como programado
    const posts2=store.get("posts")||[];
    const postData=posts2.find(p=>p.postIdx===modalData.postNum-1)||{};
    const hist=store.get("postHistory")||[];
    hist.unshift({id:Date.now(),caption:postData.caption||"",date:selectedDate.key+"T"+modalData.hour+":00",network:modalData.net,format:modalData.format||"post",status:"scheduled",postNum:modalData.postNum});
    store.set("postHistory",hist.slice(0,50));
    setShowModal(false); setDragPost(null);
    showToast("Post #"+modalData.postNum+" programado para "+selectedDate.label+" "+modalData.hour,"ok");
  };

  const removeSchedule=(key,e)=>{ if(e)e.stopPropagation(); const s={...schedules}; delete s[key]; saveSchedules(s); };

  const daysInMonth=getDaysInMonth(year,month);
  const firstDay=getFirstDayOfMonth(year,month);
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  const scheduledCount=Object.keys(schedules).length;
  const selectedPosts=posts.slice(0,7);

  return (
    <div style={{padding:"24px 28px",display:"flex",gap:20,minHeight:"calc(100vh - 64px)"}} className="fade-in">
      <div style={{width:200,flexShrink:0,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,marginBottom:4}}>Mis publicaciones</div>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,lineHeight:1.5}}>Hacé click en un día del calendario para asignar.</div>
        {selectedPosts.length===0?(<div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:"20px 0"}}>Primero generá las publicaciones.</div>):(
          <div style={{display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
            {selectedPosts.map((post,i)=>(
              <div key={i} onClick={()=>setDragPost(i+1)} style={{cursor:"pointer",outline:dragPost===i+1?"3px solid var(--accent2)":"none",borderRadius:12,transition:"all .15s",transform:dragPost===i+1?"scale(1.03)":"scale(1)"}}>
                <PostMiniCard post={post} postNum={i+1} />
              </div>
            ))}
          </div>
        )}
        {dragPost&&(<div style={{marginTop:8,background:"rgba(109,40,217,.15)",border:"1px solid var(--accent2)",borderRadius:10,padding:"10px",textAlign:"center"}}>
          <div style={{fontSize:12,color:"var(--accent2)",fontWeight:600}}>Post #{dragPost} seleccionado</div>
          <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>Hacé click en el día</div>
          <button onClick={()=>setDragPost(null)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:11,marginTop:4}}>Cancelar</button>
        </div>)}
      </div>

      <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={prevMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>‹</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}}>{MONTHS[month]} {year}</div>
          <button onClick={nextMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>›</button>
        </div>
        {posts.length===0?(<div className="card" style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
          <div style={{fontSize:32,marginBottom:12}}>📋</div>
          <div style={{fontWeight:600,marginBottom:6}}>No hay publicaciones generadas</div>
          <div style={{fontSize:13}}>Volvé a "Crear publicación".</div>
        </div>):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {DAYS_HEADER.map(d=>(<div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--muted)",letterSpacing:1,padding:"4px 0"}}>{d}</div>))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {Array.from({length:totalCells},(_,i)=>{
                const day=i-firstDay+1; const isValid=day>=1&&day<=daysInMonth;
                const key=isValid?dateKey(year,month,day):null;
                const sched=key&&schedules[key]; const isToday=key===todayKey;
                const isPast=key&&key<todayKey; const soc=sched&&socials.find(s=>s.id===sched.net);
                const isClickable=isValid&&!isPast;
                return (
                  <div key={i} onClick={()=>{ if(!isClickable)return; if(dragPost){const k=dateKey(year,month,day);setSelectedDate({day,key:k,label:day+" de "+MONTHS[month]+" "+year});setModalData({postNum:dragPost,hour:"09:00",net:connected[0]?.id||"instagram",format:"post"});setShowModal(true);}else openModal(day); }}
                    style={{minHeight:72,borderRadius:10,padding:"7px 6px",background:!isValid?"transparent":sched?"rgba(109,40,217,.18)":isPast?"rgba(255,255,255,.015)":dragPost?"rgba(109,40,217,.05)":"var(--surface2)",border:!isValid?"none":"2px solid "+(isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)"),cursor:isClickable?"pointer":"default",opacity:isPast?0.35:1,transition:"all .15s",display:"flex",flexDirection:"column",gap:3}}
                    onMouseEnter={e=>{if(isClickable)e.currentTarget.style.borderColor="var(--accent2)";}}
                    onMouseLeave={e=>{if(isValid)e.currentTarget.style.borderColor=isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)";}}>
                    {isValid&&(<>
                      <div style={{fontSize:12,fontWeight:isToday?800:400,color:isToday?"var(--accent2)":"var(--text)"}}>{day}</div>
                      {sched&&(<>
                        <div style={{background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:5,padding:"2px 5px",fontSize:10,fontWeight:800,color:"#fff",textAlign:"center"}}>#{sched.postNum}</div>
                        <div style={{fontSize:9,color:"var(--accent2)",textAlign:"center"}}>{sched.hour}</div>
                        <div style={{fontSize:11,textAlign:"center"}}>{soc?.icon} {FORMAT_ICONS[sched.format||"post"]}</div>
                        <button onClick={(e)=>removeSchedule(key,e)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:9,padding:0,lineHeight:1}}>✕ quitar</button>
                      </>)}
                    </>)}
                  </div>
                );
              })}
            </div>
            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontWeight:600,fontSize:14}}>Posts programados</div>
                <div style={{fontSize:12,color:"var(--muted)"}}>{scheduledCount} en total</div>
              </div>
              {scheduledCount===0?<div style={{color:"var(--muted)",fontSize:13,textAlign:"center",padding:"8px 0"}}>Seleccioná un post y hacé click en un día.</div>:(
                <div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:150,overflowY:"auto"}}>
                  {Object.entries(schedules).sort(([a],[b])=>a.localeCompare(b)).map(([key,sched])=>{
                    const soc=socials.find(s=>s.id===sched.net);
                    const [y2,m2,d2]=key.split("-");
                    const date=new Date(+y2,+m2-1,+d2);
                    const label=date.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
                    return(<div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid var(--border)",fontSize:12}}>
                      <span>{soc?.icon}</span>
                      <span>{FORMAT_ICONS[sched.format||"post"]}</span>
                      <span style={{flex:1,textTransform:"capitalize"}}>{label}</span>
                      <span style={{color:"var(--muted)"}}>{sched.hour}</span>
                      <span style={{background:"rgba(109,40,217,.2)",border:"1px solid rgba(168,85,247,.3)",borderRadius:20,padding:"2px 8px",color:"var(--accent2)"}}>Post #{sched.postNum}</span>
                      <button onClick={()=>removeSchedule(key)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:12}}>✕</button>
                    </div>);
                  })}
                </div>
              )}
              {scheduledCount>0&&<button className="btn btn-primary" style={{width:"100%",marginTop:12}} onClick={()=>showToast("Calendario confirmado! MCM publicará automáticamente.","ok")}>✓ Confirmar calendario</button>}
            </div>
          </>
        )}
      </div>

      {showModal&&selectedDate&&ReactDOM.createPortal(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:2000,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(16px)"}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:18,padding:28,width:"100%",maxWidth:460}} className="fade-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:700}}>📅 {selectedDate.label}</h3>
              <button onClick={()=>setShowModal(false)} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:28,height:28,borderRadius:7,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <span className="lbl">Publicación (1-7)</span>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {Array.from({length:7},(_,i)=>i+1).map(n=>(
                    <button key={n} onClick={()=>setModalData(p=>({...p,postNum:n}))} className="btn"
                      style={{width:44,height:44,padding:0,fontSize:15,fontWeight:800,background:modalData.postNum===n?"rgba(109,40,217,.3)":"var(--surface2)",border:"2px solid "+(modalData.postNum===n?"var(--accent2)":"var(--border)"),color:modalData.postNum===n?"var(--accent2)":"var(--muted)",borderRadius:10}}>
                      {n}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Horario</span>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"].map(h=>(
                    <button key={h} onClick={()=>setModalData(p=>({...p,hour:h}))} className="btn"
                      style={{padding:"6px 9px",fontSize:12,background:modalData.hour===h?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(modalData.hour===h?"var(--accent2)":"var(--border)"),color:modalData.hour===h?"var(--accent2)":"var(--muted)",borderRadius:8}}>
                      {h}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Red social</span>
                {connected.length===0?<div style={{color:"var(--muted)",fontSize:13}}>No tenés redes conectadas.</div>:(
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {connected.map(s=>(
                      <button key={s.id} onClick={()=>setModalData(p=>({...p,net:s.id}))} className="btn"
                        style={{padding:"7px 14px",fontSize:13,background:modalData.net===s.id?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(modalData.net===s.id?"var(--accent2)":"var(--border)"),color:modalData.net===s.id?"var(--accent2)":"var(--muted)"}}>
                        {s.icon} {s.name}
                      </button>
                    ))}
                  </div>
                )}
              </div>
              {/* Tipo de posteo para Instagram */}
              {modalData.net==="instagram"&&(
                <div>
                  <span className="lbl">Tipo de publicación</span>
                  <div style={{display:"flex",gap:8}}>
                    {[{id:"post",icon:"🖼",label:"Post"},{id:"story",icon:"📱",label:"Historia"},{id:"reel",icon:"🎬",label:"Reel"}].map(f=>(
                      <button key={f.id} onClick={()=>setModalData(p=>({...p,format:f.id}))}
                        style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:4,padding:"10px 8px",borderRadius:10,border:"2px solid "+(modalData.format===f.id?"var(--accent2)":"var(--border)"),background:modalData.format===f.id?"rgba(109,40,217,.2)":"var(--surface2)",cursor:"pointer",color:modalData.format===f.id?"var(--accent2)":"var(--muted)"}}>
                        <span style={{fontSize:22}}>{f.icon}</span>
                        <span style={{fontSize:12,fontWeight:600}}>{f.label}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              <button className="btn btn-primary" style={{width:"100%"}} onClick={assignPost}>
                Programar {FORMAT_ICONS[modalData.format||"post"]} Post #{modalData.postNum} — {selectedDate.label} {modalData.hour}
              </button>
            </div>
          </div>
        </div>,
        document.body
      )}
    </div>
  );
}

// HISTORY SCREEN — historial de posteos
// ════════════════════════════════════════════════════════════════
function HistoryScreen({socials,showToast}) {
  const [history,setHistory]=useState(store.get("postHistory")||[]);
  const [selected,setSelected]=useState([]);
  const [filter,setFilter]=useState("all"); // all | published | scheduled

  const SOCIAL_ICONS={"instagram":"📸","facebook":"👥","twitter":"🐦","tiktok":"🎵"};
  const FORMAT_LABELS={"post":"Publicación","story":"Historia","reel":"Reel"};
  const FORMAT_ICONS={"post":"🖼","story":"📱","reel":"🎬"};

  const toggleSelect=(id)=>setSelected(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const deleteSelected=()=>{
    const newHist=history.filter(h=>!selected.includes(h.id));
    setHistory(newHist); store.set("postHistory",newHist); setSelected([]);
    showToast(selected.length+" post(s) eliminados","ok");
  };

  const filtered=history.filter(h=>filter==="all"||(filter==="published"&&h.status==="published")||(filter==="scheduled"&&h.status==="scheduled"));

  const formatDate=(iso)=>{
    try{ return new Date(iso).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
    catch{ return iso; }
  };

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Historial de publicaciones</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>Todos tus posts realizados y programados.</p>
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {selected.length>0&&(
            <button className="btn" style={{background:"rgba(244,63,94,.15)",border:"1px solid var(--error)",color:"var(--error)",fontSize:12,padding:"7px 14px"}} onClick={deleteSelected}>
              🗑 Eliminar {selected.length} seleccionado(s)
            </button>
          )}
        </div>
      </div>

      {/* Filtros */}
      <div style={{display:"flex",gap:6,marginBottom:20}}>
        {[["all","Todos"],["published","✅ Publicados"],["scheduled","🟠 Programados"]].map(([v,l])=>(
          <button key={v} onClick={()=>setFilter(v)} className="btn"
            style={{padding:"7px 16px",fontSize:12,background:filter===v?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(filter===v?"var(--accent2)":"var(--border)"),color:filter===v?"var(--accent2)":"var(--muted)"}}>
            {l}
          </button>
        ))}
        <div style={{marginLeft:"auto",fontSize:12,color:"var(--muted)",alignSelf:"center"}}>{filtered.length} posts</div>
      </div>

      {filtered.length===0?(
        <div style={{textAlign:"center",padding:"60px 20px",color:"var(--muted)"}}>
          <div style={{fontSize:48,marginBottom:16}}>📋</div>
          <div style={{fontWeight:600,fontSize:16,marginBottom:8}}>No hay posts aún</div>
          <div style={{fontSize:13}}>Los posts publicados y programados aparecerán aquí.</div>
        </div>
      ):(
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {filtered.map(item=>(
            <div key={item.id} className="history-row"
              style={{borderColor:selected.includes(item.id)?"var(--accent2)":"var(--border)"}}>

              {/* Checkbox */}
              <div onClick={()=>toggleSelect(item.id)}
                style={{width:20,height:20,borderRadius:5,border:"2px solid "+(selected.includes(item.id)?"var(--accent2)":"var(--border)"),background:selected.includes(item.id)?"var(--accent2)":"transparent",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
                {selected.includes(item.id)&&<span style={{color:"#fff",fontSize:11}}>✓</span>}
              </div>

              {/* Miniatura */}
              {item.imgBase64?(
                <img src={item.imgBase64} alt="post" style={{width:52,height:52,objectFit:"cover",borderRadius:8,flexShrink:0}} />
              ):(
                <div style={{width:52,height:52,borderRadius:8,background:"var(--surface2)",display:"grid",placeItems:"center",fontSize:20,flexShrink:0}}>
                  {FORMAT_ICONS[item.format||"post"]}
                </div>
              )}

              {/* Info */}
              <div style={{flex:1,minWidth:0}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:4}}>
                  <span style={{fontSize:13,fontWeight:600}}>{FORMAT_LABELS[item.format||"post"]||"Post"}</span>
                  <span style={{fontSize:11}}>{SOCIAL_ICONS[item.network]||"📱"}</span>
                  {item.postNum&&<span style={{fontSize:11,color:"var(--muted)"}}>Post #{item.postNum}</span>}
                </div>
                <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>{formatDate(item.date)}</div>
                {item.caption&&<div style={{fontSize:11,color:"rgba(240,240,255,0.55)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:"100%"}}>{item.caption.slice(0,80)}{item.caption.length>80?"...":""}</div>}
              </div>

              {/* Estado */}
              <div style={{flexShrink:0,textAlign:"right"}}>
                <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:6,justifyContent:"flex-end"}}>
                  <div className="status-dot" style={{background:item.status==="published"?"#22c55e":"#f59e0b"}} />
                  <span style={{fontSize:12,fontWeight:600,color:item.status==="published"?"#22c55e":"#f59e0b"}}>
                    {item.status==="published"?"Publicado":"Programado"}
                  </span>
                </div>
                {item.status==="scheduled"&&(
                  <button className="btn btn-ghost" style={{fontSize:10,padding:"4px 10px"}} onClick={()=>showToast("Edición disponible desde Crear publicación","info")}>
                    Editar
                  </button>
                )}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════
// STATS SCREEN — Instagram Insights via API
// ════════════════════════════════════════════════════════════════
function StatsScreen({socials, showToast}) {
  const [loading, setLoading] = useState(false);
  const [stats, setStats] = useState(store.get("igStats") || null);
  const [posts, setPosts] = useState(store.get("igStatsPosts") || []);
  const [lastFetch, setLastFetch] = useState(store.get("igStatsDate") || null);
  const [activeTab, setActiveTab] = useState("resumen");

  const igConnected = socials.find(s => s.id === "instagram" && s.connected);

  const fetchStats = async () => {
    setLoading(true);
    try {
      const r = await fetch("/api/instagram?action=stats");
      const d = await r.json();
      if (!d.success) throw new Error(d.error || "Error al obtener estadísticas");
      setStats(d.account);
      setPosts(d.posts || []);
      const now = new Date().toISOString();
      setLastFetch(now);
      store.set("igStats", d.account);
      store.set("igStatsPosts", d.posts || []);
      store.set("igStatsDate", now);
      showToast("Estadísticas actualizadas ✓", "ok");
    } catch(e) {
      showToast("Error: " + e.message, "err");
    } finally {
      setLoading(false);
    }
  };

  const formatNum = (n) => {
    if (!n && n !== 0) return "—";
    if (n >= 1000000) return (n/1000000).toFixed(1) + "M";
    if (n >= 1000) return (n/1000).toFixed(1) + "K";
    return String(n);
  };

  const formatDate = (iso) => {
    try { return new Date(iso).toLocaleDateString("es-AR", {day:"numeric", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"}); }
    catch { return iso; }
  };

  const StatCard = ({icon, label, value, sub, color}) => (
    <div style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:14,padding:"18px 20px",display:"flex",flexDirection:"column",gap:6}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontSize:22}}>{icon}</span>
        <span style={{fontSize:12,color:"var(--muted)",fontWeight:500}}>{label}</span>
      </div>
      <div style={{fontSize:32,fontWeight:800,color:color||"var(--text)",fontFamily:"'Syne',sans-serif"}}>{formatNum(value)}</div>
      {sub && <div style={{fontSize:11,color:"var(--muted)"}}>{sub}</div>}
    </div>
  );

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Estadísticas de Instagram</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>
            {igConnected ? `Cuenta: ${igConnected.user}` : "Instagram no conectado"}
            {lastFetch && <span style={{marginLeft:12,fontSize:12,color:"var(--muted)"}}>Última actualización: {formatDate(lastFetch)}</span>}
          </p>
        </div>
        <button className="btn btn-primary" onClick={fetchStats} disabled={loading || !igConnected}>
          {loading ? <><div className="spin"/>Cargando...</> : "↻ Actualizar stats"}
        </button>
      </div>

      {!igConnected && (
        <div className="card" style={{textAlign:"center",padding:"48px",color:"var(--muted)"}}>
          <div style={{fontSize:40,marginBottom:12}}>📸</div>
          <div style={{fontWeight:600,fontSize:16,marginBottom:8}}>Instagram no conectado</div>
          <div style={{fontSize:13}}>Conectá Instagram en "Conectar redes" para ver las estadísticas.</div>
        </div>
      )}

      {igConnected && !stats && !loading && (
        <div className="card" style={{textAlign:"center",padding:"48px",color:"var(--muted)"}}>
          <div style={{fontSize:40,marginBottom:12}}>📊</div>
          <div style={{fontWeight:600,fontSize:16,marginBottom:8}}>Sin datos aún</div>
          <div style={{fontSize:13,marginBottom:20}}>Presioná "Actualizar stats" para cargar las estadísticas de tu cuenta.</div>
          <button className="btn btn-primary" onClick={fetchStats} disabled={loading}>
            {loading ? <><div className="spin"/>Cargando...</> : "Cargar estadísticas"}
          </button>
        </div>
      )}

      {stats && (
        <>
          {/* Tabs */}
          <div style={{display:"flex",gap:4,marginBottom:24,background:"var(--surface2)",borderRadius:12,padding:4,width:"fit-content"}}>
            {[["resumen","Resumen"],["interaccion","Interacción"],["posts","Posts recientes"]].map(([id,label])=>(
              <button key={id} onClick={()=>setActiveTab(id)}
                style={{padding:"8px 18px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                  background:activeTab===id?"var(--surface)":"transparent",
                  color:activeTab===id?"var(--text)":"var(--muted)",
                  boxShadow:activeTab===id?"0 1px 4px rgba(0,0,0,.3)":"none",transition:"all .2s"}}>
                {label}
              </button>
            ))}
          </div>

          {/* RESUMEN */}
          {activeTab==="resumen" && (
            <div className="fade-in">
              {/* Perfil */}
              <div style={{display:"flex",alignItems:"center",gap:16,marginBottom:24,background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:16,padding:"20px"}}>
                {stats.profile_picture_url && (
                  <img src={stats.profile_picture_url} alt="profile" style={{width:64,height:64,borderRadius:"50%",objectFit:"cover",border:"2px solid var(--accent2)"}} />
                )}
                <div style={{flex:1}}>
                  <div style={{fontWeight:800,fontSize:18,fontFamily:"'Syne',sans-serif"}}>{stats.name || igConnected.user}</div>
                  <div style={{fontSize:13,color:"var(--muted)",marginTop:2}}>@{stats.username || "gonvinardell"}</div>
                  {stats.biography && <div style={{fontSize:12,color:"var(--muted)",marginTop:6,lineHeight:1.5}}>{stats.biography}</div>}
                </div>
                <div style={{textAlign:"right"}}>
                  <div style={{fontSize:24,fontWeight:800,color:"var(--accent2)",fontFamily:"'Syne',sans-serif"}}>{formatNum(stats.followers_count)}</div>
                  <div style={{fontSize:11,color:"var(--muted)"}}>seguidores</div>
                </div>
              </div>

              {/* Métricas principales */}
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:12,marginBottom:24}}>
                <StatCard icon="👥" label="Seguidores" value={stats.followers_count} color="var(--accent2)" />
                <StatCard icon="📤" label="Seguidos" value={stats.follows_count} />
                <StatCard icon="🖼" label="Publicaciones" value={stats.media_count} />
                <StatCard icon="👁" label="Visualizaciones (28d)" value={stats.impressions} color="var(--success)" />
                <StatCard icon="👤" label="Cuentas alcanzadas" value={stats.reach} color="var(--success)" />
                <StatCard icon="🔗" label="Visitas al perfil" value={stats.profile_views} />
                <StatCard icon="📞" label="Clics en contacto" value={stats.website_clicks} />
                <StatCard icon="➕" label="Nuevos seguidores" value={stats.follower_count} sub="últimos 28 días" color="#22c55e" />
              </div>
            </div>
          )}

          {/* INTERACCIÓN */}
          {activeTab==="interaccion" && (
            <div className="fade-in">
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:12,marginBottom:24}}>
                <StatCard icon="❤️" label="Me gusta (total)" value={stats.total_likes} color="var(--pink)" />
                <StatCard icon="💬" label="Comentarios (total)" value={stats.total_comments} color="var(--accent2)" />
                <StatCard icon="🔁" label="Compartidos" value={stats.total_shares} />
                <StatCard icon="🔖" label="Guardados" value={stats.total_saves} color="var(--success)" />
                <StatCard icon="📊" label="Tasa de interacción" value={stats.engagement_rate ? (stats.engagement_rate * 100).toFixed(2) + "%" : null} color="var(--warn)" />
              </div>

              {/* Mejor hora para publicar */}
              {stats.best_time && (
                <div style={{background:"rgba(109,40,217,.1)",border:"1px solid rgba(168,85,247,.3)",borderRadius:14,padding:"16px 20px",marginBottom:16}}>
                  <div style={{fontWeight:700,fontSize:14,marginBottom:4,color:"var(--accent2)"}}>⏰ Mejor hora para publicar</div>
                  <div style={{fontSize:13,color:"var(--text)"}}>{stats.best_time}</div>
                </div>
              )}
            </div>
          )}

          {/* POSTS RECIENTES */}
          {activeTab==="posts" && (
            <div className="fade-in">
              {posts.length === 0 ? (
                <div style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>No hay posts recientes disponibles.</div>
              ) : (
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:14}}>
                  {posts.map((post, i) => (
                    <div key={i} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:14,overflow:"hidden"}}>
                      {post.thumbnail_url || post.media_url ? (
                        <img src={post.thumbnail_url || post.media_url} alt="post"
                          style={{width:"100%",aspectRatio:"1",objectFit:"cover"}} />
                      ) : (
                        <div style={{width:"100%",aspectRatio:"1",background:"var(--surface)",display:"grid",placeItems:"center",fontSize:32}}>
                          {post.media_type === "VIDEO" ? "🎬" : "🖼"}
                        </div>
                      )}
                      <div style={{padding:"12px"}}>
                        <div style={{fontSize:11,color:"var(--muted)",marginBottom:8}}>{formatDate(post.timestamp)}</div>
                        {post.caption && <div style={{fontSize:11,color:"rgba(240,240,255,.65)",lineHeight:1.6,marginBottom:10,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical"}}>{post.caption}</div>}
                        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:6}}>
                          {[
                            {icon:"❤️",val:post.like_count,label:"Likes"},
                            {icon:"💬",val:post.comments_count,label:"Comentarios"},
                            {icon:"👁",val:post.impressions,label:"Visualizaciones"},
                            {icon:"👤",val:post.reach,label:"Alcance"},
                          ].map(({icon,val,label})=>(
                            <div key={label} style={{textAlign:"center",background:"rgba(255,255,255,.04)",borderRadius:8,padding:"6px 4px"}}>
                              <div style={{fontSize:14}}>{icon}</div>
                              <div style={{fontSize:13,fontWeight:700}}>{formatNum(val)}</div>
                              <div style={{fontSize:9,color:"var(--muted)"}}>{label}</div>
                            </div>
                          ))}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          )}
        </>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
