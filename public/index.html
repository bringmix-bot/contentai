<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;
 
const G = "linear-gradient(135deg,#7c3aed,#ec4899)";
 
const NETWORKS = [
  { id:"instagram", label:"Instagram", icon:"📸", color:"#E1306C" },
  { id:"linkedin",  label:"LinkedIn",  icon:"💼", color:"#0A66C2" },
  { id:"twitter",   label:"X/Twitter", icon:"🐦", color:"#1DA1F2" },
  { id:"facebook",  label:"Facebook",  icon:"👥", color:"#1877F2" },
  { id:"tiktok",    label:"TikTok",    icon:"🎵", color:"#69C9D0" },
];
 
const INDUSTRIES = [
  "Restaurante / Gastronomía","Moda / Indumentaria","Salud y bienestar",
  "Tecnología","Inmobiliaria","Educación","Turismo","Retail / Tienda",
  "Servicios profesionales","Construcción","Automotriz","Entretenimiento",
  "Fitness / Deporte","Belleza / Estética","Fotografía","Arquitectura",
  "Veterinaria","Música / DJ","Abogacía","Contabilidad","Otro",
];
 
const INP = {
  width:"100%", background:"#0d0d1a", border:"1px solid #1a1a35",
  borderRadius:9, padding:"10px 13px", color:"#fff", fontSize:13, outline:"none",
};
 
const generateImage = (text, netLabel, netColor, bizName, imgPreview) => {
  return new Promise(resolve => {
    const c = document.createElement("canvas");
    c.width = 1080; c.height = 1080;
    const ctx = c.getContext("2d");
    const clean = text.replace(/#\S+/g,"").replace(/@\S+/g,"").trim();
    const lines = clean.split("\n").filter(l=>l.trim()).slice(0,3).join(" ");
    const quote = lines.length > 110 ? lines.slice(0,107)+"..." : lines;
 
    const finish = () => {
      // Gradient overlay — bottom third only
      const gr = ctx.createLinearGradient(0, 680, 0, 1080);
      gr.addColorStop(0,"rgba(0,0,0,0)");
      gr.addColorStop(0.35,"rgba(0,0,0,0.65)");
      gr.addColorStop(1,"rgba(0,0,0,0.92)");
      ctx.fillStyle = gr;
      ctx.fillRect(0, 680, 1080, 400);
 
      // Business name
      if (bizName) {
        ctx.font = "500 20px 'DM Sans',sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillText(bizName.toUpperCase(), 60, 760);
      }
 
      // Quote text
      ctx.font = "700 40px 'DM Sans',sans-serif";
      ctx.fillStyle = "#fff";
      const words = quote.split(" ");
      const ls = []; let cur = "";
      words.forEach(w => {
        const t = cur+(cur?" ":"")+w;
        if (ctx.measureText(t).width > 960) { if(cur) ls.push(cur); cur=w; }
        else cur = t;
      });
      if(cur) ls.push(cur);
      const shown = ls.slice(0,4);
      if(ls.length>4) shown[3]+="...";
      const sy = bizName ? 800 : 780;
      shown.forEach((l,i) => ctx.fillText(l, 60, sy + i*52));
 
      // Accent line
      const lg = ctx.createLinearGradient(60,0,340,0);
      lg.addColorStop(0,"#7c3aed"); lg.addColorStop(1,"#ec4899");
      ctx.fillStyle = lg;
      ctx.fillRect(60, 1048, 280, 2);
 
      // MCM branding
      ctx.font = "500 18px 'DM Sans',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.35)";
      ctx.fillText("MCM · My Community Manager", 60, 1072);
 
      resolve(c.toDataURL("image/png"));
    };
 
    if (imgPreview) {
      const img = new Image();
      img.onload = () => {
        const sc = Math.max(1080/img.width, 1080/img.height);
        ctx.drawImage(img, (1080-img.width*sc)/2, (1080-img.height*sc)/2, img.width*sc, img.height*sc);
        finish();
      };
      img.src = imgPreview;
    } else {
      const bg = ctx.createLinearGradient(0,0,1080,1080);
      bg.addColorStop(0,"#0d0520"); bg.addColorStop(1,"#05050a");
      ctx.fillStyle = bg; ctx.fillRect(0,0,1080,1080);
      ctx.beginPath(); ctx.arc(950,100,300,0,Math.PI*2);
      ctx.fillStyle="#7c3aed08"; ctx.fill();
      finish();
    }
  });
};
 
function App() {
  const [view, setView] = useState("landing");
  const [tab, setTab] = useState("generator");
 
  // Brand
  const [brand, setBrand] = useState(() => {
    try { return JSON.parse(localStorage.getItem("mcm_brand")||"{}"); } catch { return {}; }
  });
  const saveBrand = (b) => { setBrand(b); try{localStorage.setItem("mcm_brand",JSON.stringify(b));}catch{} };
  const upd = (f,v) => saveBrand({...brand,[f]:v});
 
  // Onboarding
  const needsOnboarding = !brand.name || !brand.industry;
  const [showOB, setShowOB] = useState(false);
  const [obName, setObName] = useState("");
  const [obIndustry, setObIndustry] = useState("");
  const [obCustom, setObCustom] = useState("");
  const [obTarget, setObTarget] = useState("");
 
  // Gallery
  const [gallery, setGallery] = useState([]);
  const [selected, setSelected] = useState([]);
  const addFiles = (files) => {
    Array.from(files).forEach(file => {
      const isImg = file.type.startsWith("image/");
      const isVid = file.type.startsWith("video/");
      if(!isImg && !isVid) return;
      const reader = new FileReader();
      reader.onload = e => {
        setGallery(prev => [{
          id: Date.now()+Math.random(), name:file.name,
          preview: isImg?e.target.result:null,
          base64: isImg?e.target.result.split(",")[1]:null,
          mediaType:file.type, isVideo:isVid,
          date: new Date().toLocaleDateString("es-AR"),
        },...prev]);
      };
      if(isImg) reader.readAsDataURL(file);
      else reader.readAsArrayBuffer(file);
    });
  };
  const removeItem = id => { setGallery(p=>p.filter(g=>g.id!==id)); setSelected(p=>p.filter(s=>s!==id)); };
  const toggleSel = id => setSelected(p=>p.includes(id)?p.filter(s=>s!==id):[...p,id]);
  const selItems = gallery.filter(g=>selected.includes(g.id));
 
  // Industry field
  const [customInd, setCustomInd] = useState(!INDUSTRIES.slice(0,-1).includes(brand.industry||""));
  const industryVal = brand.industry || "";
 
  // Generator
  const [topic, setTopic] = useState("");
  const [generating, setGenerating] = useState(false);
  const [results, setResults] = useState({});
  const [activeNet, setActiveNet] = useState("instagram");
  const [copied, setCopied] = useState(false);
  const [postCount, setPostCount] = useState(0);
  const [genImg, setGenImg] = useState(false);
  const [postImgs, setPostImgs] = useState({});
  const fileRef = useRef();
  const galRef = useRef();
 
  const generate = async () => {
    if (!topic.trim() && selItems.length===0) return;
    setGenerating(true); setResults({}); setPostImgs({});
 
    const bCtx = [
      brand.name && `EMPRESA: "${brand.name}"`,
      brand.industry && `RUBRO: "${brand.industry}" — usá el lenguaje, tendencias y necesidades típicas de este sector en Argentina`,
      brand.target && `A QUIÉN LE VENDE: "${brand.target}"`,
      brand.description && `PROPUESTA DE VALOR: "${brand.description}"`,
      brand.tone && `TONO: "${brand.tone}"`,
    ].filter(Boolean).join("\n");
 
    const mediaList = selItems.map((s,i)=>s.isVideo?`Video ${i+1}: ${s.name}`:`Imagen ${i+1}: ${s.name}`).join(", ");
 
    const prompt = `Sos un copywriter senior y estratega de redes sociales con 10 años de experiencia en agencias top de Argentina. Sabés exactamente qué genera engagement, cómo funcionan los algoritmos y cómo escribir copy que convierte.
 
BRIEF DEL CLIENTE:
${bCtx || "Cliente nuevo sin perfil"}
${topic ? `OBJETIVO: "${topic}"` : ""}
${selItems.length>0 ? `MATERIAL VISUAL: ${mediaList}\n${selItems.some(s=>!s.isVideo)?"Analizá cada imagen: qué producto muestra, qué ambiente, qué emoción transmite, qué diferencial tiene. Usá esos detalles específicos en los posts.":""}` : ""}
 
INSTRUCCIONES:
- Cada post debe tener un GANCHO irresistible en la primera línea que pare el scroll
- Usá lenguaje argentino natural (vos, che, etc según el tono)
- Sé específico para esta marca, NO genérico
- Cada post adaptado al algoritmo y formato de cada red
 
FORMATO EXACTO (sin texto antes ni después):
 
===INSTAGRAM===
[Gancho en la primera línea. Cuerpo con párrafos cortos. CTA. Hashtags al final.]
 
===LINKEDIN===
[Dato o insight impactante al inicio. Historia o contexto. Reflexión de valor. CTA con pregunta. Máx 5 hashtags.]
 
===TWITTER===
[Máximo 280 caracteres. Directo, con gancho. Puede ser opinión fuerte, dato, pregunta.]
 
===FACEBOOK===
[Situación con la que el lector se identifica. Historia. Propuesta de valor. CTA que invite a comentar.]
 
===TIKTOK===
[Hook viral primera línea. Script con acciones [MOSTRAR:...] y textos [TEXTO:...]. CTA al final. Caption con hashtags.]`;
 
    try {
      const firstImg = selItems.find(s=>!s.isVideo&&s.base64);
      const body = { prompt };
      if(firstImg) { body.imageBase64=firstImg.base64; body.imageMediaType=firstImg.mediaType; }
 
      const res = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
      const data = await res.json();
 
      if(data.error) { setResults({_err:data.error}); }
      else {
        const text = data.text||"";
        const parsed = {};
        const keys=["INSTAGRAM","LINKEDIN","TWITTER","FACEBOOK","TIKTOK"];
        const ids=["instagram","linkedin","twitter","facebook","tiktok"];
        keys.forEach((k,i)=>{
          const s=text.indexOf(`===${k}===`); if(s===-1)return;
          const f=s+k.length+6, n=keys[i+1]?text.indexOf(`===${keys[i+1]}===`):text.length;
          parsed[ids[i]]=text.slice(f,n).trim();
        });
        setResults(parsed); setPostCount(p=>p+5);
        setGenImg(true);
        const imgs={}, fp=selItems.find(s=>!s.isVideo)?.preview||null;
        for(const net of NETWORKS){
          if(parsed[net.id]) imgs[net.id]=await generateImage(parsed[net.id],net.label,net.color,brand.name||"",fp);
        }
        setPostImgs(imgs); setGenImg(false);
      }
    } catch(e){ setResults({_err:"Error: "+e.message}); }
    finally{ setGenerating(false); }
  };
 
  const dlText = id => {
    const n=NETWORKS.find(x=>x.id===id);
    const b=new Blob([results[id]],{type:"text/plain"});
    const u=URL.createObjectURL(b); const a=document.createElement("a");
    a.href=u; a.download=`MCM_${n.label}.txt`; a.click(); URL.revokeObjectURL(u);
  };
  const dlImg = id => {
    const n=NETWORKS.find(x=>x.id===id); const a=document.createElement("a");
    a.href=postImgs[id]; a.download=`MCM_${n.label}.png`; a.click();
  };
 
  const canGen = !generating && (!!topic.trim()||selItems.length>0);
 
  // ── LANDING ──
  if(view==="landing") return (
    <div style={{minHeight:"100vh",background:"#05050a"}}>
      <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 40px",borderBottom:"1px solid #0d0d1a",position:"sticky",top:0,background:"rgba(5,5,10,0.9)",backdropFilter:"blur(20px)",zIndex:100}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:32,height:32,background:G,borderRadius:9,display:"grid",placeItems:"center",color:"#fff",fontWeight:800,fontSize:15}}>M</div>
          <div>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:800}}>MCM</div>
            <div style={{fontSize:9,color:"#fff",letterSpacing:1}}>MY COMMUNITY MANAGER</div>
          </div>
        </div>
        <div style={{display:"flex",gap:28}}>
          {["Funciones","Precios"].map(l=>(
            <span key={l} style={{color:"#ccc",fontSize:14,cursor:"pointer"}}
              onMouseEnter={e=>e.target.style.color="#fff"} onMouseLeave={e=>e.target.style.color="#888"}>{l}</span>
          ))}
        </div>
        <button onClick={()=>setView("app")} style={{background:G,color:"#fff",border:"none",borderRadius:11,padding:"10px 24px",fontWeight:700,cursor:"pointer",fontSize:14}}>
          Empezar gratis →
        </button>
      </nav>
 
      <div style={{textAlign:"center",padding:"90px 20px 70px"}}>
        <div style={{display:"flex",justifyContent:"center",alignItems:"center",marginBottom:20}}>
          {["🧑🏻","👩🏽","👨🏾","👩🏻","🧑🏽"].map((e,i)=>(
            <div key={i} style={{width:34,height:34,borderRadius:"50%",background:`hsl(${260+i*20},55%,38%)`,border:"2px solid #05050a",display:"grid",placeItems:"center",fontSize:16,marginLeft:i===0?0:-10,zIndex:5-i}}>{e}</div>
          ))}
          <span style={{fontSize:13,color:"#ccc",marginLeft:12}}>+2.400 marcas ya usan MCM</span>
        </div>
 
        <h1 style={{fontSize:"clamp(36px,5.5vw,64px)",fontWeight:800,lineHeight:1.15,margin:"0 0 18px",letterSpacing:-1}}>
          Tu community manager.<br/>
          <span style={{background:G,WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Con IA. Sin costo de agencia.</span>
        </h1>
        <p style={{color:"#ccc",fontSize:17,maxWidth:480,margin:"0 auto 36px",lineHeight:1.7}}>
          Subís tus fotos y videos, MCM genera posts listos para publicar en todas las redes.
        </p>
        <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap",marginBottom:48}}>
          <button onClick={()=>setView("app")} style={{background:G,color:"#fff",border:"none",borderRadius:12,padding:"13px 32px",fontWeight:700,cursor:"pointer",fontSize:15}}>Empezar gratis →</button>
          <button onClick={()=>setView("pricing")} style={{background:"transparent",color:"#fff",border:"1px solid #1a1a35",borderRadius:12,padding:"13px 28px",fontWeight:600,cursor:"pointer",fontSize:15}}>Ver planes</button>
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:10,flexWrap:"wrap"}}>
          {NETWORKS.map(n=>(
            <div key={n.id} style={{display:"flex",alignItems:"center",gap:6,background:"rgba(255,255,255,0.04)",border:"1px solid #0d0d1a",borderRadius:50,padding:"7px 16px",fontSize:13,color:"#ccc"}}>
              <span>{n.icon}</span>{n.label}
            </div>
          ))}
        </div>
      </div>
 
      <div style={{padding:"60px 40px",maxWidth:1000,margin:"0 auto"}}>
        <div style={{textAlign:"center",marginBottom:48}}>
          <h2 style={{fontSize:"clamp(28px,4vw,44px)",fontWeight:800,letterSpacing:-0.5,marginBottom:10}}>Cómo funciona</h2>
          <p style={{color:"#ccc",fontSize:15}}>De tus archivos a posts publicables en menos de 30 segundos.</p>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(200px,1fr))",gap:2}}>
          {[["📁","Subís tu contenido","Fotos y videos de tu negocio"],["🤖","MCM lo analiza","Entiende tu marca y tu mercado"],["✍️","Genera 5 posts","Uno por cada red social"],["⬇️","Descargás y publicás","Texto e imagen listos"]].map(([ic,ti,de],i)=>(
            <div key={i} style={{padding:"28px 20px",borderTop:`2px solid ${i===0?"#7c3aed":"#1a1a35"}`}}>
              <div style={{fontSize:10,color:"#7c3aed",fontWeight:700,letterSpacing:2,marginBottom:12}}>0{i+1}</div>
              <div style={{fontSize:28,marginBottom:12}}>{ic}</div>
              <div style={{fontWeight:700,fontSize:15,marginBottom:6}}>{ti}</div>
              <div style={{color:"#ccc",fontSize:13,lineHeight:1.6}}>{de}</div>
            </div>
          ))}
        </div>
      </div>
 
      <div style={{padding:"0 40px 80px",maxWidth:1000,margin:"0 auto"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(270px,1fr))",gap:14}}>
          {[
            ["🖼️","Analiza tus imágenes","Ve tu foto y entiende qué transmite tu producto o servicio."],
            ["🎬","Acepta videos","Subís un video y MCM extrae el contexto visual para los posts."],
            ["🎯","Conoce tu rubro","La IA investiga las tendencias y el lenguaje de tu sector específico."],
            ["📊","5 redes a la vez","Instagram, LinkedIn, TikTok, Facebook y X en un solo click."],
            ["🖼️","Imagen lista","1080x1080px con tu foto y el texto, lista para subir."],
            ["⬇️","Descarga todo","Texto (.txt) e imagen (.png) para cada red, en segundos."],
          ].map(([ic,ti,de])=>(
            <div key={ti} style={{background:"#0d0d1a",border:"1px solid #1a1a35",borderRadius:14,padding:"22px 20px",transition:"border-color 0.2s"}}
              onMouseEnter={e=>e.currentTarget.style.borderColor="#7c3aed40"}
              onMouseLeave={e=>e.currentTarget.style.borderColor="#1a1a35"}>
              <div style={{fontSize:26,marginBottom:10}}>{ic}</div>
              <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>{ti}</div>
              <div style={{color:"#ccc",fontSize:13,lineHeight:1.6}}>{de}</div>
            </div>
          ))}
        </div>
      </div>
 
      <div style={{textAlign:"center",padding:"60px 20px 80px",borderTop:"1px solid #0d0d1a"}}>
        <h2 style={{fontSize:"clamp(28px,4vw,44px)",fontWeight:800,marginBottom:12,letterSpacing:-0.5}}>Tu CM trabaja 24/7.</h2>
        <p style={{color:"#ccc",fontSize:16,marginBottom:32}}>7 días gratis · Sin tarjeta · Cancelás cuando quieras</p>
        <button onClick={()=>setView("app")} style={{background:G,color:"#fff",border:"none",borderRadius:13,padding:"15px 44px",fontWeight:800,cursor:"pointer",fontSize:16}}>
          Empezar gratis →
        </button>
      </div>
      <div style={{textAlign:"center",padding:"20px",color:"#1a1a35",fontSize:12,borderTop:"1px solid #0a0a14"}}>
        © 2025 MCM · My Community Manager · Hecho en Argentina 🇦🇷
      </div>
    </div>
  );
 
  // ── PRICING ──
  if(view==="pricing") return (
    <div style={{minHeight:"100vh",background:"#05050a"}}>
      <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 40px",borderBottom:"1px solid #0d0d1a"}}>
        <div style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer"}} onClick={()=>setView("landing")}>
          <div style={{width:30,height:30,background:G,borderRadius:8,display:"grid",placeItems:"center",color:"#fff",fontWeight:800,fontSize:14}}>M</div>
          <span style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:800}}>MCM</span>
        </div>
        <button onClick={()=>setView("app")} style={{background:"transparent",color:"#a78bfa",border:"1px solid #7c3aed40",borderRadius:10,padding:"9px 20px",cursor:"pointer",fontWeight:700,fontSize:13}}>Ver demo →</button>
      </nav>
      <div style={{textAlign:"center",padding:"60px 20px 44px"}}>
        <h1 style={{fontFamily:"'Syne',sans-serif",fontSize:48,fontWeight:800,letterSpacing:-1,marginBottom:10}}>Planes simples.</h1>
        <p style={{color:"#ccc",fontSize:16}}>Sin contratos. Cancelás cuando quieras.</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(270px,1fr))",gap:18,maxWidth:940,margin:"0 auto",padding:"0 24px 80px"}}>
        {[
          {name:"Starter",price:29,color:"#34d399",features:["30 posts/mes","Análisis de imágenes","5 redes","Imagen generada","Descarga texto + imagen"]},
          {name:"Pro",price:59,color:"#7c3aed",pop:true,features:["100 posts/mes","Imágenes + videos","Perfil completo","Sin marca de agua","Soporte prioritario"]},
          {name:"Agency",price:149,color:"#ec4899",features:["Posts ilimitados","10 clientes","White label","API access","Soporte 24/7"]},
        ].map(p=>(
          <div key={p.name} style={{background:"#0d0d1a",border:`1.5px solid ${p.pop?p.color+"60":"#1a1a35"}`,borderRadius:20,padding:"30px 24px",position:"relative"}}>
            {p.pop&&<div style={{position:"absolute",top:-12,left:"50%",transform:"translateX(-50%)",background:G,color:"#fff",fontSize:11,fontWeight:800,padding:"4px 16px",borderRadius:50,whiteSpace:"nowrap"}}>⭐ MÁS POPULAR</div>}
            <div style={{color:p.color,fontSize:10,fontWeight:700,letterSpacing:2,marginBottom:8}}>{p.name.toUpperCase()}</div>
            <div style={{fontSize:44,fontWeight:800,fontFamily:"'Syne',sans-serif",lineHeight:1,marginBottom:4}}>${p.price}</div>
            <div style={{color:"#fff",fontSize:13,marginBottom:20}}>/mes USD</div>
            <div style={{display:"flex",flexDirection:"column",gap:9,marginBottom:22,paddingTop:16,borderTop:"1px solid #1a1a35"}}>
              {p.features.map((f,i)=><div key={i} style={{display:"flex",gap:9,color:"#ddd",fontSize:13}}><span style={{color:p.color}}>✓</span>{f}</div>)}
            </div>
            <button onClick={()=>setView("app")} style={{width:"100%",background:p.pop?G:"transparent",border:`1.5px solid ${p.color}`,color:p.pop?"#fff":p.color,borderRadius:11,padding:"12px",fontWeight:800,cursor:"pointer",fontSize:14}}>
              Empezar →
            </button>
          </div>
        ))}
      </div>
    </div>
  );
 
  // ── APP ──
  const isCustomInd = industryVal && !INDUSTRIES.slice(0,-1).includes(industryVal);
 
  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#05050a",overflow:"hidden"}}>
 
      {/* ONBOARDING */}
      {needsOnboarding && showOB && (

                    <button className="del-btn" onClick={e=>{e.stopPropagation();removeItem(item.id);}} style={{position:"absolute",top:6,left:6,background:"rgba(0,0,0,0.8)",border:"none",color:"#fff",width:18,height:18,borderRadius:"50%",cursor:"pointer",fontSize:9,lineHeight:"18px",opacity:0}}>✕</button>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.65))",padding:"5px",fontSize:8,color:"#ccc"}}>{item.date}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
 
      {/* BRAND */}
      {tab==="brand"&&(
        <div style={{flex:1,overflowY:"auto",padding:"18px 22px"}}>
          <div style={{maxWidth:500}}>
            <div style={{marginBottom:20}}>
              <div style={{fontSize:16,fontWeight:800,marginBottom:3}}>Perfil de mi marca</div>
              <div style={{fontSize:12,color:"#fff"}}>La IA usa este perfil para personalizar todos los posts automáticamente.</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:13}}>
              <div>
                <div style={{fontSize:10,color:"#fff",letterSpacing:1.5,marginBottom:5}}>NOMBRE DE LA EMPRESA</div>
                <input value={brand.name||""} onChange={e=>upd("name",e.target.value)} placeholder="Ej: La Josefa Granja Orgánica" style={INP}/>
              </div>
 
              <div>
                <div style={{fontSize:10,color:"#fff",letterSpacing:1.5,marginBottom:5}}>RUBRO / INDUSTRIA</div>
                <select
                  value={INDUSTRIES.slice(0,-1).includes(brand.industry||"")?brand.industry:(brand.industry?"Otro":"")}
                  onChange={e=>{ if(e.target.value!=="Otro"){upd("industry",e.target.value);setCustomInd(false);}else{upd("industry","");setCustomInd(true);} }}
                  style={{...INP,cursor:"pointer",marginBottom:6}}>
                  <option value="">Seleccioná tu rubro...</option>
                  {INDUSTRIES.slice(0,-1).map(i=><option key={i} value={i}>{i}</option>)}
                  <option value="Otro">✏️ Mi rubro no está en la lista</option>
                </select>
                {(customInd||isCustomInd)&&(
                  <input value={brand.industry||""} onChange={e=>upd("industry",e.target.value)}
                    placeholder="Escribí tu rubro (ej: Veterinaria, DJ, Arquitectura...)"
                    style={{...INP,border:"1px solid #7c3aed40"}}/>
                )}
              </div>
 
              <div>
                <div style={{fontSize:10,color:"#fff",letterSpacing:1.5,marginBottom:5}}>PROPUESTA DE VALOR</div>
                <textarea value={brand.description||""} onChange={e=>upd("description",e.target.value)} rows={3}
                  placeholder="Qué hacés, qué te diferencia de la competencia..."
                  style={INP}/>
              </div>
 
              <div>
                <div style={{fontSize:10,color:"#fff",letterSpacing:1.5,marginBottom:5}}>CLIENTE IDEAL</div>
                <input value={brand.target||""} onChange={e=>upd("target",e.target.value)}
                  placeholder="Ej: Familias de 30-50 años que valoran la alimentación saludable" style={INP}/>
              </div>
 
              <div>
                <div style={{fontSize:10,color:"#fff",letterSpacing:1.5,marginBottom:6}}>TONO DE COMUNICACIÓN</div>
                <div style={{display:"flex",gap:7,flexWrap:"wrap"}}>
                  {["auténtico","premium","divertido","inspirador","urgente","educativo"].map(t=>(
                    <button key={t} onClick={()=>upd("tone",t)} style={{background:(brand.tone||"auténtico")===t?"#7c3aed20":"#0d0d1a",border:`1px solid ${(brand.tone||"auténtico")===t?"#7c3aed":"#1a1a35"}`,borderRadius:7,padding:"7px 13px",color:(brand.tone||"auténtico")===t?"#a78bfa":"#888",cursor:"pointer",fontSize:12,textTransform:"capitalize"}}>
                      {t}
                    </button>
                  ))}
                </div>
              </div>
 
              <div style={{background:"#0d0d1a",border:"1px solid #7c3aed20",borderRadius:10,padding:"12px 14px"}}>
                <div style={{fontSize:11,color:"#7c3aed",fontWeight:700,marginBottom:3}}>✦ Guardado automáticamente</div>
                <div style={{fontSize:12,color:"#fff",lineHeight:1.6}}>MCM aplica este perfil en cada generación para que los posts suenen como tu marca.</div>
              </div>
 
              {brand.name&&<button onClick={()=>setTab("generator")} style={{background:G,color:"#fff",border:"none",borderRadius:10,padding:"12px",fontWeight:800,cursor:"pointer",fontSize:14}}>Ir al generador →</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
