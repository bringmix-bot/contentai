<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ContentAI — Generador de contenido con IA</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#080808;color:#fff;font-family:'DM Sans',sans-serif}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#1e1e1e;border-radius:4px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
input,textarea,select,button{font-family:'DM Sans',sans-serif}
input::placeholder,textarea::placeholder{color:#2e2e2e}
textarea{resize:none}
select{-webkit-appearance:none}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef } = React;

const NETWORKS = [
  { id:"instagram", label:"Instagram", icon:"📸", tone:"visual y emocional, con emojis y hashtags al final" },
  { id:"linkedin",  label:"LinkedIn",  icon:"💼", tone:"profesional, con datos e insights del sector, sin exceso de emojis" },
  { id:"twitter",   label:"X/Twitter", icon:"🐦", tone:"conciso y directo, máximo 280 caracteres, con gancho fuerte" },
  { id:"facebook",  label:"Facebook",  icon:"👥", tone:"conversacional y cálido, que invite a comentar" },
  { id:"tiktok",    label:"TikTok",    icon:"🎵", tone:"hook potente en la primera línea, entretenido, con llamada a la acción" },
];

const INDUSTRIES = ["Restaurante / Gastronomía","Moda / Indumentaria","Salud y bienestar","Tecnología","Inmobiliaria","Educación","Turismo","Retail / Tienda","Servicios profesionales","Otro"];

const PLANS = [
  { id:"starter", name:"Starter", price:19, color:"#a3e635", features:["30 posts/mes","Análisis de imágenes","5 redes sociales","Soporte por email"] },
  { id:"pro", name:"Pro", price:49, color:"#f59e0b", popular:true, features:["100 posts/mes","Imágenes ilimitadas","Todas las redes","Soporte prioritario"] },
  { id:"agency", name:"Agency", price:129, color:"#818cf8", features:["Posts ilimitados","10 clientes","White label","Soporte 24/7"] },
];

function App() {
  const [view, setView] = useState("landing");
  const [activePlan, setActivePlan] = useState(null);
  const [businessName, setBusinessName] = useState("");
  const [industry, setIndustry] = useState("");
  const [topic, setTopic] = useState("");
  const [tone, setTone] = useState("profesional");
  const [generating, setGenerating] = useState(false);
  const [results, setResults] = useState({});
  const [activeNet, setActiveNet] = useState("instagram");
  const [postsUsed, setPostsUsed] = useState(0);
  const [copied, setCopied] = useState(false);
  const [imagePreview, setImagePreview] = useState(null);
  const [imageBase64, setImageBase64] = useState(null);
  const [imageMediaType, setImageMediaType] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const fileRef = useRef();

  const plan = activePlan || PLANS[1];

  const handleFile = (file) => {
    if (!file || !file.type.startsWith("image/")) return;
    setImageMediaType(file.type);
    const reader = new FileReader();
    reader.onload = (e) => {
      setImagePreview(e.target.result);
      setImageBase64(e.target.result.split(",")[1]);
    };
    reader.readAsDataURL(file);
  };

  const removeImage = (e) => {
    e.stopPropagation();
    setImagePreview(null);
    setImageBase64(null);
    setImageMediaType(null);
  };

  const generateAll = async () => {
    if (!topic.trim() && !imageBase64) return;
    setGenerating(true);
    setResults({});

    const prompt = `Sos un experto en marketing digital y redes sociales con profundo conocimiento del mercado argentino y latinoamericano.
${imageBase64 ? `Analizá esta imagen del negocio "${businessName||"mi negocio"}" (rubro: ${industry||"servicios"}).` : ""}
Negocio: "${businessName||"mi negocio"}"
Rubro: "${industry||"servicios"}"
${topic ? `Tema/contexto extra: "${topic}"` : ""}
Tono: ${tone}
${imageBase64 ? "Basate en lo que ves en la imagen para crear contenido auténtico." : ""}

Generá posts para las 5 redes. Adaptá cada uno al formato, audiencia y algoritmo de cada plataforma. Usá EXACTAMENTE este formato:

===INSTAGRAM===
[post completo para Instagram: ${NETWORKS[0].tone}]

===LINKEDIN===
[post completo para LinkedIn: ${NETWORKS[1].tone}]

===TWITTER===
[post completo para X/Twitter: ${NETWORKS[2].tone}]

===FACEBOOK===
[post completo para Facebook: ${NETWORKS[3].tone}]

===TIKTOK===
[descripción/script para TikTok: ${NETWORKS[4].tone}]`;

    try {
      const res = await fetch("/api/generate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt, imageBase64, imageMediaType }),
      });
      const data = await res.json();
      if (data.error) { setResults({ _error: data.error }); }
      else {
        const text = data.text || "";
        const parsed = {};
        const keys = ["INSTAGRAM","LINKEDIN","TWITTER","FACEBOOK","TIKTOK"];
        const ids  = ["instagram","linkedin","twitter","facebook","tiktok"];
        keys.forEach((key, i) => {
          const start = text.indexOf(`===${key}===`);
          if (start === -1) return;
          const from = start + key.length + 6;
          const nextStart = keys[i+1] ? text.indexOf(`===${keys[i+1]}===`) : text.length;
          parsed[ids[i]] = text.slice(from, nextStart).trim();
        });
        setResults(parsed);
        setPostsUsed(p => p + 5);
      }
    } catch { setResults({ _error: "Error de conexión." }); }
    setGenerating(false);
  };

  const canGenerate = !generating && (!!topic.trim() || !!imageBase64);

  // ── LANDING ──
  if (view === "landing") return (
    <div style={{minHeight:"100vh",background:"#080808",color:"#fff"}}>
      <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 40px",borderBottom:"1px solid #111",position:"sticky",top:0,background:"#080808ee",backdropFilter:"blur(16px)",zIndex:50}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:30,height:30,background:"#a3e635",borderRadius:8,display:"grid",placeItems:"center",fontSize:13,color:"#000"}}>✦</div>
          <span style={{fontFamily:"'Playfair Display',serif",fontSize:19,fontWeight:800}}>ContentAI</span>
        </div>
        <div style={{display:"flex",gap:24}}>
          <span onClick={()=>setView("pricing")} style={{color:"#555",fontSize:14,cursor:"pointer"}}>Precios</span>
          <span onClick={()=>setView("app")} style={{color:"#555",fontSize:14,cursor:"pointer"}}>Demo</span>
        </div>
        <button onClick={()=>setView("app")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:11,padding:"10px 22px",fontWeight:700,cursor:"pointer",fontSize:14}}>Probar gratis →</button>
      </nav>

      <div style={{textAlign:"center",padding:"100px 20px 80px"}}>
        <div style={{display:"inline-flex",alignItems:"center",gap:8,background:"#a3e63510",border:"1px solid #a3e63330",color:"#a3e635",fontSize:11,fontWeight:700,padding:"6px 18px",borderRadius:20,marginBottom:36,letterSpacing:1.5}}>✦ ANÁLISIS DE IMÁGENES CON IA</div>
        <h1 style={{fontSize:"clamp(40px,8vw,82px)",fontFamily:"'Playfair Display',serif",fontWeight:800,lineHeight:1.05,margin:"0 0 24px",background:"linear-gradient(135deg,#fff 0%,#a3e635 45%,#f59e0b 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Subí una foto.<br/>Publicá en 5 redes.</h1>
        <p style={{color:"#555",fontSize:19,maxWidth:520,margin:"0 auto 48px",lineHeight:1.65}}>ContentAI analiza tus imágenes y genera posts optimizados para Instagram, LinkedIn, TikTok, Facebook y X — todo a la vez, en segundos.</p>
        <div style={{display:"flex",gap:12,justifyContent:"center",flexWrap:"wrap"}}>
          <button onClick={()=>setView("app")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:13,padding:"16px 40px",fontWeight:800,cursor:"pointer",fontSize:16}}>Probar gratis 7 días</button>
          <button onClick={()=>setView("pricing")} style={{background:"transparent",color:"#fff",border:"1px solid #222",borderRadius:13,padding:"16px 36px",fontWeight:600,cursor:"pointer",fontSize:16}}>Ver planes →</button>
        </div>
      </div>

      <div style={{display:"flex",justifyContent:"center",gap:"clamp(24px,6vw,80px)",padding:"36px 20px",borderTop:"1px solid #111",borderBottom:"1px solid #111",flexWrap:"wrap"}}>
        {[["🖼️","Subís una foto"],["🤖","La IA la analiza"],["📝","Genera 5 posts"],["🚀","Publicás al toque"]].map(([icon,l])=>(
          <div key={l} style={{textAlign:"center"}}><div style={{fontSize:30,marginBottom:8}}>{icon}</div><div style={{color:"#555",fontSize:13}}>{l}</div></div>
        ))}
      </div>

      <div style={{padding:"70px 40px",maxWidth:1000,margin:"0 auto"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:38,textAlign:"center",marginBottom:48}}>Todo lo que necesitás</h2>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:16}}>
          {[["🖼️","Análisis de imágenes","La IA ve tu foto y entiende el producto, el ambiente y el mensaje."],["📊","5 redes de una vez","Posts optimizados para cada plataforma simultáneamente."],["🇦🇷","Mercado argentino","Entiende el contexto local, precios y tendencias del rubro."],["🎯","Tono personalizado","Cada post adapta el mensaje al algoritmo de cada red."],["⚡","5 segundos","De foto a 5 posts listos para publicar."],["🔁","Regenerá fácil","¿No te convence? Regenerá con un click."]].map(([icon,title,desc])=>(
            <div key={title} style={{background:"#0c0c0c",border:"1px solid #141414",borderRadius:14,padding:"22px 20px"}}>
              <div style={{fontSize:26,marginBottom:10}}>{icon}</div>
              <div style={{fontWeight:700,fontSize:14,marginBottom:6}}>{title}</div>
              <div style={{color:"#555",fontSize:12,lineHeight:1.65}}>{desc}</div>
            </div>
          ))}
        </div>
      </div>

      <div style={{textAlign:"center",padding:"70px 20px",borderTop:"1px solid #111"}}>
        <h2 style={{fontFamily:"'Playfair Display',serif",fontSize:44,marginBottom:12}}>Empezá hoy.</h2>
        <p style={{color:"#555",fontSize:16,marginBottom:32}}>7 días gratis · Sin tarjeta · Cancelá cuando quieras</p>
        <button onClick={()=>setView("app")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:13,padding:"16px 48px",fontWeight:800,cursor:"pointer",fontSize:16}}>Probar gratis →</button>
      </div>
    </div>
  );

  // ── PRICING ──
  if (view === "pricing") return (
    <div style={{minHeight:"100vh",background:"#080808",color:"#fff"}}>
      <nav style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"18px 40px",borderBottom:"1px solid #111"}}>
        <span onClick={()=>setView("landing")} style={{fontFamily:"'Playfair Display',serif",fontSize:18,fontWeight:800,cursor:"pointer"}}>✦ ContentAI</span>
        <button onClick={()=>setView("app")} style={{background:"transparent",color:"#a3e635",border:"1px solid #a3e63540",borderRadius:10,padding:"9px 20px",cursor:"pointer",fontWeight:700,fontSize:13}}>Ver demo →</button>
      </nav>
      <div style={{textAlign:"center",padding:"60px 20px 40px"}}>
        <h1 style={{fontFamily:"'Playfair Display',serif",fontSize:50,margin:"0 0 12px"}}>Planes simples.</h1>
        <p style={{color:"#555",fontSize:17}}>Sin contratos. Cancelá cuando quieras.</p>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(270px,1fr))",gap:22,maxWidth:940,margin:"0 auto",padding:"0 24px 60px"}}>
        {PLANS.map(p=>(
          <div key={p.id} style={{background:activePlan?.id===p.id?`${p.color}10`:"#0f0f0f",border:`1.5px solid ${activePlan?.id===p.id?p.color:"#1e1e1e"}`,borderRadius:20,padding:"30px 24px",position:"relative",transition:"all 0.3s"}}>
            {p.popular&&<div style={{position:"absolute",top:-12,left:"50%",transform:"translateX(-50%)",background:p.color,color:"#000",fontSize:11,fontWeight:800,padding:"4px 14px",borderRadius:20,whiteSpace:"nowrap"}}>⭐ MÁS POPULAR</div>}
            <div style={{color:p.color,fontSize:11,fontWeight:700,letterSpacing:2,marginBottom:8}}>{p.name.toUpperCase()}</div>
            <div style={{fontSize:42,fontWeight:800,color:"#fff",fontFamily:"'Playfair Display',serif",lineHeight:1,marginBottom:4}}>${p.price}</div>
            <div style={{color:"#333",fontSize:12,marginBottom:18}}>/mes USD</div>
            <div style={{borderTop:"1px solid #1a1a1a",paddingTop:16,display:"flex",flexDirection:"column",gap:9,marginBottom:22}}>
              {p.features.map((f,i)=><div key={i} style={{display:"flex",gap:9,color:"#bbb",fontSize:13}}><span style={{color:p.color}}>✦</span>{f}</div>)}
            </div>
            <button onClick={()=>{setActivePlan(p);setView("app");}} style={{width:"100%",background:activePlan?.id===p.id?p.color:"transparent",border:`1.5px solid ${p.color}`,color:activePlan?.id===p.id?"#000":p.color,borderRadius:11,padding:"12px",fontWeight:800,cursor:"pointer",fontSize:14}}>
              {activePlan?.id===p.id?"✓ Tu plan actual":"Suscribirme →"}
            </button>
          </div>
        ))}
      </div>
    </div>
  );

  // ── APP ──
  return (
    <div style={{height:"100vh",display:"flex",flexDirection:"column",background:"#080808",color:"#fff",overflow:"hidden"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 22px",borderBottom:"1px solid #111",background:"#0a0a0a",flexShrink:0}}>
        <span onClick={()=>setView("landing")} style={{fontFamily:"'Playfair Display',serif",fontSize:16,fontWeight:800,cursor:"pointer"}}>✦ ContentAI</span>
        <div style={{display:"flex",alignItems:"center",gap:12}}>
          <span style={{fontSize:11,color:"#333"}}>{postsUsed} posts generados hoy</span>
          {activePlan
            ? <button onClick={()=>setView("pricing")} style={{background:`${plan.color}12`,color:plan.color,border:`1px solid ${plan.color}40`,borderRadius:8,padding:"6px 12px",cursor:"pointer",fontSize:12,fontWeight:700}}>Plan {plan.name} ↑</button>
            : <button onClick={()=>setView("pricing")} style={{background:"#a3e635",color:"#000",border:"none",borderRadius:8,padding:"7px 16px",cursor:"pointer",fontWeight:700,fontSize:12}}>Suscribirme →</button>
          }
        </div>
      </div>

      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        {/* LEFT PANEL */}
        <div style={{width:320,borderRight:"1px solid #111",padding:"18px 16px",display:"flex",flexDirection:"column",gap:14,overflowY:"auto",flexShrink:0}}>
          <div>
            <div style={{fontSize:16,fontWeight:800,marginBottom:4,fontFamily:"'Playfair Display',serif"}}>Generador IA</div>
            <div style={{fontSize:12,color:"#333"}}>Subí una imagen o escribí un tema.</div>
          </div>

          {/* DROP ZONE */}
          <div
            onDragOver={e=>{e.preventDefault();setDragOver(true)}}
            onDragLeave={()=>setDragOver(false)}
            onDrop={e=>{e.preventDefault();setDragOver(false);handleFile(e.dataTransfer.files[0])}}
            onClick={()=>fileRef.current.click()}
            style={{border:`2px dashed ${dragOver?"#a3e635":"#222"}`,borderRadius:12,padding:"16px",textAlign:"center",cursor:"pointer",transition:"all 0.2s",background:dragOver?"#a3e63505":"transparent",minHeight:120,display:"flex",alignItems:"center",justifyContent:"center"}}
          >
            <input ref={fileRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>handleFile(e.target.files[0])}/>
            {imagePreview ? (
              <div style={{width:"100%",position:"relative"}}>
                <img src={imagePreview} style={{maxHeight:100,maxWidth:"100%",borderRadius:8,objectFit:"cover"}} alt="preview"/>
                <button onClick={removeImage} style={{position:"absolute",top:-8,right:-8,background:"#f43f5e",border:"none",color:"#fff",width:22,height:22,borderRadius:"50%",cursor:"pointer",fontSize:11,lineHeight:"22px"}}>✕</button>
                <div style={{color:"#a3e635",fontSize:11,marginTop:6,fontWeight:700}}>✓ Lista para analizar</div>
              </div>
            ) : (
              <div>
                <div style={{fontSize:28,marginBottom:6}}>🖼️</div>
                <div style={{color:"#444",fontSize:12,marginBottom:3}}>Arrastrá una foto o hacé click</div>
                <div style={{color:"#2a2a2a",fontSize:11}}>JPG, PNG, WEBP</div>
              </div>
            )}
          </div>

          {/* FIELDS */}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
            <div>
              <div style={{fontSize:10,color:"#333",marginBottom:4,letterSpacing:1}}>NEGOCIO</div>
              <input value={businessName} onChange={e=>setBusinessName(e.target.value)} placeholder="Ej: La Josefa" style={{width:"100%",background:"#0c0c0c",border:"1px solid #161616",borderRadius:8,padding:"8px 10px",color:"#fff",fontSize:12,outline:"none"}}/>
            </div>
            <div>
              <div style={{fontSize:10,color:"#333",marginBottom:4,letterSpacing:1}}>RUBRO</div>
              <select value={industry} onChange={e=>setIndustry(e.target.value)} style={{width:"100%",background:"#0c0c0c",border:"1px solid #161616",borderRadius:8,padding:"8px 10px",color:industry?"#fff":"#2a2a2a",fontSize:12,cursor:"pointer"}}>
                <option value="">Seleccioná...</option>
                {INDUSTRIES.map(i=><option key={i}>{i}</option>)}
              </select>
            </div>
          </div>

          <div>
            <div style={{fontSize:10,color:"#333",marginBottom:6,letterSpacing:1}}>TONO</div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {["profesional","divertido","inspirador","urgente"].map(t=>(
                <button key={t} onClick={()=>setTone(t)} style={{background:tone===t?"#f59e0b15":"#0c0c0c",border:`1px solid ${tone===t?"#f59e0b":"#161616"}`,borderRadius:7,padding:"6px 10px",color:tone===t?"#f59e0b":"#444",cursor:"pointer",fontSize:11,textTransform:"capitalize"}}>{t}</button>
              ))}
            </div>
          </div>

          <div>
            <div style={{fontSize:10,color:"#333",marginBottom:4,letterSpacing:1}}>CONTEXTO ADICIONAL</div>
            <textarea value={topic} onChange={e=>setTopic(e.target.value)} rows={3}
              placeholder="Ej: Promo del fin de semana, lanzamiento, evento especial..."
              style={{width:"100%",background:"#0c0c0c",border:"1px solid #161616",borderRadius:8,padding:"8px 10px",color:"#fff",fontSize:12,outline:"none"}}/>
          </div>

          <button onClick={generateAll} disabled={!canGenerate} style={{background:canGenerate?"#a3e635":"#141414",color:canGenerate?"#000":"#2a2a2a",border:"none",borderRadius:10,padding:"13px",fontSize:14,fontWeight:800,cursor:canGenerate?"pointer":"not-allowed",display:"flex",alignItems:"center",justifyContent:"center",gap:10,transition:"all 0.2s"}}>
            {generating
              ? <><div style={{width:14,height:14,border:"2px solid #1a1a1a",borderTopColor:"#000",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>Generando 5 posts...</>
              : "🖼️ Generar para todas las redes"}
          </button>

          {generating && (
            <div style={{background:"#0c0c0c",border:"1px solid #141414",borderRadius:10,padding:"12px 14px"}}>
              <div style={{fontSize:11,color:"#a3e635",marginBottom:8,animation:"pulse 1.2s ease infinite"}}>🤖 Analizando y generando...</div>
              {["Analizando la imagen","Entendiendo el mercado","Escribiendo para Instagram","Escribiendo para LinkedIn","Escribiendo para X, Facebook y TikTok"].map((s,i)=>(
                <div key={i} style={{fontSize:11,color:"#2a2a2a",padding:"2px 0"}}>· {s}</div>
              ))}
            </div>
          )}
        </div>

        {/* RIGHT PANEL */}
        <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden",padding:"16px 20px",gap:12}}>
          {/* Network tabs */}
          <div style={{display:"flex",gap:6,flexWrap:"wrap",flexShrink:0}}>
            {NETWORKS.map(n=>(
              <button key={n.id} onClick={()=>setActiveNet(n.id)} style={{background:activeNet===n.id?"#a3e63515":"#0c0c0c",border:`1px solid ${activeNet===n.id?"#a3e635":"#161616"}`,borderRadius:8,padding:"8px 16px",color:activeNet===n.id?"#a3e635":"#444",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:7,transition:"all 0.15s"}}>
                <span>{n.icon}</span>{n.label}
                {results[n.id] && <span style={{width:6,height:6,borderRadius:"50%",background:"#a3e635",flexShrink:0}}/>}
              </button>
            ))}
          </div>

          {/* Result box */}
          <div style={{flex:1,background:"#0a0a0a",border:`1px solid ${results[activeNet]?"#a3e63530":"#141414"}`,borderRadius:14,padding:"18px 20px",display:"flex",flexDirection:"column",overflow:"hidden",transition:"border-color 0.3s"}}>
            {results._error && (
              <div style={{color:"#f43f5e",fontSize:14}}>❌ {results._error}</div>
            )}
            {!generating && !results[activeNet] && !results._error && (
              <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",color:"#1a1a1a",textAlign:"center"}}>
                <div style={{fontSize:44,marginBottom:12}}>🖼️</div>
                <div style={{fontSize:14,marginBottom:6}}>Subí una imagen o escribí un tema</div>
                <div style={{fontSize:12,color:"#111"}}>Se generarán posts para las 5 redes a la vez</div>
              </div>
            )}
            {generating && !results[activeNet] && (
              <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:14}}>
                <div style={{width:34,height:34,border:"3px solid #141414",borderTopColor:"#a3e635",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>
                <div style={{color:"#333",fontSize:13}}>Generando post para {NETWORKS.find(n=>n.id===activeNet)?.label}...</div>
              </div>
            )}
            {results[activeNet] && (
              <div style={{animation:"fadeIn 0.4s ease",flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,paddingBottom:12,borderBottom:"1px solid #141414",flexShrink:0}}>
                  <span style={{fontSize:18}}>{NETWORKS.find(n=>n.id===activeNet)?.icon}</span>
                  <span style={{fontWeight:700,fontSize:14}}>{NETWORKS.find(n=>n.id===activeNet)?.label}</span>
                  <span style={{marginLeft:"auto",fontSize:11,color:"#a3e635",background:"#a3e63510",padding:"3px 10px",borderRadius:20,border:"1px solid #a3e63530"}}>✓ Listo</span>
                </div>
                <div style={{whiteSpace:"pre-wrap",fontSize:13.5,lineHeight:1.9,color:"#ccc",flex:1,overflowY:"auto"}}>{results[activeNet]}</div>
                <div style={{display:"flex",gap:9,marginTop:14,paddingTop:12,borderTop:"1px solid #141414",flexShrink:0}}>
                  <button onClick={()=>{navigator.clipboard.writeText(results[activeNet]);setCopied(activeNet);setTimeout(()=>setCopied(false),2000);}}
                    style={{flex:1,background:copied===activeNet?"#0f2010":"#a3e635",color:copied===activeNet?"#a3e635":"#000",border:copied===activeNet?"1px solid #a3e635":"none",borderRadius:8,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:13,transition:"all 0.2s"}}>
                    {copied===activeNet?"✓ ¡Copiado!":"📋 Copiar post"}
                  </button>
                  <button onClick={generateAll} title="Regenerar" style={{background:"#141414",color:"#666",border:"1px solid #1e1e1e",borderRadius:8,padding:"10px 16px",cursor:"pointer",fontSize:16}}>🔁</button>
                </div>
              </div>
            )}
          </div>

          {/* Status bar */}
          {Object.keys(results).filter(k=>k!=="error").length > 0 && (
            <div style={{background:"#0c0c0c",border:"1px solid #141414",borderRadius:10,padding:"10px 16px",display:"flex",alignItems:"center",gap:16,flexShrink:0}}>
              <span style={{fontSize:11,color:"#333",letterSpacing:1}}>REDES:</span>
              {NETWORKS.map(n=>(
                <span key={n.id} onClick={()=>setActiveNet(n.id)} style={{fontSize:12,color:results[n.id]?"#a3e635":"#2a2a2a",cursor:"pointer",display:"flex",alignItems:"center",gap:4}}>
                  {results[n.id]?"✓":""} {n.label}
                </span>
              ))}
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
