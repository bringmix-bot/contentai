<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;
  --accent:#6d28d9;--accent2:#a855f7;--pink:#ec4899;
  --text:#f0f0ff;--muted:#6b6b8a;--success:#22d3ee;--error:#f43f5e;--warn:#f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:'Inter',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}

.step-dot.done{background:var(--success)}.step-dot.active{background:var(--accent2)}

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ════════════════════════════════════════════════════════════════
// STORE — por usuario (cada cliente tiene sus datos separados)
// ════════════════════════════════════════════════════════════════
const store = {
  uid: () => { try { return JSON.parse(localStorage.getItem("mcm_session"))?.uid||""; } catch { return ""; } },
  key: k => { const u=store.uid(); return u ? `mcm_u_${u}_${k}` : `mcm_${k}`; },
  get: k => { try { return JSON.parse(localStorage.getItem(store.key(k))); } catch { return null; } },
  set: (k,v) => localStorage.setItem(store.key(k), JSON.stringify(v)),
  // Globales (no por usuario)
  getG: k => { try { return JSON.parse(localStorage.getItem("mcm_"+k)); } catch { return null; } },
  setG: (k,v) => localStorage.setItem("mcm_"+k, JSON.stringify(v)),
};

// ════════════════════════════════════════════════════════════════
// PLANES
// ════════════════════════════════════════════════════════════════
const PLANS = {
  free:    { id:"free",    name:"Free",    price_usd:0,  posts:7,   redes:1, auto:false, carousel:false, stats:false, color:"#6b6b8a" },
  pro:     { id:"pro",     name:"Pro",     price_usd:33, posts:30,  redes:3, auto:true,  carousel:true,  stats:false, color:"#6d28d9" },
  premium: { id:"premium", name:"Premium", price_usd:60, posts:999, redes:5, auto:true,  carousel:true,  stats:true,  color:"#ec4899" },
};

const PLAN_FEATURES = {
  free:    ["7 posts para probar","1 red social","Editor de diseño","Templates básicos"],
  pro:     ["30 posts por mes","3 redes sociales","Publicación automática","Carrusel de imágenes","Briefs individuales","Aprendizaje de estilo"],
  premium: ["Posts ilimitados","5 redes sociales","Todo lo de Pro","Estadísticas avanzadas","Encuestas y links","Soporte prioritario"],
};

// ════════════════════════════════════════════════════════════════
// AUTH HELPERS
// ════════════════════════════════════════════════════════════════
function getSession() {
  try { return JSON.parse(localStorage.getItem("mcm_session"))||null; } catch { return null; }
}
function setSession(data) {
  localStorage.setItem("mcm_session", JSON.stringify(data));
}
function clearSession() {
  localStorage.removeItem("mcm_session");
}
function getAllUsers() {
  try { return JSON.parse(localStorage.getItem("mcm_users"))||{}; } catch { return {}; }
}
function saveUser(uid, data) {
  const users = getAllUsers();
  users[uid] = {...(users[uid]||{}), ...data};
  localStorage.setItem("mcm_users", JSON.stringify(users));
}
function getUser(uid) {
  return getAllUsers()[uid]||null;
}
function hashPassword(pwd) {
  // Simple hash para demo — en producción usar bcrypt en backend
  let hash = 0;
  for(let i=0;i<pwd.length;i++) { hash = ((hash<<5)-hash)+pwd.charCodeAt(i); hash|=0; }
  return hash.toString(36);
}

// ════════════════════════════════════════════════════════════════
// APRENDIZAJE — guarda preferencias de edición persistentes
// ════════════════════════════════════════════════════════════════
function learnFromEdit(original, edited) {
  const prefs = store.get("stylePrefs")||{};
  const delta = {};
  const fields = ["fontFamily","fontWeight","fontSize","fontColor","textBg","logoX","logoY","logoSize","showLogo","imgSrc"];
  fields.forEach(f => {
    if(edited[f] !== undefined && edited[f] !== original[f]) delta[f] = edited[f];
  });
  if(edited.textX !== original.textX || edited.textY !== original.textY) {
    delta.textX = edited.textX; delta.textY = edited.textY;
  }
  const updated = {...prefs, ...delta, lastUpdated: Date.now()};
  store.set("stylePrefs", updated);
  return updated;
}

function applyStylePrefs(opt) {
  const prefs = store.get("stylePrefs")||{};
  return {...opt, ...prefs, ...opt}; // opt values override prefs, but prefs fill defaults
}

function applyStylePrefsToNew(opt) {
  const prefs = store.get("stylePrefs")||{};
  // Only apply learned preferences for fields not explicitly set
  const result = {...opt};
  ["fontFamily","fontWeight","fontSize","fontColor","logoX","logoY","logoSize"].forEach(f => {
    if(prefs[f] !== undefined) result[f] = prefs[f];
  });
  return result;
}

function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null),3500); };
  return [t, show];
}

const SOCIALS_DEFAULT = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
];

const INDUSTRIES = ["Gastronomía","Moda","Salud","Tecnología","Inmobiliaria","Educación","Turismo","Retail","Servicios","Construcción","Paisajismo","Fitness","Belleza","Fotografía","Otro"];
const TONES = ["Profesional","Cercano","Divertido","Inspirador","Urgente","Educativo"];

// Instrucciones de tono detalladas para los prompts
const TONE_INSTRUCTIONS = {
  "Profesional": "Usá un tono formal, serio y confiable. Vocabulario técnico del rubro. Frases completas y estructuradas. Sin emojis excepto los estrictamente necesarios. Transmitir autoridad y experiencia.",
  "Cercano": "Hablale al cliente de vos a vos (tuteo argentino). Tono amigable y cálido como si fuera un amigo que te recomienda algo. Podés usar 1-2 emojis. Frases cortas y directas.",
  "Divertido": "Tono descontracturado, con humor y energía. Usá jerga argentina moderna. Podés hacer juegos de palabras. Varios emojis. Que se sienta fresco y entretenido.",
  "Inspirador": "Mensajes que motiven y emocionen. Frases poderosas y evocadoras. Que genere una conexión emocional profunda. Citaciones o frases que inviten a la reflexión.",
  "Urgente": "Llamados a la acción directos y urgentes. Frases cortas. Palabras como 'Ahora', 'Hoy', 'No te lo pierdas', 'Últimas unidades'. Crear sensación de escasez o urgencia real.",
  "Educativo": "Explicar conceptos de forma clara y didáctica. Usar listas, tips numerados, preguntas retóricas. Posicionarse como experto que enseña. Aportar valor real con cada post.",
};

async function generateText(prompt) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d = await r.json();
  return d.text||"";
}

async function generateTextWithImage(prompt, imageBase64, imageMediaType) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, imageBase64, imageMediaType})});
  const d = await r.json();
  return d.text||"";
}

// ════════════════════════════════════════════════════════════════
// CANVAS HELPERS
// ════════════════════════════════════════════════════════════════
async function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function hexToRgb(hex) {
  try {
    const h = hex.replace("#","");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  } catch { return {r:109,g:40,b:217}; }
}

function coverImg(ctx, img, x, y, w, h) {
  if (!img) return;
  const s = Math.max(w/img.width, h/img.height);
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

function rRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Calcula zona libre para el logo evitando solapamiento con textos ──
function findLogoPosition(opt, W, H) {
  const textX = (opt.textX||0.05)*W;
  const textY = (opt.textY||0.75)*H;
  const fs = Math.round((opt.fontSize||56)*1080/500);
  // Zona del texto principal (bounding box aproximado)
  const textZone = { x: textX-20, y: textY-fs*1.2, w: W*0.55, h: fs*2.5 };
  // Candidatos de posición (fracción del canvas)
  const candidates = [
    {x:0.88,y:0.88}, // esquina inferior derecha (default)
    {x:0.12,y:0.88}, // esquina inferior izquierda
    {x:0.88,y:0.10}, // esquina superior derecha
    {x:0.12,y:0.10}, // esquina superior izquierda
    {x:0.88,y:0.50}, // centro derecho
  ];
  const ls = (opt.logoSize||0.15)*W;
  for(const c of candidates) {
    const lx=c.x*W, ly=c.y*H;
    const overlap = lx+ls/2 > textZone.x && lx-ls/2 < textZone.x+textZone.w
                 && ly+ls/2 > textZone.y && ly-ls/2 < textZone.y+textZone.h;
    if(!overlap) return c;
  }
  return candidates[0];
}

// ── LOGO HELPER ──
async function drawLogo(ctx, opt, W, H) {
  if(!opt.showLogo || !opt.logoBase64) return;
  const logoImg = await loadImg(opt.logoBase64);
  if(!logoImg) return;
  const sizeFrac = opt.logoSize||0.15;
  const maxW = W * sizeFrac, maxH = H * sizeFrac;
  const scale = Math.min(maxW/logoImg.width, maxH/logoImg.height);
  const lw = logoImg.width*scale, lh = logoImg.height*scale;
  // Usa posición guardada o calcula automáticamente evitando solapamiento
  let pos;
  if(opt.logoX !== undefined && opt.logoY !== undefined) {
    pos = {x: opt.logoX, y: opt.logoY};
  } else {
    pos = findLogoPosition(opt, W, H);
  }
  const px = pos.x*W - lw/2, py = pos.y*H - lh/2;
  ctx.save();
  ctx.drawImage(logoImg, px, py, lw, lh);
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 1 — REVISTA EDITORIAL
// ════════════════════════════════════════════════════════════════
async function drawTemplate1(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const bgImg = opt.imgSrc ? await loadImg(opt.imgSrc) : null;
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();

  if(bgImg) { coverImg(ctx, bgImg, 0, 0, W, H); }
  else {
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,`rgb(${r},${g},${b})`); bg.addColorStop(1,"#000");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  }

  const topGrad = ctx.createLinearGradient(0,0,0,H*0.55);
  topGrad.addColorStop(0,"rgba(0,0,0,0.88)"); topGrad.addColorStop(0.65,"rgba(0,0,0,0.45)"); topGrad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=topGrad; ctx.fillRect(0,0,W,H*0.55);

  const botGrad = ctx.createLinearGradient(0,H*0.82,0,H);
  botGrad.addColorStop(0,"rgba(0,0,0,0)"); botGrad.addColorStop(1,"rgba(0,0,0,0.5)");
  ctx.fillStyle=botGrad; ctx.fillRect(0,H*0.82,W,H*0.18);

  ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,W,8);
  ctx.font="700 17px Arial,sans-serif"; ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.textAlign="left";
  ctx.fillText("■  PUBLICACIÓN", 56, 60);

  if(text) {
    const ff = opt.fontFamily||"Impact,'Arial Black',sans-serif";
    const fw = opt.fontWeight||"900";
    const fc = opt.fontColor||"#ffffff";
    const canvasSize = Math.round((opt.fontSize||56)*1080/500);
    const words = text.split(" "); const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size = canvasSize; ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){ ctx.font=`${fw} ${size}px ${ff}`; if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-112) break; size-=4; }
    ctx.fillStyle=fc; ctx.textAlign="left";
    ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=16;
    const lH=size*0.95; const tH=lines.length*lH;
    const posX=(opt.textX!==undefined?opt.textX:0.05)*W;
    const posY=(opt.textY!==undefined?opt.textY:0.15)*H;
    if(opt.textBg){ ctx.fillStyle="rgba(0,0,0,0.5)"; const mw=Math.max(...lines.map(l=>ctx.measureText(l).width)); rRect(ctx,posX-10,posY-10,mw+20,tH+20,8); ctx.fill(); ctx.fillStyle=fc; }
    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY+size*0.85+i*lH));
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(${r},${g},${b},0.85)`; ctx.fillRect(posX, posY+size*0.85+tH+10, 200, 5);
  }

  if(!opt.showLogo||!opt.logoBase64){ ctx.font="600 17px Arial"; ctx.fillStyle="rgba(255,255,255,0.6)"; ctx.textAlign="right"; ctx.fillText("MCM", W-40, H-26); }
  await drawLogo(ctx, opt, W, H);
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 2 — DISEÑO GRÁFICO PURO
// ════════════════════════════════════════════════════════════════
async function drawTemplate2(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080; canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  ctx.fillStyle="#0a0a0f"; ctx.fillRect(0,0,W,H);
  ctx.beginPath(); ctx.arc(W+80,-80,500,0,Math.PI*2);
  const cg=ctx.createRadialGradient(W+80,-80,0,W+80,-80,500);
  cg.addColorStop(0,`rgba(${r},${g},${b},0.65)`); cg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=cg; ctx.fill();
  ctx.beginPath(); ctx.arc(-50,H+50,320,0,Math.PI*2);
  const cg2=ctx.createRadialGradient(-50,H+50,0,-50,H+50,320);
  cg2.addColorStop(0,`rgba(${r},${g},${b},0.35)`); cg2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=cg2; ctx.fill();
  ctx.strokeStyle=`rgba(${r},${g},${b},0.1)`; ctx.lineWidth=1;
  for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle=`rgb(${r},${g},${b})`; rRect(ctx,50,200,16,H-400,8); ctx.fill();

  if(text) {
    const ff=opt.fontFamily||"Impact,'Arial Black',sans-serif"; const fw=opt.fontWeight||"900"; const fc=opt.fontColor||"#ffffff";
    const cs=Math.round((opt.fontSize||56)*1080/500);
    const words=text.toUpperCase().split(" "); const lines=[];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size=cs; ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){ctx.font=`${fw} ${size}px ${ff}`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-160)break;size-=4;}
    ctx.fillStyle=fc; ctx.textAlign="left";
    const posX=(opt.textX!==undefined?opt.textX:0.09)*W;

    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY+size*0.9+i*lH));
  }

  if(caption) {
    const bs=30; ctx.font=`300 ${bs}px Arial,sans-serif`; ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.textAlign="left";
    const mw=W-150; const words=caption.split(" "); const lines=[]; let line="";
    for(const w of words){ const t2=line+(line?" ":"")+w; if(ctx.measureText(t2).width>mw){if(line)lines.push(line);line=w;}else line=t2; if(lines.length>=4)break; }
    if(line&&lines.length<4) lines.push(line);
    lines.forEach((ln,i)=>ctx.fillText(ln, 96, H-290+i*(bs*1.5)));

  ctx.font="700 21px Arial"; ctx.fillStyle="#ffffff"; ctx.textAlign="left"; ctx.fillText("MCM · COMMUNITY MANAGER",46,H-25);
  ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(36,36); ctx.lineTo(36,88); ctx.moveTo(36,36); ctx.lineTo(88,36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-36,H-80); ctx.lineTo(W-36,H-128); ctx.moveTo(W-36,H-80); ctx.lineTo(W-88,H-80); ctx.stroke();
  await drawLogo(ctx, opt, W, H-70);
}

// TEMPLATE 3 — IA VISUAL PREMIUM
// ════════════════════════════════════════════════════════════════
async function drawTemplate3(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080; canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  const industry = (opt.industry||"").toLowerCase();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  const isFood=/gastro|restaurante|pizza|cafe|comida|food|panaderia|heladeria|granja|organica/i.test(industry+caption);
  const isHealth=/salud|fitness|deporte|medic|bienestar|gym/i.test(industry);
  const isRealEstate=/inmobil|construcci|arquitect|paisaj/i.test(industry);
  const isTech=/tecnolog|software|digital|web|app/i.test(industry);
  const isFashion=/moda|ropa|indument|fashion|belleza|estetica/i.test(industry);

  const splitX=W*0.58;

  ctx.fillStyle=isFood?"#080300":isHealth?"#020d06":isRealEstate?"#02040e":isTech?"#020408":isFashion?"#080305":"#07060f";
  ctx.fillRect(0,0,W,H);

  const panelGrad=ctx.createLinearGradient(splitX,0,W,H);
  const alpha=isFood?"0.18":isHealth?"0.18":isRealEstate?"0.15":isTech?"0.18":isFashion?"0.18":"0.18";
  panelGrad.addColorStop(0,`rgba(${r},${g},${b},${alpha})`); panelGrad.addColorStop(1,"rgba(0,0,0,0.05)");
  ctx.fillStyle=panelGrad; ctx.fillRect(splitX,0,W-splitX,H);

  ctx.beginPath(); ctx.moveTo(splitX-60,0); ctx.lineTo(splitX+60,H); ctx.lineTo(splitX+80,H); ctx.lineTo(splitX-40,0); ctx.closePath();
  const diagGrad=ctx.createLinearGradient(splitX-60,0,splitX+80,H);
  diagGrad.addColorStop(0,`rgba(${r},${g},${b},0.25)`); diagGrad.addColorStop(1,`rgba(${r},${g},${b},0.1)`);
  ctx.fillStyle=diagGrad; ctx.fill();

  const cx=W*0.79, cy=H*0.42;
  if(isFood){
    [260,200,140,80].forEach((rad,i)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle=`rgba(255,${150+i*20},${30+i*15},${0.12+i*0.07})`;ctx.lineWidth=i===3?3:1;ctx.stroke();});
    const gF=ctx.createRadialGradient(cx,cy,0,cx,cy,220);gF.addColorStop(0,"rgba(220,100,0,0.35)");gF.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gF;ctx.fillRect(splitX,0,W-splitX,H);
  } else if(isHealth){
    const gH=ctx.createRadialGradient(cx,cy,0,cx,cy,240);gH.addColorStop(0,"rgba(0,220,100,0.3)");gH.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gH;ctx.fillRect(splitX,0,W-splitX,H);
    ctx.strokeStyle="rgba(0,230,100,0.6)";ctx.lineWidth=3;ctx.beginPath();
    const hp=[splitX+40,cy+60,cx-100,cy+60,cx-60,cy+60,cx-40,cy-90,cx,cy+80,cx+30,cy+60,cx+90,cy+60,W-30,cy+60];
    for(let i=0;i<hp.length;i+=2)i===0?ctx.moveTo(hp[i],hp[i+1]):ctx.lineTo(hp[i],hp[i+1]);ctx.stroke();
  } else if(isRealEstate){
    const hx=cx-100,hy=cy-120,hw=200,hh=200;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`;ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(hx,hy+hh*0.4);ctx.lineTo(hx+hw/2,hy);ctx.lineTo(hx+hw,hy+hh*0.4);ctx.lineTo(hx+hw,hy+hh);ctx.lineTo(hx,hy+hh);ctx.lineTo(hx,hy+hh*0.4);
    ctx.moveTo(hx+hw*0.38,hy+hh);ctx.lineTo(hx+hw*0.38,hy+hh*0.65);ctx.lineTo(hx+hw*0.62,hy+hh*0.65);ctx.lineTo(hx+hw*0.62,hy+hh);ctx.stroke();
    const gR=ctx.createRadialGradient(cx,cy,0,cx,cy,240);gR.addColorStop(0,`rgba(${r},${g},${b},0.22)`);gR.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gR;ctx.fillRect(splitX,0,W-splitX,H);
  } else if(isTech){
    const np=[[cx,cy],[cx-80,cy-100],[cx+90,cy-80],[cx+70,cy+90],[cx-90,cy+70],[cx-30,cy-160],[cx+120,cy+20]];
    ctx.strokeStyle="rgba(0,200,255,0.15)";ctx.lineWidth=1;
    np.forEach(([x,y],i)=>{np.forEach(([x2,y2],j)=>{if(i<j&&Math.hypot(x-x2,y-y2)<200){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}});});
    np.forEach(([x,y],i)=>{const gn=ctx.createRadialGradient(x,y,0,x,y,i===0?36:21);gn.addColorStop(0,"rgba(0,200,255,0.5)");gn.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gn;ctx.fillRect(x-36,y-36,72,72);ctx.beginPath();ctx.arc(x,y,i===0?12:7,0,Math.PI*2);ctx.fillStyle=i===0?"rgba(0,220,255,0.9)":"rgba(0,200,255,0.6)";ctx.fill();});
    const gT=ctx.createRadialGradient(cx,cy,0,cx,cy,220);gT.addColorStop(0,"rgba(0,180,255,0.2)");gT.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gT;ctx.fillRect(splitX,0,W-splitX,H);
  } else if(isFashion){
    ctx.strokeStyle="rgba(255,100,150,0.06)";ctx.lineWidth=1;for(let i=-100;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H*0.5,H);ctx.stroke();}
    [220,170,110].forEach((rad,i)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle=`rgba(255,100,150,${0.2-i*0.04})`;ctx.lineWidth=1.5;ctx.stroke();});
    const gF2=ctx.createRadialGradient(cx,cy,0,cx,cy,230);gF2.addColorStop(0,"rgba(255,80,140,0.28)");gF2.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gF2;ctx.fillRect(splitX,0,W-splitX,H);
  } else {
    [240,180,120,60].forEach((rad,i)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle=`rgba(${r},${g},${b},${0.18-i*0.03})`;ctx.lineWidth=1.5;ctx.stroke();});
    const gG=ctx.createRadialGradient(cx,cy,0,cx,cy,260);gG.addColorStop(0,`rgba(${r},${g},${b},0.3)`);gG.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gG;ctx.fillRect(splitX,0,W-splitX,H);
  }

  for(let i=0;i<600;i++){const x=Math.random()*W,y=Math.random()*H;ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.025})`;ctx.fillRect(x,y,1.5,1.5);}

  const barGrad=ctx.createLinearGradient(0,0,0,H);barGrad.addColorStop(0,`rgba(${r},${g},${b},0.9)`);barGrad.addColorStop(1,`rgba(${r},${g},${b},0.3)`);
  ctx.fillStyle=barGrad;ctx.fillRect(0,0,6,H);

  if(text){
    const ff=opt.fontFamily||"Impact,'Arial Black',sans-serif";const fw=opt.fontWeight||"900";const fc=opt.fontColor||"#ffffff";
    const cs=Math.round((opt.fontSize||56)*1080/500);
    const words=text.split(" ");const lines=[];
    for(let i=0;i<words.length;i+=2)lines.push(words.slice(i,i+2).join(" "));
    const maxW=splitX-100;let size=cs;ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){ctx.font=`${fw} ${size}px ${ff}`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=maxW)break;size-=4;}
    const lH=size*0.96;const tH=lines.length*lH;
    const posX=(opt.textX!==undefined?Math.min(opt.textX*W,splitX-100):48);
    const posY=(opt.textY!==undefined?opt.textY*H:H/2-tH/2);
    ctx.shadowColor=`rgba(${r},${g},${b},0.6)`;ctx.shadowBlur=24;ctx.fillStyle=fc;ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln,posX,posY+size*0.85+i*lH));ctx.shadowBlur=0;
    ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(posX,posY+size*0.85+tH+12,140,4);
  }

  ctx.font="600 16px Arial";ctx.fillStyle=`rgba(${r},${g},${b},0.9)`;ctx.textAlign="left";ctx.fillText("● MCM",48,52);

  if(caption){
    const cs2=22;ctx.font=`300 ${cs2}px Arial,sans-serif`;ctx.fillStyle="rgba(255,255,255,0.55)";ctx.textAlign="left";
    const mw=splitX-80;const words=caption.split(" ");const lines=[];let line="";
    for(const w of words){const t2=line+(line?" ":"")+w;if(ctx.measureText(t2).width>mw){if(line)lines.push(line);line=w;}else line=t2;if(lines.length>=3)break;}
    if(line&&lines.length<3)lines.push(line);
    const capY=H-80-lines.length*(cs2*1.5);lines.forEach((ln,i)=>ctx.fillText(ln,48,capY+i*(cs2*1.5)));
  }

  if(!opt.showLogo||!opt.logoBase64){ctx.font="500 14px Arial";ctx.fillStyle="rgba(255,255,255,0.3)";ctx.textAlign="right";ctx.fillText("Imagen generada por IA",W-36,H-22);}
  await drawLogo(ctx,opt,W,H);
}

// ── SEGUNDO TEXTO ──
async function drawOverlayText2(canvas, opt) {
  if(!opt.overlayText2) return;
  const ctx=canvas.getContext("2d"); const W=canvas.width||1080,H=canvas.height||1080;
  const text=opt.overlayText2.replace(/[\*\_\#]/g,"").trim().toUpperCase(); if(!text) return;
  const ff=opt.fontFamily2||"Impact,'Arial Black',sans-serif"; const fw=opt.fontWeight2||"900"; const fc=opt.fontColor2||"#ffffff";
  const cs=Math.round((opt.fontSize2||40)*1080/500);
  const words=text.split(" ");const lines=[];
  for(let i=0;i<words.length;i+=2)lines.push(words.slice(i,i+2).join(" "));
  let size=cs;ctx.font=`${fw} ${size}px ${ff}`;
  while(size>24){ctx.font=`${fw} ${size}px ${ff}`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-100)break;size-=4;}
  const posX=(opt.text2X!==undefined?opt.text2X:0.05)*W;
  const posY=(opt.text2Y!==undefined?opt.text2Y:0.88)*H;
  const lH=size*0.95;
  if(opt.textBg2){
    const mw=Math.max(...lines.map(l=>ctx.measureText(l).width));
    ctx.fillStyle="rgba(0,0,0,0.55)"; rRect(ctx,posX-8,posY-size*0.85-6,mw+16,lines.length*lH+12,6); ctx.fill();
  }
  ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=14;ctx.fillStyle=fc;ctx.textAlign="left";
  lines.forEach((ln,i)=>ctx.fillText(ln,posX,posY+i*lH));
  ctx.shadowBlur=0;
}

// ── STICKERS ──
async function drawStickers(canvas, opt) {
  if(!opt.stickers||opt.stickers.length===0) return;
  const ctx=canvas.getContext("2d"); const W=canvas.width||1080,H=canvas.height||1080;
  for(const s of opt.stickers){
    const sz=Math.round((s.size||0.1)*W);
    ctx.font=`${sz}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=8;
    ctx.fillText(s.emoji,s.x*W,s.y*H);
    ctx.shadowBlur=0;ctx.textBaseline="alphabetic";
  }
}

// ── ROUTER ──
async function drawPost(canvas, opt) {
  if(opt.style===1) await drawTemplate1(canvas, opt);
  else if(opt.style===2) await drawTemplate2(canvas, opt);
  else await drawTemplate3(canvas, opt);
  await drawOverlayText2(canvas, opt);
  await drawStickers(canvas, opt);
}

function App() {
  const [appMode, setAppMode] = useState(() => {
    const s = getSession();
    if(s && s.uid && getUser(s.uid)) return "app";
    return "landing";
  });
  const [authMode, setAuthMode] = useState("login"); // login | register
  const [session, setSessionState] = useState(getSession);

  const [files, setFiles] = useState(store.get("files")||[]);
  const [posts, setPosts] = useState(store.get("posts")||[]);
  const [socials, setSocials] = useState(store.get("socials")||SOCIALS_DEFAULT);
  const [toast, showToast] = useToast();

  const currentUser = session ? getUser(session.uid) : null;

  const handleLogin = (uid, userData) => {
    const s = { uid, email: userData.email, name: userData.name, ts: Date.now() };
    setSession(s); setSessionState(s);

    setBrand(store.get("brand")||{});

    setPosts(store.get("posts")||[]);
    setSocials(store.get("socials")||SOCIALS_DEFAULT);
    setAppMode("app");
    setScreen("connect");

    clearSession(); setSessionState(null);
    setBrand({}); setFiles([]); setPosts([]); setSocials(SOCIALS_DEFAULT);

  const saveBrand=(b)=>{setBrand(b);store.set("brand",b);};

  const savePosts=(p)=>{
    setPosts(p);
    // Guardar sin imgSrc/slides para no explotar localStorage
    const stripped=p.map(post=>{
      const {imgSrc,slides,...rest}=post;
      return rest;

          <div style={{fontSize:11,color:"var(--muted)",marginBottom:4}}>Conectadas</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
            {socials.filter(s=>s.connected).map(s=><span key={s.id} title={s.name} style={{fontSize:16}}>{s.icon}</span>)}
            {!socials.some(s=>s.connected)&&<span style={{fontSize:11,color:"var(--muted)"}}>Ninguna</span>}
          </div>
          <div style={{fontSize:11,color:"var(--muted)",marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{currentUser?.email}</div>
          <button onClick={handleLogout} style={{background:"none",border:"1px solid var(--border)",color:"var(--muted)",borderRadius:7,padding:"5px 10px",fontSize:11,cursor:"pointer",width:"100%"}}>Cerrar sesión</button>
        </div>
      </div>
      <div className="main">
        {screen==="connect"  && <ConnectScreen  socials={socials} saveSocials={saveSocials} showToast={showToast} onNext={()=>setScreen("brand")} />}
        {screen==="brand"    && <BrandScreen    brand={brand} saveBrand={saveBrand} showToast={showToast} onNext={()=>setScreen("library")} />}
        {screen==="library"  && <LibraryScreen  files={files} saveFiles={saveFiles} showToast={showToast} onNext={()=>setScreen("generate")} />}
        {screen==="generate" && <GenerateScreen brand={brand} files={files} posts={posts} savePosts={savePosts} showToast={showToast} onNext={()=>setScreen("schedule")} plan={currentPlan} />}
        {screen==="schedule" && <ScheduleScreen socials={socials} showToast={showToast} />}
        {screen==="history"  && <HistoryScreen  socials={socials} showToast={showToast} />}
        {screen==="stats"    && <StatsScreen    socials={socials} showToast={showToast} />}
        {screen==="plan"     && <PlanScreen     currentPlan={currentPlan} user={currentUser} onUpgrade={(plan)=>{saveUser(session.uid,{plan});setSessionState({...session});showToast("Plan actualizado a "+PLANS[plan].name,"ok");setScreen("connect");}} showToast={showToast} />}
      </div>
      {toast&&<div className={"toast "+toast.type}>{toast.msg}</div>}
    </div>
  );
}

// AUTH SCREEN — Login + Registro
// ════════════════════════════════════════════════════════════════
function AuthScreen({mode, setMode, onSuccess, onBack, showToast}) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [name, setName] = useState("");
  const [company, setCompany] = useState("");
  const [loading, setLoading] = useState(false);

  const handleSubmit = async () => {
    if(!email||!password){showToast("Completá email y contraseña","err");return;}
    if(mode==="register"&&!name){showToast("Ingresá tu nombre","err");return;}
    if(password.length<6){showToast("La contraseña debe tener al menos 6 caracteres","err");return;}
    setLoading(true);
    await new Promise(r=>setTimeout(r,600)); // simula request

    const users = getAllUsers();
    const uid = btoa(email).replace(/[^a-z0-9]/gi,"").slice(0,16);

    if(mode==="login") {
      const user = Object.values(users).find(u=>u.email===email);
      if(!user||user.passwordHash!==hashPassword(password)){
        showToast("Email o contraseña incorrectos","err"); setLoading(false); return;
      }
      showToast("Bienvenido/a de nuevo, "+user.name+"!","ok");
      onSuccess(user.uid, user);
    } else {
      if(Object.values(users).find(u=>u.email===email)){
        showToast("Ya existe una cuenta con ese email","err"); setLoading(false); return;
      }
      const newUser = { uid, email, name, company, passwordHash: hashPassword(password), plan:"free", createdAt: Date.now() };
      saveUser(uid, newUser);
      showToast("Cuenta creada! Bienvenido/a, "+name+"!","ok");
      onSuccess(uid, newUser);
    }
    setLoading(false);
  };

  return (
    <div style={{minHeight:"100vh",background:"var(--bg)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",padding:20,position:"relative"}}>
      {/* Background glow */}
      <div style={{position:"fixed",top:"20%",left:"50%",transform:"translateX(-50%)",width:500,height:500,background:"radial-gradient(circle,rgba(109,40,217,.15) 0%,transparent 70%)",pointerEvents:"none"}} />

      <button onClick={onBack} style={{position:"absolute",top:24,left:24,background:"none",border:"none",color:"var(--muted)",cursor:"pointer",fontSize:13,display:"flex",alignItems:"center",gap:6}}>
        ← Volver
      </button>

      <div style={{width:"100%",maxWidth:420,position:"relative"}}>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:32}}>
          <svg viewBox="0 0 90 38" width="140" height="60" xmlns="http://www.w3.org/2000/svg" style={{display:"block",margin:"0 auto 12px"}}><defs><linearGradient id="lg4" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stopColor="#6d28d9"/><stop offset="100%" stopColor="#ec4899"/></linearGradient></defs><rect x="1" y="1" width="88" height="36" rx="8" fill="url(#lg4)"/><text x="45" y="28" fontFamily="'Playfair Display',Georgia,serif" fontSize="22" fontWeight="700" fill="white" textAnchor="middle" letterSpacing="3">MCM</text></svg>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:22}}>MCM</div>
          <div style={{fontSize:13,color:"var(--muted)",marginTop:4}}>
            {mode==="login"?"Iniciá sesión en tu cuenta":"Creá tu cuenta gratis"}
          </div>
        </div>

        {/* Card */}
        <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:20,padding:"32px"}}>
          <div style={{display:"flex",gap:4,background:"var(--surface2)",borderRadius:12,padding:4,marginBottom:24}}>
            {[["login","Iniciar sesión"],["register","Registrarse"]].map(([m,l])=>(
              <button key={m} onClick={()=>setMode(m)}
                style={{flex:1,padding:"9px",borderRadius:9,border:"none",cursor:"pointer",fontSize:13,fontWeight:600,
                  background:mode===m?"var(--surface)":"transparent",
                  color:mode===m?"var(--text)":"var(--muted)"}}>
                {l}
              </button>
            ))}
          </div>

          <div style={{display:"flex",flexDirection:"column",gap:14}}>
            {mode==="register"&&(
              <div>
                <span className="lbl">Nombre completo</span>
                <input value={name} onChange={e=>setName(e.target.value)} placeholder="Juan García" />
              </div>
            )}
            {mode==="register"&&(
              <div>
                <span className="lbl">Empresa (opcional)</span>
                <input value={company} onChange={e=>setCompany(e.target.value)} placeholder="La Josefa S.A." />
              </div>
            )}
            <div>
              <span className="lbl">Email</span>
              <input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="tu@email.com" />
            </div>
            <div>
              <span className="lbl">Contraseña</span>
              <input type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Mínimo 6 caracteres"
                onKeyDown={e=>e.key==="Enter"&&handleSubmit()} />
            </div>

            <button onClick={handleSubmit} disabled={loading} className="btn btn-primary" style={{width:"100%",padding:"13px",fontSize:15,borderRadius:12,marginTop:4}}>
              {loading?<><div className="spin"/>Procesando...</>:mode==="login"?"Iniciar sesión →":"Crear cuenta gratis →"}
            </button>
          </div>

          {mode==="register"&&(
            <div style={{marginTop:16,fontSize:11,color:"var(--muted)",textAlign:"center",lineHeight:1.6}}>
              Al registrarte aceptás los Términos de Servicio y la Política de Privacidad. Plan Free incluye 7 posts para probar.
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// PLAN SCREEN — Gestión de membresía + pago
// ════════════════════════════════════════════════════════════════
function PlanScreen({currentPlan, user, onUpgrade, showToast}) {
  const [billingARS, setBillingARS] = useState(false);
  const [paying, setPaying] = useState(null);
  const [usdRate, setUsdRate] = useState(null);

  useEffect(()=>{
    if(!billingARS||usdRate) return;
    fetch("https://api.exchangerate-api.com/v4/latest/USD")
      .then(r=>r.json()).then(d=>setUsdRate(d.rates?.ARS||1200))
      .catch(()=>fetch("https://dolarapi.com/v1/dolares/oficial")
        .then(r=>r.json()).then(d=>setUsdRate(d.venta||1200))
        .catch(()=>setUsdRate(1200)));
  },[billingARS]);

  const arsPrice=(usd)=>usdRate?Math.round(usd*usdRate).toLocaleString("es-AR"):"...";

  const handlePay = async (planId) => {
    if(planId===currentPlan.id){showToast("Ya estás en este plan","info");return;}
    if(planId==="free"){onUpgrade("free");return;}
    setPaying(planId);
    try {
      const plan = PLANS[planId];
      const amount = billingARS ? plan.price_ars : plan.price_usd;
      const currency = billingARS ? "ARS" : "USD";
      const r = await fetch("/api/payment?action=create", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ planId, amount, currency, email: user.email, name: user.name, uid: user.uid })
      });
      const d = await r.json();
      if(!d.success) throw new Error(d.error);
      if(d.initPoint) {
        window.open(d.initPoint, "_blank");
        showToast("Redirigiendo a "+( billingARS?"MercadoPago":"Stripe")+"...","info");
        // En producción el webhook actualiza el plan automáticamente
        // Por ahora simulamos la confirmación
        setTimeout(()=>{
          onUpgrade(planId);
          showToast("Plan "+PLANS[planId].name+" activado!","ok");
        }, 3000);
      }
    } catch(e) {
      // Si el endpoint no existe aún, simular el upgrade
      showToast("Procesando pago... (modo demo)","info");
      setTimeout(()=>{ onUpgrade(planId); showToast("Plan "+PLANS[planId].name+" activado!","ok"); },1500);
    }
    setPaying(null);
  };

  return (
    <div style={{padding:"32px 36px",maxWidth:920}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Planes y membresía</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>
          Plan actual: <strong style={{color:currentPlan.color}}>{currentPlan.name}</strong>
          {user?.createdAt&&<span style={{marginLeft:12,fontSize:12,color:"var(--muted)"}}>Cuenta desde {new Date(user.createdAt).toLocaleDateString("es-AR")}</span>}
        </p>
      </div>

      {/* Toggle */}
      <div style={{display:"flex",gap:4,background:"var(--surface2)",borderRadius:12,padding:4,width:"fit-content",marginBottom:28}}>
        {[["ARS","🇦🇷 Pagar en ARS (MercadoPago)"],["USD","🌎 Pagar en USD/USDT (Stripe)"]].map(([v,l])=>(
          <button key={v} onClick={()=>setBillingARS(v==="ARS")}
            style={{padding:"8px 16px",borderRadius:9,border:"none",cursor:"pointer",fontSize:12,fontWeight:600,
              background:(billingARS&&v==="ARS")||(!billingARS&&v==="USD")?"var(--surface)":"transparent",
              color:(billingARS&&v==="ARS")||(!billingARS&&v==="USD")?"var(--text)":"var(--muted)"}}>
            {l}
          </button>
        ))}
      </div>

      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(260px,1fr))",gap:16}}>
        {Object.values(PLANS).map((plan,i)=>{
          const isCurrent = plan.id===currentPlan.id;
          const isDowngrade = ["free","pro","premium"].indexOf(plan.id) < ["free","pro","premium"].indexOf(currentPlan.id);
          return (
            <div key={plan.id} style={{background:"var(--surface2)",border:`2px solid ${isCurrent?plan.color:"var(--border)"}`,borderRadius:16,padding:"24px",position:"relative"}}>
              {isCurrent&&<div style={{position:"absolute",top:-12,left:"50%",transform:"translateX(-50%)",background:plan.color,borderRadius:20,padding:"3px 12px",fontSize:11,fontWeight:700,color:"#fff",whiteSpace:"nowrap"}}>TU PLAN ACTUAL</div>}
              <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:20,color:plan.color,marginBottom:4}}>{plan.name}</div>
              <div style={{marginBottom:16}}>
                {plan.price_usd===0 ? (
                  <span style={{fontSize:32,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>Gratis</span>
                ) : billingARS ? (
                  <div>
                    <div style={{fontSize:11,color:"var(--muted)",marginBottom:2}}>USD {plan.price_usd} al tipo oficial</div>
                    <span style={{fontSize:28,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>ARS ${arsPrice(plan.price_usd)}</span>
                    <span style={{fontSize:12,color:"var(--muted)"}}>/mes</span>
                  </div>
                ) : (
                  <div><span style={{fontSize:32,fontWeight:800,fontFamily:"'Syne',sans-serif"}}>USD ${plan.price_usd}</span><span style={{fontSize:12,color:"var(--muted)"}}>/mes</span></div>
                )}
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:6,marginBottom:20}}>
                {PLAN_FEATURES[plan.id].map((f,j)=>(
                  <div key={j} style={{display:"flex",alignItems:"center",gap:7,fontSize:12,color:"var(--muted)"}}>
                    <span style={{color:plan.color,fontWeight:700}}>✓</span>{f}
                  </div>
                ))}
              </div>
              <button onClick={()=>handlePay(plan.id)} disabled={isCurrent||paying===plan.id} className="btn"
                style={{width:"100%",padding:"10px",fontSize:13,fontWeight:700,borderRadius:10,
                  background:isCurrent?"var(--surface)":i===0?"var(--surface2)":i===1?"linear-gradient(135deg,var(--accent),var(--accent2))":"linear-gradient(135deg,var(--pink),#f43f5e)",
                  color:isCurrent?"var(--muted)":"#fff",
                  border:isCurrent?"1px solid var(--border)":i===0?"1px solid var(--border)":"none",
                  opacity:isCurrent?0.7:1}}>
                {paying===plan.id?<><div className="spin"/>Procesando...</>:
                 isCurrent?"Plan actual":
                 isDowngrade?"Cambiar a "+plan.name:
                 plan.id==="free"?"Bajar a Free":"Contratar "+plan.name}
              </button>
              {!isCurrent&&!isDowngrade&&plan.price_ars>0&&(
                <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginTop:8}}>
                  {billingARS?"Pago via MercadoPago · Suscripción mensual":"Pago via Stripe · Suscripción mensual"}
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div style={{marginTop:24,background:"rgba(109,40,217,.08)",border:"1px solid rgba(168,85,247,.2)",borderRadius:12,padding:"14px 18px",fontSize:12,color:"var(--muted)",lineHeight:1.7}}>
        💳 <strong style={{color:"var(--text)"}}>Pagos seguros:</strong> Argentina vía MercadoPago (tarjeta, transferencia, Mercado Crédito). Internacional vía Stripe (VISA, Mastercard, USDT). Las suscripciones se renuevan automáticamente cada 30 días. Podés cancelar en cualquier momento.
      </div>
    </div>
  );
}

// CONNECT SCREEN
// ════════════════════════════════════════════════════════════════
function ConnectScreen({socials,saveSocials,showToast,onNext}) {
  const connect=(id)=>{
    if(id==="instagram"){saveSocials(socials.map(s=>s.id===id?{...s,connected:true,user:"@gonvinardell"}:s));showToast("Instagram conectado!","ok");}
    else showToast("Próximamente — "+socials.find(s=>s.id===id).name,"info");
  };
  const disconnect=(id)=>saveSocials(socials.map(s=>s.id===id?{...s,connected:false,user:""}:s));
  return (
    <div style={{padding:"32px 36px",maxWidth:600}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Conectá tus redes sociales</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>MCM publicará en las redes que conectes.</p>
      </div>
      {socials.map(s=>(
        <div key={s.id} className={"social-card"+(s.connected?" connected":"")}>
          <div className="social-icon" style={{background:s.color+"22"}}>{s.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
            <div style={{fontSize:12,color:s.connected?"var(--success)":"var(--muted)",marginTop:2}}>
              {s.connected?"● Conectado — "+s.user:"No conectado"}
            </div>
          </div>
          {s.connected
            ?<button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>disconnect(s.id)}>Desconectar</button>
            :<button className="btn btn-primary" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>connect(s.id)}>Conectar</button>}
        </div>
      ))}
      <div style={{marginTop:28}}>
        <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Mi Marca →</button>
      </div>
    </div>
  );
}

function renderTmplGrid(selected, upd) {
  const grid = document.getElementById('tmpl-grid');
  if (!grid) return;
  grid.innerHTML = '';
  const wrap = document.createElement('div');
  wrap.style.cssText = 'display:grid;grid-template-columns:repeat(3,1fr);gap:20px;';
  TEMPLATES_40.forEach(t => {
    const isSel = (selected||[]).includes(t.id);
    const card = document.createElement('div');
    card.style.cssText = `border-radius:14px;overflow:hidden;cursor:pointer;border:${isSel?'3px solid #7c3aed':'2px solid rgba(255,255,255,.1)'};background:#1a1a2e;display:flex;flex-direction:column;position:relative;`;
    card.innerHTML = `
      ${isSel?'<div style="position:absolute;top:8px;right:8px;background:#7c3aed;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;z-index:3;box-shadow:0 2px 8px rgba(0,0,0,.5)">✓</div>':''}
      <div style="height:200px;background:${t.bg};overflow:hidden;flex-shrink:0;display:flex;align-items:stretch;">
        <div style="width:100%;height:200px;">${t.html}</div>
      </div>
      <div style="padding:12px 14px 14px;background:#1e1e30;">
        <div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:4px">${t.icon} ${t.name}</div>
        <div style="font-size:11px;color:rgba(255,255,255,.5);line-height:1.5">${t.desc}</div>
      </div>`;
    card.onclick = () => {
      const curr = window._mcmSelected || [];
      const next = curr.includes(t.id) ? curr.filter(x=>x!==t.id) : [...curr, t.id];
      window._mcmSelected = next;
      upd("selectedTemplates", next);
      renderTmplGrid(next, upd);
    };
    wrap.appendChild(card);
  });
  grid.appendChild(wrap);
}

function LibraryScreen({files,saveFiles,showToast,onNext}) {
  const inputRef=useRef();
  const LOCAL_SERVER="http://localhost:3001";
  const [serverFiles,setServerFiles]=useState([]);
  const [serverOk,setServerOk]=useState(null);
  const [loadingServer,setLoadingServer]=useState(false);
  const [filtro,setFiltro]=useState("todos");
  const [busqueda,setBusqueda]=useState("");
  const [carpetaActiva,setCarpetaActiva]=useState("todas");
  const [seleccionados,setSeleccionados]=useState(new Set());
  useEffect(()=>{ checkServer(); },[]);
  const checkServer=async()=>{
    setServerOk(null);
    try{
      const res=await fetch(LOCAL_SERVER+"/list",{signal:AbortSignal.timeout(3000)});
      if(res.ok){setServerOk(true);cargarServerFiles();}else setServerOk(false);
    }catch{setServerOk(false);}
  };
  const cargarServerFiles=async()=>{
    setLoadingServer(true);
    try{
      const res=await fetch(LOCAL_SERVER+"/list");
      const data=await res.json();
      setServerFiles(data.map((f,i)=>({...f,id:"srv_"+i,tipo:f.name.match(/\.(mp4|mov|webm|avi)$/i)?"video":"imagen"})));
    }catch(e){showToast("Error servidor","err");}
    setLoadingServer(false);
  };
  const carpetas=["todas",...new Set(serverFiles.map(f=>f.carpeta||"raiz"))];
  const filtrados=serverFiles.filter(f=>(carpetaActiva==="todas"||(f.carpeta||"raiz")===carpetaActiva)&&(filtro==="todos"||f.tipo===filtro)&&f.name.toLowerCase().includes(busqueda.toLowerCase()));
  const toggleSel=(id)=>setSeleccionados(prev=>{const n=new Set(prev);n.has(id)?n.delete(id):n.add(id);return n;});
  const importar=async()=>{
    const toImport=serverFiles.filter(f=>seleccionados.has(f.id));
    showToast("Importando "+toImport.length+" archivo(s)...","info");
    const newFiles=[];
    for(const sf of toImport){
      try{
        const blob=await fetch(sf.url).then(r=>r.blob());
        const base64=await new Promise(res=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.readAsDataURL(blob);});
        newFiles.push({id:Date.now()+Math.random(),name:sf.name,type:sf.tipo==="video"?"video":"image",preview:base64,size:blob.size});
      }catch(e){}
    }
    saveFiles([...files,...newFiles]);
    setSeleccionados(new Set());
    showToast(newFiles.length+" archivo(s) importados ✓","ok");
  };
  const handleFiles=async(e)=>{
    const rawFiles=Array.from(e.target.files);
    const newFiles=await Promise.all(rawFiles.map(f=>new Promise(resolve=>{
      const reader=new FileReader();
      reader.onload=ev=>resolve({id:Date.now()+Math.random(),name:f.name,type:f.type.startsWith("video")?"video":"image",preview:ev.target.result,size:f.size});
      reader.readAsDataURL(f);
    })));
    saveFiles([...files,...newFiles]);
    showToast(newFiles.length+" archivo(s) agregado(s)","ok");
  };
  const remove=(id)=>saveFiles(files.filter(f=>f.id!==id));
  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div><h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Mis archivos</h2><p style={{color:"var(--muted)",fontSize:14}}>La IA elegirá de estos archivos para crear las publicaciones.</p></div>
        <button className="btn btn-primary" onClick={()=>inputRef.current.click()}>+ Subir</button>
      </div>
      <input ref={inputRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={handleFiles} />
      {files.length>0&&(<div style={{marginBottom:20}}><div style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginBottom:8}}>ARCHIVOS SUBIDOS ({files.length})</div><div className="file-grid">{files.map(f=>(<div key={f.id} className="file-thumb">{f.type==="video"?<video src={f.preview} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<img src={f.preview} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>}<button onClick={()=>remove(f.id)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:11}}>✕</button></div>))}</div></div>)}
      <div style={{borderTop:"1px solid var(--border)",paddingTop:18}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:10}}>
          <div><div style={{fontSize:12,color:"var(--muted)",fontWeight:600,marginBottom:4}}>📁 CARPETA LOCAL</div><div style={{display:"flex",alignItems:"center",gap:8}}><div style={{width:8,height:8,borderRadius:"50%",background:serverOk===true?"#22c55e":serverOk===false?"var(--error)":"#888"}}/><span style={{fontSize:12,color:"var(--muted)"}}>{serverOk===null?"Conectando...":serverOk?"Activo · "+serverFiles.length+" archivos":"No detectado"}</span></div></div>
          <div style={{display:"flex",gap:8}}>{seleccionados.size>0&&<button className="btn btn-primary" style={{fontSize:12,padding:"7px 14px"}} onClick={importar}>⬇ Importar {seleccionados.size}</button>}<button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={checkServer}>🔄</button></div>
        </div>
        {serverOk===false&&(<div style={{background:"rgba(244,63,94,.08)",border:"1px solid rgba(244,63,94,.25)",borderRadius:12,padding:"14px",marginBottom:12}}><div style={{fontWeight:700,fontSize:13,color:"var(--error)",marginBottom:6}}>Servidor no detectado</div><div style={{fontFamily:"monospace",fontSize:11,color:"var(--accent2)",background:"#0a0a0a",padding:"8px 12px",borderRadius:8,marginBottom:8}}>cd C:\mcm-server &amp;&amp; node server.js</div><button className="btn btn-ghost" style={{fontSize:11}} onClick={checkServer}>Reintentar</button></div>)}
        {serverOk===true&&(<>
          {carpetas.length>1&&(<div style={{display:"flex",gap:5,marginBottom:8,flexWrap:"wrap"}}>{carpetas.map(c=><button key={c} onClick={()=>setCarpetaActiva(c)} className="btn" style={{padding:"4px 10px",fontSize:11,background:carpetaActiva===c?"rgba(109,40,217,.25)":"var(--surface2)",border:"1px solid "+(carpetaActiva===c?"var(--accent2)":"var(--border)"),color:carpetaActiva===c?"var(--accent2)":"var(--muted)"}}>📁 {c==="todas"?"Todas":c}{c!=="todas"&&" ("+serverFiles.filter(f=>(f.carpeta||"raiz")===c).length+")"}</button>)}</div>)}
          <div style={{display:"flex",gap:6,marginBottom:10}}><input value={busqueda} onChange={e=>setBusqueda(e.target.value)} placeholder="Buscar..." style={{flex:1,fontSize:12,padding:"6px 10px"}}/>{["todos","imagen","video"].map(v=><button key={v} onClick={()=>setFiltro(v)} className="btn" style={{padding:"5px 9px",fontSize:11,background:filtro===v?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(filtro===v?"var(--accent2)":"var(--border)"),color:filtro===v?"var(--accent2)":"var(--muted)"}}>{v}</button>)}</div>
          {loadingServer?(<div style={{textAlign:"center",padding:16,color:"var(--muted)",fontSize:13}}>Cargando...</div>):filtrados.length===0?(<div style={{textAlign:"center",padding:16,color:"var(--muted)",fontSize:13}}>Sin archivos</div>):(<div className="file-grid">{filtrados.map(f=>{const isSel=seleccionados.has(f.id);return(<div key={f.id} className="file-thumb" style={{border:isSel?"2px solid var(--accent2)":"2px solid transparent",cursor:"pointer"}} onClick={()=>toggleSel(f.id)}>{f.tipo==="imagen"?<img src={f.url} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}} loading="lazy"/>:<div style={{width:"100%",height:"100%",background:"var(--surface2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:28}}>🎬</div>}{isSel&&<div style={{position:"absolute",top:4,right:4,background:"var(--accent)",borderRadius:"50%",width:20,height:20,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff"}}>✓</div>}<div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.7)",padding:"3px 5px",fontSize:9,color:"rgba(255,255,255,.7)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{f.name}</div></div>);})}</div>)}
          <div style={{marginTop:10,fontSize:11,color:"var(--muted)",display:"flex",alignItems:"center",gap:6}}><div style={{width:6,height:6,borderRadius:"50%",background:"#22c55e"}}/>{LOCAL_SERVER}</div>
        </>)}
      </div>
      {files.length>0&&<div style={{marginTop:20}}><button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Crear Publicaciones →</button></div>}
    </div>
  );
}
// ════════════════════════════════════════════════════════════════
// GENERATE SCREEN — 7 briefs individuales + carrusel
// ════════════════════════════════════════════════════════════════
function GenerateScreen({brand,files,posts,savePosts,showToast,onNext}) {
  const [generating,setGenerating]=useState(false);
  const [weekPosts,setWeekPosts]=useState([]);
  const [selections,setSelections]=useState({});
  const [editing,setEditing]=useState(null);
  const [progress,setProgress]=useState(0);

  // 7 briefs individuales
  const [briefs,setBriefs]=useState(store.get("weekBriefs")||Array(7).fill(""));
  // Cantidad de imágenes por post (carrusel)
  const [slideCounts,setSlideCounts]=useState(store.get("slideCounts")||Array(7).fill(1));

  const updBrief=(i,v)=>{ const b=[...briefs]; b[i]=v; setBriefs(b); store.set("weekBriefs",b); };
  const updSlideCount=(i,v)=>{ const s=[...slideCounts]; s[i]=v; setSlideCounts(s); store.set("slideCounts",s); };

  const PROMPTS=[
    "Genera un caption profesional sobre el trabajo o servicio principal que ofrece la empresa.",
    "Genera un caption con un testimonio o caso de éxito de un cliente de esta empresa.",
    "Genera un caption educativo con un tip o consejo útil relacionado al rubro.",
    "Genera un caption promocional con un llamado a la acción concreto.",
    "Genera un caption que muestre los valores humanos y el equipo de la empresa.",
    "Genera un caption con una pregunta abierta para generar interacción y comentarios.",
    "Genera un caption emotivo e inspirador que conecte con la audiencia de la marca.",
  ];

  const OVERLAY_CONTEXTS=[
    "El fondo muestra el producto o servicio principal. Tema: presentación del trabajo.",
    "El fondo muestra clientes satisfechos o resultado del trabajo. Tema: testimonio de éxito.",
    "El fondo muestra el proceso de trabajo o materiales. Tema: consejo educativo.",
    "El fondo muestra una oferta o producto destacado. Tema: promoción con urgencia.",
    "El fondo muestra el equipo o el lugar físico. Tema: valores y personas.",
    "El fondo muestra algo que invita a la reflexión. Tema: pregunta de engagement.",
    "El fondo muestra un momento emotivo o resultado especial. Tema: inspiración emocional.",
  ];

  // Construir contexto completo de la marca (incluye CM instructions, template refs, learned prefs)
  const buildBrandContext=(postIdx, tmplNote="")=>{
    const tone=brand.tone||"Profesional";
    const toneInstr=TONE_INSTRUCTIONS[tone]||"";
    const industryList=[brand.industry||"", ...(brand.subIndustries||[]), brand.customIndustry||""].filter(Boolean).join(", ");
    const cmNote=brand.cmInstructions?`\nInstrucciones especiales del cliente: ${brand.cmInstructions}`:"";
    const briefNote=briefs[postIdx]?`\nBrief específico para este post: ${briefs[postIdx]}`:"";
    const prefs=store.get("stylePrefs")||{};
    const learnedNote=prefs.lastUpdated?`\nAprendizaje previo: el cliente prefirió editar los posts con fuente ${prefs.fontFamily||"Impact"}, tamaño ${prefs.fontSize||56}px.`:"";
    const selectedTmplIds=brand.selectedTemplates||[];
    const tmplList=selectedTmplIds.length>0?`\nTemplates elegidos por el cliente para esta semana: ${TEMPLATES_40.filter(t=>selectedTmplIds.includes(t.id)).map(t=>t.name).join(", ")}.`:"";
    return `Empresa: ${brand.name}. Rubro: ${industryList}. Descripción: ${brand.description||""}. Cliente ideal: ${brand.target||""}. Tono: ${tone}. Instrucciones de tono: ${toneInstr}.${cmNote}${briefNote}${tmplList}${tmplNote}${learnedNote} Incluye 5-6 hashtags relevantes. Solo el caption, sin explicaciones.`;
  };

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    const imgs=files.filter(f=>f.type==="image");
    if(imgs.length===0){showToast("Agregá al menos una imagen a tus archivos","err");return;}
    setGenerating(true); setWeekPosts([]); setSelections({}); setProgress(0);

    try{
      const allPosts=[];
      const prefs=store.get("stylePrefs")||{};
      // Templates seleccionados por el usuario en Mi Marca
      const selectedTmplIds = brand.selectedTemplates||[];
      const selectedTmpls = selectedTmplIds.length>0
        ? TEMPLATES_40.filter(t=>selectedTmplIds.includes(t.id))
        : TEMPLATES_40;

      for(let i=0;i<7;i++){
        setProgress(i+1);
        const postBrief=briefs[i]||""; // ← MOVIDO AQUÍ, antes de usarlo

        // Elegir template para este post (rotar entre los seleccionados)
        const tmplForPost = selectedTmpls[i % selectedTmpls.length];

        // ── SELECCIÓN DE IMAGEN POR BRIEF ──
        let imgSrc = imgs[i % imgs.length].preview;
        let imgMatchWarning = false;

        if(postBrief && imgs.length > 0) {
          try {
            setProgressMsg(`Post ${i+1}: analizando imágenes para "${postBrief}"...`);

            // Convertir cada imagen a base64 con descripción de su contenido
            const imgData = await Promise.all(imgs.map(async (img, idx) => {
              let b64 = "", mtype = "image/jpeg";
              const src = img.preview || img.url || "";

              if(src.startsWith("data:")) {
                const comma = src.indexOf(",");
                b64 = src.slice(comma+1);
                mtype = src.slice(5, src.indexOf(";")) || "image/jpeg";
              } else if(src.startsWith("blob:") || src.startsWith("http")) {
                try {
                  const blob = await fetch(src).then(r=>r.blob());
                  b64 = await new Promise(res=>{
                    const fr = new FileReader();
                    fr.onload = e => res(e.target.result.split(",")[1]||"");
                    fr.onerror = () => res("");
                    fr.readAsDataURL(blob);
                  });
                  mtype = blob.type || "image/jpeg";
                } catch(e){ b64=""; }
              }
              // Incluir nombre del archivo como pista para la IA
              const fileName = img.name || img.fileName || `imagen_${idx+1}`;
              return { idx, b64, mtype, fileName, valid: b64.length > 100 };
            }));

            const validImgs = imgData.filter(d=>d.valid);

            if(validImgs.length === 0) {
              imgMatchWarning = true;
            } else {
              const r = await fetch("/api/select-image", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  brief: postBrief,
                  images: validImgs.map(d=>({idx:d.idx, b64:d.b64, mtype:d.mtype, fileName:d.fileName}))
                })
              });
              const d = await r.json();
              if(d.success && typeof d.chosenIdx === "number" && d.chosenIdx >= 0 && d.chosenIdx < imgs.length) {
                imgSrc = imgs[d.chosenIdx].preview;
                setProgressMsg(`Post ${i+1}: ✓ imagen elegida para "${postBrief}"`);
              } else {
                imgMatchWarning = true;
              }
            }
          } catch(e) {
            imgSrc = imgs[i % imgs.length].preview;
          }
        } else {
          setProgressMsg(`Post ${i+1}: generando contenido...`);
        }
        // Template elegido para este post
        const slideCount=slideCounts[i]||1;
        const tmplNote = tmplForPost ? `\nTemplate de diseño para este post: "${tmplForPost.name}" — ${tmplForPost.desc}. Adaptá el caption a este formato visual.` : "";
        const ctx=buildBrandContext(i, tmplNote);

        // Prompts overlay — guiados por brief si existe
        const overlayBase=`Sos un director creativo de publicidad. Empresa: ${brand.name} (${brand.industry||""}).`;
        const briefNote=postBrief?` El cliente pidió específicamente un post sobre: "${postBrief}".`:"";
        const themeNote=` El tema del post es: ${OVERLAY_CONTEXTS[i]}`;

        const overlayPrompt1 = postBrief
          ? `${overlayBase}${briefNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras para superponer sobre la imagen. La frase DEBE hablar sobre "${postBrief}". Sin hashtags, sin emojis, sin puntuación. Solo las palabras.`
          : `${overlayBase}${themeNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras para superponer sobre una foto. Poético e impactante. Sin hashtags, sin emojis, sin puntuación.`;

        const overlayPrompt2 = postBrief
          ? `${overlayBase}${briefNote} Escribí una frase de EXACTAMENTE 3 a 5 palabras para diseño gráfico bold sobre "${postBrief}". Sin hashtags, sin emojis, sin puntuación.`
          : `${overlayBase}${themeNote} Escribí una frase de EXACTAMENTE 3 a 5 palabras para diseño gráfico. Titular de impacto. Sin hashtags, sin emojis.`;

        const overlayPrompt3 = postBrief
          ? `${overlayBase}${briefNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras que capture la ESENCIA de "${postBrief}". Sin hashtags, sin emojis, sin puntuación.`
          : `${overlayBase}${themeNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras, creativo y conceptual. Sin hashtags, sin emojis.`;

        const cap3Prompt=postBrief
          ? `Sos un community manager experto. El cliente pidió un post sobre: "${postBrief}". Template elegido: ${tmplForPost?.name||""}. Redactá un caption para Instagram que hable exactamente de ese tema para ${brand.name} (${brand.industry||""}). ${ctx}`
          : PROMPTS[i]+" Versión orientada a ventas y conversión. "+ctx;

        const [cap1,cap2,cap3,raw1,raw2,raw3]=await Promise.all([
          generateText(PROMPTS[i]+ctx),
          generateText(PROMPTS[i]+" Versión más cercana y coloquial. "+ctx),
          generateText(cap3Prompt),
          generateText(overlayPrompt1),
          generateText(overlayPrompt2),
          generateText(overlayPrompt3),
        ]);

        const cleanOverlay=(raw)=>raw.trim().replace(/['"\*\_\#\.\,\!\?]/g,"").replace(/\s+/g," ").slice(0,40);
        const overlayText1=cleanOverlay(raw1);
        const overlayText2=cleanOverlay(raw2);
        const overlayText3=cleanOverlay(raw3);

        // Para carrusel: generar múltiples slides (misma opción pero diferentes imágenes)
        const makeCarouselSlides=(count,baseImgSrc)=>{
          const slides=[];
          for(let s=0;s<count;s++){
            slides.push(imgs[(i+s)%imgs.length].preview);
          }
          return slides;
        };

        const baseOpt={
          fontSize: prefs.fontSize||56,
          fontColor: prefs.fontColor||"#ffffff",
          fontFamily: prefs.fontFamily||"Impact",
          fontWeight: prefs.fontWeight||"900",
          textBg: false,
          showLogo: true,
          logoBase64: brand.logoBase64||null,
          brandColor: brand.color||"#6d28d9",
          industry: [brand.industry||"",...(brand.subIndustries||[]),brand.customIndustry||""].filter(Boolean).join("|"),
          logoX: prefs.logoX, logoY: prefs.logoY, logoSize: prefs.logoSize||0.15,
          stickers: [],
        };

        // ── PERSONALIZAR TEMPLATE CON DATOS REALES ──
        // Genera el HTML del template personalizado usando la IA
        let personalizedHtml = tmplForPost?.html || "";
        let personalizedBg = tmplForPost?.bg || "#1a1a2e";

        if(tmplForPost) {
          try {
            setProgressMsg(`Post ${i+1}: personalizando template "${tmplForPost.name}"...`);
            const tmplPersonPrompt = `Sos un diseñador gráfico experto. Tenés este template HTML de diseño:

${tmplForPost.html}

El cliente es: ${brand.name} — ${brand.industry||brand.description||""}
Brief del post: ${postBrief || PROMPTS[i] || tmplForPost.desc}
Tono: ${brand.tone||"Profesional"}
Instrucciones especiales: ${brand.cmInstructions||"ninguna"}

Personalizá ÚNICAMENTE los textos del template reemplazando los textos genéricos por contenido real del cliente. 
Por ejemplo si dice "El éxito no es un destino" → ponés una frase real sobre ${brand.name}.
Si dice "5 TIPS ESENCIALES" → ponés tips reales sobre el rubro.
Si dice "Tu Marca" → ponés "${brand.name}".
Si dice "87%" → ponés una estadística real del rubro.

Mantené EXACTAMENTE la misma estructura HTML, colores, estilos y layout. Solo cambiá los textos.
Respondé ÚNICAMENTE con el HTML modificado, sin explicaciones ni markdown.`;

            const tmplResp = await callAI(tmplPersonPrompt);
            if(tmplResp && tmplResp.length > 50 && tmplResp.includes("<")) {
              personalizedHtml = tmplResp;
            }
          } catch(e) {
            // fallback al html original
          }
        }

        const options=[
          {id:0,style:1,styleName:"Revista",caption:cap1,overlayText:overlayText1,imgSrc,...baseOpt,
           imgMatchWarning, slideCount, slides: slideCount>1?makeCarouselSlides(slideCount,imgSrc):null},
          {id:1,style:2,styleName:"Diseño",caption:cap2,overlayText:overlayText2,imgSrc:null,...baseOpt,
           slideCount, slides: null},
          {id:2,style:3,styleName:tmplForPost?.name||"Template",caption:cap3,overlayText:overlayText3,imgSrc:null,...baseOpt,
           templateHtml:personalizedHtml, templateBg:personalizedBg, templateName:tmplForPost?.name||"Template",
           slideCount, slides: null},
        ];
        allPosts.push({postIdx:i,label:"Post "+(i+1),theme:PROMPTS[i].slice(8,40)+"...",options,slideCount});
        setWeekPosts([...allPosts]);
      }
      // Guardar posts SIN imgSrc (las imágenes quedan en files, se reconstruyen al renderizar)
      const postsToSave = allPosts.map((p,i)=>{
        const opt = {...p.options[0], postIdx:i, id:Date.now()+i};
        delete opt.imgSrc; // no guardar base64 en localStorage
        delete opt.slides; // no guardar slides en localStorage
        return opt;
      });
      savePosts(postsToSave);
      showToast("7 publicaciones generadas!","ok");
    }catch(e){showToast("Error: "+e.message,"err");}
    finally{setGenerating(false);setProgress(0);setProgressMsg("");}
  };

  const [progressMsg, setProgressMsg] = useState("");
  const allSelected=weekPosts.length===7&&Object.keys(selections).length===7;

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Crear publicaciones de la semana</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>7 posts con 3 opciones cada uno. Configurá cada uno individualmente.</p>
        </div>
        <button className="btn btn-primary" onClick={generate} disabled={generating}>
          {generating?<><div className="spin"/>Generando {progress}/7...</>:"✦ Generar semana completa"}
        </button>
      </div>

      {/* 7 briefs individuales */}
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"16px",marginBottom:24}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Brief por publicación</div>
        <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Opcional — si querés guiar la IA en algún post específico</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
          {Array(7).fill(0).map((_,i)=>(
            <div key={i} style={{background:"var(--surface2)",borderRadius:10,padding:"10px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:12,fontWeight:600,color:"var(--accent2)"}}>Post {i+1}</span>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:11,color:"var(--muted)"}}>Slides:</span>
                  <div style={{display:"flex",gap:3}}>
                    {[1,2,3,4,5].map(n=>(
                      <button key={n} onClick={()=>updSlideCount(i,n)}
                        style={{width:22,height:22,borderRadius:5,border:"1px solid "+(slideCounts[i]===n?"var(--accent2)":"var(--border)"),background:slideCounts[i]===n?"rgba(109,40,217,.3)":"transparent",color:slideCounts[i]===n?"var(--accent2)":"var(--muted)",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {n}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <input value={briefs[i]} onChange={e=>updBrief(i,e.target.value)}
                placeholder={`Brief del post ${i+1}...`}
                style={{fontSize:12,padding:"8px 10px"}} />
            </div>
          ))}
        </div>
      </div>

      {generating&&(
        <div style={{padding:"20px",marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13,color:"var(--muted)"}}>
            <span>{progressMsg||"Generando publicaciones..."}</span>
            <span style={{color:"var(--accent2)"}}>{progress}/7</span>
          </div>
          <div style={{height:6,background:"var(--surface2)",borderRadius:6,overflow:"hidden"}}>
            <div style={{height:"100%",width:(progress/7*100)+"%",background:"linear-gradient(90deg,var(--accent),var(--accent2))",borderRadius:6,transition:"width .4s"}} />
          </div>
        </div>
      )}

      {weekPosts.map((post,pi)=>(
        <div key={pi} style={{marginBottom:32}} className="fade-in">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:28,height:28,borderRadius:8,background:"linear-gradient(135deg,var(--accent),var(--accent2))",display:"grid",placeItems:"center",fontSize:13,fontWeight:800,flexShrink:0}}>{pi+1}</div>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>Post {pi+1}
                {post.slideCount>1&&<span style={{marginLeft:8,fontSize:11,background:"rgba(236,72,153,.15)",border:"1px solid rgba(236,72,153,.3)",color:"var(--pink)",padding:"2px 8px",borderRadius:20}}>🖼 Carrusel {post.slideCount} imágenes</span>}
              </div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{post.theme}</div>
            </div>
            {selections[pi]!==undefined&&<div style={{marginLeft:"auto",fontSize:12,color:"var(--success)",background:"rgba(34,211,238,.1)",border:"1px solid rgba(34,211,238,.2)",borderRadius:20,padding:"3px 10px"}}>✓ Elegida</div>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
            {post.options.map((opt,oi)=>(
              <WeekPostCard key={oi} opt={opt} postIdx={pi} optIdx={oi}
                selected={selections[pi]===oi}
                onSelect={()=>selectOption(pi,oi)}
                onEdit={()=>setEditing({postIdx:pi,optIdx:oi})}
              />
            ))}
          </div>
        </div>
      ))}

      {weekPosts.length===7&&(
        <div className="fade-in" style={{marginTop:8}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 18px",marginBottom:14,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:22}}>📋</div>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>{Object.keys(selections).length}/7 posts seleccionados</div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>Elegí una opción por cada post para continuar</div>
            </div>
          </div>
          {allSelected&&<button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>📅 Programar en el calendario →</button>}
        </div>
      )}

      {editing&&ReactDOM.createPortal(
        <EditorModal
          opt={weekPosts[editing.postIdx]?.options[editing.optIdx]}
          brand={brand}
          onClose={()=>setEditing(null)}
          onSave={(updated)=>{
            // Aprender de las ediciones
            const original=weekPosts[editing.postIdx]?.options[editing.optIdx];
            if(original) learnFromEdit(original, updated);
            const newWeek=[...weekPosts];
            newWeek[editing.postIdx].options[editing.optIdx]=updated;
            setWeekPosts(newWeek);
            setEditing(null);
            showToast("Cambios guardados y aprendidos ✓","ok");
          }}
          showToast={showToast}
        />,
        document.body
      )}
    </div>
  );
}
