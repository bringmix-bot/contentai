<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080810;--surface:#0e0e1c;--surface2:#14142a;--surface3:#1a1a34;
  --border:#1f1f40;--border2:#2a2a50;
  --accent:#5b21b6;--accent2:#8b5cf6;--accent3:#a78bfa;
  --pink:#be185d;--pink2:#ec4899;
  --cyan:#0891b2;--cyan2:#22d3ee;
  --text:#f0f0ff;--muted:#7070a0;--muted2:#9090c0;
  --success:#10b981;--error:#f43f5e;--warn:#f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
input,textarea,select,button{font-family:'DM Sans',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:10px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s,box-shadow .2s}
input:focus,textarea:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(139,92,246,.1)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:none}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;border:none;transition:all .18s;font-family:'DM Sans',sans-serif;letter-spacing:.2px}
.btn-primary{background:linear-gradient(135deg,var(--accent) 0%,var(--accent2) 100%);color:#fff;box-shadow:0 2px 12px rgba(139,92,246,.25)}
.btn-primary:hover{opacity:.92;transform:translateY(-1px);box-shadow:0 4px 20px rgba(139,92,246,.35)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted2)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(139,92,246,.06)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}
.btn-sm{padding:7px 14px;font-size:12px;border-radius:8px}
.btn-xs{padding:5px 10px;font-size:11px;border-radius:7px}
.chip{display:inline-flex;align-items:center;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted2);transition:all .15s}
.chip:hover{border-color:var(--accent2);color:var(--accent2)}
.chip.on{background:rgba(139,92,246,.15);border-color:var(--accent2);color:var(--accent2)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}

.app{display:flex;height:100vh;overflow:hidden}

.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;max-width:360px;animation:slideUp .3s ease;backdrop-filter:blur(8px)}

.slider-wrap{display:flex;align-items:center;gap:10px}
.slider-wrap input[type=range]{flex:1;-webkit-appearance:none;height:4px;border-radius:4px;background:var(--surface2);border:none;padding:0;outline:none;cursor:pointer}
.slider-wrap input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--accent2);cursor:pointer;transition:transform .15s}
.slider-wrap input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
.slider-val{font-size:12px;color:var(--accent2);font-weight:600;min-width:36px;text-align:right}
.color-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.color-swatch{width:28px;height:28px;border-radius:7px;cursor:pointer;border:2px solid transparent;transition:all .15s;flex-shrink:0}
.color-swatch.on{border-color:#fff;transform:scale(1.15)}
.font-btn{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:9px;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted2);transition:all .15s;font-size:11px}
.font-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.font-btn.on{background:rgba(139,92,246,.15);border-color:var(--accent2);color:var(--accent2)}
.filter-btn{padding:6px 12px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--muted2);transition:all .15s;text-align:center}
.filter-btn:hover{border-color:var(--accent2);color:var(--accent2)}
.filter-btn.on{background:rgba(139,92,246,.15);border-color:var(--accent2);color:var(--accent2)}
.week-row-header{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.week-num{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:13px;font-weight:800;flex-shrink:0;color:#fff}
.week-theme{font-size:12px;color:var(--muted);text-transform:capitalize}
.sel-badge{margin-left:auto;font-size:11px;color:var(--success);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);border-radius:20px;padding:3px 10px}
.cal-day{min-height:68px;border-radius:9px;padding:6px;cursor:pointer;transition:all .15s;display:flex;flex-direction:column;gap:2px;border:1px solid var(--border)}
.cal-day:hover{border-color:var(--accent2)}
.cal-day.today{border-color:var(--accent2)}
.cal-day.has-post{background:rgba(139,92,246,.1);border-color:rgba(139,92,246,.3)}
.cal-day.past{opacity:.3;cursor:default}
.cal-day.empty{background:transparent;border-color:transparent;cursor:default}

<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

const S = {

function useToast() {

  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null), 3800); };
  return [t, show];
}

const SOCIALS_DEF = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
  {id:"linkedin",name:"LinkedIn",icon:"💼",color:"#0A66C2",connected:false,user:""},

const CAPTION_PROMPTS = [
  { theme:"presentación", prompt:"Escribe un caption impactante para presentar el producto o servicio estrella de esta empresa. Empezá con una frase gancho. Tono: {tone}." },
  { theme:"testimonio", prompt:"Crea un caption que simule el testimonio de un cliente satisfecho, en primera persona. Que sea auténtico y específico. Tono: {tone}." },

  { theme:"promocional", prompt:"Escribe un caption con una oferta o llamado a la acción urgente. Que genere FOMO (miedo a perderse algo). Tono: {tone}." },
  { theme:"historia de marca", prompt:"Cuenta en 3-4 oraciones la historia o el propósito detrás de esta empresa. Que conecte emocionalmente. Tono: {tone}." },
  { theme:"pregunta de engagement", prompt:"Escribe un caption que termine con una pregunta provocadora para generar comentarios. Que sea entretenido. Tono: {tone}." },
  { theme:"inspiracional", prompt:"Crea un caption motivacional e inspirador relacionado al rubro y a los valores de la empresa. Tono: {tone}." },
];

const OVERLAY_WORDS = [
  "un eslogan ultra-creativo de exactamente 4 palabras (ni más ni menos). Sin puntuación al final.",
  "3 palabras impactantes que resuman el tema del post. Sin signos de puntuación.",
  "una frase corta de 5 palabras que llame la atención visualmente. Solo texto, sin emojis.",
  "un titular de 4 palabras como si fuera una revista de lujo. Mayúsculas opcionales.",
  "una micro-frase de 3-4 palabras que conecte con el cliente ideal. Sin puntuación.",
  "exactamente 4 palabras que evoquen el beneficio principal del producto/servicio.",
  "3 palabras poderosas relacionadas al rubro que impacten visualmente.",
];

async function callClaude(prompt) {
  try {
    const r = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body: JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:600,
        messages:[{role:"user",content:prompt}]
      })
    });
    const d = await r.json();
    return d.content?.[0]?.text?.trim() || "";
  } catch(e) {
    return "Error al conectar con la IA: " + e.message;
  }
}

/* ─── CANVAS HELPERS ─── */
function hex2rgb(hex) {
  try { const h=hex.replace("#",""); return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)}; }
  catch { return {r:91,g:33,b:182}; }
}

async function loadImg(src) {
  return new Promise(res => {
    if(!src) return res(null);
    const img = new Image();
    img.crossOrigin="anonymous";
    img.onload = ()=>res(img);
    img.onerror = ()=>res(null);
    img.src = src;
  });
}

function coverDraw(ctx, img, x, y, w, h) {
  if(!img) return;
  const s=Math.max(w/img.width, h/img.height);
  const dw=img.width*s, dh=img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

function rrect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();
}

function wrapText(ctx, text, maxW, maxLines) {
  const words=text.split(" ");
  const lines=[]; let cur="";
  for(const w of words) {
    const test=cur+(cur?" ":"")+w;
    if(ctx.measureText(test).width>maxW) {
      if(cur) lines.push(cur);
      cur=w;
      if(lines.length>=maxLines-1) { lines.push(words.slice(words.indexOf(w)).join(" ")); return lines; }
    } else cur=test;
  }
  if(cur) lines.push(cur);
  return lines;
}

function applyFilter(ctx, W, H, filter) {
  if(!filter||filter==="none") return;
  const img = ctx.getImageData(0,0,W,H);
  const d=img.data;
  if(filter==="warm") { for(let i=0;i<d.length;i+=4){d[i]=Math.min(255,d[i]+20);d[i+2]=Math.max(0,d[i+2]-15);} }
  if(filter==="cool") { for(let i=0;i<d.length;i+=4){d[i]=Math.max(0,d[i]-15);d[i+2]=Math.min(255,d[i+2]+20);} }
  if(filter==="bw")   { for(let i=0;i<d.length;i+=4){const g=(d[i]+d[i+1]+d[i+2])/3;d[i]=d[i+1]=d[i+2]=g;} }
  if(filter==="fade") { for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]*.8+50);d[i+1]=Math.round(d[i+1]*.8+50);d[i+2]=Math.round(d[i+2]*.8+50);} }
  if(filter==="dark") { for(let i=0;i<d.length;i+=4){d[i]=Math.round(d[i]*.6);d[i+1]=Math.round(d[i+1]*.6);d[i+2]=Math.round(d[i+2]*.6);} }
  ctx.putImageData(img,0,0);
}

function drawOverlayText(ctx, W, H, opt) {
  const text=(opt.overlayText||"").replace(/[\*\_\#\n]/g," ").trim().toUpperCase();
  if(!text) return;
  const x=Math.round((opt.textX||0.08)*W);
  const y=Math.round((opt.textY||0.78)*H);
  const family=opt.fontFamily||"Impact,'Arial Black',sans-serif";
  const weight=opt.fontWeight||"900";
  const color=opt.fontColor||"#ffffff";
  const shadow=opt.textShadow!==false;
  const bg=opt.textBg||false;

  let size=opt.fontSize||80;
  ctx.font=`${weight} ${size}px ${family}`;
  const maxW=W*0.82;
  while(size>22&&ctx.measureText(text).width>maxW){size-=3;ctx.font=`${weight} ${size}px ${family}`;}

  const lines=wrapText(ctx,text,maxW,4);
  const lineH=size*1.12;
  const totalH=lines.length*lineH;
  const startY=y-totalH/2+size*.8;

  if(bg){
    ctx.fillStyle="rgba(0,0,0,.6)";
    lines.forEach((_,i)=>{
      const w=ctx.measureText(lines[i]).width;
      rrect(ctx, x-10, startY+i*lineH-size*.85-6, w+20, size+14, 6);
      ctx.fill();
    });
  }
  if(shadow){ctx.shadowColor="rgba(0,0,0,.65)";ctx.shadowBlur=18;ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;}
  ctx.fillStyle=color;
  ctx.textAlign="left";
  lines.forEach((ln,i)=>ctx.fillText(ln, x, startY+i*lineH));
  ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
}

/* ═══════════════════════════════════════════════
   TEMPLATE 1 — MAGAZINE COVER
   Foto full-bleed, franja superior editorial
═══════════════════════════════════════════════ */
async function tpl1(canvas, opt) {
  const ctx=canvas.getContext("2d");
  const W=1080,H=1080;
  canvas.width=W;canvas.height=H;
  const {r,g,b}=hex2rgb(opt.brandColor||"#5b21b6");
  const img=opt.imgSrc?await loadImg(opt.imgSrc):null;

  // Photo
  if(img){coverDraw(ctx,img,0,0,W,H);}
  else{
    const gr=ctx.createLinearGradient(0,0,W,H);
    gr.addColorStop(0,`rgb(${r},${g},${b})`);gr.addColorStop(1,"#000");
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
  if(img) applyFilter(ctx,W,H,opt.imgFilter);

  // Top editorial bar
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.fillRect(0,0,W,8);

  const topGr=ctx.createLinearGradient(0,0,0,H*.55);
  topGr.addColorStop(0,"rgba(0,0,0,.82)");
  topGr.addColorStop(.65,"rgba(0,0,0,.42)");
  topGr.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=topGr;ctx.fillRect(0,0,W,H*.55);

  const botGr=ctx.createLinearGradient(0,H*.72,0,H);
  botGr.addColorStop(0,"rgba(0,0,0,0)");
  botGr.addColorStop(1,"rgba(0,0,0,.55)");
  ctx.fillStyle=botGr;ctx.fillRect(0,H*.72,W,H*.28);

  // Magazine header
  ctx.font="700 13px 'DM Sans',sans-serif";

/* ═══════════════════════════════════════════════
   TEMPLATE 2 — SPLIT DESIGN
   Mitad color sólido | mitad foto
═══════════════════════════════════════════════ */
async function tpl2(canvas, opt) {
  const ctx=canvas.getContext("2d");
  const W=1080,H=1080;
  canvas.width=W;canvas.height=H;
  const {r,g,b}=hex2rgb(opt.brandColor||"#5b21b6");

  // Left half — solid color
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.fillRect(0,0,W*.5,H);

  // Right half — photo
  ctx.save();
  ctx.rect(W*.5,0,W*.5,H);
  ctx.clip();
  if(img){coverDraw(ctx,img,W*.5,0,W*.5,H);}
  else{
    const gr=ctx.createLinearGradient(W*.5,0,W,H);
    gr.addColorStop(0,`rgba(${r*.3},${g*.3},${b*.3},1)`);gr.addColorStop(1,"#000");
    ctx.fillStyle=gr;ctx.fillRect(W*.5,0,W*.5,H);
  }
  if(img) applyFilter(ctx,W,H,opt.imgFilter);
  ctx.restore();

  // Diagonal separator
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.beginPath();ctx.moveTo(W*.5-40,0);ctx.lineTo(W*.5+20,0);ctx.lineTo(W*.5-20,H);ctx.lineTo(W*.5-80,H);ctx.closePath();ctx.fill();

  // Geometric dots
  for(let i=0;i<5;i++){
    ctx.beginPath();ctx.arc(W*.25, H*.15+i*55, 4, 0,Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${.15+i*.03})`;ctx.fill();
  }

  // Text on left side
  const text=(opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  if(text){
    const maxW=W*.42;
    let size=100;
    ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
    while(size>28&&ctx.measureText(text).width>maxW) {size-=4;ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;}
    const lines=wrapText(ctx,text,maxW,5);
    const lineH=size*1.05;
    const startY=H*.38;
    ctx.fillStyle="#ffffff";
    ctx.textAlign="left";
    ctx.shadowColor="rgba(0,0,0,.3)";ctx.shadowBlur=8;
    lines.forEach((ln,i)=>ctx.fillText(ln, 44, startY+i*lineH));
    ctx.shadowBlur=0;

    // Underline
    ctx.fillStyle="rgba(255,255,255,.4)";
    ctx.fillRect(44, startY+lines.length*lineH+10, 100, 3);
  }

  // Brand bottom
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.fillRect(0,H-56,W*.5,56);
  ctx.font="700 14px 'DM Sans',sans-serif";
  ctx.fillStyle="#ffffff";
  ctx.textAlign="left";
  ctx.letterSpacing="2px";
  ctx.fillText("MCM", 44, H-20);
  ctx.letterSpacing="0px";
}

/* ═══════════════════════════════════════════════
   TEMPLATE 3 — POLAROID / VINTAGE
   Marco polaroid, efecto analógico
═══════════════════════════════════════════════ */
async function tpl3(canvas, opt) {
  const ctx=canvas.getContext("2d");
  const W=1080,H=1080;
  canvas.width=W;canvas.height=H;
  const {r,g,b}=hex2rgb(opt.brandColor||"#5b21b6");
  const img=opt.imgSrc?await loadImg(opt.imgSrc):null;

  // Background — beige/cream
  ctx.fillStyle="#f5f0e8";
  ctx.fillRect(0,0,W,H);

  // Grain texture
  for(let i=0;i<3000;i++){
    const x=Math.random()*W,y=Math.random()*H;
    ctx.fillStyle=`rgba(0,0,0,${Math.random()*.04})`;
    ctx.fillRect(x,y,1.5,1.5);
  }

  // Polaroid frame — slightly rotated for authenticity
  ctx.save();
  ctx.translate(W*.5,H*.48);
  ctx.rotate(-0.025);
  const pw=800,ph=860;
  // Shadow
  ctx.shadowColor="rgba(0,0,0,.22)";ctx.shadowBlur=40;ctx.shadowOffsetY=15;
  ctx.fillStyle="#fefefe";ctx.fillRect(-pw/2,-ph/2,pw,ph);ctx.shadowBlur=0;

  // Photo area
  const photoMargin=36;
  ctx.save();
  ctx.rect(-pw/2+photoMargin,-ph/2+photoMargin,pw-photoMargin*2,680);ctx.clip();
  if(img){ctx.drawImage(img,-pw/2+photoMargin,-ph/2+photoMargin,pw-photoMargin*2,680);}
  else{
    const gr=ctx.createLinearGradient(-pw/2,-ph/2,pw/2,0);
    gr.addColorStop(0,`rgb(${r},${g},${b})`);gr.addColorStop(1,"#000");
    ctx.fillStyle=gr;ctx.fillRect(-pw/2+photoMargin,-ph/2+photoMargin,pw-photoMargin*2,680);
  }
  // Vignette on photo
  const vig=ctx.createRadialGradient(0,-ph/2+350,100,0,-ph/2+350,pw/2);
  vig.addColorStop(0,"transparent");vig.addColorStop(1,"rgba(0,0,0,.35)");
  ctx.fillStyle=vig;ctx.fillRect(-pw/2+photoMargin,-ph/2+photoMargin,pw-photoMargin*2,680);
  ctx.restore();

  if(img) { ctx.save(); ctx.translate(W*.5-W*.5, H*.48-H*.48); applyFilter(ctx,W,H,opt.imgFilter); ctx.restore(); }

  // Handwritten text area
  const text=(opt.overlayText||"").replace(/[\*\_\#]/g,"").trim();
  ctx.font="italic 700 38px Georgia,serif";
  ctx.fillStyle="#2a2020";
  ctx.textAlign="center";
  ctx.fillText(text.slice(0,40), 0, ph/2-90);

  // Brand stamp
  ctx.font="600 18px 'DM Sans',sans-serif";
  ctx.fillStyle=`rgba(${r},${g},${b},.7)`;
  ctx.letterSpacing="3px";
  ctx.fillText("MCM", 0, ph/2-48);
  ctx.letterSpacing="0px";

  ctx.restore();

  // Color accent stripes — top
  [0,8,16].forEach((offset,i)=>{
    ctx.fillStyle=`rgba(${r},${g},${b},${.7-i*.2})`;
    ctx.fillRect(0, offset, W, 5);
  });
}

/* ═══════════════════════════════════════════════
   TEMPLATE 5 — NEON / DARK EDITORIAL

═══════════════════════════════════════════════ */
async function tpl5(canvas, opt) {
  const ctx=canvas.getContext("2d");

  ctx.fillStyle="#030309";ctx.fillRect(0,0,W,H);

    ctx.fillStyle="rgba(3,3,9,.78)";ctx.fillRect(0,0,W,H);
  }
  if(img) applyFilter(ctx,W,H,opt.imgFilter);

  // Neon glow circles
  [[W*.2,H*.3,300,.3],[W*.8,H*.7,200,.2]].forEach(([cx,cy,rad,alpha])=>{
    const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
    glow.addColorStop(0,`rgba(${r},${g},${b},${alpha})`);
    glow.addColorStop(.5,`rgba(${r},${g},${b},${alpha*.3})`);
    glow.addColorStop(1,"transparent");
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
  });

  // Thin grid lines
  ctx.strokeStyle=`rgba(${r},${g},${b},.06)`;ctx.lineWidth=.5;
  for(let x=0;x<W;x+=80){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=0;y<H;y+=80){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Neon accent lines
  [[0,H*.35,W*.35,H*.35],[W*.65,H*.65,W,H*.65]].forEach(([x1,y1,x2,y2])=>{
    ctx.strokeStyle=`rgba(${r},${g},${b},.7)`;ctx.lineWidth=2;
    ctx.shadowColor=`rgb(${r},${g},${b})`;ctx.shadowBlur=12;
    ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
    ctx.shadowBlur=0;
  });

  // Corner brackets
  [[40,40],[W-40,40],[40,H-40],[W-40,H-40]].forEach(([cx,cy],i)=>{
    const sx=i%2===0?1:-1, sy=i<2?1:-1;
    ctx.strokeStyle=`rgba(${r},${g},${b},.5)`;ctx.lineWidth=2;
    ctx.shadowColor=`rgb(${r},${g},${b})`;ctx.shadowBlur=6;
    ctx.beginPath();
    ctx.moveTo(cx+sx*40,cy);ctx.lineTo(cx,cy);ctx.lineTo(cx,cy+sy*40);
    ctx.stroke();ctx.shadowBlur=0;
  });

  // Main text with neon glow
  if(text){
    const words=text.split(" ");
    const lines=[];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size=140;
    ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
    while(size>32&&Math.max(...lines.map(l=>ctx.measureText(l).width))>W-120){size-=4;ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;}
    const lineH=size*1;
    const totalH=lines.length*lineH;
    const startY=H/2-totalH/2+size*.85;
    ctx.textAlign="center";
    // Neon glow layers
    [28,14,6].forEach(blur=>{
      ctx.shadowColor=`rgb(${r},${g},${b})`;ctx.shadowBlur=blur*2;
      ctx.fillStyle=`rgba(${r},${g},${b},.4)`;
      lines.forEach((ln,i)=>ctx.fillText(ln, W/2, startY+i*lineH));
    });
    ctx.shadowColor=`rgb(${r},${g},${b})`;ctx.shadowBlur=8;
    ctx.fillStyle="#ffffff";
    lines.forEach((ln,i)=>ctx.fillText(ln, W/2, startY+i*lineH));
    ctx.shadowBlur=0;
  }

  // MCM watermark
  ctx.font="600 14px 'DM Sans',sans-serif";
  ctx.fillStyle=`rgba(${r},${g},${b},.7)`;
  ctx.textAlign="center";
  ctx.letterSpacing="4px";
  ctx.fillText("MCM", W/2, H-36);
  ctx.letterSpacing="0px";
}

    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    // House line art
    ctx.strokeStyle=`rgba(${ar},${ag},${ab},.4)`;ctx.lineWidth=2;
    const hx=W*.55,hy=H*.22,hw=W*.32,hh=H*.38;
    ctx.beginPath();
    ctx.moveTo(hx,hy+hh*.38);ctx.lineTo(hx+hw/2,hy);ctx.lineTo(hx+hw,hy+hh*.38);
    ctx.lineTo(hx+hw,hy+hh);ctx.lineTo(hx,hy+hh);ctx.lineTo(hx,hy+hh*.38);
    ctx.moveTo(hx+hw*.38,hy+hh);ctx.lineTo(hx+hw*.38,hy+hh*.62);ctx.lineTo(hx+hw*.62,hy+hh*.62);ctx.lineTo(hx+hw*.62,hy+hh);
    ctx.moveTo(hx+hw*.15,hy+hh*.42);ctx.rect(hx+hw*.15,hy+hh*.42,hw*.22,hw*.2);
    ctx.stroke();

  } else if(isTech){
    ctx.fillStyle="#02040a";ctx.fillRect(0,0,W,H);
    const nodes=[[W*.28,H*.28],[W*.62,H*.22],[W*.78,H*.5],[W*.55,H*.68],[W*.22,H*.58],[W*.72,H*.75],[W*.4,H*.8]];
    ctx.strokeStyle="rgba(0,200,255,.1)";ctx.lineWidth=1;
    nodes.forEach(([x,y],i)=>{
      nodes.forEach(([x2,y2],j)=>{
        if(i<j&&Math.random()>.4){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
      });
    });
    nodes.forEach(([x,y])=>{
      ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);
      ctx.fillStyle="rgba(0,200,255,.5)";ctx.fill();
      const g=ctx.createRadialGradient(x,y,0,x,y,40);
      g.addColorStop(0,"rgba(0,200,255,.15)");g.addColorStop(1,"transparent");
      ctx.fillStyle=g;ctx.fillRect(x-40,y-40,80,80);
    });
    const glow=ctx.createRadialGradient(W*.5,H*.45,0,W*.5,H*.45,W*.5);
    glow.addColorStop(0,"rgba(0,180,255,.12)");glow.addColorStop(1,"transparent");
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  } else if(isFash){
    ctx.fillStyle="#08050a";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,150,200,.05)";ctx.lineWidth=1;
    for(let i=-H;i<W+H;i+=50){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
    [200,140,80].forEach((rad,i)=>{
      ctx.beginPath();ctx.arc(W*.68,H*.38,rad,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,100,160,${.18-i*.04})`;ctx.lineWidth=1;ctx.stroke();
    });
    const glow=ctx.createRadialGradient(W*.68,H*.38,0,W*.68,H*.38,W*.45);
    glow.addColorStop(0,"rgba(255,80,150,.2)");glow.addColorStop(1,"transparent");
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  } else if(isEdu){
    ctx.fillStyle="#03050e";ctx.fillRect(0,0,W,H);
    ctx.strokeStyle="rgba(255,200,50,.06)";ctx.lineWidth=1;
    for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    // Book spine graphics
    [[W*.62,H*.2,80,280],[W*.72,H*.18,80,320],[W*.82,H*.22,80,260]].forEach(([bx,by,bw,bh])=>{
      ctx.fillStyle="rgba(255,180,30,.06)";
      rrect(ctx,bx,by,bw,bh,4);ctx.fill();
      ctx.strokeStyle="rgba(255,180,30,.15)";ctx.lineWidth=1;
      rrect(ctx,bx,by,bw,bh,4);ctx.stroke();
    });
    const glow=ctx.createRadialGradient(W*.72,H*.4,0,W*.72,H*.4,W*.4);
    glow.addColorStop(0,"rgba(255,180,30,.18)");glow.addColorStop(1,"transparent");
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);

  } else {
    // Generic premium
    ctx.fillStyle="#06060e";ctx.fillRect(0,0,W,H);
    const glow=ctx.createRadialGradient(W*.65,H*.38,0,W*.65,H*.38,W*.55);
    glow.addColorStop(0,`rgba(${r},${g},${b},.28)`);glow.addColorStop(1,"transparent");
    ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
    ctx.strokeStyle=`rgba(${r},${g},${b},.07)`;ctx.lineWidth=1;
    for(let y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    [300,220,140].forEach((rad,i)=>{
      ctx.beginPath();ctx.arc(W*.65,H*.38,rad,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${r},${g},${b},${.12-i*.03})`;ctx.lineWidth=1.5;ctx.stroke();
    });
  }

  // Dark bottom gradient for text
  const botGr=ctx.createLinearGradient(0,H*.5,0,H);
  botGr.addColorStop(0,"transparent");botGr.addColorStop(1,"rgba(0,0,0,.9)");
  ctx.fillStyle=botGr;ctx.fillRect(0,H*.5,W,H*.5);

  // Brand mark
  ctx.font="600 15px 'DM Sans',sans-serif";
  ctx.fillStyle=`rgba(${r},${g},${b},.9)`;
  ctx.textAlign="left";ctx.letterSpacing="2px";
  ctx.fillText("MCM", 52, 56);ctx.letterSpacing="0px";

  // Main text
  if(text){
    const words=text.split(" ");
    const lines=[];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size=128;
    ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
    while(size>36&&Math.max(...lines.map(l=>ctx.measureText(l).width))>W-120){size-=4;ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;}
    const lineH=size*.96;
    const totalH=lines.length*lineH;
    const startY=H-100-totalH+size*.85;
    ctx.shadowColor=`rgba(${r},${g},${b},.65)`;ctx.shadowBlur=24;
    ctx.fillStyle="#ffffff";ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln, 52, startY+i*lineH));
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(52, startY+totalH+10, 120, 4);
  }

  ctx.font="400 13px 'DM Sans',sans-serif";
  ctx.fillStyle="rgba(255,255,255,.25)";
  ctx.textAlign="right";ctx.letterSpacing="1px";
  ctx.fillText("IA GENERADO", W-44, H-30);ctx.letterSpacing="0px";
}

const TEMPLATES=[
  {id:1,name:"Magazine",fn:tpl1,needsImg:true},
  {id:2,name:"Split",fn:tpl2,needsImg:true},
  {id:3,name:"Polaroid",fn:tpl3,needsImg:true},

];

async function drawPost(canvas, opt) {
  const tpl=TEMPLATES.find(t=>t.id===(opt.style||1))||TEMPLATES[0];

}

function GenerateScreen({brand,files,posts,savePosts,showToast,onNext}) {
  const [generating,setGenerating]=useState(false);
  const [weekPosts,setWeekPosts]=useState([]);
  const [selections,setSelections]=useState({});
  const [editing,setEditing]=useState(null);
  const [brief,setBrief]=useState("");
  const [progress,setProgress]=useState(0);

  const imgFiles=files.filter(f=>f.type==="image");

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    if(imgFiles.length===0){showToast("Agregá al menos una imagen","err");return;}
    setGenerating(true);setWeekPosts([]);setSelections({});setProgress(0);

    const base=`Empresa: "${brand.name}". Rubro: "${brand.industry||"general"}". Descripción: "${brand.description||""}". Cliente ideal: "${brand.target||""}". Tono: ${brand.tone||"profesional"}.${brief?" Contexto de la semana: "+brief+".":""} Incluí 4-6 hashtags relevantes al final. Respondé SOLO con el caption, sin explicaciones ni comillas externas.`;

    try {
      const allPosts=[];
      for(let i=0;i<7;i++){
        setProgress(i+1);
        const p=CAPTION_PROMPTS[i];
        const prompt1=`${p.prompt.replace("{tone}",brand.tone||"profesional")} ${base}`;
        const prompt2=`${p.prompt.replace("{tone}","más cercano y conversacional")} Versión directa y coloquial. ${base}`;
        const prompt3=`${p.prompt.replace("{tone}","orientado a ventas y conversión")} Versión con urgencia y llamado a la acción. ${base}`;
        const overlayPrompt=`Sos un director creativo de una agencia de publicidad premium. El post trata sobre: "${p.theme}" para la empresa "${brand.name}" (${brand.industry||""}). Escribí ${OVERLAY_WORDS[i]} Respondé ÚNICAMENTE con esas palabras, nada más.`;

        const [cap1,cap2,cap3,overlayRaw]=await Promise.all([
          callClaude(prompt1),callClaude(prompt2),callClaude(prompt3),callClaude(overlayPrompt)
        ]);

        const overlay=overlayRaw.trim().replace(/["'\*\_\#\n]/g,"").replace(/\s+/g," ").slice(0,50);
        const imgSrc=imgFiles[i%imgFiles.length].preview;
        const img2=imgFiles[(i+1)%imgFiles.length]?.preview||imgSrc;
        const bc=brand.color||"#5b21b6";

        const options=[
          {id:0,style:1,styleName:"Magazine",caption:cap1,overlayText:overlay,imgSrc,imgFilter:"none",brandColor:bc,fontFamily:"Impact,'Arial Black',sans-serif",fontWeight:"900",fontColor:"#ffffff",fontSize:80,textX:.08,textY:.78,textBg:false,textShadow:true,brand:brand.name,industry:brand.industry||""},
          {id:1,style:4,styleName:"Tipográfico",caption:cap2,overlayText:overlay,imgSrc:null,imgFilter:"none",brandColor:bc,fontFamily:"Impact,'Arial Black',sans-serif",fontWeight:"900",fontColor:"#ffffff",fontSize:80,textX:.08,textY:.78,textBg:false,textShadow:true,brand:brand.name,industry:brand.industry||"",caption:cap2},
          {id:2,style:7,styleName:"AI Scene",caption:cap3,overlayText:overlay,imgSrc:null,imgFilter:"none",brandColor:bc,fontFamily:"Impact,'Arial Black',sans-serif",fontWeight:"900",fontColor:"#ffffff",fontSize:80,textX:.08,textY:.78,textBg:false,textShadow:true,brand:brand.name,industry:brand.industry||""},
        ];
        allPosts.push({i,theme:p.theme,options});
        setWeekPosts([...allPosts]);
      }
      const def=allPosts.map((p,idx)=>({...p.options[0],postIdx:idx,id:Date.now()+idx}));
      savePosts(def);
      showToast("7 publicaciones generadas ✓","ok");
    } catch(e){showToast("Error: "+e.message,"err");}
    finally{setGenerating(false);setProgress(0);}
  };

  const pickOption=(pi,oi)=>setSelections(p=>({...p,[pi]:oi}));
  const allDone=weekPosts.length===7&&Object.keys(selections).length===7;

  return (
    <div style={{padding:"36px 40px"}} className="fade-in">
      <div className="section-header">
        <div><div className="page-title">Crear semana completa</div><div className="page-sub">7 posts · 3 opciones de diseño por post · elegís una</div></div>
        <button className="btn btn-primary" onClick={generate} disabled={generating} style={{padding:"11px 22px"}}>
          {generating?<><div className="spin"/>Generando {progress}/7...</>:"✦ Generar ahora"}
        </button>
      </div>

      <div style={{marginBottom:20}}>
        <span className="lbl">Brief de la semana (opcional)</span>
        <input value={brief} onChange={e=>setBrief(e.target.value)} placeholder="Ej: Lanzamiento nuevo producto, promo de verano, semana de descuentos..." />
      </div>

      {generating&&(
        <div className="card" style={{marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:10}}>
            <span style={{color:"var(--muted2)"}}>Generando publicaciones con IA...</span>
            <span style={{color:"var(--accent2)",fontWeight:600}}>{progress}/7</span>
          </div>
          <div className="progress-bar"><div className="progress-fill" style={{width:(progress/7*100)+"%"}} /></div>
          {weekPosts.length>0&&<div style={{fontSize:12,color:"var(--muted)",marginTop:10}}>Mostrando resultados en tiempo real ↓</div>}
        </div>
      )}

      {weekPosts.map((post,pi)=>(
        <div key={pi} style={{marginBottom:40}} className="fade-in">
          <div className="week-row-header">
            <div className="week-num">{pi+1}</div>
            <div>
              <div style={{fontWeight:700,fontSize:14,textTransform:"capitalize"}}>{post.theme}</div>
              <div className="week-theme">Post {pi+1} de 7</div>
            </div>
            {selections[pi]!==undefined&&<div className="sel-badge">✓ Opción {selections[pi]+1}</div>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
            {post.options.map((opt,oi)=>(
              <PostCard key={oi} opt={opt} selected={selections[pi]===oi}
                onSelect={()=>pickOption(pi,oi)}
                onEdit={()=>setEditing({pi,oi,opt})}
              />
            ))}
          </div>
        </div>
      ))}

      {weekPosts.length===7&&(
        <div className="fade-in">
          <div className="card" style={{marginBottom:16,display:"flex",alignItems:"center",gap:14}}>
            <div style={{fontSize:28}}>📋</div>
            <div>
              <div style={{fontWeight:600}}>{Object.keys(selections).length}/7 posts seleccionados</div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:3}}>Elegí una opción por cada post para continuar al calendario.</div>
            </div>
          </div>
          {allDone&&<button className="btn btn-primary" style={{width:"100%",padding:"14px"}} onClick={onNext}>📅 Programar en el calendario →</button>}
        </div>
      )}

      {editing&&(
        <EditorModal
          opt={editing.opt}
          brand={brand}
          onClose={()=>setEditing(null)}
          onSave={updated=>{
            const nw=[...weekPosts];
            nw[editing.pi].options[editing.oi]=updated;
            setWeekPosts(nw);
            setEditing(null);
            showToast("Post actualizado","ok");
          }}
          showToast={showToast}
        />
      )}
    </div>
  );
}

function PostCard({opt,selected,onSelect,onEdit}) {
  const canvasRef=useRef();
  useEffect(()=>{if(canvasRef.current) drawPost(canvasRef.current,opt);},[opt]);
  return (
    <div className={"post-card"+(selected?" selected":"")} style={{position:"relative"}}>
      <div className="post-canvas-wrap" onClick={onSelect}>
        <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}} />
        <div className="template-badge">{opt.styleName}</div>
        {selected&&<div className="check-badge">✓</div>}
      </div>
      <div className="post-caption-preview">{opt.caption}</div>
      <div style={{padding:"0 10px 10px",display:"flex",gap:6}}>
        <button onClick={onSelect} className={"btn btn-sm"+(selected?" btn-primary":" btn-ghost")} style={{flex:1}}>
          {selected?"✓ Elegida":"Elegir"}
        </button>
        <button onClick={onEdit} className="btn btn-sm btn-ghost" style={{padding:"7px 10px"}}>✏️</button>
      </div>
    </div>
  );
}

/* ─── EDITOR MODAL ─── */
function EditorModal({opt,brand,onClose,onSave,showToast}) {
  const canvasRef=useRef();
  const prevRef=useRef();
  const [form,setForm]=useState({...opt});
  const [publishing,setPublishing]=useState(false);
  const [pubMsg,setPubMsg]=useState(null);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{if(canvasRef.current) drawPost(canvasRef.current,form);},[form]);

  const handleClick=e=>{
    if(!prevRef.current) return;
    const rect=prevRef.current.getBoundingClientRect();
    upd("textX",(e.clientX-rect.left)/rect.width);
    upd("textY",(e.clientY-rect.top)/rect.height);
  };

  const download=()=>{
    const cv=canvasRef.current;if(!cv) return;
    const a=document.createElement("a");a.href=cv.toDataURL("image/png");a.download="MCM_post.png";a.click();
  };

  const publishIG=async()=>{
    setPublishing(true);setPubMsg(null);
    await new Promise(r=>setTimeout(r,1800));
    setPubMsg({ok:true,text:"Publicado en @gonvinardell!"});
    showToast("Publicado exitosamente!","ok");
    setPublishing(false);
  };

  const FONTS=[
    {id:"Impact,'Arial Black',sans-serif",label:"Impact"},
    {id:"Georgia,serif",label:"Serif"},
    {id:"'DM Sans',sans-serif",label:"DM Sans"},
    {id:"'Courier New',monospace",label:"Mono"},
    {id:"Verdana,sans-serif",label:"Verdana"},
    {id:"'Playfair Display',Georgia,serif",label:"Playfair"},
  ];
  const FILTERS=[
    {id:"none",label:"Original"},
    {id:"warm",label:"Cálido"},
    {id:"cool",label:"Frío"},
    {id:"bw",label:"B&W"},
    {id:"fade",label:"Faded"},
    {id:"dark",label:"Dark"},
  ];

  return (
    <div className="editor-overlay">
      <div className="editor-box slide-up">
        {/* Preview */}
        <div style={{flex:"0 0 300px"}}>
          <div className="lbl" style={{marginBottom:8}}>Vista previa · Click para mover texto</div>
          <div ref={prevRef} onClick={handleClick} style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",cursor:"crosshair",position:"relative"}}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",pointerEvents:"none"}} />
            <div style={{position:"absolute",bottom:6,left:0,right:0,textAlign:"center",fontSize:10,color:"rgba(255,255,255,.3)"}}>click para reposicionar texto</div>
          </div>
          <div style={{fontSize:11,color:"var(--muted)",textAlign:"center",marginTop:6}}>1080 × 1080 px</div>

          {/* Template selector */}
          <div style={{marginTop:14}}>
            <div className="lbl">Plantilla</div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:5}}>
              {TEMPLATES.map(t=>(
                <button key={t.id} onClick={()=>upd("style",t.id)} className={"filter-btn"+(form.style===t.id?" on":"")} style={{fontSize:10}}>{t.name}</button>
              ))}
            </div>
          </div>
        </div>

        {/* Controls */}
        <div style={{flex:1,minWidth:260,display:"flex",flexDirection:"column",gap:14,overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontSize:16,fontWeight:700}}>Editor avanzado</h3>
            <button onClick={onClose} style={{background:"var(--surface2)",border:"1px solid var(--border)",color:"var(--muted)",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:13}}>✕</button>
          </div>

          <div className="editor-section">
            <span className="lbl">Texto sobre la imagen</span>
            <input value={form.overlayText||""} onChange={e=>upd("overlayText",e.target.value)} placeholder="Máximo 5-6 palabras..." />
          </div>

          <div className="editor-section">
            <span className="lbl">Caption del post</span>
            <textarea value={form.caption||""} onChange={e=>upd("caption",e.target.value)} rows={4} />
          </div>

          <div className="divider" style={{margin:"4px 0"}} />

          <div className="editor-section">
            <span className="lbl">Tipografía</span>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
              {FONTS.map(f=>(
                <button key={f.id} onClick={()=>upd("fontFamily",f.id)} className={"font-btn"+(form.fontFamily===f.id?" on":"")}>
                  <span style={{fontFamily:f.id,fontWeight:"bold",fontSize:17}}>Aa</span>
                  <span>{f.label}</span>
                </button>
              ))}
            </div>
          </div>

          <div className="editor-section">
            <span className="lbl">Peso de fuente</span>
            <div style={{display:"flex",gap:6}}>
              {[["300","Light"],["400","Normal"],["700","Bold"],["900","Black"]].map(([v,l])=>(
                <button key={v} onClick={()=>upd("fontWeight",v)} className={"filter-btn"+(form.fontWeight===v?" on":"")} style={{flex:1,fontFamily:form.fontFamily,fontWeight:v}}>{l}</button>
              ))}
            </div>
          </div>

          <div style={{display:"flex",gap:14"}}>
            <div className="editor-section" style={{flex:1}}>
              <span className="lbl">Tamaño ({form.fontSize||80}px)</span>
              <div className="slider-wrap">
                <input type="range" min={20} max={140} step={2} value={form.fontSize||80} onChange={e=>upd("fontSize",+e.target.value)} />
                <span className="slider-val">{form.fontSize||80}</span>
              </div>
            </div>
            <div className="editor-section">
              <span className="lbl">Color texto</span>
              <input type="color" value={form.fontColor||"#ffffff"} onChange={e=>upd("fontColor",e.target.value)} style={{width:46,height:36,borderRadius:9,border:"1px solid var(--border)",cursor:"pointer",padding:3,background:"var(--surface2)"}} />
            </div>
          </div>

          <div className="editor-section">
            <span className="lbl">Opacidad del texto ({Math.round((form.textOpacity||1)*100)}%)</span>
            <div className="slider-wrap">
              <input type="range" min={20} max={100} step={5} value={Math.round((form.textOpacity||1)*100)} onChange={e=>upd("textOpacity",e.target.value/100)} />
              <span className="slider-val">{Math.round((form.textOpacity||1)*100)}%</span>
            </div>
          </div>

          <div className="editor-section">
            <span className="lbl">Filtro de imagen</span>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:5}}>
              {FILTERS.map(f=>(
                <button key={f.id} onClick={()=>upd("imgFilter",f.id)} className={"filter-btn"+(form.imgFilter===f.id?" on":"")}>{f.label}</button>
              ))}
            </div>
          </div>

          <div className="editor-section">
            <span className="lbl">Opciones de texto</span>
            <div style={{display:"flex",gap:6}}>
              <button onClick={()=>upd("textBg",!form.textBg)} className={"filter-btn"+(form.textBg?" on":"")} style={{flex:1}}>
                {form.textBg?"✓ Fondo oscuro":"○ Fondo oscuro"}
              </button>
              <button onClick={()=>upd("textShadow",!form.textShadow)} className={"filter-btn"+(form.textShadow!==false?" on":"")} style={{flex:1}}>
                {form.textShadow!==false?"✓ Sombra":"○ Sombra"}
              </button>
            </div>
          </div>

          {pubMsg&&(
            <div style={{background:pubMsg.ok?"rgba(16,185,129,.1)":"rgba(244,63,94,.1)",border:"1px solid "+(pubMsg.ok?"rgba(16,185,129,.35)":"rgba(244,63,94,.35)"),color:pubMsg.ok?"#34d399":"#fb7185",padding:"10px 14px",borderRadius:10,fontSize:13,fontWeight:500}}>
              {pubMsg.text}
            </div>
          )}

          <div style={{display:"flex",gap:8,marginTop:"auto",paddingTop:8}}>
            <button onClick={download} className="btn btn-ghost" style={{flex:1,fontSize:12}}>⬇ Descargar</button>
            <button onClick={()=>onSave(form)} className="btn btn-ghost" style={{flex:1,fontSize:12}}>✓ Guardar</button>
            <button onClick={publishIG} disabled={publishing} className="btn btn-primary" style={{flex:1.5,fontSize:12,background:publishing?"var(--surface3)":"linear-gradient(135deg,#E1306C,#833AB4)"}}>
              {publishing?<><div className="spin"/>Publicando...</>:"🚀 Publicar en IG"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ─── SCHEDULE ─── */
function ScheduleScreen({socials,posts,showToast}) {
  const now=new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [schedules,setSchedules]=useState(S.get("schedules")||{});
  const [selectedDay,setSelectedDay]=useState(null);
  const [modalData,setModalData]=useState({postNum:1,hour:"09:00",net:"instagram"});
  const [dragPost,setDragPost]=useState(null);
  const connected=socials.filter(s=>s.connected);

  const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DAYS_H=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];
  const saveSchedules=s=>{setSchedules(s);S.set("schedules",s);};
  const dKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey=dKey(now.getFullYear(),now.getMonth(),now.getDate());
  const daysInMonth=new Date(year,month+1,0).getDate();
  const firstDay=new Date(year,month,1).getDay();
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;

  const openDay=day=>{
    const key=dKey(year,month,day);
    const exist=schedules[key];
    setSelectedDay({day,key,label:day+" de "+MONTHS[month]+" "+year});
    setModalData(exist||{postNum:dragPost||1,hour:"09:00",net:connected[0]?.id||"instagram"});
  };

  const assign=()=>{
    saveSchedules({...schedules,[selectedDay.key]:modalData});
    setSelectedDay(null);setDragPost(null);
    showToast("Programado: Post #"+modalData.postNum+" · "+selectedDay.label+" "+modalData.hour,"ok");
  };

  const PostMini=({post,n})=>{
    const cr=useRef();
    useEffect(()=>{if(cr.current&&post)drawPost(cr.current,post);},[post]);
    return(
      <div onClick={()=>setDragPost(n)} style={{cursor:"pointer",borderRadius:10,overflow:"hidden",border:"2px solid "+(dragPost===n?"var(--accent2)":"var(--border)"),transform:dragPost===n?"scale(1.04)":"scale(1)",transition:"all .15s",position:"relative"}}>
        <canvas ref={cr} style={{width:"100%",display:"block",aspectRatio:"1",objectFit:"cover"}} />
        <div style={{position:"absolute",top:4,left:4,background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:5,padding:"1px 6px",fontSize:10,fontWeight:800,color:"#fff"}}>#{n}</div>
      </div>
    );
  };

  return (
    <div style={{padding:"24px 28px",display:"flex",gap:20,height:"100%",overflow:"hidden"}} className="fade-in">
      {/* Post panel */}
      <div style={{width:180,flexShrink:0,display:"flex",flexDirection:"column",gap:8,overflowY:"auto"}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Tus publicaciones</div>
        <div style={{fontSize:11,color:"var(--muted)",lineHeight:1.5,marginBottom:8}}>Seleccioná un post y hacé click en un día del calendario.</div>
        {posts.length===0?<div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:"16px 0"}}>Generá publicaciones primero.</div>:(
          posts.slice(0,7).map((p,i)=><PostMini key={i} post={p} n={i+1} />)
        )}
        {dragPost&&(
          <div style={{background:"rgba(139,92,246,.12)",border:"1px solid var(--accent2)",borderRadius:10,padding:"10px",textAlign:"center",marginTop:4}}>
            <div style={{fontSize:12,color:"var(--accent2)",fontWeight:600}}>Post #{dragPost} listo</div>
            <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>Hacé click en un día</div>
            <button onClick={()=>setDragPost(null)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:11,marginTop:4}}>Cancelar</button>
          </div>
        )}
      </div>

      {/* Calendar */}
      <div style={{flex:1,display:"flex",flexDirection:"column",gap:14,minWidth:0}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);}} className="btn btn-ghost btn-sm">‹</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:17}}>{MONTHS[month]} {year}</div>
          <button onClick={()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);}} className="btn btn-ghost btn-sm">›</button>
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3}}>
          {DAYS_H.map(d=><div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--muted)",padding:"3px 0",letterSpacing:".5px"}}>{d}</div>)}
        </div>

        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:3,flex:1}}>
          {Array.from({length:totalCells},(_,i)=>{
            const day=i-firstDay+1;
            const valid=day>=1&&day<=daysInMonth;
            const key=valid?dKey(year,month,day):null;
            const sched=key&&schedules[key];
            const isToday=key===todayKey;
            const isPast=key&&key<todayKey;
            const soc=sched&&socials.find(s=>s.id===sched.net);
            const clickable=valid&&!isPast;
            return(
              <div key={i}
                className={"cal-day"+(isToday?" today":"")+(sched?" has-post":"")+(isPast?" past":"")+((!valid||isPast)?" empty":"")}
                onClick={()=>{if(!clickable)return;if(dragPost){openDay(day);setModalData(p=>({...p,postNum:dragPost}));setSelectedDay({day,key:dKey(year,month,day),label:day+" de "+MONTHS[month]+" "+year});}else openDay(day);}}
                style={{minHeight:64,borderRadius:9,padding:"5px 6px",cursor:clickable?"pointer":"default",transition:"all .12s"}}
              >
                {valid&&(
                  <>
                    <div style={{fontSize:12,fontWeight:isToday?700:400,color:isToday?"var(--accent2)":"var(--text)"}}>{day}</div>
                    {sched&&(
                      <>
                        <div style={{background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:4,padding:"1px 5px",fontSize:10,fontWeight:700,color:"#fff",textAlign:"center",marginTop:2}}>#{sched.postNum}</div>
                        <div style={{fontSize:9,color:"var(--accent3)",textAlign:"center"}}>{sched.hour}</div>
                        <div style={{fontSize:12,textAlign:"center"}}>{soc?.icon}</div>
                        <button onClick={e=>{e.stopPropagation();const s={...schedules};delete s[key];saveSchedules(s);}} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:9,padding:0,width:"100%",textAlign:"center"}}>✕</button>
                      </>
                    )}
                  </>
                )}
              </div>
            );
          })}
        </div>

        <div className="card">
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontWeight:600,fontSize:13}}>Posts programados</div>
            <div style={{fontSize:12,color:"var(--muted)"}}>{Object.keys(schedules).length} en total</div>
          </div>
          {Object.keys(schedules).length===0
            ?<div style={{color:"var(--muted)",fontSize:13,textAlign:"center",padding:"8px"}}>Seleccioná un post del panel izquierdo y hacé click en un día.</div>
            :<div style={{display:"flex",flexDirection:"column",gap:4,maxHeight:130,overflowY:"auto"}}>
              {Object.entries(schedules).sort(([a],[b])=>a.localeCompare(b)).map(([key,s])=>{
                const soc=socials.find(x=>x.id===s.net);
                const [y,m,d]=key.split("-");
                const label=new Date(+y,+m-1,+d).toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
                return(
                  <div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid var(--border)",fontSize:12}}>
                    <span>{soc?.icon}</span>
                    <span style={{flex:1,textTransform:"capitalize"}}>{label}</span>
                    <span style={{color:"var(--muted)"}}>{s.hour}</span>
                    <span style={{background:"rgba(139,92,246,.15)",border:"1px solid rgba(139,92,246,.3)",borderRadius:20,padding:"1px 8px",color:"var(--accent2)",fontSize:11}}>#{s.postNum}</span>
                    <button onClick={()=>{const ns={...schedules};delete ns[key];saveSchedules(ns);}} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:12}}>✕</button>
                  </div>
                );
              })}
            </div>
          }
          {Object.keys(schedules).length>0&&(
            <button className="btn btn-primary" style={{width:"100%",marginTop:12}} onClick={()=>showToast("Calendario confirmado. MCM publicará automáticamente.","ok")}>
              ✓ Confirmar calendario
            </button>
          )}
        </div>
      </div>

      {/* Day modal */}
      {selectedDay&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(16px)"}}>
          <div className="card slide-up" style={{width:"100%",maxWidth:420,borderRadius:18,padding:28}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:15,fontWeight:700}}>📅 {selectedDay.label}</h3>
              <button onClick={()=>setSelectedDay(null)} style={{background:"var(--surface2)",border:"1px solid var(--border)",color:"var(--muted)",width:28,height:28,borderRadius:7,cursor:"pointer",fontSize:12}}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <span className="lbl">Publicación</span>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {Array.from({length:7},(_,i)=>i+1).map(n=>(
                    <button key={n} onClick={()=>setModalData(p=>({...p,postNum:n}))} className={"btn btn-sm"+(modalData.postNum===n?" btn-primary":" btn-ghost")} style={{width:42,height:42,padding:0,fontWeight:800}}>
                      {n}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Horario</span>
                <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
                  {["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"].map(h=>(
                    <button key={h} onClick={()=>setModalData(p=>({...p,hour:h}))} className={"chip"+(modalData.hour===h?" on":"")} style={{fontSize:11,padding:"4px 8px"}}>{h}</button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Red social</span>
                {connected.length===0?<div style={{color:"var(--muted)",fontSize:13}}>Conectá al menos una red primero.</div>:(
                  <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {connected.map(s=>(
                      <button key={s.id} onClick={()=>setModalData(p=>({...p,net:s.id}))} className={"chip"+(modalData.net===s.id?" on":"")}>{s.icon} {s.name}</button>
                    ))}
                  </div>
                )}
              </div>
              <button className="btn btn-primary" style={{width:"100%",marginTop:4}} onClick={assign}>
                Programar Post #{modalData.postNum} · {selectedDay.label} {modalData.hour}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
