<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCM — My Community Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;
  --accent:#6d28d9;--accent2:#a855f7;--pink:#ec4899;
  --text:#f0f0ff;--muted:#6b6b8a;--success:#22d3ee;--error:#f43f5e;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:'Inter',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:none}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.fade-in{animation:fadeIn .35s ease both}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px}
.main{flex:1;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:24px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:'Syne',sans-serif;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(109,40,217,.15);color:var(--accent2);border-color:rgba(168,85,247,.2)}
.nav-section{font-size:10px;color:var(--muted);letter-spacing:2px;padding:8px 12px 4px;margin-top:8px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s}
.step-dot.done{background:var(--success)}.step-dot.active{background:var(--accent2)}
.social-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:border-color .2s}
.social-card.connected{border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.03)}
.social-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.file-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color .2s}
.file-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;color:var(--muted);font-size:12px;transition:all .2s}
.file-add:hover{border-color:var(--accent2);color:var(--accent2)}
.post-option{background:var(--surface2);border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.post-option:hover{border-color:var(--accent2);transform:translateY(-2px)}
.post-option.selected{border-color:var(--accent)}
.post-canvas-wrap{aspect-ratio:1;background:var(--bg);overflow:hidden}
/* MEJORA 3: caption visible completo */
.post-caption{padding:12px;font-size:11px;color:var(--muted);line-height:1.65;max-height:none;overflow:visible;border-top:1px solid var(--border)}
.editor-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(20px);overflow-y:auto}
.editor-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:980px;max-height:92vh;overflow-y:auto;display:flex;gap:24px;flex-wrap:wrap;margin:auto}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;max-width:340px;animation:fadeIn .3s ease}
.toast.ok{background:#0d2b1f;border:1px solid var(--success);color:var(--success)}
.toast.err{background:#1f0d0d;border:1px solid var(--error);color:var(--error)}
.toast.info{background:#1a0d2e;border:1px solid var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("mcm_"+k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem("mcm_"+k, JSON.stringify(v)),
};

function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null),3500); };
  return [t, show];
}

const SOCIALS_DEFAULT = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
];

async function generateText(prompt) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d = await r.json();
  return d.text||"";
}

async function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function hexToRgb(hex) {
  try {
    const h = hex.replace("#","");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  } catch { return {r:109,g:40,b:217}; }
}

function coverImg(ctx, img, x, y, w, h) {
  if (!img) return;
  const s = Math.max(w/img.width, h/img.height);
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

function rRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ════════════════════════════════════════════════════════════════
// HELPER: dibuja el logo de marca en la posición/tamaño definidos por el usuario
// opt.logoX, opt.logoY = fracción 0-1 del canvas (posición centro del logo)
// opt.logoSize = fracción del ancho del canvas (default 0.15 = 15%)
// ════════════════════════════════════════════════════════════════
async function drawLogo(ctx, opt, W, H) {
  if(!opt.showLogo || !opt.logoBase64) return;
  const logoImg = await loadImg(opt.logoBase64);
  if(!logoImg) return;
  // Tamaño: opt.logoSize es fracción del canvas (0.05 a 0.4), default 0.15
  const sizeFrac = opt.logoSize||0.15;
  const maxW = W * sizeFrac;
  const maxH = H * sizeFrac;
  const scale = Math.min(maxW/logoImg.width, maxH/logoImg.height);
  const lw = logoImg.width*scale, lh = logoImg.height*scale;
  // Posición: centro del logo en (logoX*W, logoY*H), default esquina inferior derecha
  const cx = (opt.logoX!==undefined ? opt.logoX : 0.88) * W;
  const cy = (opt.logoY!==undefined ? opt.logoY : 0.88) * H;
  const px = cx - lw/2, py = cy - lh/2;
  ctx.save();
  ctx.drawImage(logoImg, px, py, lw, lh); // sin fondo, directo sobre la imagen
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 1 — REVISTA EDITORIAL
// Foto full bleed + franja oscura arriba + tipografía premium
// ════════════════════════════════════════════════════════════════
async function drawTemplate1(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const bgImg = opt.imgSrc ? await loadImg(opt.imgSrc) : null;
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();

  // FULL BLEED PHOTO
  if(bgImg) {
    coverImg(ctx, bgImg, 0, 0, W, H);
  } else {
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,`rgb(${r},${g},${b})`); bg.addColorStop(1,"#000");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  }

  // Gradient top (legibilidad del texto)
  const topGrad = ctx.createLinearGradient(0,0,0,H*0.55);
  topGrad.addColorStop(0,"rgba(0,0,0,0.9)");
  topGrad.addColorStop(0.65,"rgba(0,0,0,0.5)");
  topGrad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=topGrad; ctx.fillRect(0,0,W,H*0.55);

  // Gradient bottom (watermark)
  const botGrad = ctx.createLinearGradient(0,H*0.82,0,H);
  botGrad.addColorStop(0,"rgba(0,0,0,0)"); botGrad.addColorStop(1,"rgba(0,0,0,0.55)");
  ctx.fillStyle=botGrad; ctx.fillRect(0,H*0.82,W,H*0.18);

  // Accent line top
  ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,W,8);

  // Category tag
  ctx.font="700 17px Arial,sans-serif";
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.textAlign="left";
  ctx.fillText("■  PUBLICACIÓN", 56, 60);

  // Main headline — respeta fuente/peso/tamaño/color del editor
  if(text) {
    const ff = opt.fontFamily||"Impact,'Arial Black',sans-serif";
    const fw = opt.fontWeight||"900";
    const fc = opt.fontColor||"#ffffff";
    // fontSize del form está en escala "perceptual" (12-120), lo mapeamos a canvas (1080px)
    // 56 perceptual ≈ 148px canvas. Factor: 1080/500 * fontSize
    const canvasSize = Math.round((opt.fontSize||56) * 1080/500);
    const words = text.split(" ");
    const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));

    let size = canvasSize;
    ctx.font=`${fw} ${size}px ${ff}`;
    // Solo auto-reducir si desborda, nunca aumentar
    while(size>40){
      ctx.font=`${fw} ${size}px ${ff}`;
      if(Math.max(...lines.map(l=>ctx.measureText(l).width)) <= W-112) break;
      size-=4;
    }

    ctx.fillStyle=fc; ctx.textAlign="left";
    ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=16;
    const lH = size*0.95;
    const tH = lines.length*lH;
    // Posición Y: si el usuario arrastró el texto, usar textY; sino auto arriba
    const posY = opt.textY!==undefined ? opt.textY*H : 0.15*H;
    const posX = opt.textX!==undefined ? opt.textX*W : 56;
    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY + size*0.85 + i*lH));
    ctx.shadowBlur=0;

    ctx.fillStyle=`rgba(${r},${g},${b},0.85)`;
    ctx.fillRect(posX, posY + size*0.85 + tH + 10, 200, 5);
  }

  // Watermark MCM (solo si no hay logo)
  if(!opt.showLogo || !opt.logoBase64) {
    ctx.font="600 17px Arial"; ctx.fillStyle="rgba(255,255,255,0.6)"; ctx.textAlign="right";
    ctx.fillText("MCM", W-40, H-26);
  }
  await drawLogo(ctx, opt, W, H);
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 2 — DISEÑO GRÁFICO PURO (SIN FOTO)
// Composición geométrica + tipografía grande + caption visible
// ════════════════════════════════════════════════════════════════
async function drawTemplate2(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  // Background dark
  ctx.fillStyle = "#0a0a0f";
  ctx.fillRect(0,0,W,H);

  // Large accent circle top-right
  ctx.beginPath();
  ctx.arc(W+80, -80, 500, 0, Math.PI*2);
  const circGrad = ctx.createRadialGradient(W+80,-80,0,W+80,-80,500);
  circGrad.addColorStop(0, `rgba(${r},${g},${b},0.65)`);
  circGrad.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = circGrad; ctx.fill();

  // Second circle bottom-left
  ctx.beginPath(); ctx.arc(-50, H+50, 320, 0, Math.PI*2);
  const circGrad2 = ctx.createRadialGradient(-50,H+50,0,-50,H+50,320);
  circGrad2.addColorStop(0, `rgba(${r},${g},${b},0.35)`);
  circGrad2.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle=circGrad2; ctx.fill();

  // Grid lines
  ctx.strokeStyle = `rgba(${r},${g},${b},0.1)`; ctx.lineWidth=1;
  for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Left vertical accent bar
  ctx.fillStyle = `rgb(${r},${g},${b})`;
  rRect(ctx, 50, 200, 16, H-400, 8);
  ctx.fill();

  // Main headline — respeta fuente del editor
  if(text) {
    const ff = opt.fontFamily||"Impact,'Arial Black',sans-serif";
    const fw = opt.fontWeight||"900";
    const fc = opt.fontColor||"#ffffff";
    const canvasSize = Math.round((opt.fontSize||56) * 1080/500);
    const words = text.toUpperCase().split(" ");
    const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size = canvasSize;
    ctx.font = `${fw} ${size}px ${ff}`;
    while(size>40){
      ctx.font=`${fw} ${size}px ${ff}`;
      if(Math.max(...lines.map(l=>ctx.measureText(l).width)) <= W-160) break;
      size-=4;
    }
    ctx.fillStyle=fc; ctx.textAlign="left";
    const posX = opt.textX!==undefined ? opt.textX*W : 96;
    const posY = opt.textY!==undefined ? opt.textY*H : 200;
    const lineH=size*0.95;
    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY + size*0.9 + i*lineH));
  }

  // Extended body text (caption preview)
  if(caption) {
    const bodySize = 30;
    ctx.font = `300 ${bodySize}px Arial,sans-serif`;
    ctx.fillStyle="rgba(255,255,255,0.7)";
    ctx.textAlign="left";
    const maxW = W-150;
    const words = caption.split(" ");
    const lines=[]; let line="";
    for(const w of words){
      const t=line+(line?" ":"")+w;
      if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}
      else line=t;
      if(lines.length>=4) break;
    }
    if(line&&lines.length<4) lines.push(line);
    const bodyY = H-290;
    lines.forEach((ln,i)=>ctx.fillText(ln, 96, bodyY+i*(bodySize*1.5)));
  }

  // Bottom bar
  ctx.fillStyle=`rgba(${r},${g},${b},0.92)`;
  ctx.fillRect(0,H-70,W,70);
  ctx.font="700 21px Arial"; ctx.fillStyle="#ffffff"; ctx.textAlign="left";
  ctx.fillText("MCM · MY COMMUNITY MANAGER", 46, H-25);

  // Corner brackets decorativos
  ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(36,36); ctx.lineTo(36,88); ctx.moveTo(36,36); ctx.lineTo(88,36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-36,H-80); ctx.lineTo(W-36,H-128); ctx.moveTo(W-36,H-80); ctx.lineTo(W-88,H-80); ctx.stroke();
  await drawLogo(ctx, opt, W, H-70); // dentro del área sobre la barra
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 3 — IA VISUAL PREMIUM (rediseño completo)
// Composición de revista premium con elementos visuales únicos por rubro
// Layout: Split design — elemento visual derecha, texto izquierda
// ════════════════════════════════════════════════════════════════
async function drawTemplate3(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  const industry = (opt.industry||"").toLowerCase();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  const isFood = /gastro|restaurante|pizza|cafe|comida|food|panaderia|heladeria|granja|organica/i.test(industry+caption);
  const isHealth = /salud|fitness|deporte|medic|bienestar|gym/i.test(industry);
  const isRealEstate = /inmobil|construcci|arquitect|paisaj/i.test(industry);
  const isTech = /tecnolog|software|digital|web|app/i.test(industry);
  const isFashion = /moda|ropa|indument|fashion|belleza|estetica/i.test(industry);

  // ── PALETAS POR RUBRO ──
  let palette = { bg:"#0a0508", c1:"rgba(255,140,0,0.8)", c2:"rgba(200,60,0,0.4)", accent:"rgba(255,180,50,0.6)" };
  if(isFood) palette = { bg:"#080300", c1:`rgba(${r},${g},${b},0.75)`, c2:"rgba(220,80,0,0.5)", accent:"rgba(255,160,40,0.7)" };
  else if(isHealth) palette = { bg:"#020d06", c1:"rgba(0,210,90,0.7)", c2:"rgba(0,150,80,0.4)", accent:"rgba(50,255,130,0.6)" };
  else if(isRealEstate) palette = { bg:"#02040e", c1:`rgba(${r},${g},${b},0.65)`, c2:"rgba(40,80,200,0.4)", accent:"rgba(100,160,255,0.6)" };
  else if(isTech) palette = { bg:"#020408", c1:"rgba(0,200,255,0.7)", c2:"rgba(0,100,200,0.4)", accent:"rgba(0,230,255,0.6)" };
  else if(isFashion) palette = { bg:"#080305", c1:"rgba(255,80,140,0.7)", c2:"rgba(200,30,100,0.4)", accent:"rgba(255,150,200,0.6)" };
  else palette = { bg:"#07060f", c1:`rgba(${r},${g},${b},0.7)`, c2:`rgba(${r},${g},${b},0.35)`, accent:`rgba(${r},${g},${b},0.55)` };

  // ── BASE BACKGROUND ──
  ctx.fillStyle = palette.bg;
  ctx.fillRect(0,0,W,H);

  // ── SPLIT PANEL — lado derecho coloreado (2/5 del ancho) ──
  const splitX = W * 0.58;
  const panelGrad = ctx.createLinearGradient(splitX, 0, W, H);
  panelGrad.addColorStop(0, palette.c1.replace("0.7","0.18").replace("0.75","0.18").replace("0.65","0.18"));
  panelGrad.addColorStop(1, palette.c2.replace("0.4","0.08"));
  ctx.fillStyle = panelGrad;
  ctx.fillRect(splitX, 0, W-splitX, H);

  // ── DIAGONAL DIVIDER ──
  ctx.beginPath();
  ctx.moveTo(splitX - 60, 0);
  ctx.lineTo(splitX + 60, H);
  ctx.lineTo(splitX + 80, H);
  ctx.lineTo(splitX - 40, 0);
  ctx.closePath();
  const diagGrad = ctx.createLinearGradient(splitX-60, 0, splitX+80, H);
  diagGrad.addColorStop(0, palette.c1.replace("0.8","0.3").replace("0.7","0.3").replace("0.75","0.3"));
  diagGrad.addColorStop(1, palette.c2.replace("0.5","0.15").replace("0.4","0.15"));
  ctx.fillStyle = diagGrad;
  ctx.fill();

  // ── ELEMENTOS VISUALES POR RUBRO (panel derecho) ──
  const cx = W * 0.79, cy = H * 0.42;

  if(isFood) {
    // Plato estilizado — círculos concéntricos + vapor
    [260, 200, 140, 80].forEach((rad, i) => {
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2);
      ctx.strokeStyle = `rgba(255,${150+i*20},${30+i*15},${0.12+i*0.07})`;
      ctx.lineWidth = i===3 ? 3 : 1;
      ctx.stroke();
    });
    // Vapor lines
    ctx.strokeStyle="rgba(255,200,80,0.15)"; ctx.lineWidth=2;
    [cx-50,cx,cx+50].forEach((x,i)=>{
      ctx.beginPath();
      for(let y=cy+20;y>cy-180;y-=15){
        const wave=Math.sin((y+i*50)*0.06)*10;
        y===Math.round(cy+20)?ctx.moveTo(x+wave,y):ctx.lineTo(x+wave,y);
      }
      ctx.stroke();
    });
    // Glow central
    const glowFood = ctx.createRadialGradient(cx,cy,0,cx,cy,220);
    glowFood.addColorStop(0,"rgba(220,100,0,0.35)");
    glowFood.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glowFood; ctx.fillRect(splitX,0,W-splitX,H);

  } else if(isHealth) {
    // Pulso cardíaco + círculos de energía
    const glowH = ctx.createRadialGradient(cx,cy,0,cx,cy,240);
    glowH.addColorStop(0,"rgba(0,220,100,0.3)"); glowH.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glowH; ctx.fillRect(splitX,0,W-splitX,H);
    [200,150,100].forEach(rad=>{
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2);
      ctx.strokeStyle="rgba(0,230,100,0.15)"; ctx.lineWidth=1; ctx.stroke();
    });
    // Heartbeat line across right panel
    ctx.strokeStyle="rgba(0,230,100,0.6)"; ctx.lineWidth=3;
    ctx.beginPath();
    const hbY = cy+60;
    const hbPts=[splitX+40,hbY, cx-100,hbY, cx-60,hbY, cx-40,cy-90, cx,cy+80, cx+30,hbY, cx+90,hbY, W-30,hbY];
    for(let i=0;i<hbPts.length;i+=2) i===0?ctx.moveTo(hbPts[i],hbPts[i+1]):ctx.lineTo(hbPts[i],hbPts[i+1]);
    ctx.stroke();

  } else if(isRealEstate) {
    // Casa estilizada — blueprint art
    const hx=cx-100, hy=cy-120, hw=200, hh=200;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=2.5;
    ctx.beginPath();
    ctx.moveTo(hx,hy+hh*0.4); ctx.lineTo(hx+hw/2,hy); ctx.lineTo(hx+hw,hy+hh*0.4);
    ctx.lineTo(hx+hw,hy+hh); ctx.lineTo(hx,hy+hh); ctx.lineTo(hx,hy+hh*0.4);
    ctx.moveTo(hx+hw*0.38,hy+hh); ctx.lineTo(hx+hw*0.38,hy+hh*0.65);
    ctx.lineTo(hx+hw*0.62,hy+hh*0.65); ctx.lineTo(hx+hw*0.62,hy+hh);
    ctx.moveTo(hx+hw*0.12,hy+hh*0.55); ctx.lineTo(hx+hw*0.32,hy+hh*0.55);
    ctx.lineTo(hx+hw*0.32,hy+hh*0.75); ctx.lineTo(hx+hw*0.12,hy+hh*0.75); ctx.closePath();
    ctx.stroke();
    const glowRE = ctx.createRadialGradient(cx,cy,0,cx,cy,240);
    glowRE.addColorStop(0,`rgba(${r},${g},${b},0.22)`); glowRE.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glowRE; ctx.fillRect(splitX,0,W-splitX,H);

  } else if(isTech) {
    // Red de nodos + circuito
    const nodePositions = [[cx,cy],[cx-80,cy-100],[cx+90,cy-80],[cx+70,cy+90],[cx-90,cy+70],[cx-30,cy-160],[cx+120,cy+20]];
    ctx.strokeStyle="rgba(0,200,255,0.15)"; ctx.lineWidth=1;
    nodePositions.forEach(([x,y],i)=>{
      nodePositions.forEach(([x2,y2],j)=>{
        if(i<j&&Math.hypot(x-x2,y-y2)<200){ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x2,y2); ctx.stroke(); }
      });
    });
    nodePositions.forEach(([x,y],i)=>{
      const rad = i===0?12:7;
      const glowN=ctx.createRadialGradient(x,y,0,x,y,rad*3);
      glowN.addColorStop(0,"rgba(0,200,255,0.5)"); glowN.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=glowN; ctx.fillRect(x-rad*3,y-rad*3,rad*6,rad*6);
      ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2);
      ctx.fillStyle=i===0?"rgba(0,220,255,0.9)":"rgba(0,200,255,0.6)"; ctx.fill();
    });
    const glowTech = ctx.createRadialGradient(cx,cy,0,cx,cy,220);
    glowTech.addColorStop(0,"rgba(0,180,255,0.2)"); glowTech.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glowTech; ctx.fillRect(splitX,0,W-splitX,H);

  } else if(isFashion) {
    // Geometría elegante — círculos + diagonales
    ctx.strokeStyle="rgba(255,100,150,0.2)"; ctx.lineWidth=1;
    for(let i=-100;i<W;i+=40){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+H*0.5,H); ctx.stroke(); }
    [220,170,110].forEach((rad,i)=>{
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2);
      ctx.strokeStyle=`rgba(255,100,150,${0.2-i*0.04})`; ctx.lineWidth=1.5; ctx.stroke();
    });
    const glowF=ctx.createRadialGradient(cx,cy,0,cx,cy,230);
    glowF.addColorStop(0,"rgba(255,80,140,0.28)"); glowF.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glowF; ctx.fillRect(splitX,0,W-splitX,H);

  } else {
    // Generic premium — rings + glow
    [240,180,120,60].forEach((rad,i)=>{
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${r},${g},${b},${0.18-i*0.03})`; ctx.lineWidth=1.5; ctx.stroke();
    });
    const glowG=ctx.createRadialGradient(cx,cy,0,cx,cy,260);
    glowG.addColorStop(0,`rgba(${r},${g},${b},0.3)`); glowG.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=glowG; ctx.fillRect(splitX,0,W-splitX,H);
  }

  // ── NOISE TEXTURE — toda la imagen ──
  for(let i=0;i<600;i++){
    const x=Math.random()*W, y=Math.random()*H;
    ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.025})`;
    ctx.fillRect(x,y,1.5,1.5);
  }

  // ── BARRA IZQUIERDA — accent vertical ──
  const barGrad = ctx.createLinearGradient(0,0,0,H);
  barGrad.addColorStop(0,`rgba(${r},${g},${b},0.9)`);
  barGrad.addColorStop(1,`rgba(${r},${g},${b},0.3)`);
  ctx.fillStyle=barGrad;
  ctx.fillRect(0, 0, 6, H);

  // ── TEXTO PRINCIPAL — lado izquierdo, respeta fuente del editor ──
  if(text) {
    const ff = opt.fontFamily||"Impact,'Arial Black',sans-serif";
    const fw = opt.fontWeight||"900";
    const fc = opt.fontColor||"#ffffff";
    const canvasSize = Math.round((opt.fontSize||56) * 1080/500);
    const words=text.split(" ");
    const lines=[];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));

    const maxW = splitX - 100;
    let size=canvasSize;
    ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){
      ctx.font=`${fw} ${size}px ${ff}`;
      if(Math.max(...lines.map(l=>ctx.measureText(l).width)) <= maxW) break;
      size-=4;
    }

    const lineH=size*0.96;
    const totalH=lines.length*lineH;
    const posX = opt.textX!==undefined ? Math.min(opt.textX*W, splitX-100) : 48;
    const posY = opt.textY!==undefined ? opt.textY*H : H/2 - totalH/2;

    ctx.shadowColor=`rgba(${r},${g},${b},0.6)`;
    ctx.shadowBlur=24;
    ctx.fillStyle=fc; ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY + size*0.85 + i*lineH));
    ctx.shadowBlur=0;

    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(posX, posY + size*0.85 + totalH + 12, 140, 4);
  }

  // ── NOMBRE DE MARCA — arriba izquierda ──
  ctx.font="600 16px Arial"; ctx.fillStyle=`rgba(${r},${g},${b},0.9)`; ctx.textAlign="left";
  ctx.fillText("● MCM", 48, 52);

  // ── CAPTION PREVIEW — bottom izquierda ──
  if(caption) {
    const capSize = 22;
    ctx.font=`300 ${capSize}px Arial,sans-serif`;
    ctx.fillStyle="rgba(255,255,255,0.55)";
    ctx.textAlign="left";
    const maxW = splitX - 80;
    const words = caption.split(" ");
    const lines=[]; let line="";
    for(const w of words){
      const t=line+(line?" ":"")+w;
      if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}
      else line=t;
      if(lines.length>=3) break;
    }
    if(line&&lines.length<3) lines.push(line);
    const capY = H - 80 - lines.length*(capSize*1.5);
    lines.forEach((ln,i)=>ctx.fillText(ln, 48, capY+i*(capSize*1.5)));
  }

  // ── WATERMARK ──
  if(!opt.showLogo || !opt.logoBase64) {
    ctx.font="500 14px Arial"; ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.textAlign="right";
    ctx.fillText("Imagen generada por IA", W-36, H-22);
  }
  await drawLogo(ctx, opt, W, H);
}

// ── ROUTER ──
async function drawPost(canvas, opt) {
  if(opt.style===1) return drawTemplate1(canvas, opt);
  if(opt.style===2) return drawTemplate2(canvas, opt);
  return drawTemplate3(canvas, opt);
}


function App() {
  const [screen, setScreen] = useState("connect");
  const [brand, setBrand] = useState(store.get("brand")||{});
  const [files, setFiles] = useState(store.get("files")||[]);
  const [posts, setPosts] = useState(store.get("posts")||[]);
  const [socials, setSocials] = useState(store.get("socials")||SOCIALS_DEFAULT);
  const [toast, showToast] = useToast();

  const saveBrand=(b)=>{setBrand(b);store.set("brand",b);};
  const saveFiles=(f)=>{setFiles(f);store.set("files",f);};
  const savePosts=(p)=>{setPosts(p);store.set("posts",p);};
  const saveSocials=(s)=>{setSocials(s);store.set("socials",s);};

  const steps=[
    {id:"connect",icon:"🔗",label:"Conectar redes",done:socials.some(s=>s.connected)},
    {id:"brand",icon:"🎨",label:"Mi marca",done:!!(brand.name&&brand.description)},
    {id:"library",icon:"📁",label:"Mis archivos",done:files.length>0},
    {id:"generate",icon:"✦",label:"Crear publicación",done:posts.length>0},
    {id:"schedule",icon:"📅",label:"Automatizar",done:false},
  ];

  return (
    <div className="app">
      <div className="sidebar">
        <div className="logo">
          <div className="logo-mark">M</div>
          <div><div className="logo-text">MCM</div><div className="logo-sub">COMMUNITY MANAGER</div></div>
        </div>
        <div className="nav-section">FLUJO</div>
        {steps.map(s=>(
          <button key={s.id} className={"nav-item"+(screen===s.id?" active":"")} onClick={()=>setScreen(s.id)}>
            <div className={"step-dot"+(s.done?" done":screen===s.id?" active":"")} />
            <span>{s.icon}</span>{s.label}
          </button>
        ))}
        <div style={{marginTop:"auto",padding:"12px 10px"}}>
          <div style={{fontSize:11,color:"var(--muted)",marginBottom:6}}>Conectadas</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {socials.filter(s=>s.connected).map(s=><span key={s.id} title={s.name} style={{fontSize:16}}>{s.icon}</span>)}
            {!socials.some(s=>s.connected)&&<span style={{fontSize:11,color:"var(--muted)"}}>Ninguna</span>}
          </div>
        </div>
      </div>
      <div className="main">
        {screen==="connect"  && <ConnectScreen  socials={socials} saveSocials={saveSocials} showToast={showToast} onNext={()=>setScreen("brand")} />}
        {screen==="brand"    && <BrandScreen    brand={brand} saveBrand={saveBrand} showToast={showToast} onNext={()=>setScreen("library")} />}
        {screen==="library"  && <LibraryScreen  files={files} saveFiles={saveFiles} showToast={showToast} onNext={()=>setScreen("generate")} />}
        {screen==="generate" && <GenerateScreen brand={brand} files={files} posts={posts} savePosts={savePosts} showToast={showToast} onNext={()=>setScreen("schedule")} />}
        {screen==="schedule" && <ScheduleScreen socials={socials} showToast={showToast} />}
      </div>
      {toast&&<div className={"toast "+toast.type}>{toast.msg}</div>}
    </div>
  );
}

function ConnectScreen({socials,saveSocials,showToast,onNext}) {
  const connect=(id)=>{
    if(id==="instagram"){saveSocials(socials.map(s=>s.id===id?{...s,connected:true,user:"@gonvinardell"}:s));showToast("Instagram conectado!","ok");}
    else showToast("Próximamente — "+socials.find(s=>s.id===id).name,"info");
  };
  const disconnect=(id)=>saveSocials(socials.map(s=>s.id===id?{...s,connected:false,user:""}:s));
  return (
    <div style={{padding:"32px 36px",maxWidth:600}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Conectá tus redes sociales</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>MCM publicará en las redes que conectes.</p>
      </div>
      {socials.map(s=>(
        <div key={s.id} className={"social-card"+(s.connected?" connected":"")}>
          <div className="social-icon" style={{background:s.color+"22"}}>{s.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
            <div style={{fontSize:12,color:s.connected?"var(--success)":"var(--muted)",marginTop:2}}>
              {s.connected?"● Conectado — "+s.user:"No conectado"}
            </div>
          </div>
          {s.connected
            ?<button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>disconnect(s.id)}>Desconectar</button>
            :<button className="btn btn-primary" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>connect(s.id)}>Conectar</button>}
        </div>
      ))}
      <div style={{marginTop:28}}>
        <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Mi Marca →</button>
      </div>
    </div>
  );
}

    saveFiles(updated);

  return (

        {files.map(f=>(
          <div key={f.id} className="file-thumb">
            {f.type==="video"?<video src={f.preview} style={{width:"100%",height:"100%",objectFit:"cover"}} />:<img src={f.preview} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}} />}
            <button onClick={()=>remove(f.id)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            {f.type==="video"&&<div style={{position:"absolute",bottom:4,left:4,background:"rgba(0,0,0,.6)",borderRadius:4,padding:"2px 6px",fontSize:10}}>🎬</div>}
          </div>
        ))}
      </div>
      {files.length>0&&<div style={{marginTop:28}}><button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Crear Publicaciones →</button></div>}
    </div>
  );
}

function GenerateScreen({brand,files,posts,savePosts,showToast,onNext}) {
  const [generating,setGenerating]=useState(false);
  const [weekPosts,setWeekPosts]=useState([]);
  const [selections,setSelections]=useState({});
  const [editing,setEditing]=useState(null);
  const [brief,setBrief]=useState("");
  const [progress,setProgress]=useState(0);

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    const imgs=files.filter(f=>f.type==="image");
    if(imgs.length===0){showToast("Agregá al menos una imagen a tus archivos","err");return;}
    setGenerating(true); setWeekPosts([]); setSelections({}); setProgress(0);

    // MEJORA 1: Cada post tiene un tema diferente → cada overlayText será único
    const PROMPTS=[
      "Genera un caption profesional sobre el trabajo o servicio principal que ofrece la empresa.",
      "Genera un caption con un testimonio o caso de éxito de un cliente de esta empresa.",
      "Genera un caption educativo con un tip o consejo útil relacionado al rubro.",
      "Genera un caption promocional con un llamado a la acción concreto.",
      "Genera un caption que muestre los valores humanos y el equipo de la empresa.",
      "Genera un caption con una pregunta abierta para generar interacción y comentarios.",
      "Genera un caption emotivo e inspirador que conecte con la audiencia de la marca.",
    ];

    // Contextos de imagen únicos por post (para que overlayText sea diferente en cada uno)
    const OVERLAY_CONTEXTS=[
      "El fondo muestra el producto o servicio principal de la empresa. El tema del post es: presentación del trabajo.",
      "El fondo muestra clientes satisfechos o el resultado del trabajo. El tema es: testimonio de éxito.",
      "El fondo muestra el proceso de trabajo o ingredientes/materiales. El tema es: consejo educativo.",
      "El fondo muestra una oferta especial o el producto destacado. El tema es: promoción con urgencia.",
      "El fondo muestra el equipo de trabajo o el lugar físico del negocio. El tema es: valores y personas.",
      "El fondo muestra algo que invita a la reflexión relacionado al rubro. El tema es: pregunta de engagement.",
      "El fondo muestra un momento especial o resultado emotivo. El tema es: inspiración y conexión emocional.",
    ];

    const base="Empresa: "+brand.name+". Rubro: "+(brand.industry||"")+". Descripcion: "+(brand.description||"")+". Cliente ideal: "+(brand.target||"")+". "+(brief?"Contexto: "+brief+". ":"")+"Tono: "+(brand.tone||"profesional")+". Incluye 5-6 hashtags. Solo el caption, sin explicaciones.";

    try{
      const allPosts=[];
      for(let i=0;i<7;i++){
        setProgress(i+1);
        const imgSrc=imgs[i%imgs.length].preview;

        // MEJORA 1: overlayText único por post con contexto específico de imagen
        const overlayPrompt = "Sos un director creativo de publicidad. Empresa: "+brand.name+" ("+brand.industry+"). "+OVERLAY_CONTEXTS[i]+" Escribí un texto de EXACTAMENTE 3 a 5 palabras para superponer sobre esa imagen. Debe ser poético, impactante y directamente relacionado con lo que se ve en la imagen. Sin hashtags, sin emojis, sin signos de puntuación. Solo las palabras.";

        const [cap1,cap2,cap3,overlayRaw]=await Promise.all([
          generateText(PROMPTS[i]+base),
          generateText(PROMPTS[i]+" Version más cercana y coloquial. "+base),
          generateText(PROMPTS[i]+" Version orientada a ventas y conversión. "+base),
          generateText(overlayPrompt),
        ]);
        const overlayText=overlayRaw.trim().replace(/['"\*\_\#\.\,\!\?]/g,"").replace(/\s+/g," ").slice(0,40);

        const options=[
          // Template 1: foto del cliente + texto corto
          {id:0,style:1,styleName:"Revista",caption:cap1,overlayText,imgSrc,
           fontSize:56,fontColor:"#ffffff",fontFamily:"Impact",fontWeight:"900",
           textBg:false,showLogo:true,logoBase64:brand.logoBase64||null,
           brandColor:brand.color||"#6d28d9",industry:brand.industry||""},
          // Template 2: diseño gráfico puro, sin foto
          {id:1,style:2,styleName:"Diseño",caption:cap2,overlayText,imgSrc:null,
           fontSize:56,fontColor:"#ffffff",fontFamily:"Impact",fontWeight:"900",
           textBg:false,showLogo:true,logoBase64:brand.logoBase64||null,
           brandColor:brand.color||"#6d28d9",industry:brand.industry||""},
          // Template 3: fondo generado por IA según rubro
          {id:2,style:3,styleName:"IA Visual",caption:cap3,overlayText,imgSrc:null,
           fontSize:56,fontColor:"#ffffff",fontFamily:"Impact",fontWeight:"900",
           textBg:false,showLogo:true,logoBase64:brand.logoBase64||null,
           brandColor:brand.color||"#6d28d9",industry:brand.industry||""},
        ];
        allPosts.push({postIdx:i,label:"Post "+(i+1),theme:PROMPTS[i].slice(8,40)+"...",options});
        setWeekPosts([...allPosts]);
      }
      const selectedArr=allPosts.map((p,i)=>({...p.options[0],postIdx:i,id:Date.now()+i}));
      savePosts(selectedArr);
      showToast("7 publicaciones generadas!","ok");
    }catch(e){showToast("Error: "+e.message,"err");}
    finally{setGenerating(false);setProgress(0);}
  };

  const selectOption=(postIdx,optIdx)=>{
    setSelections(p=>({...p,[postIdx]:optIdx}));
  };

  const allSelected=weekPosts.length===7&&Object.keys(selections).length===7;

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Crear publicaciones de la semana</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>La IA genera 7 posts con 3 opciones cada uno — elegís una por post.</p>
        </div>
        <button className="btn btn-primary" onClick={generate} disabled={generating}>
          {generating?<><div className="spin"/>Generando post {progress}/7...</>:"✦ Generar semana completa"}
        </button>
      </div>

      <div style={{marginBottom:20}}>
        <span className="lbl">Brief de la semana (opcional)</span>
        <input value={brief} onChange={e=>setBrief(e.target.value)} placeholder="Ej: Semana de lanzamiento, promo del mes, nuevo producto..." />
      </div>

      {generating&&(
        <div style={{padding:"24px",marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13,color:"var(--muted)"}}>
            <span>Generando publicaciones...</span>
            <span style={{color:"var(--accent2)"}}>{progress}/7</span>
          </div>
          <div style={{height:6,background:"var(--surface2)",borderRadius:6,overflow:"hidden"}}>
            <div style={{height:"100%",width:(progress/7*100)+"%",background:"linear-gradient(90deg,var(--accent),var(--accent2))",borderRadius:6,transition:"width .4s"}} />
          </div>
          {weekPosts.length>0&&<div style={{fontSize:12,color:"var(--muted)",marginTop:8}}>Mostrando posts generados hasta ahora...</div>}
        </div>
      )}

      {weekPosts.map((post,pi)=>(
        <div key={pi} style={{marginBottom:36}} className="fade-in">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{width:28,height:28,borderRadius:8,background:"linear-gradient(135deg,var(--accent),var(--accent2))",display:"grid",placeItems:"center",fontSize:13,fontWeight:800,flexShrink:0}}>{pi+1}</div>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>Post {pi+1}</div>
              <div style={{fontSize:12,color:"var(--muted)",textTransform:"capitalize"}}>{post.theme}</div>
            </div>
            {selections[pi]!==undefined&&<div style={{marginLeft:"auto",fontSize:12,color:"var(--success)",background:"rgba(34,211,238,.1)",border:"1px solid rgba(34,211,238,.2)",borderRadius:20,padding:"3px 10px"}}>✓ Opción {selections[pi]+1} elegida</div>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
            {post.options.map((opt,oi)=>(
              <WeekPostCard key={oi} opt={opt} postIdx={pi} optIdx={oi}
                selected={selections[pi]===oi}
                onSelect={()=>selectOption(pi,oi)}
                onEdit={()=>setEditing({postIdx:pi,optIdx:oi})}
              />
            ))}
          </div>
        </div>
      ))}

      {weekPosts.length===7&&(
        <div className="fade-in" style={{marginTop:8}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:24}}>📋</div>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>{Object.keys(selections).length}/7 posts seleccionados</div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>Elegí una opción por cada post para continuar</div>
            </div>
          </div>
          {allSelected&&(
            <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>
              📅 Programar en el calendario →
            </button>
          )}
        </div>
      )}

      {editing&&(
        <EditorModal
          opt={weekPosts[editing.postIdx]?.options[editing.optIdx]}
          brand={brand}
          onClose={()=>setEditing(null)}
          onSave={(updated)=>{
            const newWeek=[...weekPosts];
            newWeek[editing.postIdx].options[editing.optIdx]=updated;
            setWeekPosts(newWeek);
            setEditing(null);
            showToast("Cambios guardados","ok");
          }}
          showToast={showToast}
        />
      )}
    </div>
  );
}

        {selected&&<div style={{position:"absolute",top:8,right:8,background:"var(--accent)",borderRadius:"50%",width:22,height:22,display:"grid",placeItems:"center",fontSize:12}}>✓</div>}

  );
}

function PostOptionCard(){return null;}

function EditorModal({opt,brand,onClose,onSave,showToast}) {
  const canvasRef=useRef();
  const previewRef=useRef();
  const [form,setForm]=useState({
    ...opt,
    textBg: opt.textBg||false,
    showLogo: opt.showLogo!==undefined?opt.showLogo:true,
    logoBase64: opt.logoBase64||brand?.logoBase64||null,
    logoX: opt.logoX!==undefined?opt.logoX:0.88,
    logoY: opt.logoY!==undefined?opt.logoY:0.88,
    logoSize: opt.logoSize!==undefined?opt.logoSize:0.15,
    textX: opt.textX!==undefined?opt.textX:0.05,
    textY: opt.textY!==undefined?opt.textY:0.75,
    fontFamily: opt.fontFamily||"Impact",
    fontWeight: opt.fontWeight||"900",
    fontSize: opt.fontSize||56,
    fontColor: opt.fontColor||"#ffffff",
    _customSize: true, // siempre respetar el fontSize del form
  });
  const [publishing,setPublishing]=useState(false);
  const [pubMsg,setPubMsg]=useState(null);
  const [dragMode,setDragMode]=useState(null); // null | "text" | "logo" | "logo-resize"
  const [showFormatPicker,setShowFormatPicker]=useState(false);
  const [igFormat,setIgFormat]=useState("post");
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{if(canvasRef.current)drawPost(canvasRef.current,form);},[form]);

  // Detectar si el click está cerca del logo para decidir qué arrastrar
  const getClickTarget=(e)=>{
    const rect=previewRef.current.getBoundingClientRect();
    const fx=(e.clientX-rect.left)/rect.width;
    const fy=(e.clientY-rect.top)/rect.height;
    if(form.showLogo&&form.logoBase64){
      const lx=form.logoX!==undefined?form.logoX:0.88;
      const ly=form.logoY!==undefined?form.logoY:0.88;
      const ls=form.logoSize||0.15;
      const hitR=ls*0.65;
      if(Math.abs(fx-lx)<hitR&&Math.abs(fy-ly)<hitR) return "logo";
    }
    return "text";
  };

  const handlePreviewMouseDown=(e)=>{
    e.preventDefault();
    setDragMode(getClickTarget(e));
  };
  const handlePreviewMouseMove=(e)=>{
    if(!dragMode)return;
    const rect=previewRef.current.getBoundingClientRect();
    const fx=Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width));
    const fy=Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height));
    if(dragMode==="text"){
      setForm(p=>({...p,textX:fx,textY:fy}));
    } else if(dragMode==="logo"){
      setForm(p=>({...p,logoX:fx,logoY:fy}));
    }
  };
  const handlePreviewMouseUp=()=>setDragMode(null);
  const handlePreviewTouch=(e)=>{
    if(!dragMode)return;
    const t=e.touches[0];
    const rect=previewRef.current.getBoundingClientRect();
    const fx=Math.max(0,Math.min(1,(t.clientX-rect.left)/rect.width));
    const fy=Math.max(0,Math.min(1,(t.clientY-rect.top)/rect.height));
    if(dragMode==="text") setForm(p=>({...p,textX:fx,textY:fy}));
    else if(dragMode==="logo") setForm(p=>({...p,logoX:fx,logoY:fy}));
  };
  const handlePreviewTouchStart=(e)=>{
    e.preventDefault();
    setDragMode(getClickTarget(e.touches[0]));
  };

  const download=()=>{
    const cv=canvasRef.current; if(!cv)return;
    const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="MCM_post.png"; a.click();
  };

  const publishIG=async(format)=>{
    const canvas=canvasRef.current; if(!canvas)return;
    setPublishing(true); setPubMsg(null); setShowFormatPicker(false);
    try{
      const upRes=await fetch("/api/instagram?action=upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageBase64:canvas.toDataURL("image/png")})});
      const upData=await upRes.json();
      if(!upData.success)throw new Error(upData.error);
      const pubRes=await fetch("/api/instagram?action=publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caption:form.caption,imageUrl:upData.url,format:format||igFormat})});
      const pubData=await pubRes.json();
      if(!pubData.success)throw new Error(pubData.error);
      const formatLabel={"post":"Publicación","story":"Historia","reel":"Reel"}[format||igFormat]||"Post";
      setPubMsg({ok:true,text:formatLabel+" publicada en @gonvinardell!"});
      showToast(formatLabel+" publicada exitosamente!","ok");
    }catch(e){setPubMsg({ok:false,text:"Error: "+e.message});}
    finally{setPublishing(false);}
  };

  return (
    <div className="editor-wrap">
      <div className="editor-box">
        <div style={{flex:"0 0 340px"}}>
          <div className="lbl">Preview — arrastrá texto{form.showLogo&&form.logoBase64?" o logo":""}</div>
          <div
            ref={previewRef}
            style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",cursor:dragMode?"grabbing":"crosshair",position:"relative",userSelect:"none"}}
            onMouseDown={handlePreviewMouseDown}
            onMouseMove={handlePreviewMouseMove}
            onMouseUp={handlePreviewMouseUp}
            onMouseLeave={handlePreviewMouseUp}
            onTouchStart={handlePreviewTouchStart}
            onTouchMove={handlePreviewTouch}
            onTouchEnd={handlePreviewMouseUp}
          >
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",pointerEvents:"none"}} />
            {/* Indicador de logo arrastrable - solo posición, sin handle de resize */}
            {form.showLogo&&form.logoBase64&&(
              <div style={{
                position:"absolute",
                left:`${(form.logoX||0.88)*100}%`,
                top:`${(form.logoY||0.88)*100}%`,
                transform:"translate(-50%,-50%)",
                pointerEvents:"none",
                width:8,height:8,
                borderRadius:"50%",
                background:"var(--accent2)",
                boxShadow:"0 0 0 3px rgba(168,85,247,0.4)",
              }} />
            )}
            <div style={{position:"absolute",bottom:8,left:0,right:0,textAlign:"center",fontSize:10,color:"rgba(255,255,255,.4)",pointerEvents:"none"}}>
              {form.showLogo&&form.logoBase64?"Arrastrá texto o logo · Esquina del logo para redimensionar":"Click para mover el texto"}
            </div>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginTop:6}}>1080×1080px</div>
        </div>

        <div style={{flex:1,minWidth:260,display:"flex",flexDirection:"column",gap:13,overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontSize:16,fontWeight:700}}>Editor de diseño</h3>
            <button onClick={onClose} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:14}}>✕</button>
          </div>

          <div>
            <span className="lbl">Texto sobre la imagen</span>
            <input value={form.overlayText} onChange={e=>upd("overlayText",e.target.value)} placeholder="Máximo 5-6 palabras..." style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit"}} />
          </div>

          <div>
            <span className="lbl">Caption del post</span>
            <textarea value={form.caption} onChange={e=>upd("caption",e.target.value)} rows={4}
              style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:12,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit",resize:"none"}} />
          </div>

          <div>
            <span className="lbl">Tipografía</span>
            <select value={form.fontFamily} onChange={e=>upd("fontFamily",e.target.value)}
              style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",cursor:"pointer"}}>
              <option value="Impact">Impact — DISPLAY</option>
              <option value="Arial">Arial — Sans-Serif</option>
              <option value="Georgia">Georgia — Serif</option>
              <option value="'Courier New'">Courier New — Mono</option>
              <option value="'Times New Roman'">Times New Roman — Clásica</option>
              <option value="Verdana">Verdana — Legible</option>
            </select>
          </div>

          <div>
            <span className="lbl">Peso</span>
            <div style={{display:"flex",gap:6}}>
              {[["normal","Normal"],["bold","Negrita"],["900","Extra Bold"]].map(([v,l])=>(
                <button key={v} onClick={()=>upd("fontWeight",v)} className="btn"
                  style={{flex:1,padding:"7px",fontSize:12,
                    background:form.fontWeight===v?"rgba(109,40,217,.2)":"var(--surface2)",
                    border:"1px solid "+(form.fontWeight===v?"var(--accent2)":"var(--border)"),
                    color:form.fontWeight===v?"var(--accent2)":"var(--muted)",
                    fontFamily:form.fontFamily,fontWeight:v}}>
                  {l}
                </button>

            </div>
          </div>

          <div style={{display:"flex",gap:12,alignItems:"flex-end"}}>
            <div style={{flex:1}}>
              <span className="lbl">Tamaño ({form.fontSize}px canvas = {Math.round(form.fontSize*1080/500)}px real)</span>
              <input type="range" min={12} max={120} value={form.fontSize}

            <div>

          </div>

          <div>
            <button onClick={()=>upd("textBg",!form.textBg)} className="btn"
              style={{background:form.textBg?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.textBg?"var(--accent2)":"var(--border)"),color:form.textBg?"var(--accent2)":"var(--muted)",fontSize:12,padding:"8px 14px"}}>
              {form.textBg?"✓ Fondo oscuro: ON":"○ Fondo oscuro: OFF"}
            </button>
          </div>

          {/* TOGGLE LOGO */}
          <div>
            {form.logoBase64
              ? (
                <div style={{display:"flex",flexDirection:"column",gap:8}}>
                  <button onClick={()=>upd("showLogo",!form.showLogo)} className="btn"
                    style={{background:form.showLogo?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.showLogo?"var(--accent2)":"var(--border)"),color:form.showLogo?"var(--accent2)":"var(--muted)",fontSize:12,padding:"8px 14px",gap:10,alignSelf:"flex-start"}}>
                    <img src={form.logoBase64} alt="logo" style={{width:20,height:20,objectFit:"contain",borderRadius:3,background:"rgba(255,255,255,0.1)"}} />
                    {form.showLogo?"✓ Logo: visible":"○ Logo: oculto"}
                  </button>
                  {form.showLogo&&(
                    <div>
                      <span className="lbl">Tamaño del logo ({Math.round((form.logoSize||0.15)*100)}%)</span>
                      <input type="range" min={5} max={45} value={Math.round((form.logoSize||0.15)*100)}
                        onChange={e=>upd("logoSize", +e.target.value/100)}
                        style={{width:"100%",accentColor:"var(--accent)"}} />
                      <div style={{fontSize:10,color:"var(--muted)",marginTop:4}}>Arrastrá el logo en el preview para moverlo</div>
                    </div>
                  )}
                </div>
              )
              : (
                <div style={{fontSize:12,color:"var(--muted)",padding:"8px 0"}}>
                  Sin logo — cargalo en <strong style={{color:"var(--accent2)"}}>Mi Marca</strong> para mostrarlo en los posts.
                </div>
              )
            }
          </div>

          {pubMsg&&<div style={{background:pubMsg.ok?"#0d2b1f":"#1f0d0d",border:"1px solid "+(pubMsg.ok?"var(--success)":"var(--error)"),color:pubMsg.ok?"var(--success)":"var(--error)",padding:"10px 14px",borderRadius:8,fontSize:12,fontWeight:600}}>{pubMsg.text}</div>}

          {/* FORMAT PICKER MODAL (inline) */}
          {showFormatPicker&&(
            <div style={{background:"var(--surface2)",border:"1px solid var(--accent2)",borderRadius:12,padding:"14px",display:"flex",flexDirection:"column",gap:8}} className="fade-in">
              <div style={{fontSize:12,fontWeight:700,color:"var(--accent2)",marginBottom:2}}>¿Cómo querés publicar en Instagram?</div>
              {[
                {id:"post",icon:"🖼",label:"Publicación",desc:"Post estático en el feed"},
                {id:"story",icon:"📱",label:"Historia",desc:"Desaparece en 24 hs"},
                {id:"reel",icon:"🎬",label:"Reel",desc:"Video corto (requiere video)"},
              ].map(f=>(
                <button key={f.id} onClick={()=>publishIG(f.id)}
                  style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:9,background:igFormat===f.id?"rgba(232,72,186,.15)":"rgba(255,255,255,.04)",border:"1px solid "+(igFormat===f.id?"#E1306C":"var(--border)"),cursor:"pointer",color:"var(--text)",textAlign:"left",width:"100%"}}>
                  <span style={{fontSize:22}}>{f.icon}</span>
                  <div>
                    <div style={{fontWeight:700,fontSize:13}}>{f.label}</div>
                    <div style={{fontSize:11,color:"var(--muted)"}}>{f.desc}</div>
                  </div>
                  {publishing&&<div className="spin" style={{marginLeft:"auto"}} />}
                </button>
              ))}
              <button onClick={()=>setShowFormatPicker(false)} style={{background:"none",border:"none",color:"var(--muted)",fontSize:12,cursor:"pointer",padding:"4px 0"}}>Cancelar</button>
            </div>
          )}

          <div style={{display:"flex",gap:8,marginTop:"auto"}}>
            <button onClick={download} className="btn btn-ghost" style={{flex:1}}>⬇ Descargar</button>
            <button onClick={()=>onSave(form)} className="btn btn-ghost" style={{flex:1}}>✓ Guardar</button>
            <button onClick={()=>setShowFormatPicker(v=>!v)} disabled={publishing} className="btn btn-primary"
              style={{flex:1,background:publishing?"var(--surface2)":"linear-gradient(135deg,#E1306C,#833AB4)"}}>
              {publishing?<><div className="spin"/>Publicando</>:"🚀 Publicar IG"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

function PostMiniCard({post, postNum}) {
  const canvasRef = useRef();
  useEffect(()=>{ if(canvasRef.current && post) drawPost(canvasRef.current, post); },[post]);
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',gap:4}}>
      <div style={{position:'relative',width:'100%',aspectRatio:'1',borderRadius:10,overflow:'hidden',background:'var(--bg)',border:'2px solid var(--border)'}}>
        <canvas ref={canvasRef} style={{width:'100%',height:'100%',display:'block'}} />
        <div style={{position:'absolute',top:4,left:4,background:'linear-gradient(135deg,var(--accent),var(--accent2))',borderRadius:6,padding:'2px 7px',fontSize:11,fontWeight:800,color:'#fff'}}>#{postNum}</div>
      </div>
      <div style={{fontSize:10,color:'var(--muted)'}}>Post #{postNum}</div>
    </div>
  );
}

function ScheduleScreen({socials,showToast}) {
  const now = new Date();
  const [year,setYear]=useState(now.getFullYear());
  const [month,setMonth]=useState(now.getMonth());
  const [schedules,setSchedules]=useState(store.get("schedules")||{});
  const [posts,setPosts]=useState(store.get("posts")||[]);
  const [selectedDate,setSelectedDate]=useState(null);
  const [showModal,setShowModal]=useState(false);
  const [modalData,setModalData]=useState({postNum:1,hour:"09:00",net:"instagram"});
  const [dragPost,setDragPost]=useState(null);
  const connected=socials.filter(s=>s.connected);

  const MONTHS=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  const DAYS_HEADER=["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  const saveSchedules=(s)=>{setSchedules(s);store.set("schedules",s);};
  const getDaysInMonth=(y,m)=>new Date(y,m+1,0).getDate();
  const getFirstDayOfMonth=(y,m)=>new Date(y,m,1).getDay();
  const prevMonth=()=>{if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1);};
  const nextMonth=()=>{if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1);};
  const dateKey=(y,m,d)=>`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
  const todayKey=dateKey(now.getFullYear(),now.getMonth(),now.getDate());

  const openModal=(day)=>{
    const key=dateKey(year,month,day);
    setSelectedDate({day,key,label:day+" de "+MONTHS[month]+" "+year});
    const existing=schedules[key];
    setModalData(existing||{postNum:dragPost||1,hour:"09:00",net:connected[0]?.id||"instagram"});
    setShowModal(true);
  };

  const assignPost=()=>{
    saveSchedules({...schedules,[selectedDate.key]:modalData});
    setShowModal(false);
    setDragPost(null);
    showToast("Post #"+modalData.postNum+" — "+selectedDate.label+" "+modalData.hour,"ok");
  };

  const removeSchedule=(key,e)=>{
    if(e)e.stopPropagation();
    const s={...schedules}; delete s[key]; saveSchedules(s);
  };

  const daysInMonth=getDaysInMonth(year,month);
  const firstDay=getFirstDayOfMonth(year,month);
  const totalCells=Math.ceil((firstDay+daysInMonth)/7)*7;
  const scheduledCount=Object.keys(schedules).length;
  const selectedPosts=posts.slice(0,7);

  return (
    <div style={{padding:"24px 28px",display:"flex",gap:20,height:"100%",minHeight:0}} className="fade-in">
      <div style={{width:200,flexShrink:0,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:15,marginBottom:4}}>Mis publicaciones</div>
        <div style={{fontSize:11,color:"var(--muted)",marginBottom:8,lineHeight:1.5}}>Hacé click en un día del calendario para asignar el post deseado.</div>
        {selectedPosts.length===0?(
          <div style={{color:"var(--muted)",fontSize:12,textAlign:"center",padding:"20px 0"}}>Primero generá las publicaciones.</div>
        ):(
          <div style={{display:"flex",flexDirection:"column",gap:10,overflowY:"auto"}}>
            {selectedPosts.map((post,i)=>(
              <div key={i} onClick={()=>setDragPost(i+1)}
                style={{cursor:"pointer",outline:dragPost===i+1?"3px solid var(--accent2)":"none",borderRadius:12,transition:"all .15s",transform:dragPost===i+1?"scale(1.03)":"scale(1)"}}>
                <PostMiniCard post={post} postNum={i+1} />
              </div>
            ))}
          </div>
        )}
        {dragPost&&(
          <div style={{marginTop:8,background:"rgba(109,40,217,.15)",border:"1px solid var(--accent2)",borderRadius:10,padding:"10px",textAlign:"center"}}>
            <div style={{fontSize:12,color:"var(--accent2)",fontWeight:600}}>Post #{dragPost} seleccionado</div>
            <div style={{fontSize:11,color:"var(--muted)",marginTop:3}}>Ahora hacé click en el día</div>
            <button onClick={()=>setDragPost(null)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:11,marginTop:4}}>Cancelar</button>
          </div>
        )}
      </div>

      <div style={{flex:1,minWidth:0,display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between"}}>
          <button onClick={prevMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>‹</button>
          <div style={{fontFamily:"'Syne',sans-serif",fontWeight:800,fontSize:18}}>{MONTHS[month]} {year}</div>
          <button onClick={nextMonth} className="btn btn-ghost" style={{padding:"7px 14px",fontSize:16}}>›</button>
        </div>

        {posts.length===0?(
          <div className="card" style={{textAlign:"center",padding:"40px",color:"var(--muted)"}}>
            <div style={{fontSize:32,marginBottom:12}}>📋</div>
            <div style={{fontWeight:600,marginBottom:6}}>No hay publicaciones generadas</div>
            <div style={{fontSize:13}}>Volvé a "Crear publicación" y generá las 7 publicaciones.</div>
          </div>
        ):(
          <>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {DAYS_HEADER.map(d=>(
                <div key={d} style={{textAlign:"center",fontSize:11,fontWeight:700,color:"var(--muted)",letterSpacing:1,padding:"4px 0"}}>{d}</div>
              ))}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",gap:4}}>
              {Array.from({length:totalCells},(_,i)=>{
                const day=i-firstDay+1;
                const isValid=day>=1&&day<=daysInMonth;
                const key=isValid?dateKey(year,month,day):null;
                const sched=key&&schedules[key];
                const isToday=key===todayKey;
                const isPast=key&&key<todayKey;
                const soc=sched&&socials.find(s=>s.id===sched.net);
                const isClickable=isValid&&!isPast;
                return (
                  <div key={i}
                    onClick={()=>{
                      if(!isClickable)return;
                      if(dragPost){
                        const k=dateKey(year,month,day);
                        setSelectedDate({day,key:k,label:day+" de "+MONTHS[month]+" "+year});
                        setModalData({postNum:dragPost,hour:"09:00",net:connected[0]?.id||"instagram"});
                        setShowModal(true);
                      } else openModal(day);
                    }}
                    style={{minHeight:72,borderRadius:10,padding:"7px 6px",background:!isValid?"transparent":sched?"rgba(109,40,217,.18)":isPast?"rgba(255,255,255,.015)":dragPost?"rgba(109,40,217,.05)":"var(--surface2)",border:!isValid?"none":"2px solid "+(isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)"),cursor:isClickable?"pointer":"default",opacity:isPast?0.35:1,transition:"all .15s",display:"flex",flexDirection:"column",gap:3,boxShadow:dragPost&&isClickable?"0 0 0 2px rgba(168,85,247,.3) inset":"none"}}
                    onMouseEnter={e=>{if(isClickable)e.currentTarget.style.borderColor="var(--accent2)";}}
                    onMouseLeave={e=>{if(isValid)e.currentTarget.style.borderColor=isToday?"var(--accent2)":sched?"rgba(168,85,247,.5)":"var(--border)";}}
                  >
                    {isValid&&(
                      <>
                        <div style={{fontSize:12,fontWeight:isToday?800:400,color:isToday?"var(--accent2)":"var(--text)"}}>{day}</div>
                        {sched&&(
                          <>
                            <div style={{background:"linear-gradient(135deg,var(--accent),var(--accent2))",borderRadius:5,padding:"2px 5px",fontSize:10,fontWeight:800,color:"#fff",textAlign:"center"}}>#{sched.postNum}</div>
                            <div style={{fontSize:9,color:"var(--accent2)",textAlign:"center"}}>{sched.hour}</div>
                            <div style={{fontSize:11,textAlign:"center"}}>{soc?.icon}</div>
                            <button onClick={(e)=>removeSchedule(key,e)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:9,padding:0,lineHeight:1}}>✕ quitar</button>
                          </>
                        )}
                      </>
                    )}
                  </div>
                );
              })}
            </div>
            <div className="card">
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <div style={{fontWeight:600,fontSize:14}}>Posts programados</div>
                <div style={{fontSize:12,color:"var(--muted)"}}>{scheduledCount} en total</div>
              </div>
              {scheduledCount===0
                ?<div style={{color:"var(--muted)",fontSize:13,textAlign:"center",padding:"8px 0"}}>Seleccioná un post del panel izquierdo y hacé click en un día.</div>
                :<div style={{display:"flex",flexDirection:"column",gap:5,maxHeight:150,overflowY:"auto"}}>
                  {Object.entries(schedules).sort(([a],[b])=>a.localeCompare(b)).map(([key,sched])=>{
                    const soc=socials.find(s=>s.id===sched.net);
                    const [y,m,d]=key.split("-");
                    const date=new Date(+y,+m-1,+d);
                    const label=date.toLocaleDateString("es-AR",{weekday:"short",day:"numeric",month:"short"});
                    return(
                      <div key={key} style={{display:"flex",alignItems:"center",gap:8,padding:"4px 0",borderBottom:"1px solid var(--border)",fontSize:12}}>
                        <span>{soc?.icon}</span>
                        <span style={{flex:1,textTransform:"capitalize"}}>{label}</span>
                        <span style={{color:"var(--muted)"}}>{sched.hour}</span>
                        <span style={{background:"rgba(109,40,217,.2)",border:"1px solid rgba(168,85,247,.3)",borderRadius:20,padding:"2px 8px",color:"var(--accent2)"}}>Post #{sched.postNum}</span>
                        <button onClick={()=>removeSchedule(key)} style={{background:"none",border:"none",color:"var(--error)",cursor:"pointer",fontSize:12}}>✕</button>
                      </div>
                    );
                  })}
                </div>
              }
              {scheduledCount>0&&(
                <button className="btn btn-primary" style={{width:"100%",marginTop:12}} onClick={()=>showToast("Calendario confirmado! MCM publicará automáticamente.","ok")}>
                  ✓ Confirmar calendario
                </button>
              )}
            </div>
          </>
        )}
      </div>

      {showModal&&selectedDate&&(
        <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.88)",zIndex:200,display:"flex",alignItems:"center",justifyContent:"center",padding:16,backdropFilter:"blur(16px)"}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:18,padding:28,width:"100%",maxWidth:440}} className="fade-in">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <h3 style={{fontSize:16,fontWeight:700}}>📅 {selectedDate.label}</h3>
              <button onClick={()=>setShowModal(false)} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:28,height:28,borderRadius:7,cursor:"pointer"}}>✕</button>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              <div>
                <span className="lbl">Publicación (1-7)</span>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {Array.from({length:7},(_,i)=>i+1).map(n=>(
                    <button key={n} onClick={()=>setModalData(p=>({...p,postNum:n}))} className="btn"
                      style={{width:44,height:44,padding:0,fontSize:15,fontWeight:800,background:modalData.postNum===n?"rgba(109,40,217,.3)":"var(--surface2)",border:"2px solid "+(modalData.postNum===n?"var(--accent2)":"var(--border)"),color:modalData.postNum===n?"var(--accent2)":"var(--muted)",borderRadius:10}}>
                      {n}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Horario</span>
                <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
                  {["07:00","08:00","09:00","10:00","11:00","12:00","13:00","14:00","15:00","16:00","17:00","18:00","19:00","20:00","21:00","22:00"].map(h=>(
                    <button key={h} onClick={()=>setModalData(p=>({...p,hour:h}))} className="btn"
                      style={{padding:"6px 9px",fontSize:12,background:modalData.hour===h?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(modalData.hour===h?"var(--accent2)":"var(--border)"),color:modalData.hour===h?"var(--accent2)":"var(--muted)",borderRadius:8}}>
                      {h}
                    </button>
                  ))}
                </div>
              </div>
              <div>
                <span className="lbl">Red social</span>
                {connected.length===0
                  ?<div style={{color:"var(--muted)",fontSize:13}}>No tenés redes conectadas.</div>
                  :<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                    {connected.map(s=>(
                      <button key={s.id} onClick={()=>setModalData(p=>({...p,net:s.id}))} className="btn"
                        style={{padding:"7px 14px",fontSize:13,background:modalData.net===s.id?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(modalData.net===s.id?"var(--accent2)":"var(--border)"),color:modalData.net===s.id?"var(--accent2)":"var(--muted)"}}>
                        {s.icon} {s.name}
                      </button>
                    ))}
                  </div>}
              </div>
              <button className="btn btn-primary" style={{width:"100%"}} onClick={assignPost}>
                Programar Post #{modalData.postNum} — {selectedDate.label} {modalData.hour}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
