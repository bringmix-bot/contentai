<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MCM — My Community Manager</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;
  --accent:#6d28d9;--accent2:#a855f7;--pink:#ec4899;
  --text:#f0f0ff;--muted:#6b6b8a;--success:#22d3ee;--error:#f43f5e;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:'Inter',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s}
input:focus,textarea:focus{border-color:var(--accent2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:none}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite}
.fade-in{animation:fadeIn .35s ease both}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px}
.main{flex:1;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:24px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:'Syne',sans-serif;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(109,40,217,.15);color:var(--accent2);border-color:rgba(168,85,247,.2)}
.nav-section{font-size:10px;color:var(--muted);letter-spacing:2px;padding:8px 12px 4px;margin-top:8px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s}
.step-dot.done{background:var(--success)}.step-dot.active{background:var(--accent2)}
.social-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:border-color .2s}
.social-card.connected{border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.03)}
.social-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.file-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color .2s}
.file-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;color:var(--muted);font-size:12px;transition:all .2s}
.file-add:hover{border-color:var(--accent2);color:var(--accent2)}
.post-option{background:var(--surface2);border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s}
.post-option:hover{border-color:var(--accent2);transform:translateY(-2px)}
.post-option.selected{border-color:var(--accent)}
.post-canvas-wrap{aspect-ratio:1;background:var(--bg);overflow:hidden}
.post-caption{padding:12px;font-size:12px;color:var(--muted);line-height:1.6;max-height:80px;overflow:hidden}
.editor-wrap{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(20px)}
.editor-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:24px;width:100%;max-width:980px;max-height:92vh;overflow-y:auto;display:flex;gap:24px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;max-width:340px;animation:fadeIn .3s ease}
.toast.ok{background:#0d2b1f;border:1px solid var(--success);color:var(--success)}
.toast.err{background:#1f0d0d;border:1px solid var(--error);color:var(--error)}
.toast.info{background:#1a0d2e;border:1px solid var(--accent2);color:var(--accent2)}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("mcm_"+k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem("mcm_"+k, JSON.stringify(v)),
};

function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null),3500); };
  return [t, show];
}

const SOCIALS_DEFAULT = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
];

async function generateText(prompt) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d = await r.json();
  return d.text||"";
}

async function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function hexToRgb(hex) {
  try {
    const h = hex.replace("#","");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  } catch { return {r:109,g:40,b:217}; }
}

function coverImg(ctx, img, x, y, w, h) {
  if (!img) return;
  const s = Math.max(w/img.width, h/img.height);
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

function rRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// Fallback texts so templates always look like real posts
const FALLBACK_HEADLINES = ["CALIDAD QUE SE NOTA","TU MEJOR OPCION","HACEMOS LA DIFERENCIA","PARA VOS Y LOS TUYOS","EL SABOR DE SIEMPRE","EXPERIENCIA Y PASION","RESULTADOS REALES","COMENZAR HOY"];
const FALLBACK_CAPTIONS = [
  "Porque cada detalle importa. Vení a conocernos y descubrí por qué somos la mejor opción del mercado. #calidad #excelencia",
  "Más de 10 años de experiencia nos respaldan. Tu confianza es nuestra mayor recompensa. #profesionalismo #confianza",
  "Transformamos tu idea en realidad. Contactanos hoy y empezá el cambio que siempre quisiste. #innovacion #resultados",
];

function getFallbackText(opt, seed) {
  const idx = (seed||0) % FALLBACK_HEADLINES.length;
  return {
    headline: opt.overlayText && opt.overlayText.trim() ? opt.overlayText.replace(/[\*\_\#]/g,"").trim().toUpperCase() : FALLBACK_HEADLINES[idx],
    caption: opt.caption && opt.caption.trim() ? opt.caption : FALLBACK_CAPTIONS[idx % FALLBACK_CAPTIONS.length],
    brandName: opt.brandName || "MCM",
  };
}

function wrapText(ctx, text, maxW, maxLines) {
  const words = text.split(" "); const lines = []; let line = "";
  for(const w of words) {
    const t = line + (line?" ":"") + w;
    if(ctx.measureText(t).width > maxW) { if(line) lines.push(line); line = w; if(lines.length >= maxLines-1) { lines.push(words.slice(words.indexOf(w)).join(" ")); return lines; } }
    else line = t;
  }
  if(line) lines.push(line); return lines;
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 1 — FOTO EDITORIAL
// Foto protagonista. Bottom 40% cubierto con degradé oscuro + texto grande.
// Texto SIEMPRE visible. Estilo: revista premium.
// ════════════════════════════════════════════════════════════════
async function drawTemplate1(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const bgImg = opt.imgSrc ? await loadImg(opt.imgSrc) : null;
  const {headline, caption, brandName} = getFallbackText(opt, opt.seed);

  // ── FULL BLEED PHOTO ──
  if(bgImg) {
    coverImg(ctx, bgImg, 0, 0, W, H);
  } else {
    // Rich gradient background if no photo
    const bg = ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,`rgb(${Math.min(r+40,255)},${Math.min(g+20,255)},${Math.min(b+60,255)})`);
    bg.addColorStop(0.5,`rgb(${r},${g},${b})`);
    bg.addColorStop(1,"#000");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    // Pattern overlay
    ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
    for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  }

  // ── BOTTOM GRADIENT — covers bottom 48% for text readability ──
  const botGrad = ctx.createLinearGradient(0, H*0.42, 0, H);
  botGrad.addColorStop(0,"rgba(0,0,0,0)");
  botGrad.addColorStop(0.3,"rgba(0,0,0,0.7)");
  botGrad.addColorStop(1,"rgba(0,0,0,0.96)");
  ctx.fillStyle=botGrad; ctx.fillRect(0,H*0.42,W,H*0.58);

  // ── BRAND COLOR TOP BAR ──
  ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,W,8);

  // ── BRAND LABEL top left ──
  ctx.font="700 20px Arial,sans-serif";
  ctx.fillStyle="#ffffff"; ctx.textAlign="left";
  ctx.shadowColor="rgba(0,0,0,0.8)"; ctx.shadowBlur=8;
  ctx.fillText("● "+brandName.toUpperCase(), 40, 52);
  ctx.shadowBlur=0;

  // ── MAIN HEADLINE — bottom section, 2-3 words per line, HUGE ──
  const words = headline.split(" ");
  const lines = [];
  for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));

  let size = 160;
  ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
  while(size > 48) {
    ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
    if(Math.max(...lines.map(l=>ctx.measureText(l).width)) <= W-100) break;
    size -= 4;
  }

  const lineH = size * 0.92;
  // Position: text occupies bottom zone, above caption
  const captionH = 80; // space reserved for caption
  const textZoneBottom = H - captionH - 40;
  const totalTextH = lines.length * lineH;
  const startY = textZoneBottom - totalTextH;

  ctx.fillStyle="#ffffff"; ctx.textAlign="left";
  ctx.shadowColor="rgba(0,0,0,0.9)"; ctx.shadowBlur=20;
  lines.forEach((ln,i) => ctx.fillText(ln, 40, startY + i*lineH + size*0.85));
  ctx.shadowBlur=0;

  // ── COLOR ACCENT LINE under headline ──
  ctx.fillStyle=`rgb(${r},${g},${b})`;
  ctx.fillRect(40, startY + totalTextH + size*0.85 - lineH*0.15 + 8, 200, 6);

  // ── CAPTION TEXT ──
  ctx.font="400 28px Arial,sans-serif";
  ctx.fillStyle="rgba(255,255,255,0.72)"; ctx.textAlign="left";
  const shortCaption = caption.replace(/#\S+/g,"").trim().slice(0,80);
  ctx.fillText(shortCaption + (caption.length>80?"…":""), 40, H-44);

  // ── WATERMARK ──
  ctx.font="600 18px Arial"; ctx.fillStyle=`rgba(${r},${g},${b},0.9)`; ctx.textAlign="right";
  ctx.fillText("MCM", W-36, H-28);
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 2 — DISEÑO GRÁFICO PURO
// Sin foto. Tipografía masiva + geometría. Texto más extenso.
// Variante visual basada en número de post (seed) para diversidad.
// ════════════════════════════════════════════════════════════════
async function drawTemplate2(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();
  const seed = opt.seed || 0; // post index for variation
  const variant = seed % 3; // 3 layout variants

  if(variant === 0) {
    // ── VARIANT A: Diagonal split ──
    ctx.fillStyle="#050510"; ctx.fillRect(0,0,W,H);

    // Left color panel (diagonal cut)
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(0,0); ctx.lineTo(W*0.55,0); ctx.lineTo(W*0.38,H); ctx.lineTo(0,H); ctx.closePath();
    ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fill();
    ctx.restore();

    // Dots grid on right side
    ctx.fillStyle="rgba(255,255,255,0.06)";
    for(let dx=W*0.5;dx<W;dx+=36) for(let dy=0;dy<H;dy+=36) {
      ctx.beginPath(); ctx.arc(dx,dy,2,0,Math.PI*2); ctx.fill();
    }

    // Large number / decorative element
    ctx.font=`900 420px Impact,'Arial Black',sans-serif`;
    ctx.fillStyle=`rgba(${r},${g},${b},0.12)`;
    ctx.textAlign="right";
    ctx.fillText("0"+(((seed||0)%7)+1), W-30, H*0.75);

    // Headline on colored panel
    if(text) {
      const words=text.split(" ");
      const lines=[]; for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
      let size=130;
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      while(size>36){ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W*0.45-30)break;size-=4;}
      ctx.fillStyle="#ffffff"; ctx.textAlign="left";
      ctx.shadowColor="rgba(0,0,0,0.3)"; ctx.shadowBlur=8;
      const lineH=size*0.95; const startY=H*0.2+size*0.85;
      lines.forEach((ln,i)=>ctx.fillText(ln, 48, startY+i*lineH));
      ctx.shadowBlur=0;
    }

    // Body text on dark right panel
    if(caption) {
      const sz=30; ctx.font=`300 ${sz}px Arial,sans-serif`;
      ctx.fillStyle="rgba(255,255,255,0.72)"; ctx.textAlign="left";
      const maxW=W*0.52; const words=caption.split(" ");
      const lines=[]; let line="";
      for(const w of words){
        const t=line+(line?" ":"")+w;
        if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}else line=t;
        if(lines.length>=5) break;
      }
      if(line&&lines.length<5) lines.push(line);
      const bodyY=H-220;
      lines.forEach((ln,i)=>ctx.fillText(ln, W*0.46, bodyY+i*(sz*1.5)));
    }

    // Bottom bar
    ctx.fillStyle="rgba(0,0,0,0.85)"; ctx.fillRect(0,H-60,W,60);
    ctx.font="700 20px Arial"; ctx.fillStyle="#ffffff"; ctx.textAlign="right";
    ctx.fillText("MY COMMUNITY MANAGER", W-40, H-20);

  } else if(variant === 1) {
    // ── VARIANT B: Horizontal stripes + massive type ──
    ctx.fillStyle="#000000"; ctx.fillRect(0,0,W,H);

    // Horizontal colored stripes
    const stripes=[0.08,0.16,0.24,0.32,0.40,0.48,0.56,0.64,0.72,0.80,0.88,0.96];
    stripes.forEach((y,i)=>{
      ctx.fillStyle=i%2===0?`rgba(${r},${g},${b},0.08)`:"rgba(255,255,255,0.02)";
      ctx.fillRect(0,H*y,W,H*0.08);
    });

    // Full-width color band
    ctx.fillStyle=`rgb(${r},${g},${b})`;
    ctx.fillRect(0,H*0.46,W,H*0.12);

    // Big text across color band (inverted)
    if(text) {
      const words=text.split(" ");
      let size=100;
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      while(size>24&&ctx.measureText(text).width>W-80) size-=4;
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      ctx.fillStyle="#000000"; ctx.textAlign="center";
      ctx.fillText(text, W/2, H*0.46+H*0.12*0.68);
    }

    // Large decorative letter top
    ctx.font=`900 380px Impact,'Arial Black',sans-serif`;
    ctx.fillStyle=`rgba(${r},${g},${b},0.07)`; ctx.textAlign="center";
    ctx.fillText(text ? text[0] : "M", W/2, H*0.4);

    // Caption text bottom
    if(caption) {
      const sz=28; ctx.font=`400 ${sz}px Arial,sans-serif`;
      ctx.fillStyle="rgba(255,255,255,0.65)"; ctx.textAlign="center";
      const maxW=W-200; const words=caption.split(" ");
      const lines=[]; let line="";
      for(const w of words){const t=line+(line?" ":"")+w;if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}else line=t;if(lines.length>=3)break;}
      if(line&&lines.length<3)lines.push(line);
      lines.forEach((ln,i)=>ctx.fillText(ln, W/2, H*0.72+i*(sz*1.5)));
    }

    ctx.font="700 18px Arial"; ctx.fillStyle=`rgba(${r},${g},${b},0.9)`; ctx.textAlign="left";
    ctx.fillText("● MCM", 48, H-28);

  } else {
    // ── VARIANT C: Geometric shapes composition ──
    ctx.fillStyle="#03020a"; ctx.fillRect(0,0,W,H);

    // Background large circle
    ctx.beginPath(); ctx.arc(W*0.5, H*0.42, W*0.38, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(${r},${g},${b},0.18)`; ctx.lineWidth=2; ctx.stroke();
    ctx.beginPath(); ctx.arc(W*0.5, H*0.42, W*0.28, 0, Math.PI*2);
    ctx.strokeStyle=`rgba(${r},${g},${b},0.12)`; ctx.lineWidth=1; ctx.stroke();

    // Filled circle — color
    ctx.beginPath(); ctx.arc(W*0.78, H*0.22, W*0.16, 0, Math.PI*2);
    ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fill();

    // Bottom-left rectangle
    rRect(ctx, 0, H*0.72, W*0.42, H*0.28, 0);
    ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fill();

    // Corner brackets decorative
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=3;
    // top-left
    ctx.beginPath(); ctx.moveTo(36,36); ctx.lineTo(36,100); ctx.moveTo(36,36); ctx.lineTo(100,36); ctx.stroke();
    // bottom-right
    ctx.beginPath(); ctx.moveTo(W-36,H-36); ctx.lineTo(W-36,H-100); ctx.moveTo(W-36,H-36); ctx.lineTo(W-100,H-36); ctx.stroke();

    // Headline — large, white on dark
    if(text) {
      const words=text.split(" ");
      const lines=[]; for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
      let size=138;
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      while(size>36){ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W*0.8)break;size-=4;}
      ctx.fillStyle="#ffffff"; ctx.textAlign="center";
      const lH=size*0.95; const startY=H*0.18+size*0.85;
      lines.forEach((ln,i)=>ctx.fillText(ln, W/2, startY+i*lH));
    }

    // Caption on colored rectangle (bottom-left)
    if(caption) {
      const sz=26; ctx.font=`400 ${sz}px Arial,sans-serif`;
      ctx.fillStyle="rgba(255,255,255,0.85)"; ctx.textAlign="left";
      const maxW=W*0.36; const words=caption.split(" ");
      const lines=[]; let line="";
      for(const w of words){const t=line+(line?" ":"")+w;if(ctx.measureText(t).width>maxW){if(line)lines.push(line);line=w;}else line=t;if(lines.length>=4)break;}
      if(line&&lines.length<4)lines.push(line);
      lines.forEach((ln,i)=>ctx.fillText(ln, 32, H*0.78+i*(sz*1.45)));
    }

    // White circle with brand initial on colored circle
    ctx.beginPath(); ctx.arc(W*0.78, H*0.22, 36, 0, Math.PI*2);
    ctx.fillStyle="rgba(255,255,255,0.15)"; ctx.fill();
    ctx.font="700 26px Arial"; ctx.fillStyle="#fff"; ctx.textAlign="center";
    ctx.fillText("M", W*0.78, H*0.22+9);
  }
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 3 — FONDO GENERADO POR IA SEGÚN RUBRO
// Cada industria tiene composición visual única, paleta propia,
// elementos gráficos representativos y 2 sub-variantes.
// ════════════════════════════════════════════════════════════════
async function drawTemplate3(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  const industry = (opt.industry||"").toLowerCase();
  const caption = (opt.caption||"");
  const seed = opt.seed||0;
  const subV = seed % 2; // sub-variant A or B

  // ── INDUSTRY DETECTION ──
  const isFood      = /gastro|restaurante|pizza|cafe|cafeter|comida|food|panaderia|heladeria|granja|organica|cocina|chef|bar |bar$|bebida|fruta|verdura|carnicer|sushi|hamburgues/i.test(industry+caption);
  const isHealth    = /salud|fitness|deporte|medic|bienestar|gym|nutricion|yoga|pilates|psicolog|odontolog|farmacia|clinica/i.test(industry);
  const isRealEstate= /inmobil|construcci|arquitect|ingenieria civil|contratista/i.test(industry);
  const isLandscape = /paisaj|jardin|plantas|vivero|botanica|florister/i.test(industry);
  const isTech      = /tecnolog|software|digital|web|app|programac|desarroll|sistemas|startup|ia |inteligencia/i.test(industry);
  const isFashion   = /moda|ropa|indument|fashion|calzado|accesorio/i.test(industry);
  const isBeauty    = /belleza|estetica|peluquer|cosmet|spa|manicur|maquillaje/i.test(industry);
  const isTourism   = /turismo|viajes|hotel|hospedaje|cabana|lodge|hostel|agencia de viaje/i.test(industry);
  const isEducation = /educac|escuela|academia|instituto|universidad|capacitac|curso|coaching/i.test(industry);
  const isRetail    = /retail|tienda|comercio|venta|negocio|kiosco|supermercado/i.test(industry);
  const isPhoto     = /fotograf|video|audiovisual|produccion/i.test(industry);
  const isConstruc  = /construcci|materiales|ferreteria|pinturer/i.test(industry);

  // ────────────────────────────
  // GASTRONOMÍA — cálido, textural, apetitoso
  // ────────────────────────────
  if(isFood) {
    if(subV===0) {
      // Dark moody kitchen — chiaroscuro
      ctx.fillStyle="#080300"; ctx.fillRect(0,0,W,H);

      // Main warm spot light — center
      const spot=ctx.createRadialGradient(W*0.5,H*0.38,0,W*0.5,H*0.38,W*0.52);
      spot.addColorStop(0,"rgba(220,100,0,0.48)");
      spot.addColorStop(0.4,"rgba(160,50,0,0.22)");
      spot.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=spot; ctx.fillRect(0,0,W,H);

      // Secondary warm glow bottom
      const glow2=ctx.createRadialGradient(W*0.5,H,0,W*0.5,H,W*0.5);
      glow2.addColorStop(0,"rgba(200,80,0,0.2)"); glow2.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=glow2; ctx.fillRect(0,0,W,H);

      // Plate circle composition — large
      ctx.beginPath(); ctx.arc(W*0.5,H*0.38,W*0.3,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,160,40,0.25)"; ctx.lineWidth=2; ctx.stroke();
      ctx.beginPath(); ctx.arc(W*0.5,H*0.38,W*0.22,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,160,40,0.15)"; ctx.lineWidth=1.5; ctx.stroke();
      ctx.beginPath(); ctx.arc(W*0.5,H*0.38,W*0.12,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,160,40,0.3)"; ctx.lineWidth=1; ctx.stroke();

      // Steam lines
      ctx.strokeStyle="rgba(255,200,80,0.07)"; ctx.lineWidth=2;
      [0.38,0.46,0.54,0.62].forEach((xr,i)=>{
        ctx.beginPath();
        for(let y=H*0.55;y>H*0.08;y-=18){
          const wv=Math.sin((y+i*55)*0.05)*14;
          y===Math.round(H*0.55)?ctx.moveTo(W*xr+wv,y):ctx.lineTo(W*xr+wv,y);
        }
        ctx.stroke();
      });

      // Grain
      for(let i=0;i<600;i++){
        ctx.fillStyle=`rgba(255,150,40,${Math.random()*0.035})`;
        ctx.fillRect(Math.random()*W,Math.random()*H,1.5,1.5);
      }
    } else {
      // Rustic warm — linen texture, earthy
      ctx.fillStyle="#0c0600"; ctx.fillRect(0,0,W,H);
      // Warm background gradient
      const bg=ctx.createLinearGradient(0,0,W,H);
      bg.addColorStop(0,"rgba(80,30,0,0.6)"); bg.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
      // Linen grid lines
      ctx.strokeStyle="rgba(220,150,60,0.06)"; ctx.lineWidth=1;
      for(let i=0;i<W;i+=24){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i,H);ctx.stroke();}
      for(let i=0;i<H;i+=24){ctx.beginPath();ctx.moveTo(0,i);ctx.lineTo(W,i);ctx.stroke();}
      // Large fork & knife silhouette (abstract lines)
      ctx.strokeStyle=`rgba(${r},${g},${b},0.22)`; ctx.lineWidth=4; ctx.lineCap="round";
      // Fork
      ctx.beginPath(); ctx.moveTo(W*0.72,H*0.1); ctx.lineTo(W*0.72,H*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W*0.69,H*0.1); ctx.lineTo(W*0.69,H*0.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W*0.75,H*0.1); ctx.lineTo(W*0.75,H*0.35); ctx.stroke();
      // Knife
      ctx.beginPath(); ctx.moveTo(W*0.8,H*0.1); ctx.lineTo(W*0.8,H*0.7); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(W*0.8,H*0.1); ctx.lineTo(W*0.84,H*0.28); ctx.lineTo(W*0.8,H*0.32); ctx.stroke();
      ctx.lineCap="butt";
      // Amber glow center
      const spot=ctx.createRadialGradient(W*0.38,H*0.42,0,W*0.38,H*0.42,W*0.45);
      spot.addColorStop(0,"rgba(200,90,10,0.35)"); spot.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=spot; ctx.fillRect(0,0,W,H);
    }

  // ────────────────────────────
  // SALUD & FITNESS
  // ────────────────────────────
  } else if(isHealth) {
    if(subV===0) {
      // Clean clinical — white/teal/green, energetic
      ctx.fillStyle="#010d06"; ctx.fillRect(0,0,W,H);
      // Energy burst center
      const burst=ctx.createRadialGradient(W*0.5,H*0.42,0,W*0.5,H*0.42,W*0.55);
      burst.addColorStop(0,"rgba(0,230,130,0.3)");
      burst.addColorStop(0.5,"rgba(0,180,100,0.12)");
      burst.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=burst; ctx.fillRect(0,0,W,H);
      // Dynamic diagonal lines (speed)
      ctx.strokeStyle="rgba(0,220,120,0.07)"; ctx.lineWidth=1;
      for(let i=-H;i<W+H;i+=28){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
      // Heartbeat line
      ctx.strokeStyle="rgba(0,240,130,0.55)"; ctx.lineWidth=3; ctx.lineJoin="round";
      ctx.beginPath();
      const hbPts=[0,H*0.5, W*0.15,H*0.5, W*0.22,H*0.5, W*0.28,H*0.2, W*0.32,H*0.72, W*0.38,H*0.42, W*0.44,H*0.5, W*0.55,H*0.5, W,H*0.5];
      for(let i=0;i<hbPts.length;i+=2) i===0?ctx.moveTo(hbPts[i],hbPts[i+1]):ctx.lineTo(hbPts[i],hbPts[i+1]);
      ctx.stroke();
      // Concentric health rings
      [200,145,90].forEach((rad,i)=>{
        ctx.beginPath(); ctx.arc(W*0.82,H*0.22,rad,0,Math.PI*2);
        ctx.strokeStyle=`rgba(0,220,120,${0.2-i*0.05})`; ctx.lineWidth=1.5; ctx.stroke();
      });
    } else {
      // Bold fitness — dark, muscular, red+black
      ctx.fillStyle="#0a0003"; ctx.fillRect(0,0,W,H);
      const glow=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,W*0.6);
      glow.addColorStop(0,"rgba(220,0,60,0.22)"); glow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
      // Grid
      ctx.strokeStyle="rgba(220,0,60,0.06)"; ctx.lineWidth=1;
      for(let x=0;x<W;x+=48){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=48){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Diagonal accent stripe
      ctx.save(); ctx.translate(W*0.5,H*0.5); ctx.rotate(Math.PI*-0.08);
      ctx.fillStyle=`rgba(${r},${g},${b},0.15)`; ctx.fillRect(-W*0.6,-H*0.04,W*1.2,H*0.08);
      ctx.restore();
      // Dumbbell silhouette (abstract)
      ctx.strokeStyle=`rgba(${r},${g},${b},0.3)`; ctx.lineWidth=5; ctx.lineCap="round";
      ctx.beginPath(); ctx.moveTo(W*0.62,H*0.38); ctx.lineTo(W*0.86,H*0.38); ctx.stroke();
      // weights
      [[W*0.62,H*0.38,24],[W*0.86,H*0.38,24]].forEach(([cx,cy,rad])=>{
        ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2);
        ctx.strokeStyle=`rgba(${r},${g},${b},0.35)`; ctx.lineWidth=4; ctx.stroke();
      });
      ctx.lineCap="butt";
    }

  // ────────────────────────────
  // PAISAJISMO & JARDINES
  // ────────────────────────────
  } else if(isLandscape) {
    ctx.fillStyle="#020a02"; ctx.fillRect(0,0,W,H);
    // Rich green atmosphere
    const natGlow=ctx.createRadialGradient(W*0.5,H*0.3,0,W*0.5,H*0.3,W*0.65);
    natGlow.addColorStop(0,"rgba(20,120,20,0.4)");
    natGlow.addColorStop(0.5,"rgba(10,60,10,0.2)");
    natGlow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=natGlow; ctx.fillRect(0,0,W,H);
    // Organic circles (foliage)
    const leaves=[
      [W*0.2,H*0.2,120],[W*0.75,H*0.18,95],[W*0.9,H*0.45,70],
      [W*0.1,H*0.55,85],[W*0.85,H*0.75,60],[W*0.3,H*0.8,75]
    ];
    leaves.forEach(([cx,cy,rad],i)=>{
      ctx.beginPath(); ctx.arc(cx,cy,rad,0,Math.PI*2);
      ctx.fillStyle=`rgba(${20+i*5},${80+i*8},${10+i*3},0.18)`; ctx.fill();
      ctx.strokeStyle=`rgba(40,160,40,0.15)`; ctx.lineWidth=1; ctx.stroke();
    });
    // Thin branch lines
    ctx.strokeStyle="rgba(60,120,20,0.2)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(W*0.5,H); ctx.lineTo(W*0.5,H*0.6);
    ctx.lineTo(W*0.3,H*0.3); ctx.moveTo(W*0.5,H*0.6); ctx.lineTo(W*0.65,H*0.28);
    ctx.moveTo(W*0.65,H*0.28); ctx.lineTo(W*0.78,H*0.16);
    ctx.stroke();
    // Sunray top
    const sun=ctx.createRadialGradient(W*0.5,0,0,W*0.5,0,W*0.55);
    sun.addColorStop(0,"rgba(150,220,50,0.22)"); sun.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=sun; ctx.fillRect(0,0,W,H*0.6);

  // ────────────────────────────
  // INMOBILIARIA / CONSTRUCCIÓN
  // ────────────────────────────
  } else if(isRealEstate || isConstruc) {
    if(subV===0) {
      // Blueprint / plano arquitectónico
      ctx.fillStyle="#020510"; ctx.fillRect(0,0,W,H);
      const bpBg=ctx.createLinearGradient(0,0,W,H);
      bpBg.addColorStop(0,"rgba(10,30,80,0.5)"); bpBg.addColorStop(1,"rgba(0,0,20,0)");
      ctx.fillStyle=bpBg; ctx.fillRect(0,0,W,H);
      // Blueprint grid
      ctx.strokeStyle="rgba(80,140,255,0.1)"; ctx.lineWidth=1;
      for(let x=0;x<W;x+=54){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      ctx.strokeStyle="rgba(80,140,255,0.04)"; ctx.lineWidth=0.5;
      for(let x=0;x<W;x+=18){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
      for(let y=0;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Floor plan silhouette
      ctx.strokeStyle=`rgba(${r},${g},${b},0.45)`; ctx.lineWidth=2;
      const bx=W*0.22, by=H*0.18, bw=W*0.56, bh=H*0.44;
      // Outer walls
      ctx.strokeRect(bx,by,bw,bh);
      // Inner rooms
      ctx.beginPath(); ctx.moveTo(bx+bw*0.5,by); ctx.lineTo(bx+bw*0.5,by+bh*0.6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx,by+bh*0.5); ctx.lineTo(bx+bw*0.5,by+bh*0.5); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(bx+bw*0.5,by+bh*0.35); ctx.lineTo(bx+bw,by+bh*0.35); ctx.stroke();
      // Door arcs
      ctx.beginPath(); ctx.arc(bx+bw*0.5,by+bh*0.5,22,Math.PI,Math.PI*1.5);
      ctx.strokeStyle=`rgba(${r},${g},${b},0.3)`; ctx.stroke();
      // Glow
      const glow=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,W*0.42);
      glow.addColorStop(0,`rgba(${r},${g},${b},0.15)`); glow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=glow; ctx.fillRect(0,0,W,H);
    } else {
      // Premium real estate — minimalist city silhouette
      ctx.fillStyle="#040408"; ctx.fillRect(0,0,W,H);
      const sky=ctx.createLinearGradient(0,0,0,H*0.6);
      sky.addColorStop(0,`rgba(${r},${g},${b},0.18)`); sky.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.6);
      // City buildings silhouette
      const buildings=[
        [0.05,0.45,0.12,0.45],[0.18,0.28,0.1,0.62],[0.29,0.38,0.08,0.52],
        [0.38,0.2,0.11,0.7],[0.5,0.32,0.09,0.58],[0.6,0.15,0.13,0.75],
        [0.74,0.25,0.1,0.65],[0.85,0.42,0.09,0.48],[0.95,0.35,0.06,0.55]
      ];
      buildings.forEach(([x,h,w,bot])=>{
        ctx.fillStyle=`rgba(${r},${g},${b},0.12)`;
        ctx.fillRect(W*x, H*h, W*w, H*(bot-h));
        ctx.strokeStyle=`rgba(${r},${g},${b},0.25)`; ctx.lineWidth=0.5;
        ctx.strokeRect(W*x, H*h, W*w, H*(bot-h));
        // Windows
        for(let wy=H*h+8;wy<H*bot-8;wy+=20){
          for(let wx=W*x+6;wx<W*(x+w)-6;wx+=14){
            if(Math.random()>0.45){
              ctx.fillStyle=`rgba(${r},${g},${b},0.3)`;
              ctx.fillRect(wx,wy,6,10);
            }
          }
        }
      });
      // Ground line
      ctx.fillStyle=`rgba(${r},${g},${b},0.5)`; ctx.fillRect(0,H*0.72,W,2);
    }

  // ────────────────────────────
  // TECNOLOGÍA / DIGITAL
  // ────────────────────────────
  } else if(isTech) {
    if(subV===0) {
      // Matrix/neural network
      ctx.fillStyle="#00030a"; ctx.fillRect(0,0,W,H);
      const techGlow=ctx.createRadialGradient(W*0.5,H*0.4,0,W*0.5,H*0.4,W*0.65);
      techGlow.addColorStop(0,"rgba(0,160,255,0.22)"); techGlow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=techGlow; ctx.fillRect(0,0,W,H);
      // Neural network nodes
      const nodes=[];
      for(let i=0;i<18;i++) nodes.push([Math.random()*W,Math.random()*H*0.85+H*0.05]);
      // Connections
      ctx.strokeStyle="rgba(0,180,255,0.08)"; ctx.lineWidth=1;
      nodes.forEach(([x,y],i)=>nodes.forEach(([x2,y2],j)=>{
        if(i<j&&Math.hypot(x2-x,y2-y)<W*0.38){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}
      }));
      // Node dots
      nodes.forEach(([x,y],i)=>{
        const sz=i%3===0?10:i%3===1?6:4;
        ctx.beginPath(); ctx.arc(x,y,sz,0,Math.PI*2);
        ctx.fillStyle=`rgba(0,180,255,${0.3+i*0.02})`; ctx.fill();
      });
      // Binary rain (subtle)
      ctx.font="10px 'Courier New',monospace"; ctx.fillStyle="rgba(0,180,255,0.07)";
      for(let x=0;x<W;x+=20) for(let y=0;y<H;y+=18) ctx.fillText(Math.round(Math.random()).toString(),x,y);
    } else {
      // Dark UI / HUD style
      ctx.fillStyle="#010208"; ctx.fillRect(0,0,W,H);
      // Horizontal scan lines
      ctx.strokeStyle="rgba(0,200,255,0.04)"; ctx.lineWidth=1;
      for(let y=0;y<H;y+=4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Corner HUD frames
      const hud=(x,y,w,h,c)=>{
        ctx.strokeStyle=c; ctx.lineWidth=2;
        const s=30;
        ctx.beginPath();
        ctx.moveTo(x+s,y);ctx.lineTo(x,y);ctx.lineTo(x,y+s); ctx.moveTo(x+w-s,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+s);
        ctx.moveTo(x,y+h-s);ctx.lineTo(x,y+h);ctx.lineTo(x+s,y+h); ctx.moveTo(x+w,y+h-s);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-s,y+h);
        ctx.stroke();
      };
      hud(60,60,W-120,H-120,`rgba(0,200,255,0.35)`);
      hud(120,120,W-240,H-240,`rgba(0,200,255,0.15)`);
      // Glowing line
      ctx.strokeStyle="rgba(0,200,255,0.5)"; ctx.lineWidth=1;
      ctx.beginPath(); ctx.moveTo(0,H*0.5); ctx.lineTo(W,H*0.5); ctx.stroke();
      const lineGlow=ctx.createLinearGradient(0,H*0.5-12,0,H*0.5+12);
      lineGlow.addColorStop(0,"rgba(0,200,255,0)"); lineGlow.addColorStop(0.5,"rgba(0,200,255,0.1)"); lineGlow.addColorStop(1,"rgba(0,200,255,0)");
      ctx.fillStyle=lineGlow; ctx.fillRect(0,H*0.5-12,W,24);
    }

  // ────────────────────────────
  // MODA
  // ────────────────────────────
  } else if(isFashion) {
    if(subV===0) {
      // Minimal editorial — black/white/accent
      ctx.fillStyle="#050305"; ctx.fillRect(0,0,W,H);
      // Thin parallel diagonal lines
      ctx.strokeStyle="rgba(255,255,255,0.04)"; ctx.lineWidth=1;
      for(let i=-H;i<W+H;i+=22){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H,H);ctx.stroke();}
      // Large white rectangle — editorial block
      ctx.fillStyle="rgba(255,255,255,0.06)"; ctx.fillRect(W*0.55,0,W*0.45,H*0.58);
      // Accent pink detail
      ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(W*0.55,0,4,H*0.58);
      // Circles — abstract fashion
      ctx.beginPath(); ctx.arc(W*0.72,H*0.3,160,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,255,255,0.1)"; ctx.lineWidth=1; ctx.stroke();
      ctx.beginPath(); ctx.arc(W*0.72,H*0.3,100,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,255,255,0.07)"; ctx.lineWidth=1; ctx.stroke();
    } else {
      // Luxury — gold/black
      ctx.fillStyle="#060400"; ctx.fillRect(0,0,W,H);
      const goldGlow=ctx.createRadialGradient(W*0.6,H*0.35,0,W*0.6,H*0.35,W*0.5);
      goldGlow.addColorStop(0,"rgba(200,160,0,0.2)"); goldGlow.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=goldGlow; ctx.fillRect(0,0,W,H);
      // Gold horizontal lines
      ctx.strokeStyle="rgba(200,160,0,0.12)"; ctx.lineWidth=1;
      for(let y=0;y<H;y+=30){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
      // Diamond shapes
      [[W*0.7,H*0.3,80],[W*0.82,H*0.18,45],[W*0.58,H*0.48,35]].forEach(([cx,cy,sz])=>{
        ctx.save(); ctx.translate(cx,cy); ctx.rotate(Math.PI/4);
        ctx.strokeStyle="rgba(200,160,0,0.3)"; ctx.lineWidth=1.5; ctx.strokeRect(-sz/2,-sz/2,sz,sz); ctx.restore();
      });
    }

  // ────────────────────────────
  // BELLEZA & ESTÉTICA
  // ────────────────────────────
  } else if(isBeauty) {
    ctx.fillStyle="#0a0208"; ctx.fillRect(0,0,W,H);
    const roseGlow=ctx.createRadialGradient(W*0.5,H*0.38,0,W*0.5,H*0.38,W*0.58);
    roseGlow.addColorStop(0,"rgba(220,80,140,0.28)"); roseGlow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=roseGlow; ctx.fillRect(0,0,W,H);
    // Petal circles — 5-petal composition
    const petals=5;
    for(let i=0;i<petals;i++){
      const angle=(i/petals)*Math.PI*2 - Math.PI/2;
      const px=W*0.5+Math.cos(angle)*W*0.22;
      const py=H*0.38+Math.sin(angle)*H*0.22;
      ctx.beginPath(); ctx.arc(px,py,W*0.12,0,Math.PI*2);
      ctx.strokeStyle=`rgba(220,80,140,${0.18-i*0.02})`; ctx.lineWidth=1.5; ctx.stroke();
    }
    // Center
    ctx.beginPath(); ctx.arc(W*0.5,H*0.38,W*0.07,0,Math.PI*2);
    ctx.strokeStyle="rgba(220,80,140,0.35)"; ctx.lineWidth=1; ctx.stroke();
    // Sparkles
    for(let i=0;i<12;i++){
      const angle=Math.random()*Math.PI*2, dist=W*(0.2+Math.random()*0.28);
      const sx=W*0.5+Math.cos(angle)*dist, sy=H*0.38+Math.sin(angle)*dist;
      ctx.fillStyle=`rgba(255,180,220,${0.15+Math.random()*0.2})`;
      ctx.fillRect(sx-1,sy-6,2,12); ctx.fillRect(sx-6,sy-1,12,2);
    }
    // Thin horizontal lines
    ctx.strokeStyle="rgba(220,80,140,0.05)"; ctx.lineWidth=1;
    for(let y=0;y<H;y+=18){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // ────────────────────────────
  // TURISMO
  // ────────────────────────────
  } else if(isTourism) {
    if(subV===0) {
      // Sky & horizon — travel mood
      ctx.fillStyle="#020410"; ctx.fillRect(0,0,W,H);
      // Sky gradient
      const sky=ctx.createLinearGradient(0,0,0,H*0.55);
      sky.addColorStop(0,"rgba(10,20,80,0.8)"); sky.addColorStop(0.5,"rgba(30,80,160,0.4)"); sky.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=sky; ctx.fillRect(0,0,W,H*0.55);
      // Stars
      for(let i=0;i<80;i++){
        const sx=Math.random()*W, sy=Math.random()*H*0.4;
        const ss=Math.random()*2+0.5;
        ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.7+0.2})`;
        ctx.fillRect(sx,sy,ss,ss);
      }
      // Moon
      ctx.beginPath(); ctx.arc(W*0.78,H*0.12,38,0,Math.PI*2);
      ctx.fillStyle="rgba(220,210,160,0.25)"; ctx.fill();
      ctx.beginPath(); ctx.arc(W*0.84,H*0.1,34,0,Math.PI*2);
      ctx.fillStyle="#020410"; ctx.fill();
      // Horizon line
      ctx.fillStyle=`rgba(${r},${g},${b},0.6)`; ctx.fillRect(0,H*0.52,W,2);
      // Mountain silhouette
      ctx.fillStyle="rgba(20,30,60,0.8)";
      ctx.beginPath(); ctx.moveTo(0,H*0.52);
      ctx.lineTo(W*0.12,H*0.28); ctx.lineTo(W*0.25,H*0.42); ctx.lineTo(W*0.38,H*0.18);
      ctx.lineTo(W*0.52,H*0.38); ctx.lineTo(W*0.65,H*0.22); ctx.lineTo(W*0.78,H*0.45);
      ctx.lineTo(W*0.9,H*0.3); ctx.lineTo(W,H*0.48); ctx.lineTo(W,H*0.52); ctx.closePath();
      ctx.fill();
    } else {
      // Tropical — warm, ocean vibes
      ctx.fillStyle="#020810"; ctx.fillRect(0,0,W,H);
      const ocean=ctx.createLinearGradient(0,0,0,H);
      ocean.addColorStop(0,"rgba(0,60,100,0.5)"); ocean.addColorStop(0.5,"rgba(0,100,80,0.3)"); ocean.addColorStop(1,"rgba(0,0,0,0)");
      ctx.fillStyle=ocean; ctx.fillRect(0,0,W,H);
      // Wave lines
      ctx.strokeStyle="rgba(0,180,160,0.12)"; ctx.lineWidth=1.5;
      [0.35,0.45,0.55,0.65,0.75].forEach((yr,i)=>{
        ctx.beginPath();
        for(let x=0;x<W;x+=20){
          const yw=H*yr+Math.sin((x*0.02)+(i*1.2))*18;
          x===0?ctx.moveTo(x,yw):ctx.lineTo(x,yw);
        }
        ctx.stroke();
      });
      // Sun
      ctx.beginPath(); ctx.arc(W*0.72,H*0.18,55,0,Math.PI*2);
      ctx.fillStyle="rgba(255,190,0,0.15)"; ctx.fill();
      ctx.beginPath(); ctx.arc(W*0.72,H*0.18,38,0,Math.PI*2);
      ctx.fillStyle="rgba(255,200,30,0.2)"; ctx.fill();
      // Sun rays
      for(let i=0;i<12;i++){
        const angle=(i/12)*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(W*0.72+Math.cos(angle)*46,H*0.18+Math.sin(angle)*46);
        ctx.lineTo(W*0.72+Math.cos(angle)*70,H*0.18+Math.sin(angle)*70);
        ctx.strokeStyle="rgba(255,200,0,0.2)"; ctx.lineWidth=2; ctx.stroke();
      }
    }

  // ────────────────────────────
  // EDUCACIÓN
  // ────────────────────────────
  } else if(isEducation) {
    ctx.fillStyle="#02030e"; ctx.fillRect(0,0,W,H);
    const eduGlow=ctx.createRadialGradient(W*0.5,H*0.38,0,W*0.5,H*0.38,W*0.55);
    eduGlow.addColorStop(0,`rgba(${r},${g},${b},0.22)`); eduGlow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=eduGlow; ctx.fillRect(0,0,W,H);
    // Notebook lines
    ctx.strokeStyle="rgba(255,255,255,0.05)"; ctx.lineWidth=1;
    for(let y=H*0.18;y<H;y+=36){ctx.beginPath();ctx.moveTo(W*0.12,y);ctx.lineTo(W*0.88,y);ctx.stroke();}
    // Red margin line
    ctx.strokeStyle=`rgba(${r},${g},${b},0.35)`; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(W*0.18,H*0.1); ctx.lineTo(W*0.18,H*0.92); ctx.stroke();
    // Atom model
    ctx.strokeStyle=`rgba(${r},${g},${b},0.22)`; ctx.lineWidth=1.5;
    [[0],[Math.PI/3],[Math.PI*2/3]].forEach(([angle])=>{
      ctx.save(); ctx.translate(W*0.72,H*0.3); ctx.rotate(angle);
      ctx.beginPath(); ctx.ellipse(0,0,W*0.14,W*0.06,0,0,Math.PI*2); ctx.stroke(); ctx.restore();
    });
    ctx.beginPath(); ctx.arc(W*0.72,H*0.3,10,0,Math.PI*2);
    ctx.fillStyle=`rgba(${r},${g},${b},0.4)`; ctx.fill();

  // ────────────────────────────
  // FOTOGRAFÍA / VIDEO
  // ────────────────────────────
  } else if(isPhoto) {
    ctx.fillStyle="#040404"; ctx.fillRect(0,0,W,H);
    // Lens flare glow
    const lens=ctx.createRadialGradient(W*0.5,H*0.38,0,W*0.5,H*0.38,W*0.55);
    lens.addColorStop(0,"rgba(255,255,255,0.12)"); lens.addColorStop(0.15,"rgba(255,220,100,0.08)");
    lens.addColorStop(0.4,"rgba(100,100,255,0.05)"); lens.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=lens; ctx.fillRect(0,0,W,H);
    // Camera aperture — concentric polygons
    const drawPoly=(cx,cy,r,sides,rot)=>{
      ctx.beginPath();
      for(let i=0;i<sides;i++){
        const a=(i/sides)*Math.PI*2+rot;
        i===0?ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):ctx.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
      }
      ctx.closePath();
    };
    [220,170,120,70].forEach((rad,i)=>{
      drawPoly(W*0.5,H*0.36,rad,8,Math.PI/8*(i%2));
      ctx.strokeStyle=`rgba(255,255,255,${0.08-i*0.015})`; ctx.lineWidth=1; ctx.stroke();
    });
    // Film strip lines top and bottom
    ctx.fillStyle="rgba(255,255,255,0.08)"; ctx.fillRect(0,0,W,40); ctx.fillRect(0,H-40,W,40);
    for(let x=20;x<W;x+=50){
      ctx.fillStyle="rgba(0,0,0,0.5)"; ctx.fillRect(x,6,30,28); ctx.fillRect(x,H-34,30,28);
    }

  // ────────────────────────────
  // GENERIC PREMIUM — fallback elegante
  // ────────────────────────────
  } else {
    ctx.fillStyle="#05040e"; ctx.fillRect(0,0,W,H);
    const gGlow=ctx.createRadialGradient(W*0.6,H*0.38,0,W*0.6,H*0.38,W*0.62);
    gGlow.addColorStop(0,`rgba(${r},${g},${b},0.3)`); gGlow.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=gGlow; ctx.fillRect(0,0,W,H);
    // Subtle grid
    ctx.strokeStyle=`rgba(${r},${g},${b},0.07)`; ctx.lineWidth=1;
    for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
    for(let x=0;x<W;x+=54){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
    // Decorative rings
    [300,220,140].forEach((rad,i)=>{
      ctx.beginPath(); ctx.arc(W*0.62,H*0.38,rad,0,Math.PI*2);
      ctx.strokeStyle=`rgba(${r},${g},${b},${0.18-i*0.05})`; ctx.lineWidth=1.5; ctx.stroke();
    });
    // Cross accent
    ctx.strokeStyle=`rgba(${r},${g},${b},0.2)`; ctx.lineWidth=1;
    ctx.beginPath(); ctx.moveTo(W*0.62,H*0.38-160); ctx.lineTo(W*0.62,H*0.38+160); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(W*0.62-160,H*0.38); ctx.lineTo(W*0.62+160,H*0.38); ctx.stroke();
  }

  // ── COMMON: bottom dark gradient for text ──
  const botGrad=ctx.createLinearGradient(0,H*0.52,0,H);
  botGrad.addColorStop(0,"rgba(0,0,0,0)"); botGrad.addColorStop(0.4,"rgba(0,0,0,0.7)"); botGrad.addColorStop(1,"rgba(0,0,0,0.95)");
  ctx.fillStyle=botGrad; ctx.fillRect(0,H*0.52,W,H*0.48);

  // ── Brand tag — top ──
  ctx.font="600 17px Arial"; ctx.fillStyle=`rgba(${r},${g},${b},0.9)`; ctx.textAlign="left";
  ctx.fillText("● MCM", 52, 56);

  // ── Main text — bottom, massive with brand glow ──
  if(text) {
    const words=text.split(" ");
    const lines=[]; for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size=128;
    ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
    while(size>36){
      ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;
      if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-110) break;
      size-=4;
    }
    const availH=H*0.44; const lH=size*0.96;
    if(lines.length*lH>availH){size=Math.max(36,Math.floor(availH/lines.length/0.96));ctx.font=`900 ${size}px Impact,'Arial Black',sans-serif`;}
    const lineH=size*0.96; const totalH=lines.length*lineH;
    const startY=H-72-totalH+size*0.85;
    ctx.shadowColor=`rgba(${r},${g},${b},0.6)`; ctx.shadowBlur=24;
    ctx.fillStyle="#ffffff"; ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln, 52, startY+i*lineH));
    ctx.shadowBlur=0;
    // Accent line
    ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(52, startY+totalH+8, 140, 5);
  }

  ctx.font="500 15px Arial"; ctx.fillStyle="rgba(255,255,255,0.3)"; ctx.textAlign="right";
  ctx.fillText("IA Visual", W-40, H-24);
}

// ── ROUTER — cada post rota entre los 3 templates ──
async function drawPost(canvas, opt) {
  if(opt.style===1) return drawTemplate1(canvas, opt);
  if(opt.style===2) return drawTemplate2(canvas, opt);
  return drawTemplate3(canvas, opt);
}


function App() {
  const [screen, setScreen] = useState("connect");
  const [brand, setBrand] = useState(store.get("brand")||{});
  const [files, setFiles] = useState(store.get("files")||[]);
  const [posts, setPosts] = useState(store.get("posts")||[]);
  const [socials, setSocials] = useState(store.get("socials")||SOCIALS_DEFAULT);
  const [toast, showToast] = useToast();

  const saveBrand=(b)=>{setBrand(b);store.set("brand",b);};
  const saveFiles=(f)=>{setFiles(f);store.set("files",f);};
  const savePosts=(p)=>{setPosts(p);store.set("posts",p);};
  const saveSocials=(s)=>{setSocials(s);store.set("socials",s);};

  const steps=[
    {id:"connect",icon:"🔗",label:"Conectar redes",done:socials.some(s=>s.connected)},
    {id:"brand",icon:"🎨",label:"Mi marca",done:!!(brand.name&&brand.description)},
    {id:"library",icon:"📁",label:"Mis archivos",done:files.length>0},
    {id:"generate",icon:"✦",label:"Crear publicación",done:posts.length>0},
    {id:"schedule",icon:"📅",label:"Automatizar",done:false},
  ];

  return (
    <div className="app">
      <div className="sidebar">
        <div className="logo">
          <div className="logo-mark">M</div>
          <div><div className="logo-text">MCM</div><div className="logo-sub">COMMUNITY MANAGER</div></div>
        </div>
        <div className="nav-section">FLUJO</div>
        {steps.map(s=>(
          <button key={s.id} className={"nav-item"+(screen===s.id?" active":"")} onClick={()=>setScreen(s.id)}>
            <div className={"step-dot"+(s.done?" done":screen===s.id?" active":"")} />
            <span>{s.icon}</span>{s.label}
          </button>
        ))}
        <div style={{marginTop:"auto",padding:"12px 10px"}}>
          <div style={{fontSize:11,color:"var(--muted)",marginBottom:6}}>Conectadas</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {socials.filter(s=>s.connected).map(s=><span key={s.id} title={s.name} style={{fontSize:16}}>{s.icon}</span>)}
            {!socials.some(s=>s.connected)&&<span style={{fontSize:11,color:"var(--muted)"}}>Ninguna</span>}
          </div>
        </div>
      </div>
      <div className="main">
        {screen==="connect"  && <ConnectScreen  socials={socials} saveSocials={saveSocials} showToast={showToast} onNext={()=>setScreen("brand")} />}
        {screen==="brand"    && <BrandScreen    brand={brand} saveBrand={saveBrand} showToast={showToast} onNext={()=>setScreen("library")} />}
        {screen==="library"  && <LibraryScreen  files={files} saveFiles={saveFiles} showToast={showToast} onNext={()=>setScreen("generate")} />}
        {screen==="generate" && <GenerateScreen brand={brand} files={files} posts={posts} savePosts={savePosts} showToast={showToast} onNext={()=>setScreen("schedule")} />}
        {screen==="schedule" && <ScheduleScreen socials={socials} posts={posts} showToast={showToast} />}
      </div>
      {toast&&<div className={"toast "+toast.type}>{toast.msg}</div>}
    </div>
  );
}

function ConnectScreen({socials,saveSocials,showToast,onNext}) {
  const connect=(id)=>{
    if(id==="instagram"){saveSocials(socials.map(s=>s.id===id?{...s,connected:true,user:"@gonvinardell"}:s));showToast("Instagram conectado!","ok");}
    else showToast("Próximamente — "+socials.find(s=>s.id===id).name,"info");
  };
  const disconnect=(id)=>saveSocials(socials.map(s=>s.id===id?{...s,connected:false,user:""}:s));
  return (
    <div style={{padding:"32px 36px",maxWidth:600}} className="fade-in">
      <div style={{marginBottom:28}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Conectá tus redes sociales</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>MCM publicará en las redes que conectes.</p>
      </div>
      {socials.map(s=>(
        <div key={s.id} className={"social-card"+(s.connected?" connected":"")}>
          <div className="social-icon" style={{background:s.color+"22"}}>{s.icon}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:14}}>{s.name}</div>
            <div style={{fontSize:12,color:s.connected?"var(--success)":"var(--muted)",marginTop:2}}>
              {s.connected?"● Conectado — "+s.user:"No conectado"}
            </div>
          </div>
          {s.connected
            ?<button className="btn btn-ghost" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>disconnect(s.id)}>Desconectar</button>
            :<button className="btn btn-primary" style={{fontSize:12,padding:"7px 14px"}} onClick={()=>connect(s.id)}>Conectar</button>}
        </div>
      ))}
      <div style={{marginTop:28}}>
        <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Mi Marca →</button>
      </div>
    </div>
  );
}

          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>

            <span style={{fontSize:13,color:"var(--muted)"}}>Se usa en todos los diseños</span>
          </div>
        </div>
      </div>
      <div style={{display:"flex",gap:10,marginTop:28}}>
        <button className="btn btn-ghost" style={{flex:1}} onClick={save}>Guardar</button>

}

function LibraryScreen({files,saveFiles,showToast,onNext}) {
  const inputRef=useRef();
  const handleFiles=(e)=>{
    const newFiles=Array.from(e.target.files).map(f=>({
      id:Date.now()+Math.random(),name:f.name,
      type:f.type.startsWith("video")?"video":"image",
      preview:URL.createObjectURL(f),size:f.size,
    }));
    saveFiles([...files,...newFiles]);
    showToast(newFiles.length+" archivo(s) agregado(s)","ok");
  };
  const remove=(id)=>saveFiles(files.filter(f=>f.id!==id));
  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Mis archivos</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>La IA elegirá de estos archivos para crear las publicaciones.</p>
        </div>
        <button className="btn btn-primary" onClick={()=>inputRef.current.click()}>+ Agregar</button>
      </div>
      <input ref={inputRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={handleFiles} />
      <div className="file-grid">
        <div className="file-add" onClick={()=>inputRef.current.click()}>
          <div style={{fontSize:28}}>📷</div><div>Fotos y videos</div>
        </div>
        {files.map(f=>(
          <div key={f.id} className="file-thumb">
            {f.type==="video"?<video src={f.preview} style={{width:"100%",height:"100%",objectFit:"cover"}} />:<img src={f.preview} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}} />}
            <button onClick={()=>remove(f.id)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            {f.type==="video"&&<div style={{position:"absolute",bottom:4,left:4,background:"rgba(0,0,0,.6)",borderRadius:4,padding:"2px 6px",fontSize:10}}>🎬</div>}
          </div>
        ))}
      </div>
      {files.length>0&&<div style={{marginTop:28}}><button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Crear Publicaciones →</button></div>}
    </div>
  );
}

function GenerateScreen({brand,files,posts,savePosts,showToast,onNext}) {
  const [generating,setGenerating]=useState(false);
  const [weekPosts,setWeekPosts]=useState([]);
  const [selections,setSelections]=useState({});
  const [editing,setEditing]=useState(null);
  const [brief,setBrief]=useState("");
  const [progress,setProgress]=useState(0);

  // Template names for display
  const TEMPLATE_NAMES={1:"📸 Foto Editorial",2:"🎨 Diseño Gráfico",3:"✨ IA Visual"};

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    const imgs=files.filter(f=>f.type==="image");
    if(imgs.length===0){showToast("Agregá al menos una imagen a tus archivos","err");return;}
    setGenerating(true); setWeekPosts([]); setSelections({}); setProgress(0);

    const THEMES=[
      "servicio principal y propuesta de valor",
      "testimonio o caso de éxito de un cliente",
      "tip o consejo educativo del rubro",
      "promoción con llamado a la acción",
      "equipo humano y valores de la empresa",
      "pregunta para generar engagement",
      "contenido emotivo o inspirador",
    ];

    const base=`Empresa: ${brand.name}. Rubro: ${brand.industry||""}. Descripción: ${brand.description||""}. Cliente ideal: ${brand.target||""}. ${brief?"Contexto: "+brief+". ":""}Tono: ${brand.tone||"profesional"}. Responde SOLO el caption, sin explicaciones, sin preamble. Incluye 5-6 hashtags relevantes al final.`;

    try{
      const allPosts=[];
      for(let i=0;i<7;i++){
        setProgress(i+1);

        // Rotate images across posts
        const imgSrc=imgs[i%imgs.length].preview;

        // Each post gets 3 captions (one per template style)
        const [cap1,cap2,cap3,overlayRaw]=await Promise.all([
          generateText(`Escribe un caption ${brand.tone||"profesional"} sobre ${THEMES[i]} para ${brand.name} (${brand.industry}). ${base}`),
          generateText(`Escribe un caption ${brand.tone||"profesional"} MÁS EXTENSO (2-3 oraciones) sobre ${THEMES[i]} para ${brand.name}. ${base}`),
          generateText(`Escribe un caption ${brand.tone||"profesional"} orientado a ventas y conversión sobre ${THEMES[i]} para ${brand.name}. ${base}`),
          generateText(`Sos director creativo. Escribe EXACTAMENTE 3-5 palabras impactantes en español para poner sobre una imagen de ${brand.name} (${brand.industry||""}) con el tema: "${THEMES[i]}". Solo las palabras, sin puntuación, sin hashtags, sin explicación.`),
        ]);

        const overlayText=overlayRaw.trim().replace(/['"*_#.!?,]/g,"").replace(/\s+/g," ").slice(0,40);

        // POST i → Template style cycles: 0→T1, 1→T2, 2→T3, 3→T1, 4→T2, 5→T3, 6→T1
        const styleForPost = (i % 3) + 1;
        const styleNames={1:"Foto Editorial",2:"Diseño Gráfico",3:"IA Visual"};

        const options=[
          // Option A: the rotating template for this post
          {id:0, style:styleForPost, styleName:styleNames[styleForPost],
           caption:cap1, overlayText, imgSrc,
           fontSize:56, fontColor:"#ffffff", fontFamily:"Impact", fontWeight:"900",
           textBg:false, brandColor:brand.color||"#6d28d9", industry:brand.industry||"",
           seed:i},
          // Option B: next template in rotation
          {id:1, style:(styleForPost%3)+1, styleName:styleNames[(styleForPost%3)+1],
           caption:cap2, overlayText, imgSrc,
           fontSize:56, fontColor:"#ffffff", fontFamily:"Impact", fontWeight:"900",
           textBg:false, brandColor:brand.color||"#6d28d9", industry:brand.industry||"",
           seed:i+1},
          // Option C: remaining template
          {id:2, style:((styleForPost+1)%3)+1, styleName:styleNames[((styleForPost+1)%3)+1],
           caption:cap3, overlayText, imgSrc,
           fontSize:56, fontColor:"#ffffff", fontFamily:"Impact", fontWeight:"900",
           textBg:false, brandColor:brand.color||"#6d28d9", industry:brand.industry||"",
           seed:i+2},
        ];
        allPosts.push({postIdx:i,label:"Post "+(i+1),theme:THEMES[i],options});
        setWeekPosts([...allPosts]);
      }
      const selectedArr=allPosts.map((p,i)=>({...p.options[0],postIdx:i,id:Date.now()+i}));
      savePosts(selectedArr);
      showToast("7 publicaciones generadas!","ok");
    }catch(e){showToast("Error: "+e.message,"err");}
    finally{setGenerating(false);setProgress(0);}
  };

  const selectOption=(postIdx,optIdx)=>setSelections(p=>({...p,[postIdx]:optIdx}));
  const allSelected=weekPosts.length===7&&Object.keys(selections).length===7;

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Crear publicaciones de la semana</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>7 posts × 3 opciones cada uno — cada template es diferente.</p>
        </div>
        <button className="btn btn-primary" onClick={generate} disabled={generating}>
          {generating?<><div className="spin"/>Generando {progress}/7...</>:"✦ Generar semana completa"}
        </button>
      </div>

      <div style={{marginBottom:20}}>
        <span className="lbl">Brief de la semana (opcional)</span>
        <input value={brief} onChange={e=>setBrief(e.target.value)} placeholder="Ej: Semana de lanzamiento, promo del mes, nuevo producto..." />
      </div>

      {/* Template legend */}
      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {Object.entries(TEMPLATE_NAMES).map(([k,v])=>(
          <div key={k} style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:8,padding:"5px 12px",fontSize:12,color:"var(--muted)"}}>{v}</div>
        ))}
        <div style={{fontSize:12,color:"var(--muted)",display:"flex",alignItems:"center"}}>← Todos diferentes entre sí</div>
      </div>

      {generating&&(
        <div style={{padding:"24px",marginBottom:24}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13,color:"var(--muted)"}}>
            <span>Generando publicaciones...</span>
            <span style={{color:"var(--accent2)"}}>{progress}/7</span>
          </div>
          <div style={{height:6,background:"var(--surface2)",borderRadius:6,overflow:"hidden"}}>
            <div style={{height:"100%",width:(progress/7*100)+"%",background:"linear-gradient(90deg,var(--accent),var(--accent2))",borderRadius:6,transition:"width .4s"}} />
          </div>
        </div>
      )}

      {weekPosts.map((post,pi)=>(
        <div key={pi} style={{marginBottom:36}} className="fade-in">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:12}}>
            <div style={{width:28,height:28,borderRadius:8,background:"linear-gradient(135deg,var(--accent),var(--accent2))",display:"grid",placeItems:"center",fontSize:13,fontWeight:800,flexShrink:0}}>{pi+1}</div>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>Post {pi+1}</div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{post.theme}</div>
            </div>
            {selections[pi]!==undefined&&<div style={{marginLeft:"auto",fontSize:12,color:"var(--success)",background:"rgba(34,211,238,.1)",border:"1px solid rgba(34,211,238,.2)",borderRadius:20,padding:"3px 10px"}}>✓ Elegida</div>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
            {post.options.map((opt,oi)=>(
              <WeekPostCard key={oi} opt={opt} postIdx={pi} optIdx={oi}
                selected={selections[pi]===oi}
                onSelect={()=>selectOption(pi,oi)}
                onEdit={()=>setEditing({postIdx:pi,optIdx:oi})}
              />
            ))}
          </div>
        </div>
      ))}

      {weekPosts.length===7&&(
        <div className="fade-in" style={{marginTop:8}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"16px 20px",marginBottom:16,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:24}}>📋</div>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>{Object.keys(selections).length}/7 posts seleccionados</div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>Elegí una opción por cada post para continuar</div>
            </div>
          </div>
          {allSelected&&(
            <button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>
              📅 Programar en el calendario →
            </button>
          )}
        </div>
      )}

      {editing&&(
        <EditorModal
          opt={weekPosts[editing.postIdx]?.options[editing.optIdx]}
          brand={brand}
          onClose={()=>setEditing(null)}
          onSave={(updated)=>{
            const newWeek=[...weekPosts];
            newWeek[editing.postIdx].options[editing.optIdx]=updated;
            setWeekPosts(newWeek);
            setEditing(null);
            showToast("Cambios guardados","ok");
          }}
          showToast={showToast}
        />
      )}
    </div>
  );
}

function EditorModal({opt,brand,onClose,onSave,showToast}) {
  const canvasRef=useRef();
  const previewRef=useRef();
  const [form,setForm]=useState({
    ...opt,
    textBg: opt.textBg||false,
    textX: opt.textX!==undefined?opt.textX:0.08,
    textY: opt.textY!==undefined?opt.textY:0.75,
    fontFamily: opt.fontFamily||"Impact",
    fontWeight: opt.fontWeight||"900",
  });
  const [publishing,setPublishing]=useState(false);
  const [pubMsg,setPubMsg]=useState(null);
  const [dragging,setDragging]=useState(false);
  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  useEffect(()=>{if(canvasRef.current)drawPost(canvasRef.current,form);},[form]);

  const handlePreviewMouseDown=(e)=>{e.preventDefault();setDragging(true);};
  const handlePreviewMouseMove=(e)=>{
    if(!dragging)return;
    const rect=previewRef.current.getBoundingClientRect();
    upd("textX",Math.max(0,Math.min(1,(e.clientX-rect.left)/rect.width)));
    upd("textY",Math.max(0,Math.min(1,(e.clientY-rect.top)/rect.height)));
  };
  const handlePreviewMouseUp=()=>setDragging(false);
  const handlePreviewTouch=(e)=>{
    const t=e.touches[0];
    const rect=previewRef.current.getBoundingClientRect();
    upd("textX",Math.max(0,Math.min(1,(t.clientX-rect.left)/rect.width)));
    upd("textY",Math.max(0,Math.min(1,(t.clientY-rect.top)/rect.height)));
  };

  const download=()=>{
    const cv=canvasRef.current; if(!cv)return;
    const a=document.createElement("a"); a.href=cv.toDataURL("image/png"); a.download="MCM_post.png"; a.click();
  };

  const publishIG=async()=>{
    const canvas=canvasRef.current; if(!canvas)return;
    setPublishing(true); setPubMsg(null);
    try{
      const upRes=await fetch("/api/instagram?action=upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({imageBase64:canvas.toDataURL("image/png")})});
      const upData=await upRes.json();
      if(!upData.success)throw new Error(upData.error);
      const pubRes=await fetch("/api/instagram?action=publish",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({caption:form.caption,imageUrl:upData.url})});
      const pubData=await pubRes.json();
      if(!pubData.success)throw new Error(pubData.error);
      setPubMsg({ok:true,text:"Publicado en @gonvinardell!"});
      showToast("Publicado exitosamente!","ok");
    }catch(e){setPubMsg({ok:false,text:"Error: "+e.message});}
    finally{setPublishing(false);}
  };

  return (
    <div className="editor-wrap">
      <div className="editor-box">
        <div style={{flex:"0 0 340px"}}>
          <div className="lbl">Preview — arrastrá el texto</div>
          <div ref={previewRef}
            style={{borderRadius:12,overflow:"hidden",aspectRatio:"1",background:"var(--bg)",cursor:dragging?"grabbing":"crosshair",position:"relative",userSelect:"none"}}
            onMouseDown={handlePreviewMouseDown} onMouseMove={handlePreviewMouseMove}
            onMouseUp={handlePreviewMouseUp} onMouseLeave={handlePreviewMouseUp}
            onTouchMove={handlePreviewTouch}>
            <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block",pointerEvents:"none"}} />
            <div style={{position:"absolute",bottom:8,left:0,right:0,textAlign:"center",fontSize:10,color:"rgba(255,255,255,.4)",pointerEvents:"none"}}>Click para mover el texto</div>
          </div>
          <div style={{fontSize:10,color:"var(--muted)",textAlign:"center",marginTop:6}}>1080×1080px</div>
        </div>

        <div style={{flex:1,minWidth:260,display:"flex",flexDirection:"column",gap:13,overflowY:"auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <h3 style={{fontSize:16,fontWeight:700}}>Editor de diseño</h3>
            <button onClick={onClose} style={{background:"var(--surface2)",border:"none",color:"var(--muted)",width:30,height:30,borderRadius:8,cursor:"pointer",fontSize:14}}>✕</button>
          </div>

          <div>
            <span className="lbl">Texto sobre la imagen</span>
            <input value={form.overlayText} onChange={e=>upd("overlayText",e.target.value)} placeholder="Máximo 5-6 palabras..." style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:13,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit"}} />
          </div>

          <div>
            <span className="lbl">Caption del post</span>
            <textarea value={form.caption} onChange={e=>upd("caption",e.target.value)} rows={4}
              style={{background:"var(--surface2)",border:"1px solid var(--border)",borderRadius:10,color:"var(--text)",fontSize:12,padding:"10px 12px",width:"100%",outline:"none",fontFamily:"inherit",resize:"none"}} />
          </div>

          <div>
            <span className="lbl">Tipografía</span>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:6}}>
              {[{id:"Arial",label:"Sans-Serif"},{id:"Georgia",label:"Serif"},{id:"'Courier New'",label:"Mono"},{id:"Impact",label:"Impact"},{id:"'Times New Roman'",label:"Times"},{id:"Verdana",label:"Verdana"}].map(f=>(
                <button key={f.id} onClick={()=>upd("fontFamily",f.id)} className="btn"
                  style={{padding:"8px 6px",fontSize:11,flexDirection:"column",gap:2,
                    background:form.fontFamily===f.id?"rgba(109,40,217,.2)":"var(--surface2)",
                    border:"1px solid "+(form.fontFamily===f.id?"var(--accent2)":"var(--border)"),
                    color:form.fontFamily===f.id?"var(--accent2)":"var(--muted)"}}>
                  <span style={{fontSize:16,fontFamily:f.id,fontWeight:"bold"}}>Aa</span>
                  <span>{f.label}</span>
                </button>
              ))}
            </div>
          </div>

          <div>
            <span className="lbl">Peso</span>
            <div style={{display:"flex",gap:6}}>
              {[["normal","Normal"],["bold","Negrita"],["900","Extra Bold"]].map(([v,l])=>(
                <button key={v} onClick={()=>upd("fontWeight",v)} className="btn"
                  style={{flex:1,padding:"7px",fontSize:12,
                    background:form.fontWeight===v?"rgba(109,40,217,.2)":"var(--surface2)",
                    border:"1px solid "+(form.fontWeight===v?"var(--accent2)":"var(--border)"),
                    color:form.fontWeight===v?"var(--accent2)":"var(--muted)",
                    fontFamily:form.fontFamily,fontWeight:v}}>
                  {l}
                </button>
              ))}
            </div>
          </div>

          <div style={{display:"flex",gap:12,alignItems:"flex-end"}}>
            <div style={{flex:1}}>
              <span className="lbl">Tamaño ({form.fontSize}px)</span>
              <input type="range" min={20} max={110} value={form.fontSize} onChange={e=>upd("fontSize",+e.target.value)} style={{width:"100%",accentColor:"var(--accent)"}} />
            </div>
            <div>
              <span className="lbl">Color</span>
              <input type="color" value={form.fontColor||"#ffffff"} onChange={e=>upd("fontColor",e.target.value)} style={{width:44,height:36,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:3}} />
            </div>
          </div>

          <div>
            <button onClick={()=>upd("textBg",!form.textBg)} className="btn"
              style={{background:form.textBg?"rgba(109,40,217,.2)":"var(--surface2)",border:"1px solid "+(form.textBg?"var(--accent2)":"var(--border)"),color:form.textBg?"var(--accent2)":"var(--muted)",fontSize:12,padding:"8px 14px"}}>
              {form.textBg?"✓ Fondo oscuro: ON":"○ Fondo oscuro: OFF"}
            </button>
          </div>

          {pubMsg&&<div style={{background:pubMsg.ok?"#0d2b1f":"#1f0d0d",border:"1px solid "+(pubMsg.ok?"var(--success)":"var(--error)"),color:pubMsg.ok?"var(--success)":"var(--error)",padding:"10px 14px",borderRadius:8,fontSize:12,fontWeight:600}}>{pubMsg.text}</div>}

          <div style={{display:"flex",gap:8,marginTop:"auto"}}>
            <button onClick={download} className="btn btn-ghost" style={{flex:1}}>⬇ Descargar</button>
            <button onClick={()=>onSave(form)} className="btn btn-ghost" style={{flex:1}}>✓ Guardar</button>
            <button onClick={publishIG} disabled={publishing} className="btn btn-primary"
              style={{flex:1,background:publishing?"var(--surface2)":"linear-gradient(135deg,#E1306C,#833AB4)"}}>
              {publishing?<><div className="spin"/>Publicando</>:"🚀 Publicar IG"}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}
