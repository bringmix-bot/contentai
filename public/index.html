const INDUSTRIES = ["Restaurante / Gastronomía","Moda / Indumentaria","Salud y bienestar","Tecnología","Inmobiliaria","Educación","Turismo","Retail / Tienda","Servicios profesionales","Construcción","Automotriz","Entretenimiento","Fitness / Deporte","Belleza / Estética","Otro"];

const generatePostImage = (postText, networkName, networkColor, businessName, imagePreview) => {
  return new Promise(resolve => {
    const canvas = document.createElement("canvas");
    canvas.width = 1080; canvas.height = 1080;
    const ctx = canvas.getContext("2d");
 
    // Extract first meaningful lines (skip hashtags)
    const cleanText = postText.replace(/#\S+/g,'').replace(/@\S+/g,'').trim();
    const firstLines = cleanText.split('\n').filter(l => l.trim().length > 0).slice(0, 3).join(' ');
    const shortQuote = firstLines.length > 120 ? firstLines.slice(0, 117) + '...' : firstLines;
 
    const draw = () => {
      if (imagePreview) {
        const img = new Image();
        img.onload = () => {
          // Draw full image clean — no overlay on main area
          const scale = Math.max(1080/img.width, 1080/img.height);
          const iw = img.width*scale, ih = img.height*scale;
          ctx.drawImage(img, (1080-iw)/2, (1080-ih)/2, iw, ih);
          addOverlay();
        };
        img.src = imagePreview;
      } else {
        // Clean dark gradient background
        const g = ctx.createLinearGradient(0, 0, 1080, 1080);
        g.addColorStop(0, "#0d0520"); g.addColorStop(1, "#05050a");
        ctx.fillStyle = g; ctx.fillRect(0, 0, 1080, 1080);
        // Subtle decorative circles
        ctx.beginPath(); ctx.arc(1050, 80, 200, 0, Math.PI*2);
        ctx.fillStyle = "#7c3aed10"; ctx.fill();
        ctx.beginPath(); ctx.arc(30, 1000, 150, 0, Math.PI*2);
        ctx.fillStyle = "#ec489910"; ctx.fill();
        addOverlay();
      }
    };
 
    const addOverlay = () => {
      // Bottom gradient overlay — only covers bottom 35% of image
      const bottomH = 380;
      const grad = ctx.createLinearGradient(0, 1080-bottomH, 0, 1080);
      grad.addColorStop(0, "rgba(0,0,0,0)");
      grad.addColorStop(0.4, "rgba(0,0,0,0.7)");
      grad.addColorStop(1, "rgba(0,0,0,0.95)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 1080-bottomH, 1080, bottomH);
 
      const pad = 60;
      const textY = 1080 - bottomH + 100;
 
      // Business name — small, above quote
      if (businessName) {
        ctx.font = "500 22px 'DM Sans',sans-serif";
        ctx.fillStyle = "rgba(255,255,255,0.5)";
        ctx.fillText(businessName.toUpperCase(), pad, textY);
      }
 
      // Main quote text — clean, readable
      ctx.font = "700 42px 'DM Sans',sans-serif";
      ctx.fillStyle = "#ffffff";
      const words = shortQuote.split(' ');
      const lines = []; let line = '';
      const maxW = 1080 - pad*2;
      words.forEach(w => {
        const t = line + (line?' ':'') + w;
        if (ctx.measureText(t).width > maxW) { if(line) lines.push(line); line = w; }
        else line = t;
      });
      if (line) lines.push(line);
      const shown = lines.slice(0, 4);
      if (lines.length > 4) shown[3] = shown[3] + '...';
      const lh = 54;
      const startY = businessName ? textY + 44 : textY + 10;
      shown.forEach((l, i) => ctx.fillText(l, pad, startY + i*lh));
 
      // Thin colored accent line above branding
      const lineY = 1080 - 68;
      const lineGrad = ctx.createLinearGradient(pad, 0, pad+300, 0);
      lineGrad.addColorStop(0, "#7c3aed");
      lineGrad.addColorStop(1, "#ec4899");
      ctx.fillStyle = lineGrad;
      ctx.fillRect(pad, lineY, 300, 2);
 
      // MCM branding — bottom left, small
      ctx.font = "600 20px 'DM Sans',sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.4)";
      ctx.fillText("MCM · My Community Manager", pad, 1080 - 30);
 
      resolve(canvas.toDataURL("image/png"));
    };
 
    draw();
  });
};

      if(isImg) reader.readAsDataURL(file); else reader.readAsArrayBuffer(file);
    });

  const galleryRef = useRef();
 
  const generateAll = async () => {
    if (!topic.trim() && selItems.length === 0) return;
    setGenerating(true); setResults({}); setPostImages({});
 
    const brandCtx = [
      brand.name && `EMPRESA: "${brand.name}"`,
      brand.industry && `INDUSTRIA: "${brand.industry}"`,
      brand.tone && `VOZ DE MARCA: "${brand.tone}"`,
      brand.description && `PROPUESTA DE VALOR: "${brand.description}"`,
      brand.target && `BUYER PERSONA: "${brand.target}"`,
      brand.colors && `IDENTIDAD VISUAL: "${brand.colors}"`,
    ].filter(Boolean).join("\n");
 
    const mediaDesc = selItems.map((item,i) => item.isVideo ? `Video ${i+1} (${item.name})` : `Imagen ${i+1} (${item.name})`).join(", ");
 
    const prompt = `Sos un copywriter senior especializado en social media con experiencia en agencias top de Buenos Aires. Trabajaste con marcas de retail, gastronomía, moda y lifestyle. Sabés exactamente qué genera engagement en Argentina y Latam, cómo funcionan los algoritmos de cada red y cómo escribir copy que convierte seguidores en clientes.
 
━━━━━━━━━━━━━━━━━━━━━━━━━━━
BRIEF DEL CLIENTE
━━━━━━━━━━━━━━━━━━━━━━━━━━━
${brandCtx || "Cliente nuevo — creá posts que funcionen para cualquier marca"}
 
${topic ? `OBJETIVO DE ESTE POST: "${topic}"` : "OBJETIVO: Generar awareness y engagement genuino de la marca"}
 
${selItems.length > 0 ? `MATERIAL VISUAL DISPONIBLE:
${mediaDesc}
${selItems.some(s=>!s.isVideo) ? `
ANÁLISIS VISUAL OBLIGATORIO: Examiná cada imagen en detalle. Identificá:
- Qué producto/servicio se muestra y sus características visuales específicas
- El ambiente, la estética y los colores dominantes

━━━━━━━━━━━━━━━━━━━━━━━━━━━
CONTEXTO DE MERCADO
━━━━━━━━━━━━━━━━━━━━━━━━━━━
Pensá como un estratega: ¿qué le duele o qué desea el consumidor de este rubro? ¿Qué miedos tiene? ¿Qué aspira? ¿Qué contenido de la competencia ya está viendo? Creá posts que rompan el patrón y hablen directo al corazón de ese consumidor.
 
━━━━━━━━━━━━━━━━━━━━━━━━━━━
PRODUCCIÓN DE CONTENIDO
━━━━━━━━━━━━━━━━━━━━━━━━━━━
Creá posts de calidad agencia para las 5 plataformas. Cada uno debe:

IMPORTANTE: Usá lenguaje argentino natural. Nada de "¡Hola comunidad!" ni clichés de redes.

${NETWORKS[0].tone}

${NETWORKS[1].tone}

${NETWORKS[2].tone}

${NETWORKS[4].tone}`;
 
    try {
      const firstImg = selItems.find(s => !s.isVideo && s.base64);
      const body = { prompt };
      if (firstImg) { body.imageBase64 = firstImg.base64; body.imageMediaType = firstImg.mediaType; }
      const res = await fetch("/api/generate", { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) });
      const data = await res.json();
      if (data.error) { setResults({ _error: data.error }); }
      else {
        const text = data.text || "";
        const parsed = {};
        const keys=["INSTAGRAM","LINKEDIN","TWITTER","FACEBOOK","TIKTOK"];
        const ids=["instagram","linkedin","twitter","facebook","tiktok"];
        keys.forEach((key,i) => {
          const s=text.indexOf(`===${key}===`); if(s===-1)return;
          const f=s+key.length+6, n=keys[i+1]?text.indexOf(`===${keys[i+1]}===`):text.length;
          parsed[ids[i]]=text.slice(f,n).trim();
        });
        setResults(parsed); setPostsCount(p=>p+5);

        for(const net of NETWORKS){ if(parsed[net.id]){ imgs[net.id]=await generatePostImage(parsed[net.id],net.label,net.color,brand.name||"",firstPrev); } }

  const canGen = !generating && (!!topic.trim()||selItems.length>0);

        <div style={{position:"absolute",top:"40%",left:"30%",width:400,height:400,background:"radial-gradient(circle,#06b6d415 0%,transparent 70%)",animation:"float 12s ease-in-out infinite 4s"}}/>
      </div>

                )}
                {generating&&!results[activeNet]&&(
                  <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:12}}>
                    <div style={{width:32,height:32,border:"3px solid #1a1a35",borderTopColor:"#7c3aed",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>
                    <div style={{color:"#333",fontSize:12}}>Generando para {NETWORKS.find(n=>n.id===activeNet)?.label}...</div>
                  </div>
                )}
                {results[activeNet]&&(
                  <div style={{animation:"fadeIn 0.4s ease",flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
                    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:12,paddingBottom:10,borderBottom:"1px solid #0d0d1a",flexShrink:0}}>
                      <span style={{fontSize:16}}>{NETWORKS.find(n=>n.id===activeNet)?.icon}</span>
                      <span style={{fontWeight:700,fontSize:13}}>{NETWORKS.find(n=>n.id===activeNet)?.label}</span>
                      <span style={{marginLeft:"auto",fontSize:10,color:"#34d399",background:"#34d39910",padding:"3px 10px",borderRadius:20,border:"1px solid #34d39920"}}>✓ Listo</span>
                    </div>
                    <div style={{whiteSpace:"pre-wrap",fontSize:13.5,lineHeight:1.9,color:"#ddd",flex:1,overflowY:"auto"}}>{results[activeNet]}</div>
                    <div style={{display:"flex",gap:7,marginTop:12,paddingTop:10,borderTop:"1px solid #0d0d1a",flexShrink:0,flexWrap:"wrap"}}>
                      <button onClick={()=>{navigator.clipboard.writeText(results[activeNet]);setCopied(activeNet);setTimeout(()=>setCopied(false),2000);}}
                        style={{flex:1,background:copied===activeNet?"#0a2010":GRAD,color:"#fff",border:copied===activeNet?"1px solid #34d399":"none",borderRadius:8,padding:"10px",fontWeight:700,cursor:"pointer",fontSize:12,transition:"all 0.2s",minWidth:100,fontFamily:"'DM Sans',sans-serif"}}>
                        {copied===activeNet?"✓ Copiado":"📋 Copiar texto"}
                      </button>
                      <button onClick={()=>dlText(activeNet)} style={{background:"#0d0d1a",color:"#666",border:"1px solid #1a1a35",borderRadius:8,padding:"10px 12px",cursor:"pointer",fontSize:12,fontFamily:"'DM Sans',sans-serif"}}>⬇ .txt</button>
                      <button onClick={generateAll} style={{background:"#0d0d1a",color:"#444",border:"1px solid #0d0d1a",borderRadius:8,padding:"10px 12px",cursor:"pointer",fontSize:13}}>🔁</button>
                    </div>
                  </div>
                )}
              </div>
 
              {(results[activeNet]||generatingImg)&&(
                <div style={{width:210,background:"#080810",border:"1px solid #0d0d1a",borderRadius:13,padding:"14px",display:"flex",flexDirection:"column",gap:10,flexShrink:0}}>
                  <div style={{fontSize:10,color:"#555",letterSpacing:1}}>IMAGEN DEL POST</div>
                  {generatingImg&&!postImages[activeNet]?(
                    <div style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:8,minHeight:120}}>
                      <div style={{width:22,height:22,border:"2px solid #1a1a35",borderTopColor:"#7c3aed",borderRadius:"50%",animation:"spin 0.7s linear infinite"}}/>
                      <div style={{fontSize:10,color:"#333",textAlign:"center"}}>Generando...</div>
                    </div>
                  ):postImages[activeNet]?(
                    <>
                      <img src={postImages[activeNet]} style={{width:"100%",borderRadius:8,aspectRatio:"1",objectFit:"cover"}} alt="post"/>
                      <button onClick={()=>dlImg(activeNet)} className="btn-primary" style={{padding:"10px",fontSize:12,borderRadius:8,textAlign:"center"}}>
                        ⬇ Descargar imagen
                      </button>
                      <div style={{fontSize:10,color:"#333",textAlign:"center"}}>1080×1080px</div>
                    </>
                  ):null}
                </div>
              )}
            </div>
 
            {Object.keys(results).filter(k=>k!=="_error").length>0&&(
              <div style={{background:"#080810",border:"1px solid #0d0d1a",borderRadius:8,padding:"8px 14px",display:"flex",alignItems:"center",gap:12,flexShrink:0}}>
                <span style={{fontSize:10,color:"#222",letterSpacing:1}}>REDES:</span>
                {NETWORKS.map(n=>(
                  <span key={n.id} onClick={()=>setActiveNet(n.id)} style={{fontSize:11,color:results[n.id]?"#34d399":"#1a1a35",cursor:"pointer"}}>
                    {results[n.id]&&postImages[n.id]?"🖼️ ":results[n.id]?"✓ ":""}{n.label}
                  </span>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
 
      {/* GALLERY */}
      {tab==="gallery"&&(
        <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
            <div>
              <div style={{fontSize:17,fontWeight:800,fontFamily:"'Syne',sans-serif",marginBottom:3}}>Mi contenido</div>
              <div style={{fontSize:12,color:"#444"}}>{gallery.length} archivo{gallery.length!==1?"s":""} · {selected.length} seleccionado{selected.length!==1?"s":""}</div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {selected.length>0&&<button onClick={()=>setTab("generator")} className="btn-primary" style={{padding:"9px 18px",fontSize:13,borderRadius:10}}>Generar con {selected.length} →</button>}
              <button onClick={()=>galleryRef.current.click()} style={{background:"transparent",color:"#a78bfa",border:"1px solid #7c3aed40",borderRadius:10,padding:"9px 18px",cursor:"pointer",fontWeight:700,fontSize:13}}>+ Subir archivos</button>
              <input ref={galleryRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={e=>addFiles(e.target.files)}/>
            </div>
          </div>
 
          <div onDragOver={e=>e.preventDefault()} onDrop={e=>{e.preventDefault();addFiles(e.dataTransfer.files);}} onClick={()=>galleryRef.current.click()}
            style={{border:"2px dashed #1a1a35",borderRadius:14,padding:"28px",textAlign:"center",marginBottom:18,cursor:"pointer",transition:"all 0.2s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="#7c3aed50"} onMouseLeave={e=>e.currentTarget.style.borderColor="#1a1a35"}>
            <div style={{fontSize:32,marginBottom:8}}>📁</div>
            <div style={{fontSize:13,marginBottom:3,color:"#666"}}>Arrastrá tus fotos y videos acá</div>
            <div style={{fontSize:11,color:"#333"}}>JPG, PNG, WEBP, MP4, MOV · Múltiples archivos</div>
          </div>
 
          {selected.length>0&&(
            <div style={{background:"#7c3aed10",border:"1px solid #7c3aed25",borderRadius:10,padding:"9px 14px",marginBottom:14,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:"#a78bfa",fontSize:12,fontWeight:700}}>✓ {selected.length} seleccionado{selected.length>1?"s":""}</span>
              <div style={{display:"flex",gap:8}}>
                <button onClick={()=>setSelected(gallery.map(g=>g.id))} style={{background:"transparent",color:"#a78bfa",border:"1px solid #7c3aed30",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11}}>Todos</button>
                <button onClick={()=>setSelected([])} style={{background:"transparent",color:"#444",border:"1px solid #1a1a35",borderRadius:6,padding:"4px 10px",cursor:"pointer",fontSize:11}}>Ninguno</button>
              </div>
            </div>
          )}
 
          {gallery.length===0?(
            <div style={{textAlign:"center",padding:"60px 20px"}}>
              <div style={{fontSize:48,marginBottom:10,opacity:0.15,fontFamily:"'Syne',sans-serif",fontWeight:800}}>MCM</div>
              <div style={{fontSize:15,color:"#222",marginBottom:6}}>Tu carpeta de contenido está vacía</div>
              <div style={{fontSize:12,color:"#1a1a35"}}>Subí las fotos y videos de tu empresa para generar posts.</div>
            </div>
          ):(
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(150px,1fr))",gap:10}}>
              {gallery.map(item=>{
                const isSel=selected.includes(item.id);
                return(
                  <div key={item.id} className="media-wrap" style={{position:"relative",borderRadius:12,overflow:"hidden",border:`2px solid ${isSel?"#7c3aed":"transparent"}`,cursor:"pointer",aspectRatio:"1",background:"#0d0d1a",transition:"border-color 0.2s"}} onClick={()=>toggleSel(item.id)}>
                    {item.isVideo
                      ? <div style={{width:"100%",height:"100%",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6}}><div style={{fontSize:32}}>🎬</div><div style={{fontSize:10,color:"#444",textAlign:"center",padding:"0 8px"}}>{item.name.slice(0,18)}</div></div>
                      : <img src={item.preview} style={{width:"100%",height:"100%",objectFit:"cover"}} alt=""/>
                    }
                    {isSel&&<div style={{position:"absolute",inset:0,background:"#7c3aed20",display:"flex",alignItems:"flex-start",justifyContent:"flex-end",padding:7}}><div style={{width:22,height:22,borderRadius:"50%",background:GRAD,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,color:"#fff",fontWeight:800}}>✓</div></div>}
                    <button className="del-btn" onClick={e=>{e.stopPropagation();removeItem(item.id);}} style={{position:"absolute",top:7,left:7,background:"rgba(0,0,0,0.8)",border:"none",color:"#fff",width:20,height:20,borderRadius:"50%",cursor:"pointer",fontSize:10,lineHeight:"20px",opacity:0}}>✕</button>
                    <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(transparent,rgba(0,0,0,0.7))",padding:"6px",fontSize:9,color:"#666"}}>{item.date}</div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
 
      {/* BRAND */}
      {tab==="brand"&&(
        <div style={{flex:1,overflowY:"auto",padding:"20px 24px"}}>
          <div style={{maxWidth:540}}>
            <div style={{marginBottom:22}}>
              <div style={{fontSize:17,fontWeight:800,fontFamily:"'Syne',sans-serif",marginBottom:3}}>Perfil de mi marca</div>
              <div style={{fontSize:12,color:"#444"}}>MCM usa este perfil para personalizar todos los posts. Cuanto más completo, mejor el resultado.</div>
            </div>
            <div style={{display:"flex",flexDirection:"column",gap:14}}>
              {[
                ["NOMBRE DE LA EMPRESA","name","input","Ej: La Josefa Granja Orgánica"],
                ["INDUSTRIA / RUBRO","industry","select",""],
                ["PROPUESTA DE VALOR (qué hacés, qué te hace diferente)","description","textarea","Ej: Granja orgánica familiar. Vendemos huevos y verduras de estación directas al consumidor. Sin intermediarios, sin agroquímicos."],
                ["BUYER PERSONA (quién es tu cliente ideal)","target","input","Ej: Familias de 28-45 años, clase media-alta, que priorizan alimentación saludable y apoyo al productor local"],
                ["IDENTIDAD VISUAL Y ESTILO","colors","input","Ej: Verde tierra, madera natural, artesanal, fotos con luz natural, sin filtros exagerados"],
              ].map(([label,field,type,ph])=>(
                <div key={field}>
                  <span style={LBL}>{label}</span>
                  {type==="select"?(
                    <select value={brand[field]||""} onChange={e=>updateBrand(field,e.target.value)} style={{...INP,color:brand[field]?"#fff":"#3a3a4a",cursor:"pointer"}}>
                      <option value="">Seleccioná tu industria...</option>
                      {INDUSTRIES.map(i=><option key={i}>{i}</option>)}
                    </select>
                  ):type==="textarea"?(
                    <textarea value={brand[field]||""} onChange={e=>updateBrand(field,e.target.value)} rows={3} placeholder={ph} style={{...INP}}/>
                  ):(
                    <input value={brand[field]||""} onChange={e=>updateBrand(field,e.target.value)} placeholder={ph} style={{...INP}}/>
                  )}
                </div>
              ))}
 
              <div>
                <span style={LBL}>VOZ Y TONO DE MARCA</span>
                <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
                  {TONES.map(t=>(
                    <button key={t} onClick={()=>updateBrand("tone",t)} style={{background:(brand.tone||"auténtico")===t?"#7c3aed20":"#0d0d1a",border:`1px solid ${(brand.tone||"auténtico")===t?"#7c3aed":"#1a1a35"}`,borderRadius:8,padding:"8px 14px",color:(brand.tone||"auténtico")===t?"#a78bfa":"#444",cursor:"pointer",fontSize:12,textTransform:"capitalize",transition:"all 0.2s",fontFamily:"'DM Sans',sans-serif"}}>{t}</button>
                  ))}
                </div>
              </div>
 
              <div style={{background:"#0d0d1a",border:"1px solid #7c3aed20",borderRadius:12,padding:"14px 16px"}}>
                <div style={{fontSize:11,color:"#7c3aed",fontWeight:700,marginBottom:4}}>✦ Guardado automáticamente</div>
                <div style={{fontSize:12,color:"#444",lineHeight:1.7}}>MCM aplica este perfil en cada generación. Cuanto más detallado sea, más auténticos y precisos van a ser los posts.</div>
              </div>
 
              {brand.name&&(
                <button onClick={()=>setTab("generator")} className="btn-primary" style={{borderRadius:11,padding:"13px",fontSize:14}}>
                  Ir al generador →
                </button>
              )}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}
 
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
