<html lang="es">
<head>

<title>MCM — My Community Manager</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#08080f;--surface:#0f0f1a;--surface2:#161625;--border:#1e1e35;
  --accent:#6d28d9;--accent2:#a855f7;--pink:#ec4899;
  --text:#f0f0ff;--muted:#6b6b8a;--success:#22d3ee;--error:#f43f5e;--warn:#f59e0b;
}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;overflow-x:hidden}
h1,h2,h3{font-family:'Syne',sans-serif}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:'Inter',sans-serif;color:var(--text)}
input,textarea,select{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px 14px;width:100%;outline:none;font-size:14px;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--accent2)}
input::placeholder,textarea::placeholder{color:var(--muted)}
textarea{resize:vertical}
select{appearance:none;cursor:pointer}
select option{background:var(--surface)}
.lbl{font-size:11px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;font-weight:500}
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 22px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .2s;font-family:'Inter',sans-serif}
.btn-primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-primary:hover{opacity:.9;transform:translateY(-1px)}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-ghost:hover{border-color:var(--accent2);color:var(--accent2)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.spin{width:18px;height:18px;border:2px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
.fade-in{animation:fadeIn .35s ease both}
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:228px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;padding:16px 12px;overflow-y:auto}
.main{flex:1;overflow-y:auto}
.logo{display:flex;align-items:center;gap:10px;padding:8px 10px;margin-bottom:20px}
.logo-mark{width:32px;height:32px;background:linear-gradient(135deg,var(--accent),var(--pink));border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:13px;color:#fff;font-family:'Syne',sans-serif;flex-shrink:0}
.logo-text{font-family:'Syne',sans-serif;font-weight:800;font-size:15px}
.logo-sub{font-size:9px;color:var(--muted);letter-spacing:1px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:all .15s;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:rgba(109,40,217,.15);color:var(--accent2);border-color:rgba(168,85,247,.2)}
.nav-section{font-size:10px;color:var(--muted);letter-spacing:2px;padding:8px 12px 4px;margin-top:8px}
.step-dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0;transition:background .3s}
.step-dot.done{background:var(--success)}.step-dot.active{background:var(--accent2)}
.social-card{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin-bottom:10px;transition:border-color .2s}
.social-card.connected{border-color:rgba(34,211,238,.25);background:rgba(34,211,238,.03)}
.social-icon{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex-shrink:0}
.file-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.file-thumb{aspect-ratio:1;border-radius:10px;overflow:hidden;position:relative;border:2px solid transparent;transition:border-color .2s}
.file-add{aspect-ratio:1;border-radius:10px;border:2px dashed var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:6px;color:var(--muted);font-size:12px;transition:all .2s}
.file-add:hover{border-color:var(--accent2);color:var(--accent2)}
.post-option{background:var(--surface2);border:2px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:all .2s;display:flex;flex-direction:column}
.post-option:hover{border-color:var(--accent2);transform:translateY(-2px)}
.post-option.selected{border-color:var(--accent)}
.post-canvas-wrap{aspect-ratio:1;background:var(--bg);overflow:hidden;position:relative;flex-shrink:0}
.editor-wrap{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.92);z-index:2000;display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(24px)}
.editor-box{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:22px;width:100%;max-width:1020px;max-height:94vh;overflow-y:auto;display:flex;gap:22px;flex-wrap:wrap}
.toast{position:fixed;bottom:24px;right:24px;padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;z-index:9999;display:flex;align-items:center;gap:8px;max-width:340px;animation:fadeIn .3s ease}
.toast.ok{background:#0d2b1f;border:1px solid var(--success);color:var(--success)}
.toast.err{background:#1f0d0d;border:1px solid var(--error);color:var(--error)}
.toast.info{background:#1a0d2e;border:1px solid var(--accent2);color:var(--accent2)}
.pill-primary{display:inline-flex;align-items:center;padding:3px 10px;borderRadius:20px;fontSize:11px;fontWeight:600;background:rgba(109,40,217,.2);border:1px solid rgba(168,85,247,.4);color:var(--accent2)}
.pill-secondary{display:inline-flex;align-items:center;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(236,72,153,.15);border:1px solid rgba(236,72,153,.3);color:var(--pink)}
/* Historial */
.history-row{background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:14px;display:flex;align-items:center;gap:14px;transition:border-color .2s}
.history-row:hover{border-color:var(--border);background:var(--surface)}
.status-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useCallback } = React;

// ════════════════════════════════════════════════════════════════
// STORE — localStorage helpers
// ════════════════════════════════════════════════════════════════
const store = {
  get: k => { try { return JSON.parse(localStorage.getItem("mcm_"+k)); } catch { return null; } },
  set: (k,v) => localStorage.setItem("mcm_"+k, JSON.stringify(v)),
};

// ════════════════════════════════════════════════════════════════
// APRENDIZAJE — guarda preferencias de edición persistentes
// ════════════════════════════════════════════════════════════════
function learnFromEdit(original, edited) {
  const prefs = store.get("stylePrefs")||{};
  const delta = {};
  const fields = ["fontFamily","fontWeight","fontSize","fontColor","textBg","logoX","logoY","logoSize","showLogo","imgSrc"];
  fields.forEach(f => {
    if(edited[f] !== undefined && edited[f] !== original[f]) delta[f] = edited[f];
  });
  if(edited.textX !== original.textX || edited.textY !== original.textY) {
    delta.textX = edited.textX; delta.textY = edited.textY;
  }
  const updated = {...prefs, ...delta, lastUpdated: Date.now()};
  store.set("stylePrefs", updated);
  return updated;
}

function applyStylePrefs(opt) {
  const prefs = store.get("stylePrefs")||{};
  return {...opt, ...prefs, ...opt}; // opt values override prefs, but prefs fill defaults
}

function applyStylePrefsToNew(opt) {
  const prefs = store.get("stylePrefs")||{};
  // Only apply learned preferences for fields not explicitly set
  const result = {...opt};
  ["fontFamily","fontWeight","fontSize","fontColor","logoX","logoY","logoSize"].forEach(f => {
    if(prefs[f] !== undefined) result[f] = prefs[f];
  });
  return result;
}

function useToast() {
  const [t, setT] = useState(null);
  const show = (msg, type="info") => { setT({msg,type}); setTimeout(()=>setT(null),3500); };
  return [t, show];
}

const SOCIALS_DEFAULT = [
  {id:"instagram",name:"Instagram",icon:"📸",color:"#E1306C",connected:true,user:"@gonvinardell"},
  {id:"facebook",name:"Facebook",icon:"👥",color:"#1877F2",connected:false,user:""},
  {id:"twitter",name:"X / Twitter",icon:"🐦",color:"#1DA1F2",connected:false,user:""},
  {id:"tiktok",name:"TikTok",icon:"🎵",color:"#69C9D0",connected:false,user:""},
];

const INDUSTRIES = ["Gastronomía","Moda","Salud","Tecnología","Inmobiliaria","Educación","Turismo","Retail","Servicios","Construcción","Paisajismo","Fitness","Belleza","Fotografía","Otro"];
const TONES = ["Profesional","Cercano","Divertido","Inspirador","Urgente","Educativo"];

// Instrucciones de tono detalladas para los prompts
const TONE_INSTRUCTIONS = {
  "Profesional": "Usá un tono formal, serio y confiable. Vocabulario técnico del rubro. Frases completas y estructuradas. Sin emojis excepto los estrictamente necesarios. Transmitir autoridad y experiencia.",
  "Cercano": "Hablale al cliente de vos a vos (tuteo argentino). Tono amigable y cálido como si fuera un amigo que te recomienda algo. Podés usar 1-2 emojis. Frases cortas y directas.",
  "Divertido": "Tono descontracturado, con humor y energía. Usá jerga argentina moderna. Podés hacer juegos de palabras. Varios emojis. Que se sienta fresco y entretenido.",
  "Inspirador": "Mensajes que motiven y emocionen. Frases poderosas y evocadoras. Que genere una conexión emocional profunda. Citaciones o frases que inviten a la reflexión.",
  "Urgente": "Llamados a la acción directos y urgentes. Frases cortas. Palabras como 'Ahora', 'Hoy', 'No te lo pierdas', 'Últimas unidades'. Crear sensación de escasez o urgencia real.",
  "Educativo": "Explicar conceptos de forma clara y didáctica. Usar listas, tips numerados, preguntas retóricas. Posicionarse como experto que enseña. Aportar valor real con cada post.",
};

async function generateText(prompt) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt})});
  const d = await r.json();
  return d.text||"";
}

async function generateTextWithImage(prompt, imageBase64, imageMediaType) {
  const r = await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({prompt, imageBase64, imageMediaType})});
  const d = await r.json();
  return d.text||"";
}

// ════════════════════════════════════════════════════════════════
// CANVAS HELPERS
// ════════════════════════════════════════════════════════════════
async function loadImg(src) {
  return new Promise(resolve => {
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => resolve(img);
    img.onerror = () => resolve(null);
    img.src = src;
  });
}

function hexToRgb(hex) {
  try {
    const h = hex.replace("#","");
    return { r:parseInt(h.slice(0,2),16), g:parseInt(h.slice(2,4),16), b:parseInt(h.slice(4,6),16) };
  } catch { return {r:109,g:40,b:217}; }
}

function coverImg(ctx, img, x, y, w, h) {
  if (!img) return;
  const s = Math.max(w/img.width, h/img.height);
  const dw = img.width*s, dh = img.height*s;
  ctx.drawImage(img, x+(w-dw)/2, y+(h-dh)/2, dw, dh);
}

function rRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
}

// ── Calcula zona libre para el logo evitando solapamiento con textos ──
function findLogoPosition(opt, W, H) {
  const textX = (opt.textX||0.05)*W;
  const textY = (opt.textY||0.75)*H;
  const fs = Math.round((opt.fontSize||56)*1080/500);
  // Zona del texto principal (bounding box aproximado)
  const textZone = { x: textX-20, y: textY-fs*1.2, w: W*0.55, h: fs*2.5 };
  // Candidatos de posición (fracción del canvas)
  const candidates = [
    {x:0.88,y:0.88}, // esquina inferior derecha (default)
    {x:0.12,y:0.88}, // esquina inferior izquierda
    {x:0.88,y:0.10}, // esquina superior derecha
    {x:0.12,y:0.10}, // esquina superior izquierda
    {x:0.88,y:0.50}, // centro derecho
  ];
  const ls = (opt.logoSize||0.15)*W;
  for(const c of candidates) {
    const lx=c.x*W, ly=c.y*H;
    const overlap = lx+ls/2 > textZone.x && lx-ls/2 < textZone.x+textZone.w
                 && ly+ls/2 > textZone.y && ly-ls/2 < textZone.y+textZone.h;
    if(!overlap) return c;
  }
  return candidates[0];
}

// ── LOGO HELPER ──
async function drawLogo(ctx, opt, W, H) {
  if(!opt.showLogo || !opt.logoBase64) return;
  const logoImg = await loadImg(opt.logoBase64);
  if(!logoImg) return;
  const sizeFrac = opt.logoSize||0.15;
  const maxW = W * sizeFrac, maxH = H * sizeFrac;
  const scale = Math.min(maxW/logoImg.width, maxH/logoImg.height);
  const lw = logoImg.width*scale, lh = logoImg.height*scale;
  // Usa posición guardada o calcula automáticamente evitando solapamiento
  let pos;
  if(opt.logoX !== undefined && opt.logoY !== undefined) {
    pos = {x: opt.logoX, y: opt.logoY};
  } else {
    pos = findLogoPosition(opt, W, H);
  }
  const px = pos.x*W - lw/2, py = pos.y*H - lh/2;
  ctx.save();
  ctx.drawImage(logoImg, px, py, lw, lh);
  ctx.restore();
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 1 — REVISTA EDITORIAL
// ════════════════════════════════════════════════════════════════
async function drawTemplate1(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080;
  canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const bgImg = opt.imgSrc ? await loadImg(opt.imgSrc) : null;
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();

  if(bgImg) { coverImg(ctx, bgImg, 0, 0, W, H); }
  else {
    const bg=ctx.createLinearGradient(0,0,W,H);
    bg.addColorStop(0,`rgb(${r},${g},${b})`); bg.addColorStop(1,"#000");
    ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  }

  const topGrad = ctx.createLinearGradient(0,0,0,H*0.55);
  topGrad.addColorStop(0,"rgba(0,0,0,0.88)"); topGrad.addColorStop(0.65,"rgba(0,0,0,0.45)"); topGrad.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=topGrad; ctx.fillRect(0,0,W,H*0.55);

  const botGrad = ctx.createLinearGradient(0,H*0.82,0,H);
  botGrad.addColorStop(0,"rgba(0,0,0,0)"); botGrad.addColorStop(1,"rgba(0,0,0,0.5)");
  ctx.fillStyle=botGrad; ctx.fillRect(0,H*0.82,W,H*0.18);

  ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.fillRect(0,0,W,8);
  ctx.font="700 17px Arial,sans-serif"; ctx.fillStyle=`rgb(${r},${g},${b})`; ctx.textAlign="left";
  ctx.fillText("■  PUBLICACIÓN", 56, 60);

  if(text) {
    const ff = opt.fontFamily||"Impact,'Arial Black',sans-serif";
    const fw = opt.fontWeight||"900";
    const fc = opt.fontColor||"#ffffff";
    const canvasSize = Math.round((opt.fontSize||56)*1080/500);
    const words = text.split(" "); const lines = [];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size = canvasSize; ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){ ctx.font=`${fw} ${size}px ${ff}`; if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-112) break; size-=4; }
    ctx.fillStyle=fc; ctx.textAlign="left";
    ctx.shadowColor="rgba(0,0,0,0.5)"; ctx.shadowBlur=16;
    const lH=size*0.95; const tH=lines.length*lH;
    const posX=(opt.textX!==undefined?opt.textX:0.05)*W;
    const posY=(opt.textY!==undefined?opt.textY:0.15)*H;
    if(opt.textBg){ ctx.fillStyle="rgba(0,0,0,0.5)"; const mw=Math.max(...lines.map(l=>ctx.measureText(l).width)); rRect(ctx,posX-10,posY-10,mw+20,tH+20,8); ctx.fill(); ctx.fillStyle=fc; }
    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY+size*0.85+i*lH));
    ctx.shadowBlur=0;
    ctx.fillStyle=`rgba(${r},${g},${b},0.85)`; ctx.fillRect(posX, posY+size*0.85+tH+10, 200, 5);
  }

  if(!opt.showLogo||!opt.logoBase64){ ctx.font="600 17px Arial"; ctx.fillStyle="rgba(255,255,255,0.6)"; ctx.textAlign="right"; ctx.fillText("MCM", W-40, H-26); }
  await drawLogo(ctx, opt, W, H);
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 2 — DISEÑO GRÁFICO PURO
// ════════════════════════════════════════════════════════════════
async function drawTemplate2(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080; canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  ctx.fillStyle="#0a0a0f"; ctx.fillRect(0,0,W,H);
  ctx.beginPath(); ctx.arc(W+80,-80,500,0,Math.PI*2);
  const cg=ctx.createRadialGradient(W+80,-80,0,W+80,-80,500);
  cg.addColorStop(0,`rgba(${r},${g},${b},0.65)`); cg.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=cg; ctx.fill();
  ctx.beginPath(); ctx.arc(-50,H+50,320,0,Math.PI*2);
  const cg2=ctx.createRadialGradient(-50,H+50,0,-50,H+50,320);
  cg2.addColorStop(0,`rgba(${r},${g},${b},0.35)`); cg2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=cg2; ctx.fill();
  ctx.strokeStyle=`rgba(${r},${g},${b},0.1)`; ctx.lineWidth=1;
  for(let y=0;y<H;y+=54){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  ctx.fillStyle=`rgb(${r},${g},${b})`; rRect(ctx,50,200,16,H-400,8); ctx.fill();

  if(text) {
    const ff=opt.fontFamily||"Impact,'Arial Black',sans-serif"; const fw=opt.fontWeight||"900"; const fc=opt.fontColor||"#ffffff";
    const cs=Math.round((opt.fontSize||56)*1080/500);
    const words=text.toUpperCase().split(" "); const lines=[];
    for(let i=0;i<words.length;i+=2) lines.push(words.slice(i,i+2).join(" "));
    let size=cs; ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){ctx.font=`${fw} ${size}px ${ff}`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-160)break;size-=4;}
    ctx.fillStyle=fc; ctx.textAlign="left";
    const posX=(opt.textX!==undefined?opt.textX:0.09)*W;
    const posY=(opt.textY!==undefined?opt.textY:0.19)*H;
    const lH=size*0.95;
    lines.forEach((ln,i)=>ctx.fillText(ln, posX, posY+size*0.9+i*lH));
  }

  if(caption) {
    const bs=30; ctx.font=`300 ${bs}px Arial,sans-serif`; ctx.fillStyle="rgba(255,255,255,0.7)"; ctx.textAlign="left";
    const mw=W-150; const words=caption.split(" "); const lines=[]; let line="";
    for(const w of words){ const t2=line+(line?" ":"")+w; if(ctx.measureText(t2).width>mw){if(line)lines.push(line);line=w;}else line=t2; if(lines.length>=4)break; }
    if(line&&lines.length<4) lines.push(line);
    lines.forEach((ln,i)=>ctx.fillText(ln, 96, H-290+i*(bs*1.5)));
  }

  ctx.fillStyle=`rgba(${r},${g},${b},0.92)`; ctx.fillRect(0,H-70,W,70);
  ctx.font="700 21px Arial"; ctx.fillStyle="#ffffff"; ctx.textAlign="left"; ctx.fillText("MCM · MY COMMUNITY MANAGER",46,H-25);
  ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(36,36); ctx.lineTo(36,88); ctx.moveTo(36,36); ctx.lineTo(88,36); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(W-36,H-80); ctx.lineTo(W-36,H-128); ctx.moveTo(W-36,H-80); ctx.lineTo(W-88,H-80); ctx.stroke();
  await drawLogo(ctx, opt, W, H-70);
}

// ════════════════════════════════════════════════════════════════
// TEMPLATE 3 — IA VISUAL PREMIUM
// ════════════════════════════════════════════════════════════════
async function drawTemplate3(canvas, opt) {
  const ctx = canvas.getContext("2d");
  const W=1080, H=1080; canvas.width=W; canvas.height=H;
  const {r,g,b} = hexToRgb(opt.brandColor||"#6d28d9");
  const text = (opt.overlayText||"").replace(/[\*\_\#]/g,"").trim().toUpperCase();
  const industry = (opt.industry||"").toLowerCase();
  const caption = (opt.caption||"").replace(/[\*\_\#\n]/g," ").replace(/\s+/g," ").trim();

  const isFood=/gastro|restaurante|pizza|cafe|comida|food|panaderia|heladeria|granja|organica/i.test(industry+caption);
  const isHealth=/salud|fitness|deporte|medic|bienestar|gym/i.test(industry);
  const isRealEstate=/inmobil|construcci|arquitect|paisaj/i.test(industry);
  const isTech=/tecnolog|software|digital|web|app/i.test(industry);
  const isFashion=/moda|ropa|indument|fashion|belleza|estetica/i.test(industry);

  const splitX=W*0.58;

  ctx.fillStyle=isFood?"#080300":isHealth?"#020d06":isRealEstate?"#02040e":isTech?"#020408":isFashion?"#080305":"#07060f";
  ctx.fillRect(0,0,W,H);

  const panelGrad=ctx.createLinearGradient(splitX,0,W,H);
  const alpha=isFood?"0.18":isHealth?"0.18":isRealEstate?"0.15":isTech?"0.18":isFashion?"0.18":"0.18";
  panelGrad.addColorStop(0,`rgba(${r},${g},${b},${alpha})`); panelGrad.addColorStop(1,"rgba(0,0,0,0.05)");
  ctx.fillStyle=panelGrad; ctx.fillRect(splitX,0,W-splitX,H);

  ctx.beginPath(); ctx.moveTo(splitX-60,0); ctx.lineTo(splitX+60,H); ctx.lineTo(splitX+80,H); ctx.lineTo(splitX-40,0); ctx.closePath();
  const diagGrad=ctx.createLinearGradient(splitX-60,0,splitX+80,H);
  diagGrad.addColorStop(0,`rgba(${r},${g},${b},0.25)`); diagGrad.addColorStop(1,`rgba(${r},${g},${b},0.1)`);
  ctx.fillStyle=diagGrad; ctx.fill();

  const cx=W*0.79, cy=H*0.42;
  if(isFood){
    [260,200,140,80].forEach((rad,i)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle=`rgba(255,${150+i*20},${30+i*15},${0.12+i*0.07})`;ctx.lineWidth=i===3?3:1;ctx.stroke();});
    const gF=ctx.createRadialGradient(cx,cy,0,cx,cy,220);gF.addColorStop(0,"rgba(220,100,0,0.35)");gF.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gF;ctx.fillRect(splitX,0,W-splitX,H);
  } else if(isHealth){
    const gH=ctx.createRadialGradient(cx,cy,0,cx,cy,240);gH.addColorStop(0,"rgba(0,220,100,0.3)");gH.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gH;ctx.fillRect(splitX,0,W-splitX,H);
    ctx.strokeStyle="rgba(0,230,100,0.6)";ctx.lineWidth=3;ctx.beginPath();
    const hp=[splitX+40,cy+60,cx-100,cy+60,cx-60,cy+60,cx-40,cy-90,cx,cy+80,cx+30,cy+60,cx+90,cy+60,W-30,cy+60];
    for(let i=0;i<hp.length;i+=2)i===0?ctx.moveTo(hp[i],hp[i+1]):ctx.lineTo(hp[i],hp[i+1]);ctx.stroke();
  } else if(isRealEstate){
    const hx=cx-100,hy=cy-120,hw=200,hh=200;
    ctx.strokeStyle=`rgba(${r},${g},${b},0.5)`;ctx.lineWidth=2.5;ctx.beginPath();
    ctx.moveTo(hx,hy+hh*0.4);ctx.lineTo(hx+hw/2,hy);ctx.lineTo(hx+hw,hy+hh*0.4);ctx.lineTo(hx+hw,hy+hh);ctx.lineTo(hx,hy+hh);ctx.lineTo(hx,hy+hh*0.4);
    ctx.moveTo(hx+hw*0.38,hy+hh);ctx.lineTo(hx+hw*0.38,hy+hh*0.65);ctx.lineTo(hx+hw*0.62,hy+hh*0.65);ctx.lineTo(hx+hw*0.62,hy+hh);ctx.stroke();
    const gR=ctx.createRadialGradient(cx,cy,0,cx,cy,240);gR.addColorStop(0,`rgba(${r},${g},${b},0.22)`);gR.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gR;ctx.fillRect(splitX,0,W-splitX,H);
  } else if(isTech){
    const np=[[cx,cy],[cx-80,cy-100],[cx+90,cy-80],[cx+70,cy+90],[cx-90,cy+70],[cx-30,cy-160],[cx+120,cy+20]];
    ctx.strokeStyle="rgba(0,200,255,0.15)";ctx.lineWidth=1;
    np.forEach(([x,y],i)=>{np.forEach(([x2,y2],j)=>{if(i<j&&Math.hypot(x-x2,y-y2)<200){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x2,y2);ctx.stroke();}});});
    np.forEach(([x,y],i)=>{const gn=ctx.createRadialGradient(x,y,0,x,y,i===0?36:21);gn.addColorStop(0,"rgba(0,200,255,0.5)");gn.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gn;ctx.fillRect(x-36,y-36,72,72);ctx.beginPath();ctx.arc(x,y,i===0?12:7,0,Math.PI*2);ctx.fillStyle=i===0?"rgba(0,220,255,0.9)":"rgba(0,200,255,0.6)";ctx.fill();});
    const gT=ctx.createRadialGradient(cx,cy,0,cx,cy,220);gT.addColorStop(0,"rgba(0,180,255,0.2)");gT.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gT;ctx.fillRect(splitX,0,W-splitX,H);
  } else if(isFashion){
    ctx.strokeStyle="rgba(255,100,150,0.06)";ctx.lineWidth=1;for(let i=-100;i<W;i+=40){ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+H*0.5,H);ctx.stroke();}
    [220,170,110].forEach((rad,i)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle=`rgba(255,100,150,${0.2-i*0.04})`;ctx.lineWidth=1.5;ctx.stroke();});
    const gF2=ctx.createRadialGradient(cx,cy,0,cx,cy,230);gF2.addColorStop(0,"rgba(255,80,140,0.28)");gF2.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gF2;ctx.fillRect(splitX,0,W-splitX,H);
  } else {
    [240,180,120,60].forEach((rad,i)=>{ctx.beginPath();ctx.arc(cx,cy,rad,0,Math.PI*2);ctx.strokeStyle=`rgba(${r},${g},${b},${0.18-i*0.03})`;ctx.lineWidth=1.5;ctx.stroke();});
    const gG=ctx.createRadialGradient(cx,cy,0,cx,cy,260);gG.addColorStop(0,`rgba(${r},${g},${b},0.3)`);gG.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=gG;ctx.fillRect(splitX,0,W-splitX,H);
  }

  for(let i=0;i<600;i++){const x=Math.random()*W,y=Math.random()*H;ctx.fillStyle=`rgba(255,255,255,${Math.random()*0.025})`;ctx.fillRect(x,y,1.5,1.5);}

  const barGrad=ctx.createLinearGradient(0,0,0,H);barGrad.addColorStop(0,`rgba(${r},${g},${b},0.9)`);barGrad.addColorStop(1,`rgba(${r},${g},${b},0.3)`);
  ctx.fillStyle=barGrad;ctx.fillRect(0,0,6,H);

  if(text){
    const ff=opt.fontFamily||"Impact,'Arial Black',sans-serif";const fw=opt.fontWeight||"900";const fc=opt.fontColor||"#ffffff";
    const cs=Math.round((opt.fontSize||56)*1080/500);
    const words=text.split(" ");const lines=[];
    for(let i=0;i<words.length;i+=2)lines.push(words.slice(i,i+2).join(" "));
    const maxW=splitX-100;let size=cs;ctx.font=`${fw} ${size}px ${ff}`;
    while(size>40){ctx.font=`${fw} ${size}px ${ff}`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=maxW)break;size-=4;}
    const lH=size*0.96;const tH=lines.length*lH;
    const posX=(opt.textX!==undefined?Math.min(opt.textX*W,splitX-100):48);
    const posY=(opt.textY!==undefined?opt.textY*H:H/2-tH/2);
    ctx.shadowColor=`rgba(${r},${g},${b},0.6)`;ctx.shadowBlur=24;ctx.fillStyle=fc;ctx.textAlign="left";
    lines.forEach((ln,i)=>ctx.fillText(ln,posX,posY+size*0.85+i*lH));ctx.shadowBlur=0;
    ctx.fillStyle=`rgb(${r},${g},${b})`;ctx.fillRect(posX,posY+size*0.85+tH+12,140,4);
  }

  ctx.font="600 16px Arial";ctx.fillStyle=`rgba(${r},${g},${b},0.9)`;ctx.textAlign="left";ctx.fillText("● MCM",48,52);

  if(caption){
    const cs2=22;ctx.font=`300 ${cs2}px Arial,sans-serif`;ctx.fillStyle="rgba(255,255,255,0.55)";ctx.textAlign="left";
    const mw=splitX-80;const words=caption.split(" ");const lines=[];let line="";
    for(const w of words){const t2=line+(line?" ":"")+w;if(ctx.measureText(t2).width>mw){if(line)lines.push(line);line=w;}else line=t2;if(lines.length>=3)break;}
    if(line&&lines.length<3)lines.push(line);
    const capY=H-80-lines.length*(cs2*1.5);lines.forEach((ln,i)=>ctx.fillText(ln,48,capY+i*(cs2*1.5)));
  }

  if(!opt.showLogo||!opt.logoBase64){ctx.font="500 14px Arial";ctx.fillStyle="rgba(255,255,255,0.3)";ctx.textAlign="right";ctx.fillText("Imagen generada por IA",W-36,H-22);}
  await drawLogo(ctx,opt,W,H);
}

// ── SEGUNDO TEXTO ──
async function drawOverlayText2(canvas, opt) {
  if(!opt.overlayText2) return;
  const ctx=canvas.getContext("2d"); const W=canvas.width||1080,H=canvas.height||1080;
  const text=opt.overlayText2.replace(/[\*\_\#]/g,"").trim().toUpperCase(); if(!text) return;
  const ff=opt.fontFamily2||"Impact,'Arial Black',sans-serif"; const fw=opt.fontWeight2||"900"; const fc=opt.fontColor2||"#ffffff";
  const cs=Math.round((opt.fontSize2||40)*1080/500);
  const words=text.split(" ");const lines=[];
  for(let i=0;i<words.length;i+=2)lines.push(words.slice(i,i+2).join(" "));
  let size=cs;ctx.font=`${fw} ${size}px ${ff}`;
  while(size>24){ctx.font=`${fw} ${size}px ${ff}`;if(Math.max(...lines.map(l=>ctx.measureText(l).width))<=W-100)break;size-=4;}
  const posX=(opt.text2X!==undefined?opt.text2X:0.05)*W;
  const posY=(opt.text2Y!==undefined?opt.text2Y:0.88)*H;
  const lH=size*0.95;
  if(opt.textBg2){
    const mw=Math.max(...lines.map(l=>ctx.measureText(l).width));
    ctx.fillStyle="rgba(0,0,0,0.55)"; rRect(ctx,posX-8,posY-size*0.85-6,mw+16,lines.length*lH+12,6); ctx.fill();
  }
  ctx.shadowColor="rgba(0,0,0,0.6)";ctx.shadowBlur=14;ctx.fillStyle=fc;ctx.textAlign="left";
  lines.forEach((ln,i)=>ctx.fillText(ln,posX,posY+i*lH));
  ctx.shadowBlur=0;
}

// ── STICKERS ──
async function drawStickers(canvas, opt) {
  if(!opt.stickers||opt.stickers.length===0) return;
  const ctx=canvas.getContext("2d"); const W=canvas.width||1080,H=canvas.height||1080;
  for(const s of opt.stickers){
    const sz=Math.round((s.size||0.1)*W);
    ctx.font=`${sz}px serif`;ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.shadowColor="rgba(0,0,0,0.3)";ctx.shadowBlur=8;
    ctx.fillText(s.emoji,s.x*W,s.y*H);
    ctx.shadowBlur=0;ctx.textBaseline="alphabetic";
  }
}

// ── ROUTER ──
async function drawPost(canvas, opt) {
  if(opt.style===1) await drawTemplate1(canvas, opt);
  else if(opt.style===2) await drawTemplate2(canvas, opt);
  else await drawTemplate3(canvas, opt);
  await drawOverlayText2(canvas, opt);
  await drawStickers(canvas, opt);
}

// BRAND SCREEN — con rubro múltiple, tono reforzado, CM, templates ref
// ════════════════════════════════════════════════════════════════
function BrandScreen({brand,saveBrand,showToast,onNext}) {
  const [form,setForm]=useState({
    industry: brand.industry||"",
    subIndustries: brand.subIndustries||[],
    customIndustry: brand.customIndustry||"",
    name: brand.name||"",
    description: brand.description||"",
    target: brand.target||"",
    tone: brand.tone||"",
    color: brand.color||"#6d28d9",
    logoBase64: brand.logoBase64||null,
    cmInstructions: brand.cmInstructions||"",
    templateRefs: brand.templateRefs||[],
    analyzingTemplates: false,
  });
  const logoRef=useRef();
  const templateRefInput=useRef();
  const [analyzingRubro, setAnalyzingRubro]=useState(false);

  const upd=(k,v)=>setForm(p=>({...p,[k]:v}));

  // Manejo de rubro principal
  const selectIndustry=(ind)=>{
    if(ind===form.industry){ upd("industry",""); return; }
    upd("industry",ind);
    // Si el nuevo principal estaba en sub, sacarlo
    upd("subIndustries",(form.subIndustries||[]).filter(s=>s!==ind));
  };

  // Manejo de sub-rubros (máx 3)
  const toggleSubIndustry=(ind)=>{
    if(ind===form.industry) return; // no puede ser principal y secundario
    const subs=form.subIndustries||[];
    if(subs.includes(ind)){
      upd("subIndustries",subs.filter(s=>s!==ind));
    } else {
      if(subs.length>=3){showToast("Máximo 3 rubros secundarios","info");return;}
      upd("subIndustries",[...subs,ind]);
    }
  };

  // Cuando se elige "Otro" como principal, analizar con IA
  const analyzeCustomRubro=async()=>{
    if(!form.customIndustry.trim()){showToast("Escribí el nombre de tu rubro primero","err");return;}
    setAnalyzingRubro(true);
    try{
      const desc=await generateText(`Sos un experto en marketing digital. El cliente trabaja en el rubro: "${form.customIndustry}". En 2-3 oraciones cortas, describí qué hace este tipo de negocio, cuál es su público típico y qué temas de contenido son relevantes para sus redes sociales. Responde solo con la descripción, sin títulos.`);
      upd("customIndustryDesc",desc);
      showToast("Rubro analizado por IA ✓","ok");
    }catch(e){showToast("Error al analizar: "+e.message,"err");}
    finally{setAnalyzingRubro(false);}
  };

  // Logo upload
  const handleLogo=(e)=>{
    const file=e.target.files[0]; if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{upd("logoBase64",ev.target.result);showToast("Logo cargado!","ok");};
    reader.readAsDataURL(file);
  };

  // Templates de referencia upload + análisis IA
  const handleTemplateRefs=async(e)=>{
    const newFiles=Array.from(e.target.files);
    if(!newFiles.length) return;
    showToast("Analizando templates con IA...","info");
    const refs=[...(form.templateRefs||[])];
    for(const file of newFiles){
      const base64=await new Promise(res=>{
        const r=new FileReader(); r.onload=ev=>res(ev.target.result); r.readAsDataURL(file);
      });
      // Analizar con IA Vision
      try{
        const mediaType=file.type||"image/jpeg";
        const b64data=base64.split(",")[1];
        const analysis=await generateTextWithImage(
          `Sos un director de arte experto en diseño de posts para redes sociales. Analizá este template de diseño y describí en formato JSON los siguientes atributos:
{
  "layout": "descripción del layout (ej: foto full bleed con texto arriba, split design izquierda/derecha, etc)",
  "colorPalette": "colores dominantes y su uso",
  "fontStyle": "estilo tipográfico (grande/pequeño, serif/sans, etc)",
  "textPlacement": "dónde se ubica el texto principal (arriba/abajo/centro/izquierda/etc)",
  "mood": "sensación general del diseño (minimalista, bold, elegante, etc)",
  "elements": "elementos decorativos presentes (líneas, formas, gradientes, etc)"
}
Responde SOLO con el JSON, sin texto adicional.`,
          b64data, mediaType
        );
        let styleData={};
        try{ styleData=JSON.parse(analysis.replace(/```json|```/g,"").trim()); }catch{}
        refs.push({preview:base64, style:styleData});
      }catch(err){
        refs.push({preview:base64, style:{}});
      }
    }
    upd("templateRefs",refs);
    // Guardar en stylePrefs para que influence los templates
    const existingPrefs=store.get("stylePrefs")||{};
    store.set("stylePrefs",{...existingPrefs, templateRefs: refs, lastTemplateAnalysis: Date.now()});
    showToast(newFiles.length+" template(s) analizados ✓","ok");
  };

  const removeTemplateRef=(idx)=>upd("templateRefs",(form.templateRefs||[]).filter((_,i)=>i!==idx));

  const save=()=>{
    saveBrand(form);
    showToast("Perfil guardado — MCM lo recordará siempre ✓","ok");
  };

  const industryForDisplay=(ind)=>{
    const isPrimary=form.industry===ind;
    const isSecondary=(form.subIndustries||[]).includes(ind);
    let bg="var(--surface2)", border="var(--border)", color="var(--muted)";
    if(isPrimary){bg="rgba(109,40,217,.25)";border="var(--accent2)";color="var(--accent2)";}
    else if(isSecondary){bg="rgba(236,72,153,.18)";border="rgba(236,72,153,.5)";color="var(--pink)";}
    return {isPrimary,isSecondary,bg,border,color};
  };

  return (
    <div style={{padding:"32px 36px",maxWidth:680}} className="fade-in">
      <div style={{marginBottom:24}}>
        <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Perfil de tu marca</h2>
        <p style={{color:"var(--muted)",fontSize:14}}>MCM guarda todo esto y lo usa cada vez que genera contenido.</p>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:18}}>

        {/* Nombre */}
        <div><span className="lbl">Nombre de la empresa</span>
          <input value={form.name} onChange={e=>upd("name",e.target.value)} placeholder="Ej: La Josefa Granja Orgánica" /></div>

        {/* Rubro con multi-select */}
        <div>
          <span className="lbl">Rubro principal (1) y secundarios (hasta 3)</span>
          <div style={{fontSize:11,color:"var(--muted)",marginBottom:8}}>
            <span style={{background:"rgba(109,40,217,.2)",border:"1px solid var(--accent2)",color:"var(--accent2)",padding:"2px 8px",borderRadius:20,marginRight:6}}>Principal</span>
            <span style={{background:"rgba(236,72,153,.15)",border:"1px solid rgba(236,72,153,.4)",color:"var(--pink)",padding:"2px 8px",borderRadius:20}}>Secundario</span>
          </div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {INDUSTRIES.map(ind=>{
              const {isPrimary,isSecondary,bg,border,color}=industryForDisplay(ind);
              return (
                <button key={ind} className="btn" style={{padding:"6px 12px",fontSize:12,background:bg,border:"1px solid "+border,color}}
                  onClick={()=>isPrimary?selectIndustry(ind):isSecondary?toggleSubIndustry(ind):form.industry?toggleSubIndustry(ind):selectIndustry(ind)}>
                  {isPrimary&&"★ "}{isSecondary&&"+ "}{ind}
                </button>
              );
            })}
          </div>
          {form.industry&&<div style={{fontSize:11,color:"var(--muted)",marginTop:8}}>
            Click en uno sin marcar → secundario. Click en el principal → deseleccionar.
          </div>}

          {/* Rubro personalizado si elige "Otro" */}
          {(form.industry==="Otro"||(form.subIndustries||[]).includes("Otro"))&&(
            <div style={{marginTop:12,display:"flex",flexDirection:"column",gap:8}}>
              <input value={form.customIndustry} onChange={e=>upd("customIndustry",e.target.value)}
                placeholder="Describí tu rubro (ej: Veterinaria especializada en animales exóticos)" />
              <button className="btn btn-ghost" style={{alignSelf:"flex-start",fontSize:12,padding:"7px 14px"}}
                onClick={analyzeCustomRubro} disabled={analyzingRubro}>
                {analyzingRubro?<><div className="spin"/>Analizando...</>:"🤖 Analizar rubro con IA"}
              </button>
              {form.customIndustryDesc&&(
                <div style={{background:"rgba(109,40,217,.1)",border:"1px solid rgba(168,85,247,.2)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"var(--text)",lineHeight:1.6}}>
                  <strong style={{color:"var(--accent2)"}}>IA analizó tu rubro:</strong><br/>{form.customIndustryDesc}
                </div>
              )}
            </div>
          )}
        </div>

        {/* Descripción */}
        <div><span className="lbl">Descripción del negocio</span>
          <textarea value={form.description} onChange={e=>upd("description",e.target.value)} rows={3}
            placeholder="Qué ofrecés, qué te diferencia de la competencia..." /></div>

        {/* Cliente ideal */}
        <div><span className="lbl">Cliente ideal</span>
          <input value={form.target} onChange={e=>upd("target",e.target.value)}
            placeholder="Ej: Familias que valoran la alimentación saludable" /></div>

        {/* Tono */}
        <div>
          <span className="lbl">Tono de comunicación</span>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:8}}>
            {TONES.map(t=>(
              <button key={t} onClick={()=>upd("tone",t)} className="btn"
                style={{padding:"6px 14px",fontSize:12,background:form.tone===t?"rgba(109,40,217,.25)":"var(--surface2)",border:"1px solid "+(form.tone===t?"var(--accent2)":"var(--border)"),color:form.tone===t?"var(--accent2)":"var(--muted)"}}>
                {t}
              </button>
            ))}
          </div>
          {form.tone&&(
            <div style={{background:"rgba(109,40,217,.08)",border:"1px solid rgba(168,85,247,.15)",borderRadius:10,padding:"10px 14px",fontSize:12,color:"var(--muted)",lineHeight:1.6}}>
              <strong style={{color:"var(--accent2)"}}>Cómo va a sonar tu contenido: </strong>{TONE_INSTRUCTIONS[form.tone]}
            </div>
          )}
        </div>

        {/* Color de marca */}
        <div>
          <span className="lbl">Color de marca</span>
          <div style={{display:"flex",alignItems:"center",gap:12}}>
            <input type="color" value={form.color||"#6d28d9"} onChange={e=>upd("color",e.target.value)}
              style={{width:48,height:40,borderRadius:8,border:"1px solid var(--border)",cursor:"pointer",padding:4}} />
            <span style={{fontSize:13,color:"var(--muted)"}}>Se usa en los fondos de las imágenes</span>
          </div>
        </div>

        {/* Logo */}
        <div>
          <span className="lbl">Logo de la marca</span>
          <input ref={logoRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleLogo} />
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            {form.logoBase64?(
              <div style={{position:"relative"}}>
                <img src={form.logoBase64} alt="Logo" style={{width:72,height:72,objectFit:"contain",borderRadius:10,background:"rgba(255,255,255,0.06)",border:"1px solid var(--border)",padding:6}} />
                <button onClick={()=>upd("logoBase64",null)} style={{position:"absolute",top:-6,right:-6,background:"var(--error)",border:"none",color:"#fff",borderRadius:"50%",width:18,height:18,cursor:"pointer",fontSize:10,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
              </div>
            ):(
              <div onClick={()=>logoRef.current.click()} style={{width:72,height:72,borderRadius:10,border:"2px dashed var(--border)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",gap:4,color:"var(--muted)",fontSize:11,transition:"all .2s"}}
                onMouseEnter={e=>{e.currentTarget.style.borderColor="var(--accent2)";e.currentTarget.style.color="var(--accent2)";}}
                onMouseLeave={e=>{e.currentTarget.style.borderColor="var(--border)";e.currentTarget.style.color="var(--muted)";}}>
                <span style={{fontSize:22}}>🖼</span><span>Subir</span>
              </div>
            )}
            <div style={{fontSize:12,color:"var(--muted)",lineHeight:1.6}}>PNG o SVG con fondo transparente.<br/>Se puede mostrar/ocultar desde el editor.</div>
          </div>
        </div>

        {/* Contale a tu CM */}
        <div style={{background:"rgba(109,40,217,.06)",border:"1px solid rgba(168,85,247,.2)",borderRadius:14,padding:"16px"}}>
          <span className="lbl" style={{marginBottom:8}}>💬 Contale a tu CM</span>
          <p style={{fontSize:12,color:"var(--muted)",marginBottom:10,lineHeight:1.6}}>
            Contale a tu community manager IA qué tipo de posts querés, qué cosas te gustan o no te gustan, ideas especiales, eventos próximos, lo que se te ocurra. La IA lo va a tener en cuenta en cada publicación.
          </p>
          <textarea value={form.cmInstructions} onChange={e=>upd("cmInstructions",e.target.value)} rows={4}
            placeholder="Ej: Me gustan los posts con mucha energía y colores vivos. Próximo mes tenemos el aniversario número 5 de la empresa. No quiero posts que hablen de precios. Me gustaría mostrar más el equipo de trabajo..." />
        </div>

        {/* Dame ideas de templates */}
        <div style={{background:"rgba(236,72,153,.05)",border:"1px solid rgba(236,72,153,.2)",borderRadius:14,padding:"16px"}}>
          <span className="lbl" style={{marginBottom:8}}>🎨 Dame ideas de templates</span>
          <p style={{fontSize:12,color:"var(--muted)",marginBottom:10,lineHeight:1.6}}>
            Subí imágenes de diseños que te gusten. La IA las va a analizar y va a intentar crear posts con un estilo similar para tu marca.
          </p>
          <input ref={templateRefInput} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleTemplateRefs} />
          <button className="btn btn-ghost" style={{fontSize:12,padding:"8px 16px",borderColor:"rgba(236,72,153,.4)",color:"var(--pink)"}}
            onClick={()=>templateRefInput.current.click()}>
            + Subir imágenes de referencia
          </button>
          {(form.templateRefs||[]).length>0&&(
            <div style={{marginTop:12,display:"flex",gap:8,flexWrap:"wrap"}}>
              {form.templateRefs.map((ref,i)=>(
                <div key={i} style={{position:"relative",width:72,height:72}}>
                  <img src={ref.preview} alt="ref" style={{width:72,height:72,objectFit:"cover",borderRadius:8,border:"1px solid var(--border)"}} />
                  <button onClick={()=>removeTemplateRef(i)} style={{position:"absolute",top:-5,right:-5,background:"var(--error)",border:"none",color:"#fff",borderRadius:"50%",width:16,height:16,cursor:"pointer",fontSize:9,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
                  {ref.style?.mood&&<div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,.75)",fontSize:8,color:"#fff",padding:"2px 4px",borderRadius:"0 0 8px 8px",textAlign:"center",overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{ref.style.mood}</div>}
                </div>
              ))}
            </div>
          )}
        </div>

      </div>

      <div style={{display:"flex",gap:10,marginTop:28}}>
        <button className="btn btn-ghost" style={{flex:1}} onClick={save}>💾 Guardar</button>
        <button className="btn btn-primary" style={{flex:1}} onClick={()=>{save();onNext();}}>Siguiente — Mis Archivos →</button>
      </div>
    </div>
  );
}

// LIBRARY SCREEN
// ════════════════════════════════════════════════════════════════
function LibraryScreen({files,saveFiles,showToast,onNext}) {
  const inputRef=useRef();
  const handleFiles=async(e)=>{
    const rawFiles=Array.from(e.target.files);
    showToast("Procesando "+rawFiles.length+" archivo(s)...","info");
    const newFiles = await Promise.all(rawFiles.map(f => new Promise(resolve => {
      const reader = new FileReader();
      reader.onload = ev => resolve({
        id: Date.now()+Math.random(),
        name: f.name,
        type: f.type.startsWith("video") ? "video" : "image",
        preview: ev.target.result, // base64 real, no blob URL
        size: f.size,
      });
      reader.readAsDataURL(f);
    })));
    saveFiles([...files,...newFiles]);
    showToast(newFiles.length+" archivo(s) agregado(s)","ok");
  };
  const remove=(id)=>saveFiles(files.filter(f=>f.id!==id));
  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:24,display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Mis archivos</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>La IA elegirá de estos archivos para crear las publicaciones.</p>
        </div>
        <button className="btn btn-primary" onClick={()=>inputRef.current.click()}>+ Agregar</button>
      </div>
      <input ref={inputRef} type="file" accept="image/*,video/*" multiple style={{display:"none"}} onChange={handleFiles} />
      <div className="file-grid">
        <div className="file-add" onClick={()=>inputRef.current.click()}>
          <div style={{fontSize:28}}>📷</div><div>Fotos y videos</div>
        </div>
        {files.map(f=>(
          <div key={f.id} className="file-thumb">
            {f.type==="video"?<video src={f.preview} style={{width:"100%",height:"100%",objectFit:"cover"}} />:<img src={f.preview} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}} />}
            <button onClick={()=>remove(f.id)} style={{position:"absolute",top:4,right:4,background:"rgba(0,0,0,.7)",border:"none",color:"#fff",borderRadius:"50%",width:22,height:22,cursor:"pointer",fontSize:11,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
            {f.type==="video"&&<div style={{position:"absolute",bottom:4,left:4,background:"rgba(0,0,0,.6)",borderRadius:4,padding:"2px 6px",fontSize:10}}>🎬</div>}
          </div>
        ))}
      </div>
      {files.length>0&&<div style={{marginTop:28}}><button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>Siguiente — Crear Publicaciones →</button></div>}
    </div>
  );
}

// GENERATE SCREEN — 7 briefs individuales + carrusel
// ════════════════════════════════════════════════════════════════
function GenerateScreen({brand,files,posts,savePosts,showToast,onNext}) {
  const [generating,setGenerating]=useState(false);
  const [weekPosts,setWeekPosts]=useState([]);
  const [selections,setSelections]=useState({});
  const [editing,setEditing]=useState(null);
  const [progress,setProgress]=useState(0);

  // 7 briefs individuales
  const [briefs,setBriefs]=useState(store.get("weekBriefs")||Array(7).fill(""));
  // Cantidad de imágenes por post (carrusel)
  const [slideCounts,setSlideCounts]=useState(store.get("slideCounts")||Array(7).fill(1));

  const updBrief=(i,v)=>{ const b=[...briefs]; b[i]=v; setBriefs(b); store.set("weekBriefs",b); };
  const updSlideCount=(i,v)=>{ const s=[...slideCounts]; s[i]=v; setSlideCounts(s); store.set("slideCounts",s); };

  const PROMPTS=[
    "Genera un caption profesional sobre el trabajo o servicio principal que ofrece la empresa.",
    "Genera un caption con un testimonio o caso de éxito de un cliente de esta empresa.",
    "Genera un caption educativo con un tip o consejo útil relacionado al rubro.",
    "Genera un caption promocional con un llamado a la acción concreto.",
    "Genera un caption que muestre los valores humanos y el equipo de la empresa.",
    "Genera un caption con una pregunta abierta para generar interacción y comentarios.",
    "Genera un caption emotivo e inspirador que conecte con la audiencia de la marca.",
  ];

  const OVERLAY_CONTEXTS=[
    "El fondo muestra el producto o servicio principal. Tema: presentación del trabajo.",
    "El fondo muestra clientes satisfechos o resultado del trabajo. Tema: testimonio de éxito.",
    "El fondo muestra el proceso de trabajo o materiales. Tema: consejo educativo.",
    "El fondo muestra una oferta o producto destacado. Tema: promoción con urgencia.",
    "El fondo muestra el equipo o el lugar físico. Tema: valores y personas.",
    "El fondo muestra algo que invita a la reflexión. Tema: pregunta de engagement.",
    "El fondo muestra un momento emotivo o resultado especial. Tema: inspiración emocional.",
  ];

  // Construir contexto completo de la marca (incluye CM instructions, template refs, learned prefs)
  const buildBrandContext=(postIdx)=>{
    const tone=brand.tone||"Profesional";
    const toneInstr=TONE_INSTRUCTIONS[tone]||"";
    const industryList=[brand.industry||"", ...(brand.subIndustries||[]), brand.customIndustry||""].filter(Boolean).join(", ");
    const cmNote=brand.cmInstructions?`\nInstrucciones especiales del cliente: ${brand.cmInstructions}`:"";
    const briefNote=briefs[postIdx]?`\nBrief específico para este post: ${briefs[postIdx]}`:"";
    const prefs=store.get("stylePrefs")||{};
    const templateNote=(brand.templateRefs||[]).length>0?`\nEl cliente subió referencias de diseño con estos estilos: ${(brand.templateRefs||[]).map(r=>r.style?.mood||"").filter(Boolean).join(", ")}.`:"";
    const learnedNote=prefs.lastUpdated?`\nAprendizaje previo: el cliente prefirió editar los posts con fuente ${prefs.fontFamily||"Impact"}, tamaño ${prefs.fontSize||56}px.`:"";
    return `Empresa: ${brand.name}. Rubro: ${industryList}. Descripción: ${brand.description||""}. Cliente ideal: ${brand.target||""}. Tono: ${tone}. Instrucciones de tono: ${toneInstr}.${cmNote}${briefNote}${templateNote}${learnedNote} Incluye 5-6 hashtags relevantes. Solo el caption, sin explicaciones.`;
  };

  const generate=async()=>{
    if(!brand.name){showToast("Primero completá el perfil de tu marca","err");return;}
    const imgs=files.filter(f=>f.type==="image");
    if(imgs.length===0){showToast("Agregá al menos una imagen a tus archivos","err");return;}
    setGenerating(true); setWeekPosts([]); setSelections({}); setProgress(0);

    try{
      const allPosts=[];
      const prefs=store.get("stylePrefs")||{};
      for(let i=0;i<7;i++){
        setProgress(i+1);
        // ── SELECCIÓN DE IMAGEN POR BRIEF ──
        // Estrategia: cada imagen recibe una puntuación de relevancia (0-10) 
        // comparada directamente con el brief en un solo llamado Vision.
        // Se elige la de mayor puntaje. Sin pasos intermedios que puedan fallar.
        let imgSrc = imgs[i % imgs.length].preview;
        let imgMatchWarning = false;

        if(postBrief && imgs.length > 1) {
          try {
            setProgressMsg(`Post ${i+1}: analizando ${imgs.length} imágenes para "${postBrief}"...`);
            const scores = await Promise.all(imgs.map(async (img, idx) => {
              const parts = img.preview.split(",");
              const b64 = parts[1];
              const mtype = (parts[0]||"").split(";")[0].split(":")[1] || "image/jpeg";
              if(!b64 || b64.length < 100) return { idx, score: 0 };
              try {
                const result = await generateTextWithImage(
                  `El cliente quiere publicar sobre: "${postBrief}". ¿Esta imagen muestra ese tema o algo directamente relacionado? Respondé con UN SOLO número del 0 al 10 donde 0=sin relación, 10=perfectamente relacionado. Solo el número.`,
                  b64, mtype
                );
                const score = parseInt(result.trim().replace(/\D/g,"")) || 0;
                return { idx, score };
              } catch { return { idx, score: 0 }; }
            }));

            // Elegir la imagen con mayor puntaje
            const best = scores.reduce((a, b) => b.score > a.score ? b : a, { idx: i % imgs.length, score: 0 });
            setProgressMsg(`Post ${i+1}: imagen seleccionada (relevancia ${best.score}/10) — generando texto...`);
            if(best.score >= 4) {
              imgSrc = imgs[best.idx].preview;
            } else {
              imgSrc = imgs[best.idx].preview;
              imgMatchWarning = true;
            }
          } catch(e) {
            imgSrc = imgs[i % imgs.length].preview;
          }
        } else {
          setProgressMsg(`Post ${i+1}: generando contenido...`);
        }
        const ctx=buildBrandContext(i);
        const slideCount=slideCounts[i]||1;
        const postBrief=briefs[i]||"";

        // Base del prompt de overlay — contexto visual único por post
        const overlayBase=`Sos un director creativo de publicidad. Empresa: ${brand.name} (${brand.industry||""}).`;
        const briefNote=postBrief?` El cliente pidió específicamente un post sobre: "${postBrief}".`:"";
        const themeNote=` El tema del post es: ${OVERLAY_CONTEXTS[i]}`;

        // T1 (Revista): el brief manda. Si hay brief, la frase es SOBRE el brief, no sobre la imagen
        const overlayPrompt1 = postBrief
          ? `${overlayBase}${briefNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras para superponer sobre la imagen. La frase DEBE hablar sobre "${postBrief}". Es OBLIGATORIO que la frase esté directamente relacionada con ese tema específico. Sin hashtags, sin emojis, sin puntuación. Solo las palabras.`
          : `${overlayBase}${themeNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras para superponer sobre una foto real del negocio. Debe ser poético e impactante. Sin hashtags, sin emojis, sin puntuación. Solo las palabras.`;

        // T2 (Diseño): titular tipográfico fuerte, también guiado por brief si lo hay
        const overlayPrompt2 = postBrief
          ? `${overlayBase}${briefNote} Escribí una frase de EXACTAMENTE 3 a 5 palabras para un diseño gráfico bold. La frase DEBE referirse a "${postBrief}" de forma impactante. Sin hashtags, sin emojis, sin puntuación. Solo las palabras. Que sea DIFERENTE a cualquier otra frase que hayas generado para este post.`
          : `${overlayBase}${themeNote} Escribí una frase de EXACTAMENTE 3 a 5 palabras para un diseño gráfico sin foto. Titular de impacto. Sin hashtags, sin emojis, sin puntuación. Solo las palabras.`;

        // T3 (IA Visual): 100% guiado por el brief
        const overlayPrompt3 = postBrief
          ? `${overlayBase}${briefNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras que capture la ESENCIA de "${postBrief}". Esta será la frase principal del diseño. Sin hashtags, sin emojis, sin puntuación. Solo las palabras.`
          : `${overlayBase}${themeNote} Escribí un texto de EXACTAMENTE 3 a 5 palabras, creativo y conceptual, diferente a las otras opciones. Sin hashtags, sin emojis, sin puntuación. Solo las palabras.`;

        // Caption para T3: si hay brief, responde directamente a él
        const cap3Prompt=postBrief
          ? `Sos un community manager experto. El cliente pidió un post que hable de: "${postBrief}". Redactá un caption para Instagram que desarrolle exactamente esa idea para la empresa: ${brand.name} (${brand.industry||""}). ${ctx} El caption debe abordar directamente el tema del brief con profundidad y creatividad.`
          : PROMPTS[i]+" Versión orientada a ventas y conversión. "+ctx;

        const [cap1,cap2,cap3,raw1,raw2,raw3]=await Promise.all([
          generateText(PROMPTS[i]+ctx),
          generateText(PROMPTS[i]+" Versión más cercana y coloquial. "+ctx),
          generateText(cap3Prompt),
          generateText(overlayPrompt1),
          generateText(overlayPrompt2),
          generateText(overlayPrompt3),
        ]);

        const cleanOverlay=(raw)=>raw.trim().replace(/['"\*\_\#\.\,\!\?]/g,"").replace(/\s+/g," ").slice(0,40);
        const overlayText1=cleanOverlay(raw1);
        const overlayText2=cleanOverlay(raw2);
        const overlayText3=cleanOverlay(raw3);

        // Para carrusel: generar múltiples slides (misma opción pero diferentes imágenes)
        const makeCarouselSlides=(count,baseImgSrc)=>{
          const slides=[];
          for(let s=0;s<count;s++){
            slides.push(imgs[(i+s)%imgs.length].preview);
          }
          return slides;
        };

        const baseOpt={
          fontSize: prefs.fontSize||56,
          fontColor: prefs.fontColor||"#ffffff",
          fontFamily: prefs.fontFamily||"Impact",
          fontWeight: prefs.fontWeight||"900",
          textBg: false,
          showLogo: true,
          logoBase64: brand.logoBase64||null,
          brandColor: brand.color||"#6d28d9",
          industry: [brand.industry||"",...(brand.subIndustries||[]),brand.customIndustry||""].filter(Boolean).join("|"),
          logoX: prefs.logoX, logoY: prefs.logoY, logoSize: prefs.logoSize||0.15,
          stickers: [],
        };

        const options=[
          {id:0,style:1,styleName:"Revista",caption:cap1,overlayText:overlayText1,imgSrc,...baseOpt,
           imgMatchWarning, slideCount, slides: slideCount>1?makeCarouselSlides(slideCount,imgSrc):null},
          {id:1,style:2,styleName:"Diseño",caption:cap2,overlayText:overlayText2,imgSrc:null,...baseOpt,
           slideCount, slides: null},
          {id:2,style:3,styleName:"IA Visual",caption:cap3,overlayText:overlayText3,imgSrc:null,...baseOpt,
           slideCount, slides: null},
        ];
        allPosts.push({postIdx:i,label:"Post "+(i+1),theme:PROMPTS[i].slice(8,40)+"...",options,slideCount});
        setWeekPosts([...allPosts]);
      }
      savePosts(allPosts.map((p,i)=>({...p.options[0],postIdx:i,id:Date.now()+i})));
      showToast("7 publicaciones generadas!","ok");
    }catch(e){showToast("Error: "+e.message,"err");}
    finally{setGenerating(false);setProgress(0);setProgressMsg("");}
  };

  const [progressMsg, setProgressMsg] = useState("");
  const allSelected=weekPosts.length===7&&Object.keys(selections).length===7;

  return (
    <div style={{padding:"32px 36px"}} className="fade-in">
      <div style={{marginBottom:20,display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexWrap:"wrap",gap:12}}>
        <div>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:6}}>Crear publicaciones de la semana</h2>
          <p style={{color:"var(--muted)",fontSize:14}}>7 posts con 3 opciones cada uno. Configurá cada uno individualmente.</p>
        </div>
        <button className="btn btn-primary" onClick={generate} disabled={generating}>
          {generating?<><div className="spin"/>Generando {progress}/7...</>:"✦ Generar semana completa"}
        </button>
      </div>

      {/* 7 briefs individuales */}
      <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:14,padding:"16px",marginBottom:24}}>
        <div style={{fontWeight:700,fontSize:14,marginBottom:4}}>Brief por publicación</div>
        <div style={{fontSize:12,color:"var(--muted)",marginBottom:14}}>Opcional — si querés guiar la IA en algún post específico</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
          {Array(7).fill(0).map((_,i)=>(
            <div key={i} style={{background:"var(--surface2)",borderRadius:10,padding:"10px 12px"}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:6}}>
                <span style={{fontSize:12,fontWeight:600,color:"var(--accent2)"}}>Post {i+1}</span>
                <div style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{fontSize:11,color:"var(--muted)"}}>Slides:</span>
                  <div style={{display:"flex",gap:3}}>
                    {[1,2,3,4,5].map(n=>(
                      <button key={n} onClick={()=>updSlideCount(i,n)}
                        style={{width:22,height:22,borderRadius:5,border:"1px solid "+(slideCounts[i]===n?"var(--accent2)":"var(--border)"),background:slideCounts[i]===n?"rgba(109,40,217,.3)":"transparent",color:slideCounts[i]===n?"var(--accent2)":"var(--muted)",fontSize:11,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center"}}>
                        {n}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
              <input value={briefs[i]} onChange={e=>updBrief(i,e.target.value)}
                placeholder={`Brief del post ${i+1}...`}
                style={{fontSize:12,padding:"8px 10px"}} />
            </div>
          ))}
        </div>
      </div>

      {generating&&(
        <div style={{padding:"20px",marginBottom:20}}>
          <div style={{display:"flex",justifyContent:"space-between",marginBottom:8,fontSize:13,color:"var(--muted)"}}>
            <span>{progressMsg||"Generando publicaciones..."}</span>
            <span style={{color:"var(--accent2)"}}>{progress}/7</span>
          </div>
          <div style={{height:6,background:"var(--surface2)",borderRadius:6,overflow:"hidden"}}>
            <div style={{height:"100%",width:(progress/7*100)+"%",background:"linear-gradient(90deg,var(--accent),var(--accent2))",borderRadius:6,transition:"width .4s"}} />
          </div>
        </div>
      )}

      {weekPosts.map((post,pi)=>(
        <div key={pi} style={{marginBottom:32}} className="fade-in">
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
            <div style={{width:28,height:28,borderRadius:8,background:"linear-gradient(135deg,var(--accent),var(--accent2))",display:"grid",placeItems:"center",fontSize:13,fontWeight:800,flexShrink:0}}>{pi+1}</div>
            <div>
              <div style={{fontWeight:700,fontSize:15}}>Post {pi+1}
                {post.slideCount>1&&<span style={{marginLeft:8,fontSize:11,background:"rgba(236,72,153,.15)",border:"1px solid rgba(236,72,153,.3)",color:"var(--pink)",padding:"2px 8px",borderRadius:20}}>🖼 Carrusel {post.slideCount} imágenes</span>}
              </div>
              <div style={{fontSize:12,color:"var(--muted)"}}>{post.theme}</div>
            </div>
            {selections[pi]!==undefined&&<div style={{marginLeft:"auto",fontSize:12,color:"var(--success)",background:"rgba(34,211,238,.1)",border:"1px solid rgba(34,211,238,.2)",borderRadius:20,padding:"3px 10px"}}>✓ Elegida</div>}
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12}}>
            {post.options.map((opt,oi)=>(
              <WeekPostCard key={oi} opt={opt} postIdx={pi} optIdx={oi}
                selected={selections[pi]===oi}
                onSelect={()=>selectOption(pi,oi)}
                onEdit={()=>setEditing({postIdx:pi,optIdx:oi})}
              />
            ))}
          </div>
        </div>
      ))}

      {weekPosts.length===7&&(
        <div className="fade-in" style={{marginTop:8}}>
          <div style={{background:"var(--surface)",border:"1px solid var(--border)",borderRadius:12,padding:"14px 18px",marginBottom:14,display:"flex",alignItems:"center",gap:12}}>
            <div style={{fontSize:22}}>📋</div>
            <div>
              <div style={{fontWeight:600,fontSize:14}}>{Object.keys(selections).length}/7 posts seleccionados</div>
              <div style={{fontSize:12,color:"var(--muted)",marginTop:2}}>Elegí una opción por cada post para continuar</div>
            </div>
          </div>
          {allSelected&&<button className="btn btn-primary" style={{width:"100%"}} onClick={onNext}>📅 Programar en el calendario →</button>}
        </div>
      )}

      {editing&&ReactDOM.createPortal(
        <EditorModal
          opt={weekPosts[editing.postIdx]?.options[editing.optIdx]}
          brand={brand}
          onClose={()=>setEditing(null)}
          onSave={(updated)=>{
            // Aprender de las ediciones
            const original=weekPosts[editing.postIdx]?.options[editing.optIdx];
            if(original) learnFromEdit(original, updated);
            const newWeek=[...weekPosts];
            newWeek[editing.postIdx].options[editing.optIdx]=updated;
            setWeekPosts(newWeek);
            setEditing(null);
            showToast("Cambios guardados y aprendidos ✓","ok");
          }}
          showToast={showToast}
        />,
        document.body
      )}
    </div>
  );
}

// WEEK POST CARD
// ════════════════════════════════════════════════════════════════
function WeekPostCard({opt,postIdx,optIdx,selected,onSelect,onEdit}) {
  const canvasRef=useRef();
  const [currentSlide,setCurrentSlide]=useState(0);

  useEffect(()=>{
    if(!canvasRef.current) return;
    const displayOpt = opt.slides && opt.slides.length>1
      ? {...opt, imgSrc: opt.slides[currentSlide]}
      : opt;
    drawPost(canvasRef.current, displayOpt);
  },[opt,currentSlide]);

  const hasCarousel = opt.slides && opt.slides.length > 1;

  return (
    <div className={"post-option"+(selected?" selected":"")} style={{position:"relative"}}>
      <div className="post-canvas-wrap" onClick={onSelect} style={{position:"relative"}}>
        <canvas ref={canvasRef} style={{width:"100%",height:"100%",display:"block"}} />
        <div style={{position:"absolute",top:8,left:8,background:"rgba(0,0,0,.7)",backdropFilter:"blur(4px)",borderRadius:6,padding:"3px 8px",fontSize:11,fontWeight:600}}>{opt.styleName}</div>
        {selected&&<div style={{position:"absolute",top:8,right:8,background:"var(--accent)",borderRadius:"50%",width:22,height:22,display:"grid",placeItems:"center",fontSize:12}}>✓</div>}
        {opt.imgMatchWarning&&(
          <div style={{position:"absolute",bottom:hasCarousel?24:8,left:0,right:0,margin:"0 8px",background:"rgba(245,158,11,.9)",borderRadius:6,padding:"4px 8px",fontSize:10,fontWeight:600,color:"#000",textAlign:"center"}}>
            ⚠️ Imagen puede no coincidir con el brief — agregá fotos relacionadas
          </div>
        )}
        {hasCarousel&&(
          <div style={{position:"absolute",bottom:8,left:0,right:0,display:"flex",justifyContent:"center",gap:4}}>
            {opt.slides.map((_,i)=>(
              <button key={i} onClick={e=>{e.stopPropagation();setCurrentSlide(i);}}
                style={{width:i===currentSlide?18:8,height:8,borderRadius:4,border:"none",background:i===currentSlide?"#fff":"rgba(255,255,255,.4)",cursor:"pointer",transition:"all .2s",padding:0}} />
            ))}
          </div>
        )}
        {hasCarousel&&<div style={{position:"absolute",top:8,right:selected?40:8,background:"rgba(236,72,153,.8)",borderRadius:6,padding:"2px 6px",fontSize:10,fontWeight:700,color:"#fff"}}>🖼 {opt.slides.length}</div>}
      </div>
      <div style={{padding:"10px 12px 4px",flex:1}}>
        <div style={{fontSize:10,color:"var(--accent2)",letterSpacing:"1.5px",textTransform:"uppercase",marginBottom:5,fontWeight:600}}>Caption</div>
        <div style={{fontSize:11,color:"rgba(240,240,255,0.75)",lineHeight:1.7,wordBreak:"break-word",whiteSpace:"pre-wrap"}}>{(opt.caption||"").trim()}</div>
      </div>
      <div style={{padding:"10px 12px 12px",display:"flex",gap:6}}>
        <button onClick={onSelect} className="btn btn-primary" style={{flex:1,padding:"7px",fontSize:11}}>
          {selected?"✓ Elegida":"Elegir esta"}
        </button>
        <button onClick={onEdit} className="btn btn-ghost" style={{padding:"7px 10px",fontSize:11}}>✏️</button>
      </div>
    </div>
  );
}
